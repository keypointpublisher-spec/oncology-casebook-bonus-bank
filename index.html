<!DOCTYPE html>
<html lang="en" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2A0B18"><title>Medical Oncology Clinical Casebook: Online Companion</title><style>:root{--hf:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;--df:Bahnschrift,"Arial Narrow","Roboto Condensed","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;--serif:"Times New Roman","Liberation Serif",Georgia,serif;
--bg:#F6F3EE;--bg2:#ECE6DE;--sf:#FFFEFB;--sf2:#F9F5F0;--ink:#262B33;--mu:#67707B;--ln:#E2DBD2;--hd:#2A0B18;--g:#6E1E3A;--g2:#8E2A4D;--g3:#F7E6EC;--ind:#3A4290;--ind2:#E6E8F7;--amb:#E8B04A;--amb2:#FBEFD2;--amd:#8A5A0B;--ok:#1B7A4E;--ok2:#DDF2E4;--bad:#B8342B;--bad2:#FBE4E0;--cream:#FFF6E6;
--sh:0 1px 2px rgba(42,11,24,.06),0 8px 24px rgba(42,11,24,.08);--sh2:0 2px 4px rgba(42,11,24,.1),0 16px 40px rgba(42,11,24,.18);--r:16px;--hero:linear-gradient(135deg,#1a060f 0%,#45102a 55%,#7c2447 130%);--fs:16px}
:root[data-theme=dark]{--bg:#16100F;--bg2:#211918;--sf:#1F1716;--sf2:#271E1D;--ink:#EFE8E4;--mu:#A89D99;--ln:#3A2E2D;--g:#E08AA6;--g2:#F0A8BF;--g3:#3A1E29;--ind:#A9B1F2;--ind2:#232647;--amb2:#3A2E12;--amd:#F0C26A;--ok:#6BD6A0;--ok2:#17332A;--bad:#FF8C80;--bad2:#3B1D1A;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
@media(prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#16100F;--bg2:#211918;--sf:#1F1716;--sf2:#271E1D;--ink:#EFE8E4;--mu:#A89D99;--ln:#3A2E2D;--g:#E08AA6;--g2:#F0A8BF;--g3:#3A1E29;--ind:#A9B1F2;--ind2:#232647;--amb2:#3A2E12;--amd:#F0C26A;--ok:#6BD6A0;--ok2:#17332A;--bad:#FF8C80;--bad2:#3B1D1A}}
*{box-sizing:border-box}html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--hf);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}svg{flex:none}
:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
.nomo *{transition:none!important;animation:none!important}
header.top{position:sticky;top:0;z-index:20;background:var(--hd);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.bar{max-width:920px;margin:auto;padding:0 16px;height:50px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;min-width:0;background:none;border:0;padding:0;text-align:left}
.logo{width:34px;height:34px;border-radius:50%;border:2px solid var(--amb);background:#3a0f22;display:grid;place-items:center}
.brand b{display:block;font-size:15px;line-height:1.15;font-weight:700;white-space:nowrap}
.brand small{display:block;font-size:10px;letter-spacing:.12em;color:#F2B8CB;font-weight:700;white-space:nowrap}
nav.tabs{margin-left:auto;display:flex;gap:2px}
nav.tabs button{background:none;border:0;color:#F6DCE5;padding:7px 11px;border-radius:9px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
nav.tabs button:hover{background:rgba(255,255,255,.08)}nav.tabs button.on{background:rgba(255,255,255,.14);color:#fff}
main{max-width:920px;margin:auto;padding:18px 16px 70px}
.hero{position:relative;overflow:hidden;background:var(--hero);color:#FFF6EC;border-radius:20px;padding:24px 26px 46px;box-shadow:var(--sh2);display:grid;grid-template-columns:1fr 250px;gap:10px;align-items:center}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(900px 300px at 85% -10%,rgba(255,255,255,.1),transparent 60%),repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 26px);pointer-events:none}
.hero>*{position:relative}
.pill{display:inline-block;border:1px solid var(--amb);color:var(--amb);border-radius:10px;padding:3px 11px;font-size:11px;letter-spacing:.09em;font-weight:700}
.hero h1{font-family:var(--df);font-size:40px;line-height:1.04;margin:14px 0 12px;letter-spacing:.01em;color:#FFF3DD}
.hero .kick{font-size:11.5px;letter-spacing:.14em;font-weight:700;color:#F2B8CB;text-transform:uppercase}
.hero p{margin:8px 0 18px;max-width:420px;opacity:.95;font-size:15px}
.hero .cta{display:flex;gap:9px;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;gap:7px;border-radius:11px;padding:9px 15px;font-weight:700;font-size:14px;border:1px solid transparent;background:var(--g);color:#fff}
.b:hover{filter:brightness(1.08)}.b:disabled{opacity:.45;cursor:not-allowed;filter:none}
.b.gold{background:linear-gradient(180deg,#F0BC5B,#DC9F36);color:#2A1A04}
.b.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#FFF6EC}.b.ghost:hover{background:rgba(255,255,255,.16)}
.b.line{background:var(--sf);color:var(--g);border-color:var(--ln)}.b.line:hover{border-color:var(--g)}
.b.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.ring{position:relative;width:210px;height:210px;margin:0 auto}
.ring svg.rg{position:absolute;inset:0}
.ring img{position:absolute;inset:22px;width:166px;height:166px;border-radius:50%;object-fit:cover;border:3px solid var(--amb);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.ready{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:var(--cream);color:#2A0B18;border-radius:999px;padding:5px 16px;font-weight:800;font-size:22px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.ready small{font-size:10.5px;letter-spacing:.1em;margin-left:4px;font-weight:700;color:var(--g)}
.hnote{font-size:11.5px;text-align:center;opacity:.85;margin-top:16px}
.ecg{position:absolute;left:0;right:0;bottom:10px;height:44px;opacity:.55}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.stat .ic{width:30px;height:30px;border-radius:9px;background:var(--g3);color:var(--g);display:grid;place-items:center;margin-bottom:10px}
.stat b{font-family:var(--df);font-size:25px;line-height:1}.stat b i{font-style:normal;font-size:14px;color:var(--mu);font-family:var(--hf);font-weight:400}
.stat span{display:block;font-size:11px;letter-spacing:.09em;font-weight:700;color:var(--mu);text-transform:uppercase;margin-top:6px}
.stat em{display:block;font-style:normal;font-size:12.5px;color:var(--mu);margin-top:2px}
.mini{height:7px;background:var(--bg2);border-radius:6px;overflow:hidden;margin-top:8px}.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--amb));border-radius:6px}
h2.sec{display:flex;align-items:center;gap:12px;font-size:17px;margin:26px 0 12px;color:var(--ink)}h2.sec:after{content:"";flex:1;height:1px;background:var(--ln)}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fc3{text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.fc3:hover{border-color:var(--g)}.fc3 h3{font-size:15.5px;margin:9px 0 6px;line-height:1.25}.fc3 .mu{font-size:13px;color:var(--mu)}.fc3 .rd{font-size:12.5px;font-weight:700;color:var(--g);margin-top:12px}
.tag{display:inline-block;background:var(--bg2);color:var(--mu);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}.tag.warn{background:var(--amb2);color:var(--amd)}.tag.ok{background:var(--ok2);color:var(--ok)}
.part{display:flex;align-items:baseline;gap:9px;border-bottom:1px solid var(--g);padding-bottom:5px;margin:22px 0 10px}
.part small{font-size:11px;letter-spacing:.1em;font-weight:800;color:var(--amd)}.part b{font-size:15.5px;color:var(--g)}.part span{margin-left:auto;font-size:12.5px;color:var(--mu)}
.chs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.chc{text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 13px;box-shadow:var(--sh);position:relative;overflow:hidden}
.chc:hover{border-color:var(--g)}.chc.st:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ok)}.chc.st.weak:before{background:var(--bad)}
.chc small{display:block;font-size:10.5px;letter-spacing:.1em;font-weight:800;color:var(--mu)}.chc b{display:block;font-size:14px;line-height:1.25;margin:5px 0 7px}.chc span{font-size:12.5px;color:var(--mu)}
.pg{display:flex;align-items:center;gap:14px;margin:6px 0 14px}.pg .th{width:62px;height:62px;border-radius:50%;object-fit:cover;border:3px solid var(--amb);box-shadow:var(--sh)}
.pg small{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--amd)}.pg h1{font-family:var(--df);font-size:30px;margin:0;line-height:1.1}
.lead{color:var(--mu);margin:2px 0 14px;max-width:560px}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.lbl{display:block;font-size:11px;letter-spacing:.09em;font-weight:800;color:var(--mu);text-transform:uppercase;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--bg2);color:var(--ink);border:1px solid var(--ln);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--hd);color:#fff;border-color:var(--hd)}:root[data-theme=dark] .chip.on{background:var(--g);color:#1a0a10}
.chip.sq{border-radius:10px}.chip.big{padding:8px 14px;border-radius:12px}
.grid3{display:grid;grid-template-columns:1.1fr 1.2fr 1fr;gap:12px;margin-top:12px}
select,input[type=text],input[type=date],input[type=number]{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);margin-bottom:10px}
.opt2{display:block;width:100%;text-align:left;background:var(--sf);border:2px solid var(--ln);border-radius:12px;padding:10px 13px;margin-bottom:9px}
.opt2.on{border-color:var(--g);box-shadow:0 0 0 3px var(--g3)}.opt2 b{display:block}.opt2 small{color:var(--mu);font-size:12.5px}
.sess{display:grid;grid-template-columns:1fr 250px;gap:14px;align-items:start}
.stop{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.clock{margin-left:auto;font-family:var(--df);font-size:19px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:5px 18px;min-width:96px;text-align:center}
.clock.low{color:var(--bad);border-color:var(--bad)}
.pbar{height:6px;background:var(--bg2);border-radius:6px;overflow:hidden;margin-bottom:14px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--amb));transition:width .3s}
.qcard{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.qh{display:flex;gap:7px;align-items:center;margin-bottom:10px}.qh .tag:first-child{background:var(--amb2);color:var(--amd)}.qh .b{margin-left:auto}
.stem{font-family:var(--serif);font-size:1.12rem;line-height:1.5;margin:6px 0 14px}
.orow{display:flex;gap:8px;margin-bottom:9px}
.opt{flex:1;display:flex;align-items:center;gap:11px;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:9px 12px;font-family:var(--serif);font-size:1.02rem;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--g)}.opt .lt{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-family:var(--hf);font-weight:800;font-size:12.5px;color:var(--mu)}
.opt.sel{border-color:var(--g);background:var(--g3)}.opt.sel .lt{background:var(--g);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok2)}.opt.ok .lt{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad2)}.opt.bad .lt{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}.opt.cut .tx{text-decoration:line-through;opacity:.5}
.opt:disabled{cursor:default}
.xb{flex:none;width:38px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--mu);display:grid;place-items:center}.xb:hover{color:var(--bad);border-color:var(--bad)}.xb.on{background:var(--bg2);color:var(--bad)}
.conf{display:flex;align-items:center;gap:8px;margin:12px 0 4px}.conf .lbl{margin:0}
.expl{border-radius:14px;padding:14px 16px;margin:12px 0;border:1px solid}
.expl.right{background:var(--ok2);border-color:var(--ok)}.expl.wrong{background:var(--bad2);border-color:var(--bad)}
.expl h4{margin:0 0 6px;font-size:16px;display:flex;gap:8px;align-items:center}.expl h4 .tag{background:var(--sf);color:var(--ink)}
.expl p{margin:0 0 10px}
.tp{background:rgba(232,176,74,.2);border-left:4px solid var(--amb);border-radius:6px;padding:8px 12px;margin:8px 0}.tp small{display:block;font-size:10.5px;letter-spacing:.12em;font-weight:800;color:var(--amd)}
.rm{font-size:13px;font-weight:700;color:var(--g);border-top:1px dashed var(--ln);padding-top:8px;margin-top:6px}
details.note{margin:8px 0}details.note summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--mu)}details.note textarea{width:100%;min-height:70px;margin-top:8px;font:inherit;padding:9px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink)}
.nav2{display:flex;justify-content:space-between;margin-top:12px}
.navp{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:13px;box-shadow:var(--sh);position:sticky;top:64px}
.ngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 10px}
.ngrid button{aspect-ratio:1;border:1px solid var(--ln);background:var(--sf);border-radius:9px;font-weight:700;font-size:12.5px;position:relative}
.ngrid button.cur{border:2px solid var(--amb);box-shadow:0 0 0 2px var(--amb2)}.ngrid .r{background:var(--ok);color:#fff;border-color:var(--ok)}.ngrid .w{background:var(--bad);color:#fff;border-color:var(--bad)}.ngrid .a{background:var(--ind2);border-color:var(--ind);color:var(--ind)}
.ngrid .f:after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:#D4448A}
.leg{display:flex;gap:10px;font-size:11.5px;color:var(--mu);margin-bottom:10px;flex-wrap:wrap}.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.coach{font-size:12.5px;color:var(--mu);margin:0 0 9px}.coach b{color:var(--g)}
.timer{display:flex;gap:18px;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.timer .big{font-family:var(--df);font-size:50px;line-height:1}
.pause{position:fixed;inset:0;z-index:50;background:rgba(26,6,15,.88);backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff;text-align:center}
.pause h2{font-family:var(--df);font-size:34px;margin:0 0 6px}
.res{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
.score{text-align:center;padding:20px 12px}.score svg{display:block;margin:0 auto 8px}.score b{font-family:var(--df);font-size:30px}
.bars .rw{display:grid;grid-template-columns:1fr 50px;gap:8px;align-items:center;margin-bottom:10px}.bars .rw small{grid-column:1/3;font-weight:600;font-size:13px}.bars .mini{margin:0}.bars em{font-style:normal;font-weight:800;text-align:right;font-size:13px}
.qlist button{display:flex;gap:10px;width:100%;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--ln);background:none;padding:8px 2px;font-size:14px}
.dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}.dot.r{background:var(--ok)}.dot.w{background:var(--bad)}.dot.s{background:var(--mu)}
.fcard{perspective:1200px}.fcf{min-height:300px;border-radius:20px;border:1px solid var(--ln);background:var(--sf);box-shadow:var(--sh2);padding:24px 26px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.fcf.back{background:linear-gradient(160deg,#fff 0,var(--g3) 120%);border-color:var(--g)}:root[data-theme=dark] .fcf.back{background:var(--g3)}
.fcf .stem{font-size:1.2rem;margin:10px 0 0}.fcf .ans{font-size:1.25rem;font-weight:700;font-family:var(--serif);color:var(--g);margin:6px 0 12px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.rate button{border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:10px 4px;font-weight:700}.rate button small{display:block;font-weight:400;color:var(--mu);font-size:11.5px}
.rate .a{border-color:var(--bad);color:var(--bad)}.rate .h{border-color:var(--amb);color:var(--amd)}.rate .gd{border-color:var(--ok);color:var(--ok)}.rate .e{border-color:var(--ind);color:var(--ind)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.sgrid .stat{padding:12px 14px}
.hist{display:flex;align-items:flex-end;gap:7px;height:190px;padding:10px 6px 0}.hist .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11.5px;color:var(--mu)}
.hist .c .col{width:100%;max-width:34px;background:var(--bg2);border-radius:6px 6px 3px 3px;position:relative;margin-bottom:6px;min-height:0}.hist .c .col i{position:absolute;left:0;right:0;bottom:0;background:var(--ok);border-radius:6px 6px 3px 3px}
.kb{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:13.5px}kbd{background:var(--bg2);border:1px solid var(--ln);border-bottom-width:2px;border-radius:6px;padding:0 6px;font:12px var(--hf);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--ln);border-radius:11px;overflow:hidden}.seg button{border:0;background:var(--sf);padding:9px 4px;font-weight:600;border-right:1px solid var(--ln)}.seg button:last-child{border:0}.seg button.on{background:var(--hd);color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}.tbl th{background:var(--g);color:#fff;text-align:left;padding:7px 9px}.tbl td{border:1px solid var(--ln);padding:7px 9px;vertical-align:top}
.disc{color:var(--mu);font-size:12px;max-width:520px;margin:34px 0 0}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--hd);color:#fff;border-radius:12px;padding:10px 18px;font-weight:600;box-shadow:var(--sh2);z-index:60}
.gate{min-height:100vh;display:grid;place-items:center;background:var(--hero);padding:20px;color:#FFF6EC}
.gate .box{max-width:430px;width:100%;text-align:center}.gate img{width:130px;height:130px;border-radius:50%;border:3px solid var(--amb);object-fit:cover;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.gate h1{font-family:var(--df);font-size:34px;line-height:1.05;margin:16px 0 8px;color:#FFF3DD}.gate input{text-align:center;font-size:21px;letter-spacing:.14em;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;margin:14px 0 8px}.gate input::placeholder{color:rgba(255,255,255,.45)}
.err{min-height:22px;color:#FFB4A8;font-weight:700}
.emp{text-align:center;color:var(--mu);padding:30px 10px}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-bottom:50px}.ring{order:-1;width:170px;height:170px}.ring img{inset:18px;width:134px;height:134px}.hero h1{font-size:32px}.stats,.sgrid{grid-template-columns:repeat(2,1fr)}.cards3{grid-template-columns:1fr}.chs{grid-template-columns:repeat(2,1fr)}.grid3,.two,.res,.sess{grid-template-columns:1fr}.navp{position:static}

</style></head><body><noscript>This companion needs JavaScript.</noscript><script>const DATA={"D":[{"ch":1,"title":"Clinical Research Methodology and Ethics","qs":[{"n":1,"stem":"A 60-year-old man with metastatic colorectal cancer has baseline CT showing three liver metastases, two lung metastases, and four retroperitoneal nodes. Under RECIST 1.1, how many target lesions may be recorded in total?","opts":["Up to eight, with no more than four per organ","Up to three, one per organ","All measurable lesions of at least 10 mm","Up to ten, with no more than five per organ","Up to five, with no more than two per organ"],"a":4,"e":"RECIST 1.1 allows a maximum of five target lesions in total and two per organ. The remaining lesions are recorded as non-target and judged qualitatively. The older RECIST 1.0 permitted ten.","k":"RECIST 1.1 caps target lesions at five in total and two per organ.","t":"RECIST target lesions"},{"n":2,"stem":"At first restaging, the sum of target lesion diameters in a patient with lung cancer has risen from a nadir of 40 mm to 46 mm. No new lesions appear. How is this response categorized by RECIST 1.1?","opts":["Stable disease, because the increase is under 20 percent","Progressive disease, because the sum rose by 6 mm","Partial response, because the sum did not fall by 30 percent","Progressive disease, because the rise exceeds 5 mm","Not evaluable until a second scan confirms the change"],"a":0,"e":"Progressive disease requires a 20 percent increase over the smallest sum on study and an absolute increase of at least 5 mm. Here the rise is 15 percent, so the category is stable disease despite the 6 mm change.","k":"RECIST progression needs both a 20 percent rise from nadir and an absolute rise of at least 5 mm.","t":"Progressive disease threshold"},{"n":3,"stem":"A staging CT shows a pathologic left paraaortic node measuring 22 mm in long axis and 16 mm in short axis. How is it measured as a RECIST 1.1 target lesion?","opts":["By the volume of the node","By the short axis, 16 mm","By the long axis, 22 mm","By the short axis only if it exceeds 20 mm","By the average of both axes, 19 mm"],"a":1,"e":"Lymph nodes are measured by the short axis, and a node of at least 15 mm short axis is measurable. Nodes with a short axis under 10 mm are considered normal.","k":"RECIST measures lymph nodes by the short axis, and under 10 mm is normal.","t":"Nodal target measurement"},{"n":4,"stem":"After treatment, a patient has no residual extranodal disease, but a previously 24 mm target node now measures 12 mm in short axis. How does RECIST 1.1 classify the response?","opts":["Stable disease, because the node is under 15 mm","Complete response, because all extranodal disease resolved","Partial response, because the node has not fallen below 10 mm","Progressive disease, because a node persists","Complete response, because the node shrank by more than 30 percent"],"a":2,"e":"A complete response requires every target node to fall below 10 mm in short axis. A fall from 24 mm to 12 mm is a 50 percent reduction, which meets the partial response threshold of 30 percent.","k":"For a RECIST complete response, target nodes must be under 10 mm in short axis.","t":"Complete response in nodes"},{"n":5,"stem":"A patient with melanoma on pembrolizumab has new growth in two target lesions at week 12, but remains clinically well. Under iRECIST, what is the best next step?","opts":["Stop pembrolizumab and begin salvage chemotherapy","Ignore the finding and image again in 6 months","Biopsy every growing lesion before any further treatment","Continue treatment and repeat imaging in 4 to 8 weeks to confirm","Record confirmed progression and stop the study drug"],"a":3,"e":"iRECIST labels first progression as unconfirmed (iUPD) in a clinically stable patient and asks for confirmation on a scan 4 to 8 weeks later. Confirmed progression requires further growth or new lesions at that point.","k":"In a stable patient, iRECIST progression is unconfirmed until repeat imaging at 4 to 8 weeks.","t":"iRECIST confirmation"},{"n":6,"stem":"A man with renal cell carcinoma on nivolumab and ipilimumab has an enlarging liver lesion at 10 weeks. Biopsy shows dense lymphocytic infiltrate with no viable tumor. What does this represent?","opts":["Pseudoprogression from immune cell infiltration","A complete pathologic response of the whole disease","Hyperprogression","A radiation recall reaction","True progression with a new resistance mutation"],"a":0,"e":"Pseudoprogression is an apparent increase in tumor size caused by immune infiltration and edema, with later shrinkage. It is uncommon, so the usual response to growth is still to confirm before changing therapy.","k":"Pseudoprogression is immune infiltration that mimics growth and is proved by biopsy or by later shrinkage.","t":"Pseudoprogression"},{"n":7,"stem":"Investigators plan a randomized phase 3 trial of adjuvant therapy in a disease where many patients receive effective salvage therapy after relapse. Which endpoint is least affected by these later treatments?","opts":["Quality-adjusted survival","Post-progression survival","Overall survival","Crossover-adjusted overall survival","Disease-free survival"],"a":4,"e":"Overall survival is diluted by treatments given after relapse, and crossover can mask a difference. Disease-free survival ends at relapse, before most later therapies are given, but it is a surrogate that must be validated for the disease.","k":"Overall survival is affected by later therapies, whereas disease-free survival ends at relapse.","t":"Overall survival as endpoint"},{"n":8,"stem":"A single-arm phase 2 trial reports an objective response rate of 40 percent in refractory disease. Which statement about this result is correct?","opts":["It includes patients with stable disease lasting at least 6 months","It proves improved overall survival over standard therapy","It is a time-to-event endpoint analyzed with the log-rank test","It is the proportion of patients with a partial or complete response and gives no time-to-event information","It can be compared directly with progression-free survival from another trial"],"a":3,"e":"Objective response rate counts patients whose tumors shrink by the criteria. It is a proportion, not a time-to-event measure, and it does not show survival benefit without a comparator.","k":"Objective response rate is a proportion and does not prove a survival benefit.","t":"Objective response rate"},{"n":9,"stem":"In a randomized trial, 15 percent of patients assigned to surgery refused and received radiotherapy instead. The investigators analyze only patients who received the assigned treatment. What is the main problem?","opts":["Detection bias","Bias in favor of the control arm","Selection bias, because randomization is no longer preserved","Loss of statistical power only","A violation of the non-inferiority margin"],"a":2,"e":"Per-protocol analysis removes patients after randomization, and the reasons for non-adherence are often related to prognosis. Intention-to-treat keeps the groups comparable. Per-protocol results are secondary and may be used as sensitivity analyses.","k":"Excluding non-adherent patients breaks randomization, so the primary analysis is intention to treat.","t":"Per-protocol analysis"},{"n":10,"stem":"A phase 3 trial is negative for its primary endpoint. A post hoc analysis shows a significant benefit in women over 65 with stage III disease. How should this be regarded?","opts":["As valid only if the trial was double-blind","As hypothesis-generating, because of multiple comparisons","As confirmatory, because the p value is below 0.05","As proof that the primary analysis was wrong","As a practice-changing result for that subgroup"],"a":1,"e":"Post hoc subgroup findings in a trial that missed its primary endpoint carry a high chance of false positives. They can suggest a hypothesis, but they need prospective confirmation.","k":"Post hoc subgroup findings from a negative trial generate hypotheses and do not change practice.","t":"Subgroup analysis"},{"n":11,"stem":"A screening program reports that 5-year survival from diagnosis rose from 40 percent to 70 percent, but mortality from the cancer did not change. Which bias best explains this?","opts":["Length-time bias","Lead-time bias","Attrition bias","Immortal time bias","Recall bias"],"a":1,"e":"Screening finds disease earlier, so survival measured from diagnosis lengthens even if death occurs at the same time. Disease-specific mortality in the population is the correct measure of screening benefit.","k":"Earlier diagnosis lengthens survival from diagnosis without changing death, which is lead-time bias.","t":"Lead-time bias"},{"n":12,"stem":"A screening test detects mostly slow-growing tumors, and screened patients appear to live longer than those whose cancers present with symptoms. Which bias is described?","opts":["Informative censoring","Ascertainment of crossover","Lead-time bias","Selection of surrogate endpoint","Length-time bias"],"a":4,"e":"Screening preferentially detects slowly progressive disease that remains in the detectable phase longer. These cases have a better prognosis, which makes screening look more beneficial than it is.","k":"Screening over-samples slow-growing tumors, which is length-time bias.","t":"Length-time bias"},{"n":13,"stem":"A retrospective study finds that patients who received a second-line drug lived longer than those who did not. Treatment status was assigned at the time the drug started, and survival was counted from first-line start. What bias is likely?","opts":["Immortal time bias","Lead-time bias","Detection bias","Recall bias","Performance bias"],"a":0,"e":"Patients had to survive long enough to receive second-line therapy, so the time before treatment is immortal in the treated group. Landmark analysis or time-dependent modeling reduces the problem.","k":"Counting survival before treatment starts gives the treated group immortal time.","t":"Immortal time bias"},{"n":14,"stem":"In a trial of an oral drug, many patients on the experimental arm withdraw because of toxicity and are censored at withdrawal. Their prognosis is worse than that of patients who remain. What is the problem?","opts":["Non-informative censoring, which is acceptable","Crossover contamination","Type II error only","Informative censoring, which can bias the survival estimate","Regression to the mean"],"a":3,"e":"Kaplan-Meier methods assume censoring is unrelated to prognosis. When sicker patients are removed for reasons tied to outcome, the curve is biased, usually in favor of the arm that lost them.","k":"Censoring must be unrelated to prognosis, or the survival curve is biased.","t":"Informative censoring"},{"n":15,"stem":"In a classic 3+3 dose-escalation trial, one of the first three patients at a dose level has a dose-limiting toxicity. What is done next?","opts":["Declare the maximum tolerated dose","Escalate to the next dose level","Enroll three more patients at the same dose","Enroll a single patient at a higher dose","De-escalate and stop the trial"],"a":2,"e":"With one of three patients showing a dose-limiting toxicity, the cohort is expanded by three. If no further dose-limiting toxicity appears among the six, escalation continues. Two or more in a cohort sets the dose as too toxic.","k":"In a 3+3 design, one dose-limiting toxicity in three patients expands the cohort to six.","t":"Phase 1 design"},{"n":16,"stem":"A single-arm phase 2 trial in a rare cancer shows a median progression-free survival of 9 months, compared with 6 months in a prior trial. What limits the interpretation?","opts":["Progression-free survival cannot be measured in single-arm trials","The comparison is historical and may differ in patient selection","The trial has too many endpoints","Median values are never reported in phase 2 trials","The control arm was randomized incorrectly"],"a":1,"e":"Single-arm trials rely on historical controls, which differ in prognostic factors, imaging schedules, and supportive care. Randomization is the way to remove these differences.","k":"A single-arm trial compares with historical controls, so differences in patient selection can mimic benefit.","t":"Single-arm phase 2"},{"n":17,"stem":"A patient with refractory cancer enrolling in a phase 1 trial says she expects the dose she receives to be chosen to give her the best possible chance of benefit. What does this reflect?","opts":["Appropriate informed consent","Clinical equipoise bias","Voluntariness","Therapeutic misconception","Equipoise"],"a":3,"e":"Therapeutic misconception is the belief that trial procedures are individualized for personal benefit, when early-phase trials aim chiefly to define safety and dose. Consent discussions should state this plainly.","k":"Early-phase trials aim to learn about the drug, and patients who expect personal optimization show therapeutic misconception.","t":"Therapeutic misconception"},{"n":18,"stem":"What condition must be met before randomizing patients between two treatments in a phase 3 trial?","opts":["Proof that the experimental arm is better","A planned crossover at progression","Genuine uncertainty in the expert community about which arm is better","Agreement of the sponsor about the primary endpoint","A guarantee that all patients will receive the new drug eventually"],"a":2,"e":"Clinical equipoise means that informed experts disagree about the superior treatment. It makes randomization ethical because no patient is knowingly assigned to an inferior arm.","k":"Randomization is ethical only when real uncertainty exists about which arm is better.","t":"Clinical equipoise"},{"n":19,"stem":"A data monitoring committee reviews a phase 3 trial at 50 percent of events and finds a very large survival benefit that crosses a prespecified O'Brien-Fleming boundary. What is the appropriate action?","opts":["Consider early stopping and unblinding, on the committee's recommendation","Change the primary endpoint to a safer one","Add more patients to confirm the result","Stop the committee and re-randomize patients","Continue to the planned end without disclosure"],"a":0,"e":"Group sequential boundaries such as O'Brien-Fleming are set stringently early to control the overall type I error. Crossing one allows early stopping, with the decision made by an independent committee.","k":"An independent committee may stop a trial early when a prespecified efficacy boundary is crossed.","t":"Interim analysis"},{"n":20,"stem":"A trial reports a hazard ratio of 0.75 for death with a new drug. The control arm median survival is 8 months. Which statement is most accurate?","opts":["The drug reduces absolute mortality by 25 percentage points","The new drug adds exactly 25 percent to median survival","The hazard ratio shows survival at fixed time points","Median survival is exactly 10.7 months with the drug","The relative risk of death is 25 percent lower, but absolute gain depends on baseline risk"],"a":4,"e":"A hazard ratio is a relative measure of the instantaneous risk across follow-up. Absolute gains need the survival curves, and under proportional hazards the median improves roughly as the reciprocal of the hazard ratio, which is an estimate.","k":"A hazard ratio is a relative measure and does not give the absolute gain.","t":"Hazard ratio versus absolute benefit"},{"n":21,"stem":"Using the ESMO Magnitude of Clinical Benefit Scale, which grades indicate substantial benefit in the curative setting?","opts":["Grades 4 and 5","Any grade with a significant p value","Grades A and B","Grades C and 3","Only grade A"],"a":2,"e":"In the curative setting the scale uses grades A to C, and A and B indicate substantial benefit. In the noncurative setting grades 4 and 5 indicate substantial benefit.","k":"ESMO-MCBS grades A and B in the curative setting and 4 and 5 in the noncurative setting indicate substantial benefit.","t":"ESMO scale in curative setting"}]},{"ch":2,"title":"Advanced Cancer and Cancer Pain","qs":[{"n":1,"stem":"A woman with metastatic breast cancer takes extended-release morphine 60 mg twice daily. She asks for a rescue dose for flares of pain. Which immediate-release morphine dose is the usual starting breakthrough dose?","opts":["60 mg, equal to one scheduled dose","One-hundredth of the daily dose","5 mg, regardless of the daily dose","About 10 to 20 percent of the total daily dose, 12 to 24 mg","50 percent of the total daily dose"],"a":3,"e":"Breakthrough doses are commonly set at 10 to 20 percent of the 24-hour opioid dose and repeated as needed, with the daily need reviewed to adjust the scheduled dose.","k":"Breakthrough opioid is usually 10 to 20 percent of the total daily dose.","t":"Breakthrough dose"},{"n":2,"stem":"A patient is rotated from oral morphine to oral hydromorphone because of myoclonus and confusion. Her pain is controlled. By how much should the calculated equianalgesic dose of the new opioid usually be reduced?","opts":["Increased by 25 percent for safety","By 90 percent","Not at all, since the doses are equivalent","Doubled, because hydromorphone is less potent","By 25 to 50 percent, to allow for incomplete cross-tolerance"],"a":4,"e":"Equianalgesic tables are approximate and cross-tolerance between opioids is incomplete. Reducing the calculated dose by 25 to 50 percent and titrating avoids overdose.","k":"Reduce the calculated equianalgesic dose by 25 to 50 percent when rotating opioids.","t":"Opioid rotation"},{"n":3,"stem":"A man on high-dose morphine for pancreatic cancer develops multifocal myoclonus, agitation, and pain that seems to worsen with each dose increase. Which approach is best?","opts":["Stop all analgesia","Hydrate, reduce the dose, and rotate to another opioid","Add a benzodiazepine alone","Add a second long-acting morphine","Increase the morphine dose further"],"a":1,"e":"Opioid-induced neurotoxicity includes myoclonus, delirium, and hyperalgesia and is more likely with accumulating metabolites. Management is to hydrate, lower the dose, and rotate the opioid.","k":"Myoclonus and worsening pain on rising opioid doses suggest neurotoxicity, which is managed by rotation.","t":"Opioid neurotoxicity"},{"n":4,"stem":"Before starting methadone for refractory cancer pain, which baseline test is most appropriate?","opts":["An electrocardiogram to measure the QTc interval","A serum amylase level","A chest radiograph","A fasting lipid profile","An echocardiogram"],"a":0,"e":"Methadone can prolong the QT interval and cause torsades de pointes. It also has a long and variable half-life and many drug interactions, so it should be started by an experienced prescriber.","k":"Methadone needs QTc monitoring because it can prolong the QT interval.","t":"Methadone safety"},{"n":5,"stem":"A patient starting regular oral oxycodone for bone pain asks about constipation prevention. Which approach is best?","opts":["Start a stool softener alone","Start a stimulant laxative, with or without an osmotic agent, with the first opioid dose","Wait until constipation develops","Use a bulk-forming fiber supplement alone","Use only dietary changes"],"a":1,"e":"Tolerance to opioid constipation does not develop. A stimulant laxative such as senna, with an osmotic agent if needed, is started with the first dose, and bulk fiber is poorly suited to weak, dehydrated patients.","k":"Start a stimulant laxative with the first opioid dose.","t":"Bowel regimen"},{"n":6,"stem":"Despite senna and polyethylene glycol, a patient on opioids has had no stool for 5 days. There is no obstruction on examination or imaging. Which drug class is appropriate next?","opts":["A peripherally acting mu-opioid receptor antagonist such as methylnaltrexone","A centrally acting opioid antagonist such as naloxone infusion","An antimuscarinic","Increased opioid dose","A prokinetic antibiotic"],"a":0,"e":"Peripherally acting mu-opioid receptor antagonists block gut receptors without reversing analgesia. They are used when laxatives fail and bowel obstruction has been excluded.","k":"Use a peripherally acting opioid antagonist for refractory opioid constipation once obstruction is excluded.","t":"Refractory opioid constipation"},{"n":7,"stem":"A man with prostate cancer has several painful bone metastases controlled only partly by opioids. Besides radiotherapy, which agent also reduces skeletal events?","opts":["Octreotide","Duloxetine","Ketamine","Denosumab or zoledronic acid","Gabapentin"],"a":3,"e":"Bone-modifying agents lower the rate of skeletal-related events in bone metastases. Dental assessment is advised beforehand because of the risk of osteonecrosis of the jaw.","k":"Denosumab or zoledronic acid reduces skeletal events in bone metastases.","t":"Bone pain adjuncts"},{"n":8,"stem":"A woman has one painful rib metastasis and a good prognosis. A single 8 Gy fraction is compared with multiple fractions. What is the main trade-off of the single fraction?","opts":["Worse pain relief","Much greater acute toxicity","Similar pain relief, but a higher rate of retreatment","Longer overall treatment time","Higher rate of spinal cord injury"],"a":2,"e":"Single-fraction radiotherapy gives pain relief comparable with multiple fractions, with a higher rate of later retreatment. It is convenient and often preferred in advanced disease.","k":"Single-fraction radiotherapy relieves bone pain equally but is retreated more often.","t":"Radiotherapy for bone pain"},{"n":9,"stem":"A patient develops a transient increase in bone pain two days after palliative radiotherapy. What can reduce the risk?","opts":["A benzodiazepine","Increased scheduled opioid for a month","Acetaminophen alone","A bisphosphonate infusion","A short course of dexamethasone around the time of treatment"],"a":4,"e":"A pain flare occurs in roughly one-third of patients after bone radiotherapy. Dexamethasone given around the time of treatment lowers the rate of flare.","k":"Dexamethasone around radiotherapy lowers the risk of a pain flare.","t":"Pain flare after radiotherapy"},{"n":10,"stem":"A woman has painful neuropathy in her feet after oxaliplatin. Which agent has the strongest guideline support for treatment?","opts":["Pregabalin","Duloxetine","Amitriptyline","Gabapentin","Lidocaine patch"],"a":1,"e":"Duloxetine is the only drug with guideline support for painful chemotherapy-induced neuropathy, supported by a randomized trial. Evidence for gabapentinoids and tricyclics in this setting is weak.","k":"Duloxetine is the recommended drug for painful chemotherapy-induced neuropathy.","t":"Chemotherapy neuropathy"},{"n":11,"stem":"A patient with pancreatic cancer has severe upper abdominal pain radiating to the back despite escalating opioids that cause sedation. Which intervention can help?","opts":["Celiac plexus neurolysis","Stellate ganglion block","Intrathecal baclofen","Sacral nerve stimulation","Phrenic nerve block"],"a":0,"e":"Celiac plexus neurolysis can lower pain and opioid requirements in upper abdominal visceral cancer pain, especially pancreatic, and is used when opioid side effects limit titration.","k":"Celiac plexus neurolysis helps visceral pain from pancreatic cancer.","t":"Celiac plexus block"},{"n":12,"stem":"A man with lung cancer and an unremarkable examination has distressing dyspnea at rest. His oxygen saturation is 96 percent on room air. Which measure is most appropriate first?","opts":["Intubation","Bronchoscopy","A handheld fan directed at the face","Continuous high-flow oxygen","Benzodiazepine alone"],"a":2,"e":"Fan therapy is cheap and effective. Oxygen helps only when hypoxemia is present, and opioids are used when dyspnea persists despite treatment of causes.","k":"Oxygen helps dyspnea only in hypoxemia, and a fan helps regardless.","t":"Dyspnea management"},{"n":13,"stem":"A patient with advanced cancer has refractory dyspnea despite treatment of causes. Which treatment has the best support?","opts":["Nebulized saline alone","Oral theophylline","Inhaled corticosteroid","Low-dose systemic opioid","Antibiotic course"],"a":3,"e":"Low-dose oral or parenteral opioids reduce the sensation of breathlessness in advanced disease and are used after correctable causes are treated. Doses are lower than for pain.","k":"Low-dose opioid is the pharmacologic treatment for refractory dyspnea.","t":"Opioids for dyspnea"},{"n":14,"stem":"A woman with metastatic breast cancer has recurrent symptomatic right pleural effusion after repeated thoracentesis, and the lung re-expands fully. Which option allows home drainage?","opts":["Systemic steroids","Repeat thoracentesis every week","Diuretics alone","Pleurectomy as first step","An indwelling pleural catheter"],"a":4,"e":"An indwelling pleural catheter allows outpatient drainage and is a standard option for recurrent malignant effusion with expandable lung. Pleurodesis is an alternative.","k":"An indwelling pleural catheter is a standard choice for recurrent malignant effusion.","t":"Malignant pleural effusion"},{"n":15,"stem":"A woman with advanced ovarian cancer has inoperable malignant bowel obstruction with vomiting and colic. Which combination is typically used to reduce secretions and vomiting?","opts":["Oral contrast with early feeding","Metoclopramide alone at high dose","Neostigmine","Stimulant laxatives","Octreotide with dexamethasone and an antiemetic"],"a":4,"e":"Octreotide lowers gastrointestinal secretions, and dexamethasone may relieve obstruction. Prokinetics are avoided in complete obstruction, and a venting gastrostomy is an option.","k":"Octreotide reduces secretions in inoperable malignant bowel obstruction.","t":"Malignant bowel obstruction"},{"n":16,"stem":"A man with metastatic pancreatic cancer has anorexia and 10 percent weight loss. Which statement about cancer cachexia is correct?","opts":["Nutritional support alone does not reverse it","It improves with high-dose vitamin supplements","It is the same as simple starvation","Enteral feeding reliably reverses the muscle loss","It is explained entirely by low calorie intake"],"a":0,"e":"Cachexia is a metabolic syndrome with inflammation and muscle loss that is not fully reversed by feeding. Low-dose olanzapine or short-term corticosteroids may help appetite.","k":"Cancer cachexia is not reversed by feeding alone.","t":"Cancer cachexia"},{"n":17,"stem":"A woman with myeloma has confusion and a corrected calcium of 14 mg/dL. After intravenous saline, which agent should follow?","opts":["Oral calcium binder","Thiazide diuretic","Furosemide alone","Zoledronic acid","Vitamin D"],"a":3,"e":"Treatment is fluids, then an intravenous bisphosphonate to inhibit bone resorption. Denosumab is an alternative in renal impairment, and loop diuretics are used only for fluid overload.","k":"Treat hypercalcemia of malignancy with saline and a bisphosphonate.","t":"Hypercalcemia of malignancy"},{"n":18,"stem":"A man with advanced cancer has agitated hyperactive delirium with hallucinations. No reversible cause is found beyond medications. Which drug is first-line for symptom control?","opts":["Lorazepam alone","Amitriptyline","Haloperidol","Zolpidem","Diphenhydramine"],"a":2,"e":"A low-dose antipsychotic such as haloperidol is standard for hyperactive delirium after reversible causes are addressed. Benzodiazepines can worsen delirium and are reserved for specific situations such as alcohol withdrawal.","k":"Haloperidol is standard for hyperactive delirium after treating causes.","t":"Delirium"},{"n":19,"stem":"A dying patient has noisy, rattling breathing that distresses family. Which approach is appropriate?","opts":["High-flow oxygen","Explain the symptom, reposition, and give an antimuscarinic such as glycopyrrolate","Intubation","Deep suctioning every hour","Large-volume intravenous fluids"],"a":1,"e":"Terminal secretions usually do not distress the unconscious patient. Reassurance, repositioning and antimuscarinic drugs are appropriate, and deep suctioning is distressing and ineffective.","k":"Terminal secretions are managed with family explanation and an antimuscarinic.","t":"Terminal secretions"},{"n":20,"stem":"A man with prostate cancer has new back pain, leg weakness, and urinary retention. What should be done urgently?","opts":["Increase morphine and observe","Give high-dose dexamethasone and obtain MRI of the whole spine","Start gabapentin","Schedule outpatient radiograph next week","Begin physical therapy"],"a":1,"e":"Spinal cord compression is an emergency. Corticosteroids are given, and MRI of the whole spine guides radiotherapy or surgery. Outcome depends on neurologic function at the start of treatment.","k":"Suspected cord compression needs dexamethasone and urgent MRI.","t":"Cord compression"}]},{"ch":3,"title":"Survivorship and End of Life","qs":[{"n":1,"stem":"A 34-year-old woman received mantle radiotherapy for Hodgkin lymphoma at age 19. She has no family history of breast cancer. Which surveillance is recommended?","opts":["Clinical breast examination alone until age 40","No screening, since her risk is average","Annual mammography with breast MRI, beginning 8 years after radiotherapy or at age 25, whichever is later","Mammography alone beginning at age 50","Breast ultrasound every 5 years"],"a":2,"e":"Women treated with chest radiotherapy before age 30 have a markedly raised lifetime risk of breast cancer. Guidelines advise annual mammography and MRI beginning 8 years after treatment or at age 25.","k":"Chest radiotherapy before age 30 calls for early annual mammography and MRI.","t":"Chest radiation and breast cancer risk"},{"n":2,"stem":"A 45-year-old survivor of breast cancer received doxorubicin and trastuzumab five years ago. She is asymptomatic. What is appropriate?","opts":["Troponin every month","Coronary angiography every year","Stress testing only if she develops chest pain","No cardiac follow-up, since treatment is complete","Periodic cardiac assessment, with attention to blood pressure, lipids, and echocardiography per risk"],"a":4,"e":"Anthracyclines and trastuzumab can cause cardiomyopathy that appears years later. Survivors need risk-factor control and periodic assessment, with imaging intervals set by cumulative dose and risk.","k":"Anthracycline survivors need long-term cardiac surveillance and risk-factor control.","t":"Anthracycline cardiac surveillance"},{"n":3,"stem":"A 28-year-old survivor of testicular cancer treated with four cycles of bleomycin, etoposide, and cisplatin reports ringing in the ears and numb toes. Which late effect of cisplatin is most likely responsible for both?","opts":["Ototoxicity and sensory neuropathy","Hemorrhagic cystitis and osteoporosis","Hypothyroidism and hypogonadism","Myelodysplasia and cataracts","Pulmonary fibrosis and cardiomyopathy"],"a":0,"e":"Cisplatin causes dose-related sensory neuropathy and high-frequency hearing loss with tinnitus. Bleomycin adds pulmonary toxicity, and survivors have raised cardiovascular risk.","k":"Cisplatin causes lasting ototoxicity and sensory neuropathy.","t":"Cisplatin late effects"},{"n":4,"stem":"A woman finished adjuvant chemotherapy 8 months ago and has ongoing fatigue. Blood counts, thyroid function and hemoglobin are normal and she has no depression. What is the best-supported intervention?","opts":["Bed rest","Erythropoietin","Methylphenidate as first-line therapy","A structured aerobic and resistance exercise program","Long-term corticosteroids"],"a":3,"e":"Exercise is the intervention with the strongest evidence for cancer-related fatigue after treatment, along with psychological approaches. Stimulants lack consistent benefit.","k":"Exercise is first-line for cancer-related fatigue after treatment.","t":"Fatigue in survivors"},{"n":5,"stem":"What weekly amount of moderate-intensity aerobic activity is recommended for cancer survivors?","opts":["30 minutes","60 minutes, avoiding all resistance exercise","At least 150 minutes, with strength training twice weekly","300 minutes with no strength training","Activity only during chemotherapy"],"a":2,"e":"Guidelines for survivors follow general adult recommendations, with 150 minutes of moderate aerobic activity weekly and strength training on two days, adjusted for treatment effects.","k":"Survivors should aim for 150 minutes of moderate aerobic activity weekly plus strength training.","t":"Physical activity target"},{"n":6,"stem":"A woman taking tamoxifen has bothersome hot flashes. Which drug should be avoided because it strongly inhibits CYP2D6?","opts":["Paroxetine","Venlafaxine","Gabapentin","Oxybutynin","Cognitive behavioral therapy"],"a":0,"e":"Tamoxifen is activated to endoxifen by CYP2D6, and strong inhibitors such as paroxetine and fluoxetine can lower this activation. Venlafaxine and gabapentin are alternatives.","k":"Avoid strong CYP2D6 inhibitors such as paroxetine with tamoxifen.","t":"Hot flashes on tamoxifen"},{"n":7,"stem":"A breast cancer survivor has chronic insomnia lasting several months. Which treatment has the strongest evidence?","opts":["Over-the-counter antihistamine nightly","Alcohol before sleep","Melatonin at very high doses","Long-term benzodiazepine","Cognitive behavioral therapy for insomnia"],"a":4,"e":"Cognitive behavioral therapy for insomnia is recommended as first-line therapy for chronic insomnia, including in survivors, and has durable benefit.","k":"Cognitive behavioral therapy for insomnia is first-line for chronic insomnia.","t":"Insomnia in survivors"},{"n":8,"stem":"A survivor has persistent, disabling fear of recurrence that causes her to seek frequent scans. Which approach is best supported?","opts":["Referral only to nutrition","Daily benzodiazepine","Additional surveillance scans on request","Psychological therapy aimed at fear of recurrence","Reassurance alone with a statement that cancer will not return"],"a":3,"e":"Fear of recurrence is common. Cognitive behavioral and mindfulness-based approaches reduce it, whereas extra imaging beyond guideline schedules can reinforce anxiety without benefit.","k":"Fear of recurrence responds to psychological therapy and not to extra scans.","t":"Fear of recurrence"},{"n":9,"stem":"A newly widowed man who is a cancer survivor tells you he feels hopeless and has thought about ending his life. What is the most appropriate response?","opts":["Reassure him that survivors rarely act on such thoughts","Ask directly about intent and plan, assess safety, and arrange urgent mental health care","Prescribe a sleep aid and reassess in 3 months","Refer to the oncology nutritionist","Avoid the subject to prevent planting ideas"],"a":1,"e":"Asking directly about suicide does not raise risk. Cancer survivors and bereaved persons have increased suicide risk, and any expressed ideation prompts safety assessment and urgent care.","k":"Direct questions about suicide are appropriate, and ideation needs urgent assessment.","t":"Suicide risk"},{"n":10,"stem":"Which statement best describes eligibility for hospice care under the usual Medicare benefit?","opts":["The patient must be in the last 2 weeks of life","The patient must stop all symptom treatments","A physician certifies a prognosis of 6 months or less if the illness runs its expected course","The patient must have no family caregiver","The patient must be a cancer patient with no active disease"],"a":2,"e":"The benefit requires certification of a limited prognosis of 6 months or less if the disease follows its usual course, and recertification is allowed if the patient lives longer. Palliative treatments continue.","k":"Hospice requires a certified prognosis of 6 months or less if the disease runs its expected course.","t":"Hospice eligibility"},{"n":11,"stem":"A patient asks whether choosing hospice means all cancer treatment must end. What is the most accurate answer?","opts":["Treatments aimed at cure are usually stopped, but comfort treatments such as palliative radiotherapy may continue","Hospice can only be used in the final 48 hours","Hospice care never includes radiotherapy","Chemotherapy continues unchanged at hospice expense","All treatments including pain medicines stop"],"a":0,"e":"Hospice focuses on comfort. Disease-directed therapy is generally stopped, but interventions that relieve symptoms, such as palliative radiotherapy, are often allowed.","k":"Hospice stops curative treatment, but comfort-directed treatment continues.","t":"Hospice and disease-directed therapy"},{"n":12,"stem":"A dying patient has severe refractory agitation and dyspnea despite maximal treatment. Palliative sedation is discussed. Which ethical principle is most relevant?","opts":["The procedure is euthanasia","Sedation is permitted only without consent","Sedation is justified only if the patient is unconscious","The intent is to relieve suffering, not to hasten death","The intent is to end the patient's life"],"a":3,"e":"Palliative sedation uses titrated sedatives to relieve intolerable suffering when other measures fail. It is distinguished from euthanasia by its intent, its proportionate dosing and its outcome.","k":"Palliative sedation aims to relieve suffering, not to cause death.","t":"Palliative sedation"},{"n":13,"stem":"A patient with respiratory failure from advanced cancer, who has capacity, asks to stop mechanical ventilation. Which statement is correct?","opts":["Withdrawal must wait for family agreement","Withdrawal is ethically worse than withholding","Withdrawal is permitted only for surrogates","Withdrawal requires a court order","Withdrawing a treatment the patient refuses is ethically equivalent to not starting it"],"a":4,"e":"A capacitated patient may refuse any treatment, including life-sustaining treatment, and withdrawal is ethically and legally equivalent to withholding. Symptoms are treated during withdrawal.","k":"Withdrawing an unwanted treatment is ethically equivalent to withholding it.","t":"Withdrawing treatment"},{"n":14,"stem":"A woman is 4 weeks into grief after her husband's death from cancer. She cries daily and sometimes hears his voice, but functions and has no suicidal thoughts. What is the best approach?","opts":["Start an antidepressant at once","Provide support and monitor, because this is an expected grief response","Diagnose psychosis and start antipsychotics","Advise her to avoid discussing him","Admit to inpatient psychiatry"],"a":1,"e":"Intense grief with brief perceptual experiences of the deceased is common. Persistent, impairing grief beyond 12 months is considered for prolonged grief disorder, and risk factors prompt earlier support.","k":"Intense early grief is expected, and support with monitoring is appropriate.","t":"Bereavement"},{"n":15,"stem":"A woman who had axillary dissection and radiotherapy develops mild arm swelling 8 months later. Which is appropriate?","opts":["Start a loop diuretic","Advise strict arm immobility","Prescribe long-term antibiotics","Recommend no weight-bearing exercise ever","Refer for complex decongestive therapy, including compression and manual drainage"],"a":4,"e":"Lymphedema is managed with compression, skin care, exercise and manual lymphatic drainage. Diuretics are ineffective, and progressive resistance exercise is safe.","k":"Lymphedema is treated with compression and decongestive therapy, not diuretics.","t":"Lymphedema"},{"n":16,"stem":"A survivor reports difficulty concentrating and word finding after chemotherapy. Neurologic examination and imaging are normal. What is the best approach?","opts":["Start donepezil routinely","Reassure that deficits are fixed and untreatable","Screen for contributors such as mood, sleep and medications, and offer cognitive rehabilitation","Start long-term corticosteroids","Order repeat chemotherapy"],"a":2,"e":"Cancer-related cognitive impairment is multifactorial. Contributors are treated, and cognitive rehabilitation and exercise are supported, whereas drug treatments lack strong evidence.","k":"Treat contributors and offer cognitive rehabilitation for cancer-related cognitive impairment.","t":"Cognitive effects"},{"n":17,"stem":"A survivor of head and neck cancer continues to smoke. Which statement is correct?","opts":["Counseling alone is superior to any drug","Only nicotine gum is permitted","Cessation no longer matters after treatment","Quitting after diagnosis improves outcomes, and combined counseling and pharmacotherapy is advised","Cessation should wait until surveillance ends"],"a":3,"e":"Continued smoking raises recurrence, second primary cancers and treatment complications. Behavioral support with pharmacotherapy such as varenicline or nicotine replacement works best.","k":"Smoking cessation after a cancer diagnosis improves outcomes and should be actively supported.","t":"Smoking cessation"},{"n":18,"stem":"A survivor who received neck radiotherapy for lymphoma 12 years ago has fatigue and weight gain. Which test is most useful?","opts":["Serum amylase","Thyroid-stimulating hormone","Stool occult blood","Bone scan","Echocardiogram only"],"a":1,"e":"Neck irradiation commonly causes hypothyroidism, often years later, so thyroid function is checked at intervals. Carotid disease and second cancers are also considered.","k":"Check thyroid function periodically after neck radiotherapy.","t":"Late effects of neck radiotherapy"},{"n":19,"stem":"A patient lacking capacity has no advance directive. Her daughter says she would not want a feeding tube because she always said she hated hospitals. Which standard applies?","opts":["Substituted judgment, based on what the patient would choose","The physician's preference alone","The oldest relative's wishes regardless of patient values","The cheapest option","Best interest never applies"],"a":0,"e":"Surrogates are asked to apply substituted judgment, reporting what the patient would decide. When her wishes are unknown the surrogate uses the best interest standard.","k":"A surrogate applies substituted judgment, based on what the patient would choose.","t":"Surrogate decisions"},{"n":20,"stem":"Which element belongs in a survivorship care plan?","opts":["Only the names of the nurses","A treatment summary and a schedule of surveillance, with who is responsible","Nothing about late effects","Only a list of drugs for pain","Only the pathology report"],"a":1,"e":"A care plan includes a treatment summary, expected late and long-term effects, surveillance and cancer screening schedules, health promotion and the clinician responsible for each part.","k":"A survivorship plan holds a treatment summary, late effects, surveillance, and responsibilities.","t":"Care plan content"},{"n":21,"stem":"A premenopausal survivor of breast cancer treated with an aromatase inhibitor has painful intercourse and vaginal dryness. Which is the first-line approach?","opts":["Nonhormonal moisturizers and lubricants","Stopping all endocrine therapy","Higher-dose tamoxifen","Systemic estrogen replacement","Testosterone cream"],"a":0,"e":"Nonhormonal moisturizers and lubricants are first-line. Local hormonal therapy is reserved for refractory cases after discussion with the oncologist, and systemic estrogen is avoided in hormone-sensitive disease.","k":"Nonhormonal moisturizers and lubricants are first-line for vaginal dryness after breast cancer.","t":"Sexual health"}]},{"ch":4,"title":"Communication, Prognosis, and Goals of Care","qs":[{"n":1,"stem":"A physician must tell a woman that her CT shows progression. Using SPIKES, what should be done right after arranging a private setting?","opts":["Give the prognosis in months","Ask the family to leave","Discuss the next chemotherapy","Show her the scan report at once","Ask what she understands about her illness"],"a":4,"e":"The second step of SPIKES is perception: finding out what the patient knows or suspects. It lets the clinician align the information with her understanding.","k":"After setting, SPIKES asks what the patient already understands.","t":"SPIKES perception step"},{"n":2,"stem":"A man with metastatic cancer says he is unsure how much he wants to know about his prognosis. What is the best response?","opts":["Give statistics only if he asks twice","Withhold the diagnosis entirely","Speak only with his wife","Ask how much information he would like and offer to share details at his pace","Tell him all the details regardless"],"a":3,"e":"The invitation step of SPIKES asks how much the patient wants to know. Patients vary, and respecting their preference supports trust and informed decisions.","k":"Ask patients how much information they want before giving it.","t":"Invitation to information"},{"n":3,"stem":"A patient with a new recurrence says, I cannot believe this is happening again. Which reply is an empathic statement that names the emotion?","opts":["Let us discuss the chemotherapy options","Many patients do worse than you","I can see how upsetting this is, and I wish the news were different","The scan shows a 3 cm lesion","You should look on the bright side"],"a":2,"e":"Empathic statements acknowledge and name the emotion before moving to information. They are often summarized by NURSE statements: name, understand, respect, support, explore.","k":"Acknowledge and name the emotion before giving more information.","t":"Empathic statement"},{"n":4,"stem":"After explaining the results of genomic testing, which technique best confirms that a patient has understood?","opts":["Hand over a brochure and end the visit","Repeat the explanation once more","Ask whether she has any questions only","Tell her not to worry","Ask the patient to say in her own words what she has heard"],"a":4,"e":"Ask-tell-ask, or teach-back, invites the patient to restate the information. It identifies misunderstanding and lets the clinician correct it, and open questions work better than yes or no ones.","k":"Teach-back lets the clinician check what the patient has understood.","t":"Ask-tell-ask"},{"n":5,"stem":"The family of a patient who speaks little English asks that the patient not be told her cancer is advanced. How should the physician respond?","opts":["Explore the family's concern, then ask the patient how much she wants to know, with a trained interpreter","Agree and withhold the diagnosis","Use a family member as the interpreter","Tell the family it is illegal to withhold","Cancel the visit"],"a":0,"e":"Patients have the right to information and may decide to delegate it. The clinician asks the patient directly, using a professional interpreter, and respects culturally shaped preferences.","k":"Ask the patient what she wants to know and use a professional interpreter.","t":"Family request to withhold"},{"n":6,"stem":"A patient needs an interpreter during a conversation about prognosis. Which is best practice?","opts":["The patient's teenage child","No interpreter if the patient nods","An untrained staff member","A trained medical interpreter, in person or by video","A family friend who is bilingual"],"a":3,"e":"Trained interpreters improve understanding and accuracy and lower errors. Family members may filter or soften information, and children should not interpret.","k":"Use a trained medical interpreter, not family members.","t":"Professional interpreter"},{"n":7,"stem":"Which statement about clinicians' predictions of survival in advanced cancer is supported by research?","opts":["Predictions are accurate to within one week","Clinicians tend to overestimate survival","Predictions are best made without an examination","Prediction accuracy improves with longer relationships","Clinicians usually underestimate survival"],"a":1,"e":"Clinicians' estimates are optimistic, often by a factor of two or more, and accuracy is limited. Performance status and symptoms improve estimates, which are best shared as ranges.","k":"Clinicians tend to overestimate survival in advanced cancer.","t":"Prognostic estimates"},{"n":8,"stem":"A patient asks how long she has. Based on her illness, a typical outcome is months, with some living a year or more and some a few weeks. How should this be communicated?","opts":["Say nobody can know and stop","Quote a five-year survival percentage","Share a range with best, worst and typical scenarios","Give a single exact date","Refuse to answer"],"a":2,"e":"A range with scenarios conveys uncertainty honestly and allows planning. It is often framed as hoping for the best while preparing for the worst.","k":"Share prognosis as a range with scenarios, not a single number.","t":"Sharing a range"},{"n":9,"stem":"A patient with metastatic cancer says he still hopes for a cure. What is a suitable response?","opts":["Tell him hope is unrealistic","Change the subject","Acknowledge the hope and also share the worry that the illness may not respond","Withdraw from discussing prognosis","Agree that cure is likely"],"a":2,"e":"Hope and realism can coexist. The clinician acknowledges the wish while stating the medical concern, which is sometimes expressed as I hope for that too, and I am worried that it may not happen.","k":"Acknowledge hope while honestly stating the medical concern.","t":"Hope and honesty"},{"n":10,"stem":"Which question best opens a goals-of-care conversation?","opts":["Would you like a feeding tube?","Do you want everything done?","Have you signed the form?","Do you want to be resuscitated?","What is most important to you if your health gets worse?"],"a":4,"e":"A goals discussion begins with values and priorities, then moves to specific treatments. Starting with procedures such as resuscitation hides the purpose.","k":"Start with values and goals, then discuss specific treatments.","t":"Goals of care"},{"n":11,"stem":"A patient with refractory metastatic cancer and poor performance status has not decided on resuscitation. What is the best approach?","opts":["Ask the family alone","List every option and ask her to choose","Defer until cardiac arrest occurs","Recommend what the clinician believes is medically appropriate after exploring her goals","Write a do-not-resuscitate order without discussion"],"a":3,"e":"Clinicians should offer a recommendation based on the patient's goals and medical reality, rather than present a menu. Resuscitation has low success in advanced cancer, and the patient keeps the final say.","k":"Offer a recommendation grounded in the patient's goals, not a menu of options.","t":"Code status recommendation"},{"n":12,"stem":"A family asks whether a do-not-resuscitate order means no further treatment. What is correct?","opts":["No, it applies only to cardiopulmonary resuscitation, and other treatment continues","Yes, all treatment stops","No, it also removes pain relief","Yes, chemotherapy is stopped","Yes, antibiotics are withheld"],"a":0,"e":"A code status order covers resuscitation only. Other treatments, including antibiotics, chemotherapy and comfort care, continue according to the goals.","k":"A do-not-resuscitate order concerns resuscitation only.","t":"Do not resuscitate meaning"},{"n":13,"stem":"A patient with respiratory failure and uncertain prognosis is unsure about intensive care. Which approach helps?","opts":["Open-ended life support","Agree on a time-limited trial with defined goals and review points","Immediate withdrawal of care","Transfer without discussion","Delay until the family agrees"],"a":1,"e":"A time-limited trial sets a period, a measure of success and a plan if treatment is not working. It respects uncertainty and lets the patient and clinicians revisit goals.","k":"A time-limited trial defines the duration and success criteria for intensive treatment.","t":"Time-limited trial"},{"n":14,"stem":"In a large cohort of patients with stage IV cancer, many believed that chemotherapy could cure them. What was a noted association?","opts":["Misunderstanding was related to age only","Those with the best communication had accurate beliefs","Misunderstanding was rare","Misunderstanding disappeared with more visits","Patients who rated communication highly more often held inaccurate beliefs"],"a":4,"e":"In the cohort, most patients with advanced lung or colorectal cancer misunderstood the aim of chemotherapy, and those most satisfied with their physician's communication were more likely to be mistaken.","k":"Satisfaction with communication does not guarantee accurate understanding.","t":"Misunderstanding of intent"},{"n":15,"stem":"An observational study finds that patients who discussed end-of-life care had less intensive care near death. Which statement is correct?","opts":["It is a randomized trial","It shows no relationship exists","It shows an association and cannot prove that the discussions caused the difference","It shows the discussions increase mortality","It proves causation"],"a":2,"e":"A cohort study can show association, but unmeasured differences between patients may explain it. Randomized trials of structured communication improve documentation and conversation quality.","k":"A cohort study shows association and does not prove causation.","t":"Observational data"},{"n":16,"stem":"What is the surprise question used to identify patients who may benefit from palliative care?","opts":["Is the patient surprised by the side effects?","Would you be surprised if this patient died within the next year?","Would the insurer be surprised?","Is the family surprised by the diagnosis?","Would you be surprised by the next scan?"],"a":1,"e":"The surprise question prompts clinicians to identify patients with a limited prognosis who need advance care planning. A no answer is a trigger for a conversation, not a precise prediction.","k":"The surprise question flags patients who may die within a year.","t":"Surprise question"},{"n":17,"stem":"Siblings disagree about whether their mother with advanced cancer should receive further chemotherapy. She cannot speak for herself. What is the best step?","opts":["Hold a family meeting to review her prior values and the medical facts","Refer the dispute to court immediately","Start chemotherapy without discussion","Follow the loudest sibling","Ask the sibling with the highest income"],"a":0,"e":"Meetings with a shared medical update and focus on what the patient would want usually resolve conflict. Ethics consultation is considered if disagreement persists.","k":"Use a family meeting centered on what the patient would want.","t":"Conflict among family"},{"n":18,"stem":"After hearing about progression, a patient is quiet and looks down. What is the best response?","opts":["Fill the silence with more data","Leave the room","Tell her to stay calm","Allow silence and then acknowledge the emotion","Proceed to consent forms"],"a":3,"e":"Silence gives patients time to absorb bad news. Waiting, then naming what you notice, supports communication better than hurrying on.","k":"Allow silence after bad news and then acknowledge the emotion.","t":"Silence"},{"n":19,"stem":"A patient with limited options asks about a phase 1 trial. Which statement is most appropriate during the discussion?","opts":["Say that trial participation guarantees better care","Avoid mentioning risks","Tell her to decide immediately","Explain that the main aim is to learn about the drug and that benefit is uncertain","Promise a high chance of response"],"a":3,"e":"Honest discussion prevents therapeutic misconception. Patients should hear the purpose, the risks and the chance of benefit, and the alternatives, including hospice.","k":"Discuss phase 1 trials honestly, including the limited chance of benefit.","t":"Clinical trial discussion"},{"n":20,"stem":"A cluster randomized trial of a structured serious illness conversation program showed which main result?","opts":["Chemotherapy use fell to zero","Survival improved by one year","Hospital admissions were abolished","Costs were unchanged and communication unaffected","Goals and values were documented more often, and conversations were of higher quality"],"a":4,"e":"The trial's outcomes were documentation, timing and quality of discussions, which improved. It did not primarily test survival.","k":"Structured conversation programs improved documentation and conversation quality.","t":"Serious illness conversation guide"},{"n":21,"stem":"A patient with cancer wants to ensure that her wishes are followed if she loses capacity. What should she do?","opts":["Rely on the hospital to decide","Wait until she is critically ill","Complete an advance directive and name a health care proxy","Write a note to herself","Tell only her pharmacist"],"a":2,"e":"An advance directive records preferences, and the proxy speaks for her when she cannot. Both work best after discussion with the family and clinicians, and they should be reviewed as illness changes.","k":"An advance directive and a named proxy preserve a patient's wishes.","t":"Advance directives"}]},{"ch":5,"title":"Acute Leukemia and Myelodysplasia","qs":[{"n":1,"stem":"A 58-year-old man treated with radiotherapy and alkylating chemotherapy for Hodgkin lymphoma 6 years ago has newly diagnosed AML with myelodysplasia-related changes. He is fit for intensive therapy. Which induction regimen improved survival over 7+3 in this group?","opts":["Low-dose cytarabine alone","CPX-351, a liposomal daunorubicin and cytarabine","Gilteritinib alone","Hydroxyurea","Azacitidine alone"],"a":1,"e":"CPX-351 improved overall survival over standard 7+3 in older patients with therapy-related or myelodysplasia-related AML. It has a longer interval to count recovery.","k":"CPX-351 is used for therapy-related AML and AML with myelodysplasia-related changes.","t":"Therapy-related AML"},{"n":2,"stem":"A 35-year-old woman has AML with t(8;21) and no FLT3 mutation. Which consolidation is standard after remission?","opts":["High-dose cytarabine","Azacitidine maintenance","Imatinib","Observation only","Allogeneic transplant in first remission for all patients"],"a":0,"e":"Core binding factor leukemias have favorable risk, and repeated cycles of high-dose cytarabine give good outcomes. Transplant is reserved for relapse or persistent measurable residual disease.","k":"Core binding factor AML is consolidated with high-dose cytarabine.","t":"Core binding factor AML"},{"n":3,"stem":"A 40-year-old man with newly diagnosed core binding factor AML is treated with 7+3. Which antibody-drug conjugate may be added?","opts":["Inotuzumab ozogamicin","Gemtuzumab ozogamicin","Polatuzumab vedotin","Trastuzumab deruxtecan","Brentuximab vedotin"],"a":1,"e":"Gemtuzumab ozogamicin targets CD33 and improves outcomes when added to intensive chemotherapy in favorable-risk disease. Hepatotoxicity, including veno-occlusive disease, is a recognized risk.","k":"Gemtuzumab ozogamicin targets CD33 and is added to chemotherapy in core binding factor AML.","t":"Gemtuzumab"},{"n":4,"stem":"A 50-year-old man has AML with a mutated NPM1 gene and no FLT3-ITD. How is his genetic risk classified under the European LeukemiaNet 2022 system?","opts":["Cannot be classified","Intermediate with transplant required","Adverse if TP53 is wild type","Favorable","Adverse"],"a":3,"e":"NPM1 mutation without FLT3-ITD is favorable risk. The presence of adverse cytogenetics changes the category, and measurable residual disease helps guide transplant decisions.","k":"NPM1 mutation without FLT3-ITD is favorable risk.","t":"NPM1 mutated AML"},{"n":5,"stem":"A woman with relapsed AML and a FLT3 mutation has previously received 7+3 without a FLT3 inhibitor. Which drug has survival benefit over salvage chemotherapy?","opts":["Imatinib","Midostaurin alone","Enasidenib","Sorafenib alone","Gilteritinib"],"a":4,"e":"Gilteritinib, an oral FLT3 inhibitor, improved overall survival over salvage chemotherapy in relapsed or refractory FLT3-mutated AML in the ADMIRAL trial.","k":"Gilteritinib is the FLT3 inhibitor for relapsed or refractory FLT3-mutated AML.","t":"Relapsed FLT3 AML"},{"n":6,"stem":"A patient with relapsed AML carries an IDH2 mutation. Which targeted drug is approved?","opts":["Quizartinib","Venetoclax","Enasidenib","Ivosidenib","G
