tage IB to IIIA disease.", "t": "Adjuvant osimertinib"}, {"n": 3, "stem": "A 44-year-old never-smoker presents with headaches and is found to have lung adenocarcinoma with bone metastases. MRI shows four brain metastases, the largest 9 mm, none causing mass effect. Fluorescence in situ hybridization shows an ALK rearrangement, and EGFR testing is negative. Which first-line therapy has the strongest randomized evidence of intracranial activity?", "opts": ["Pembrolizumab", "Crizotinib", "Osimertinib", "Lorlatinib", "Sotorasib"], "a": 3, "e": "In CROWN, lorlatinib beat crizotinib, with 12-month progression-free survival of 78% against 39%, and among patients with measurable brain metastases the intracranial response rate was 82% against 23%. Crizotinib is the comparator that lost, and the trap is its familiarity as the original ALK inhibitor. Osimertinib and sotorasib target EGFR and KRAS G12C, which his tumor does not carry. Pembrolizumab with chemotherapy was studied in patients without ALK alterations. In practice, brain metastases strengthen the case for an ALK inhibitor with better intracranial activity than crizotinib.", "k": "In ALK-positive disease with brain metastases, first-line lorlatinib has randomized intracranial evidence over crizotinib.", "t": "ALK with brain metastases"}, {"n": 4, "stem": "A 63-year-old former smoker received first-line pembrolizumab plus chemotherapy for metastatic lung adenocarcinoma and had progression at 8 months, with new liver metastases. Repeat tissue testing shows a KRAS G12C mutation and no EGFR, ALK, or other actionable alteration. Performance status is 1 and liver function tests are normal. Which treatment has randomized evidence of better progression-free survival than docetaxel in this setting?", "opts": ["Sotorasib", "Lorlatinib", "Durvalumab", "Crizotinib", "Osimertinib"], "a": 0, "e": "CodeBreaK 200 randomized 345 previously treated patients with KRAS G12C disease to sotorasib or docetaxel, and median progression-free survival was 5.6 against 4.5 months, a hazard ratio of 0.66. That supports sotorasib. The trap is reaching for a drug that worked in another genotype, since osimertinib and lorlatinib are matched to EGFR and ALK. Durvalumab consolidation belongs after chemoradiotherapy in stage III disease. Sotorasib also had fewer grade 3 or higher events than docetaxel, 33% against 40%, although diarrhea and raised liver enzymes need monitoring.", "k": "In previously treated KRAS G12C lung cancer, sotorasib improved progression-free survival over docetaxel.", "t": "KRAS G12C later line"}, {"n": 5, "stem": "A 68-year-old man with unresectable stage IIIB lung adenocarcinoma completes concurrent chemoradiotherapy. Restaging CT four weeks later shows a partial response with no new lesions. EGFR and ALK testing are negative, and he has no history of autoimmune disease. His oxygen saturation at rest is normal. What is the best next step?", "opts": ["Observation with surveillance imaging", "Osimertinib for three years", "Additional cycles of the same chemotherapy", "Pembrolizumab with chemotherapy", "Durvalumab for up to 12 months"], "a": 4, "e": "In PACIFIC, 713 patients without progression after chemoradiotherapy received durvalumab or placebo for up to 12 months, and median progression-free survival was 16.8 against 5.6 months, a hazard ratio of 0.52. That is the basis for durvalumab here. Observation is the older default and the trap for readers who remember the era before immunotherapy. Osimertinib requires an EGFR alteration, which he does not have. Pembrolizumab with chemotherapy belongs to metastatic disease. Expect more discontinuations for toxicity than with placebo, 15.4% against 9.8%.", "k": "After chemoradiotherapy for unresectable stage III disease without progression, durvalumab for up to 12 months improves progression-free survival.", "t": "Stage III consolidation"}, {"n": 6, "stem": "A 59-year-old man has a right upper lobe adenocarcinoma with ipsilateral hilar nodal involvement, clinical stage IIIA, judged resectable at multidisciplinary review. Pulmonary reserve is adequate for lobectomy. He has no EGFR or ALK alteration. Which approach has randomized evidence of improved event-free survival and pathological complete response?", "opts": ["Adjuvant osimertinib after upfront surgery", "Concurrent chemoradiotherapy, then durvalumab", "Platinum chemotherapy alone, then surgery with no immunotherapy", "Immediate surgery followed by observation alone", "Nivolumab with platinum chemotherapy, then surgery"], "a": 4, "e": "CheckMate 816 gave resectable stage IB to IIIA patients nivolumab plus platinum-based chemotherapy or chemotherapy alone before surgery. Median event-free survival was 31.6 against 20.8 months, and pathological complete response was 24.0% against 2.2%. Chemotherapy alone before surgery is the control arm, which makes it the most tempting wrong answer. Chemoradiotherapy followed by durvalumab is the pathway for unresectable disease, and adjuvant osimertinib needs an EGFR alteration. The neoadjuvant approach did not reduce operability, since 83.2% and 75.4% underwent surgery.", "k": "For resectable stage IB to IIIA disease, neoadjuvant nivolumab plus chemotherapy improves event-free survival and pathological complete response.", "t": "Neoadjuvant chemoimmunotherapy"}, {"n": 7, "stem": "A 70-year-old man who smoked has newly diagnosed metastatic lung adenocarcinoma with pleural and liver metastases. Comprehensive tissue and plasma testing finds no EGFR, ALK, or other actionable alteration, and PD-L1 expression is 20%. His ECOG performance status is 1. Which first-line treatment has randomized evidence of improved overall survival at 12 months?", "opts": ["Crizotinib as targeted therapy", "Osimertinib as targeted therapy", "Durvalumab after chemoradiotherapy", "Pembrolizumab with chemotherapy", "Platinum doublet chemotherapy alone"], "a": 3, "e": "KEYNOTE-189 randomized 616 patients without EGFR or ALK alterations to pembrolizumab plus chemotherapy or placebo plus chemotherapy. Twelve-month overall survival was 69.2% against 49.4%, a hazard ratio for death of 0.49, while grade 3 or higher events were similar, 67.2% against 65.8%. Chemotherapy alone is the comparator and the common trap. Osimertinib and crizotinib need EGFR or ALK alterations, and durvalumab consolidation follows chemoradiotherapy. In practice, the benefit is shown in the population that lacks a driver, which is why testing comes first.", "k": "In nonsquamous disease without EGFR or ALK alterations, adding pembrolizumab to chemotherapy improved survival at 12 months.", "t": "Chemoimmunotherapy without a driver"}, {"n": 8, "stem": "A 55-year-old woman with EGFR exon 19 deleted lung adenocarcinoma has taken first-line osimertinib for 14 months with stable disease. She asks whether the drug extends life or only delays progression, because a friend quoted her a progression-free survival number. Which statement best describes the final overall survival analysis of the first-line trial?", "opts": ["No difference, with identical median survival in both arms", "Longer survival with osimertinib, hazard ratio of 0.46", "Longer survival with osimertinib, hazard ratio of 0.80", "Longer survival with the comparator in later follow-up", "Survival data immature, with no conclusion possible yet"], "a": 2, "e": "The final analysis reported median overall survival of 38.6 months with osimertinib against 31.8 months with a first-generation inhibitor, a hazard ratio for death of 0.80 with a confidence interval reaching 1.00. Survival was longer, but the margin is modest. The progression-free hazard ratio of 0.46 is the tempting wrong number, because it describes a different endpoint. The immature-data answer describes the earlier interim analysis, when overall survival was only 25% mature. In practice, tell her that osimertinib delays progression substantially and extends survival by a smaller, statistically borderline margin.", "k": "In the first-line osimertinib trial, overall survival improved with a hazard ratio of 0.80, a smaller effect than on progression-free survival.", "t": "Reading the overall survival analysis"}, {"n": 9, "stem": "A 52-year-old woman with ALK-positive lung adenocarcinoma has received first-line therapy for 5 months, with an excellent response of her brain metastases. At follow-up she reports new ankle swelling, weight gain, and difficulty finding words. A fasting lipid panel shows markedly raised cholesterol and triglycerides that were normal at baseline. Which agent is most likely responsible for this pattern of adverse effects?", "opts": ["Crizotinib", "Lorlatinib", "Sotorasib", "Osimertinib", "Durvalumab"], "a": 1, "e": "In CROWN, grade 3 or 4 adverse events occurred in 72% of lorlatinib patients against 56% with crizotinib, driven mainly by altered lipid levels, and edema, weight gain, neuropathy and cognitive effects were also common with lorlatinib. That cluster identifies lorlatinib. Crizotinib is the trap because it is the other first-line ALK inhibitor, but the excess of severe events in the trial came with lorlatinib. The remaining agents are not ALK inhibitors. In practice, check lipids at baseline and during treatment, and ask about mood and cognition at each visit.", "k": "Lorlatinib adds raised lipids, edema, weight gain and cognitive effects to its intracranial benefit.", "t": "Lorlatinib adverse effects"}, {"n": 10, "stem": "A 66-year-old woman who has never smoked has newly diagnosed metastatic lung adenocarcinoma with a symptomatic pleural effusion and worsening dyspnea. PD-L1 immunohistochemistry returns at 60% within 3 days, and molecular sequencing needs 10 more days. The oncologist is tempted to start pembrolizumab plus chemotherapy at once. How should treatment be sequenced?", "opts": ["Manage the effusion and await genotype before choosing therapy", "Start pembrolizumab plus chemotherapy now because PD-L1 is high", "Start chemotherapy alone now and test only at progression", "Wait for a second biopsy to repeat PD-L1 first", "Start osimertinib now because she has never smoked"], "a": 0, "e": "The chemoimmunotherapy evidence comes from 616 patients who had no EGFR or ALK alteration, so a high PD-L1 value does not show that this woman belongs to that population. In a never-smoker an EGFR or ALK driver is a real possibility, and the matched drugs carry large progression-free survival advantages., Starting immunotherapy early commits her to a regimen that may be wrong. Empiric osimertinib is the opposite error, treating a guess. Testing only at progression forgoes the best first-line option. Drain the effusion for relief and wait the days needed.", "k": "Do not commit to chemoimmunotherapy until EGFR and ALK status is known.", "t": "Biomarker-first sequencing"}, {"n": 11, "stem": "A 62-year-old man undergoes lobectomy for a stage II lung adenocarcinoma with an EGFR exon 19 deletion, negative margins, and one positive hilar node. His surgeon asks you to state what the adjuvant osimertinib trial established before recommending it to him. Which statement is accurate?", "opts": ["Disease-free survival improved; overall survival was immature", "Central nervous system relapse was not reduced by treatment", "Benefit emerged only after the three-year course was finished", "Overall survival improved significantly in every stage studied", "Treatment was stopped early because of excess toxicity signals"], "a": 0, "e": "ADAURA reported 24-month disease-free survival of 89% with osimertinib against 52% with placebo across stages IB to IIIA, a hazard ratio of 0.20, and overall survival was immature with only 29 deaths. That makes the disease-free survival statement correct. The survival claim is the trap, because a large disease-free benefit invites the assumption of a survival benefit. Central nervous system disease-free survival also improved, 98% against 85%, and no new safety concerns were noted, which rules out the other statements. In practice, counsel patients that the proven benefit is fewer relapses.", "k": "Adjuvant osimertinib proved a disease-free survival benefit; an overall survival benefit was not yet shown.", "t": "Interpreting the adjuvant trial"}]}, {"ch": 10, "title": "Small Cell Lung Cancer, Mesothelioma, Thymic Cancer, and Complications", "qs": [{"n": 1, "stem": "A 66-year-old man with limited-stage small cell lung cancer completes concurrent platinum-based chemoradiotherapy. Restaging computed tomography shows a partial response without progression, and brain magnetic resonance imaging is negative. His performance status is good. His oncologist is deciding on further systemic treatment. Which approach has randomized survival evidence in this setting?", "opts": ["Durvalumab consolidation", "Tarlatamab maintenance", "Atezolizumab with carboplatin", "Observation with imaging only", "Four more cycles of etoposide"], "a": 0, "e": "ADRIATIC randomized patients without progression after concurrent chemoradiotherapy to durvalumab or placebo, and median overall survival was 55.9 months against 33.4 months, a hazard ratio of 0.73. Observation was the old default and is now outdated. Atezolizumab with carboplatin belongs to extensive-stage induction. Tarlatamab was studied after platinum chemotherapy in relapsed disease. In practice, consolidation applies only after chemoradiotherapy and only without progression.", "k": "After chemoradiotherapy without progression in limited-stage disease, give durvalumab.", "t": "Limited-stage consolidation"}, {"n": 2, "stem": "A 58-year-old man with extensive-stage small cell lung cancer has liver and adrenal metastases and a good performance status. Brain magnetic resonance imaging is negative, and he has not been treated. He asks whether chemotherapy alone remains the standard or whether something should be added. Which first-line regimen improved overall survival in a blinded randomized trial?", "opts": ["Pemetrexed with a platinum drug, then maintenance", "Carboplatin and etoposide with prophylactic brain radiation", "Atezolizumab added to carboplatin and etoposide", "Nivolumab with ipilimumab in place of chemotherapy", "Tarlatamab given in place of platinum chemotherapy"], "a": 2, "e": "IMpower133 added atezolizumab or placebo to carboplatin and etoposide, and median overall survival was 12.3 months against 10.3 months, a hazard ratio of 0.70. Chemotherapy without an added drug was the comparator and lost. Pemetrexed treats nonsquamous lung cancer, not small cell disease. Tarlatamab was tested after platinum in relapsed disease. In practice the gain is real but modest, and counseling should say so plainly.", "k": "Extensive-stage SCLC: add atezolizumab to platinum and etoposide.", "t": "Extensive-stage first line"}, {"n": 3, "stem": "A 63-year-old woman completes induction with atezolizumab, carboplatin and etoposide for extensive-stage small cell lung cancer. Restaging shows no progression, she is fit, and her blood counts are adequate. Her oncologist wants maintenance therapy with randomized evidence of better survival than atezolizumab alone, accepting extra toxicity. Which option fits?", "opts": ["Topotecan alone as ongoing maintenance", "Observation off all further treatment", "Nivolumab with ipilimumab as maintenance", "Durvalumab given after thoracic radiation", "Lurbinectedin added to atezolizumab"], "a": 4, "e": "IMforte randomized patients without progression after induction to lurbinectedin with atezolizumab or to atezolizumab alone, and the hazard ratios were 0.54 for progression-free survival and 0.73 for overall survival. The cost was more grade 3 or 4 events, 38% against 22%, with more myelosuppression. Durvalumab consolidation belongs to limited-stage disease. Topotecan is a second-line chemotherapy. Maintenance choices should weigh benefit against toxicity.", "k": "Extensive-stage maintenance: lurbinectedin plus atezolizumab improves survival and adds toxicity.", "t": "Extensive-stage maintenance"}, {"n": 4, "stem": "A 60-year-old woman with extensive-stage small cell lung cancer progresses six months after first-line chemoimmunotherapy. She has new liver lesions and fatigue but is ambulatory, with adequate organ function. Her oncologist wants a second-line option that has been shown in a randomized trial to improve overall survival compared with chemotherapy. Which is best supported?", "opts": ["Durvalumab given after thoracic radiation", "Tarlatamab, a DLL3-directed T-cell engager", "Pemetrexed with cisplatin as salvage therapy", "Topotecan repeated as second-line chemotherapy", "Atezolizumab rechallenge without any chemotherapy"], "a": 1, "e": "DeLLphi-304 randomized patients who progressed after platinum to tarlatamab or chemotherapy, and median overall survival was 13.6 months against 8.3 months, a hazard ratio of 0.60. Grade 3 or higher events were less frequent with tarlatamab, 54% against 80%. Topotecan was a drug in the losing arm. Durvalumab consolidation is for limited-stage disease. The analysis was interim, so the estimate may be refined with longer follow-up.", "k": "Relapsed SCLC: tarlatamab improves survival over chemotherapy.", "t": "Relapsed disease"}, {"n": 5, "stem": "A 71-year-old retired plumber has an unresectable epithelioid malignant pleural mesothelioma confirmed on thoracoscopic biopsy. He has good performance status and no autoimmune disease. His oncologist wants the first-line option that was compared with platinum and pemetrexed in a randomized phase 3 trial and improved overall survival. What is it?", "opts": ["Pembrolizumab alone without ipilimumab", "Lurbinectedin combined with atezolizumab", "Durvalumab consolidation after radiation", "Nivolumab combined with ipilimumab", "Tarlatamab as first-line therapy"], "a": 3, "e": "CheckMate 743 randomized patients to nivolumab with ipilimumab or to platinum with pemetrexed, and median overall survival was 18.1 months against 14.1 months, a hazard ratio of 0.74, with two-year survival of 41% against 27%. The other options belong to small cell lung cancer. Grade 3 or 4 events were similar between arms, so the choice rests on survival and on the ability to recognize immune toxicity early.", "k": "Unresectable pleural mesothelioma: nivolumab plus ipilimumab is an accepted first-line option.", "t": "Mesothelioma first line"}, {"n": 6, "stem": "A 45-year-old woman has ptosis that worsens by evening and difficulty swallowing. Chest imaging shows an anterior mediastinal mass, acetylcholine receptor antibodies are positive, and the mass is consistent with thymoma. Surgery is planned for next week. Which step should come before the resection is performed?", "opts": ["Neurologic optimization of her myasthenia gravis", "Immediate chemotherapy in place of any surgery", "Long-term immunotherapy with a checkpoint inhibitor", "Observation with surveillance imaging every year", "Prophylactic cranial irradiation before the operation"], "a": 0, "e": "Thymomas are associated with myasthenia gravis, and uncontrolled disease raises the risk of respiratory failure under anesthesia, so neurology should optimize control first. Complete resection is the most important prognostic step for the tumor itself. Chemotherapy in place of surgery is reserved for unresectable disease. Prophylactic cranial irradiation belongs to small cell lung cancer. In practice, the neurologic and surgical plans are made together.", "k": "Control myasthenia gravis before thymoma surgery.", "t": "Thymoma and myasthenia"}, {"n": 7, "stem": "A 63-year-old woman receiving atezolizumab for small cell lung cancer reports seven watery stools daily for a week, with cramping and no fever. Stool studies exclude infection, and her baseline was one formed stool daily. Her oncologist grades the diarrhea as grade 3. Which management matches consensus guidance for this grade of toxicity?", "opts": ["Continue immunotherapy and add loperamide for symptom relief", "Observe without any change to the current treatment", "Suspend immunotherapy and start high-dose corticosteroids", "Permanently stop all immunotherapy and give no steroids", "Start broad-spectrum antibiotics for presumed infection"], "a": 2, "e": "ASCO guidance for grade 3 toxicity generally calls for suspending immunotherapy and starting high-dose corticosteroids, tapered over at least 4 to 6 weeks. Continuing the drug is the approach for grade 1 events. Permanent discontinuation is generally reserved for grade 4 events. Observation is inadequate at this grade, and antibiotics do not treat an immune cause. The recommendations rest on expert consensus, so the decision should be documented.", "k": "Grade 3 immune toxicity: suspend immunotherapy and give high-dose steroids with a long taper.", "t": "Grade 3 colitis"}, {"n": 8, "stem": "A 67-year-old man receiving nivolumab and ipilimumab for pleural mesothelioma develops fatigue and cold intolerance. Thyroid-stimulating hormone is markedly elevated and free thyroxine is low. He has no other organ toxicity, and imaging shows his tumor is responding. His oncologist wants to protect the response. What is the best approach?", "opts": ["Switch to platinum chemotherapy for safety", "Permanently stop all immunotherapy at once", "Start high-dose corticosteroids for thyroid inflammation", "Wait for spontaneous recovery of function", "Replace thyroid hormone and continue immunotherapy"], "a": 4, "e": "Hypothyroidism is an endocrinopathy, and endocrinopathies controlled with hormone replacement are the stated exception to permanent discontinuation in the ASCO guidance. The missing hormone is replaced, and the drug that is controlling the tumor continues. High-dose steroids are for higher-grade inflammatory toxicity. Switching to chemotherapy gives up a response that is working, and waiting leaves the patient symptomatic with fatigue and cold intolerance. In practice, thyroid function is checked regularly during immunotherapy so that this event is caught and treated early.", "k": "Controlled endocrinopathies are treated by replacement and rarely stop immunotherapy.", "t": "Endocrine toxicity"}, {"n": 9, "stem": "A 69-year-old smoker is admitted with confusion. Serum sodium is low, urine osmolality is high, and she appears euvolemic on examination. Chest imaging shows a central lung mass with mediastinal nodes, and biopsy shows small cell carcinoma. Her oncologist is preparing to counsel the family. Which statement about her hyponatremia is correct?", "opts": ["It requires lifelong fluid restriction to control", "It reflects adrenal insufficiency from metastases", "It makes a diagnosis of small cell cancer unlikely", "It is likely SIADH and improves with tumor treatment", "It will persist unchanged even once chemotherapy begins"], "a": 3, "e": "Small cell lung cancer can secrete antidiuretic hormone, producing SIADH with a euvolemic hyponatremia and concentrated urine. Fluid restriction is a temporary measure, and the durable fix is effective treatment of the tumor, since the hormone comes from the cancer. Adrenal metastases can cause insufficiency but do not explain euvolemic hyponatremia with high urine osmolality. A later return of hyponatremia may signal relapse.", "k": "SIADH in SCLC is treated by treating the tumor.", "t": "SIADH as a paraneoplastic syndrome"}, {"n": 10, "stem": "A 62-year-old man with a long smoking history has difficulty rising from chairs and climbing stairs, a dry mouth, and erectile dysfunction. Strength improves briefly with sustained effort, and his reflexes are reduced. No lung mass has been found yet. Which next step is most appropriate in his evaluation?", "opts": ["Thymectomy because of a presumed thymoma", "Chest imaging to look for small cell lung cancer", "Reassurance and discharge from further care", "Plasma exchange as the only treatment offered", "Immunotherapy for a presumed immune-related toxicity"], "a": 1, "e": "Proximal weakness with autonomic features and brief improvement on effort fits Lambert-Eaton myasthenic syndrome, which is strongly associated with small cell lung cancer. Imaging for an occult primary is the next step, and treating the cancer is the first step in controlling the syndrome. Thymectomy addresses a different condition. Immune-related toxicity would need prior immunotherapy exposure, which this man has not had.", "k": "Suspect small cell lung cancer in Lambert-Eaton syndrome.", "t": "Lambert-Eaton syndrome"}, {"n": 11, "stem": "A 52-year-old man has chest pain and a large anterior mediastinal mass invading the pericardium and great vessels. Biopsy shows thymic carcinoma, and imaging shows pleural implants. He has no myasthenic symptoms. Surgeons judge complete resection not feasible. Which is the usual first systemic approach in this situation?", "opts": ["Platinum-based chemotherapy", "Tarlatamab given as first-line therapy", "Durvalumab consolidation after radiation", "Nivolumab combined with ipilimumab", "Immediate thymectomy with curative intent"], "a": 0, "e": "Thymic carcinoma that cannot be fully resected is usually treated with platinum-based chemotherapy, with radiation considered for local control. Thymectomy needs resectable disease. Nivolumab with ipilimumab has randomized evidence in mesothelioma, not thymic carcinoma. Tarlatamab and durvalumab consolidation belong to small cell lung cancer., Radiation may be added for local control after chemotherapy, and the plan is reviewed by a multidisciplinary team.", "k": "Unresectable thymic carcinoma: platinum-based chemotherapy.", "t": "Unresectable thymic carcinoma"}, {"n": 12, "stem": "A 58-year-old man with extensive-stage small cell lung cancer asks how much longer atezolizumab with chemotherapy will let him live compared with chemotherapy alone. His oncologist recalls the registration trial, which reported median overall survival in both arms. How should the expected benefit be described to him in this visit?", "opts": ["A gain in progression-free survival with no overall benefit", "No survival advantage over chemotherapy given alone", "A cure for most patients who receive the treatment", "A real but modest gain of about two months at the median", "A gain of more than one year at the median"], "a": 3, "e": "IMpower133 reported median overall survival of 12.3 months with atezolizumab against 10.3 months with placebo, a hazard ratio of 0.70, and the progression-free gain was smaller, 5.2 against 4.3 months. That is a statistically significant but modest gain, driven by a minority of long-term responders. Calling it a cure overstates it, and denying any advantage understates it. Honest counseling uses the actual medians.", "k": "Atezolizumab added about two months of median survival in extensive-stage SCLC.", "t": "Interpreting a modest survival gain"}]}, {"ch": 11, "title": "Risk, Premalignant Conditions, and Carcinoma in Situ", "qs": [{"n": 1, "stem": "A 58-year-old postmenopausal woman has a mother and sister with breast cancer, dense breasts, and a high calculated lifetime risk. She has no history of thrombosis or osteoporosis. She asks whether a medication can reduce her risk of developing breast cancer. Which statement best reflects the evidence for her situation?", "opts": ["Medication is recommended routinely for every woman", "Only mastectomy lowers the risk in this situation", "Tamoxifen is the sole option after the menopause", "Medication has no proven role in preventing breast cancer", "Anastrozole reduced incidence in a randomized trial"], "a": 4, "e": "IBIS-II randomized postmenopausal women at increased risk to anastrozole or placebo, and breast cancer developed in 40 women on anastrozole against 85 on placebo, a hazard ratio of 0.47. The Task Force recommends offering medication to women at increased risk and low risk of adverse effects, not routinely to everyone. Tamoxifen is one option among several after menopause. In practice, the choice depends on age, comorbidity and tolerance.", "k": "Postmenopausal women at increased risk can be offered anastrozole, exemestane, raloxifene or tamoxifen.", "t": "Risk-reducing medication, postmenopausal"}, {"n": 2, "stem": "A 42-year-old premenopausal woman has atypical ductal hyperplasia on core biopsy, and excision shows no cancer. She has completed childbearing and has no history of thrombosis. She asks whether a risk-reducing medication is appropriate and which drug it should be. What is the best recommendation?", "opts": ["Raloxifene for 5 years after the menopause", "Anastrozole for 5 years, as in postmenopausal women", "Tamoxifen for 5 years", "Exemestane for 5 years, with ovarian suppression", "No medication option exists at any age"], "a": 2, "e": "For premenopausal women, anastrozole, exemestane and raloxifene should not be prescribed for risk reduction, and tamoxifen for 5 years remains the standard for women at least 35 years old who have completed childbearing. She falls within the group the Task Force includes, since atypical hyperplasia raises risk. The trap is applying the postmenopausal anastrozole data to a premenopausal woman. In practice, thromboembolic and endometrial risks are discussed.", "k": "Premenopausal risk reduction means tamoxifen, not an aromatase inhibitor.", "t": "Premenopausal risk reduction"}, {"n": 3, "stem": "A 55-year-old postmenopausal woman has hormone receptor-positive ductal carcinoma in situ treated with lumpectomy with clear margins and whole breast irradiation. She has no contraindication to either drug. She asks which endocrine drug to take for 5 years and whether it will help her live longer. Which statement is most accurate?", "opts": ["Anastrozole improved overall survival compared with tamoxifen in this setting", "Anastrozole improved breast events, not survival, versus tamoxifen", "Endocrine therapy has no effect on later breast events", "Tamoxifen was clearly superior to anastrozole in all age groups", "Neither drug has been tested in randomized trials"], "a": 1, "e": "NSABP B-35 randomized postmenopausal women with hormone-positive carcinoma in situ after lumpectomy and radiation to tamoxifen or anastrozole, and the breast cancer-free interval favored anastrozole, with a hazard ratio of 0.73. Overall survival did not differ, with a hazard ratio of 1.11 and 10-year rates of 92.1% against 92.5%. The benefit appeared mainly under 60 years. The goal is fewer new breast events.", "k": "In hormone-positive DCIS, anastrozole beats tamoxifen for breast events but not for survival.", "t": "Endocrine therapy for DCIS"}, {"n": 4, "stem": "A 66-year-old woman has a small focus of grade 1, estrogen receptor-positive ductal carcinoma in situ with no invasive component. She is anxious about surgery and asks about alternatives. Her oncologist reviews randomized evidence of active monitoring with follow-up every 6 months. Which conclusion is supported?", "opts": ["Monitoring is proven safe for all grades of DCIS", "Follow-up of more than a decade confirmed the result", "Monitoring more than doubled the invasive cancer rate at 2 years", "The 2-year invasive cancer rate was not higher with monitoring", "Surgery was shown to be unnecessary for every woman"], "a": 3, "e": "COMET enrolled women with low-risk hormone-positive carcinoma in situ, and the 2-year cumulative rate of ipsilateral invasive cancer was 4.2% with active monitoring and 5.9% with standard care, which met the noninferiority criterion. Median follow-up was only 36.9 months, so long-term data are limited. The result does not extend to high-grade disease. In practice, only carefully selected women who accept regular surveillance should be offered monitoring.", "k": "Active monitoring is an option for selected low-risk DCIS, supported by short-term data.", "t": "Active monitoring in DCIS"}, {"n": 5, "stem": "A 51-year-old woman has a biopsy of a benign-appearing mass, and the pathologist reports classic lobular carcinoma in situ in an adjacent area, with no invasive cancer. She has no family history of breast cancer and wants plain advice. She is frightened, and her surgeon is deciding between further surgery and surveillance. Which approach is most appropriate?", "opts": ["Surveillance and discussion of risk-reducing medication", "Lifelong imaging with no further discussion", "Bilateral mastectomy as the standard treatment for this lesion", "Immediate chemotherapy with an anthracycline", "Radiation to the whole breast on the same side"], "a": 0, "e": "Classic lobular carcinoma in situ is a marker of increased risk in both breasts, not a cancer to be removed, and incidental findings do not generally require excision. The Task Force population for medication includes women with lobular carcinoma in situ. Mastectomy, chemotherapy and radiation overtreat the lesion. In practice, a pleomorphic variant or a mismatch with imaging would change the plan.", "k": "Classic LCIS is a risk marker managed with surveillance and a medication discussion.", "t": "Lobular carcinoma in situ"}, {"n": 6, "stem": "A 38-year-old woman with a single second-degree relative with breast cancer reads about risk-reducing drugs and asks to start tamoxifen. Her calculated risk is average, and she has no atypia on prior biopsies. She has no contraindications. Which response is most consistent with national recommendations?", "opts": ["Recommend against routine use, since the benefit is small", "Start anastrozole because she is a candidate by age alone", "Offer tamoxifen only after a prophylactic mastectomy", "Start tamoxifen because every woman benefits substantially", "Prescribe raloxifene for a younger woman"], "a": 0, "e": "The Task Force recommends against routine use of risk-reducing medication in women who are not at increased risk, because the benefit is no greater than small and harms such as thromboembolism and endometrial cancer are real. Counseling should cover screening and lifestyle, and the question can be revisited if new risk information appears. The trap is treating a request as an indication. A risk tool informs the discussion but does not forecast the individual.", "k": "Routine risk-reducing medication is not recommended at average risk.", "t": "Average-risk woman and chemoprevention"}]}, {"ch": 12, "title": "Early, Locally Advanced, Inflammatory, and Recurrent Breast Cancer", "qs": [{"n": 1, "stem": "A 63-year-old postmenopausal woman has a 1.8 cm, hormone receptor-positive, HER2-negative, node-negative breast cancer. Her 21-gene recurrence score is 17, and she is healthy and willing to take chemotherapy if it helps. She asks whether chemotherapy is needed in addition to endocrine therapy. Which advice is best supported?", "opts": ["Chemotherapy is required because the score exceeds ten", "Chemotherapy should be given for any score greater than zero", "Endocrine therapy alone is expected to be as effective", "No endocrine therapy is needed once the score is known", "Radiation alone gives equal protection in this setting"], "a": 2, "e": "TAILORx randomized women with midrange scores of 11 to 25 to endocrine therapy alone or chemoendocrine therapy, and endocrine therapy alone was noninferior, with a hazard ratio of 1.08 and 9-year disease-free survival of 83.3% against 84.3%. The exception was women aged 50 or younger with scores of 16 to 25, which does not describe her. The trap is treating any score as a trigger for chemotherapy. In practice, she is spared its toxicity.", "k": "Postmenopausal, node-negative, midrange score: endocrine therapy alone.", "t": "21-gene assay in node-negative disease"}, {"n": 2, "stem": "A 44-year-old premenopausal woman has a 2.5 cm, estrogen receptor-positive, HER2-negative cancer, with three of 12 sampled nodes positive and a 21-gene recurrence score of 18. She asks whether a low score means she can skip chemotherapy. What does randomized evidence for her situation show?", "opts": ["Chemotherapy should replace endocrine therapy in this setting", "A low score removes any benefit from chemotherapy at any age", "Chemotherapy helps only postmenopausal women with positive nodes", "Chemotherapy improved outcomes in premenopausal women", "Node status has no effect on chemotherapy benefit at all"], "a": 3, "e": "RxPONDER enrolled women with one to three positive nodes and a score of 25 or lower, and the chemotherapy effect differed by menopausal status. In premenopausal women, 5-year invasive disease-free survival was 93.9% with chemotherapy and 89.0% without, a hazard ratio of 0.60, while postmenopausal women showed no benefit. The trap is applying the node-negative rule to node-positive disease. Ovarian suppression is discussed as part of the plan.", "k": "With one to three nodes, a low score spares chemotherapy only after menopause.", "t": "21-gene assay in node-positive disease"}, {"n": 3, "stem": "A 52-year-old woman has a 3 cm HER2-positive breast cancer treated with neoadjuvant taxane chemotherapy and trastuzumab. Surgery shows a 1.2 cm residual invasive cancer in the breast and negative margins. She has recovered well and asks which adjuvant therapy gives the best chance of avoiding recurrence. What is it?", "opts": ["Capecitabine alone given for six months", "Trastuzumab emtansine for 14 cycles", "Pembrolizumab alone given for one full year", "Observation without any further systemic therapy", "Trastuzumab alone for the remaining cycles"], "a": 1, "e": "KATHERINE randomized patients with residual invasive disease after neoadjuvant therapy to trastuzumab emtansine or trastuzumab, and 3-year invasive disease-free survival was 88.3% against 77.0%, a hazard ratio of 0.50. Trastuzumab alone was the losing comparator. The conjugate caused more adverse events, so the benefit is not free. In practice, the finding of residual invasive disease at surgery triggers the switch.", "k": "Residual invasive HER2-positive disease: trastuzumab emtansine for 14 cycles.", "t": "Residual HER2-positive disease"}, {"n": 4, "stem": "A 47-year-old woman has a 2.8 cm triple-negative breast cancer with a biopsy-proven positive axillary node, stage II. Germline testing is pending. Her oncologist recommends neoadjuvant therapy and asks the tumor board which regimen has randomized overall survival evidence in this stage. What is best supported?", "opts": ["Pembrolizumab alone before any chemotherapy is given", "Endocrine therapy because of the stage of disease", "Radiation alone followed by surveillance imaging after", "Chemotherapy alone without any added immunotherapy", "Pembrolizumab with chemotherapy, then adjuvant"], "a": 4, "e": "KEYNOTE-522 randomized stage II or III triple-negative patients to pembrolizumab or placebo with chemotherapy, continued with up to nine adjuvant cycles, and 60-month overall survival was 86.6% against 81.7%. Chemotherapy without immunotherapy was the comparator that lost. Endocrine therapy has no role in a triple-negative tumor, which lacks the receptors it targets. In practice, immune-related events can be permanent, which should be part of counseling, and germline testing is sent early because a BRCA variant would add olaparib.", "k": "Stage II or III triple-negative disease: pembrolizumab with chemotherapy, then adjuvant pembrolizumab.", "t": "Immunotherapy in triple-negative disease"}, {"n": 5, "stem": "A 39-year-old woman with a germline BRCA1 pathogenic variant has finished neoadjuvant chemotherapy and surgery for triple-negative cancer, with high-risk features at pathology. She is well, recovering normally, and asks whether more treatment is worthwhile after all she has been through. Which is best supported by randomized evidence?", "opts": ["One year of olaparib after completing local therapy", "Olaparib given for as long as it is tolerated", "No further treatment, because BRCA status is not relevant", "Trastuzumab emtansine given for fourteen cycles", "Olaparib given before surgery in place of chemotherapy"], "a": 0, "e": "OlympiA randomized patients with HER2-negative, germline BRCA-mutated, high-risk disease to one year of olaparib or placebo after local treatment and chemotherapy, and 3-year invasive disease-free survival was 85.9% against 77.1%, a hazard ratio of 0.58. Deaths were 59 against 86, not significant at the interim threshold. Trastuzumab emtansine belongs to HER2-positive disease. Survival data are still maturing, so counseling should separate recurrence-free benefit from survival benefit, and the year of treatment should be completed.", "k": "Germline BRCA with high-risk HER2-negative disease: olaparib for one year.", "t": "Adjuvant olaparib"}, {"n": 6, "stem": "A 55-year-old postmenopausal woman has hormone receptor-positive, HER2-negative breast cancer with four positive axillary nodes. She completes surgery and radiation and starts an aromatase inhibitor. Her oncologist discusses adding a cell-cycle inhibitor and wants to review the trial evidence in her risk group first. Which statement about that evidence is correct?", "opts": ["Abemaciclib was tested only in node-negative disease", "The benefit was seen only in triple-negative tumors", "Adjuvant abemaciclib was shown to be inferior to endocrine therapy", "Abemaciclib for 2 years improved invasive disease-free survival", "CDK4/6 inhibitors had no effect on recurrence in adjuvant trials"], "a": 3, "e": "monarchE randomized patients with high-risk node-positive disease, including four or more positive nodes, to endocrine therapy with or without abemaciclib for 2 years, and invasive disease-free survival improved, with a hazard ratio of 0.75. NATALEE tested ribociclib for 3 years in stage II or III disease, with a similar hazard ratio. The trials enrolled different populations. In practice, diarrhea and blood counts need monitoring.", "k": "High-risk node-positive HR-positive disease: add abemaciclib or ribociclib to endocrine therapy.", "t": "CDK4/6 inhibition"}, {"n": 7, "stem": "A 41-year-old woman has a red, swollen, warm breast that has enlarged rapidly over 6 weeks, with skin thickening and a peau d'orange appearance involving much of the breast. Biopsy shows grade 3 invasive ductal carcinoma, HER2 negative. Which management approach is appropriate for this presentation?", "opts": ["Immediate breast conservation with sentinel node biopsy only", "Neoadjuvant systemic therapy, then mastectomy and radiation", "Endocrine therapy alone because of the biopsy findings", "Lumpectomy followed by whole breast radiation alone", "A course of antibiotics, then repeat imaging next month"], "a": 1, "e": "Inflammatory breast cancer is a clinical diagnosis based on erythema and edema of much of the breast, and it is treated with neoadjuvant systemic therapy, mastectomy with axillary dissection and radiation. Breast conservation is not appropriate, and antibiotics delay treatment of a mistaken diagnosis of mastitis. Progression during preoperative therapy calls for an early change in plan, and reconstruction is generally deferred until after radiation.", "k": "Inflammatory breast cancer: neoadjuvant therapy, mastectomy, axillary dissection and radiation.", "t": "Inflammatory breast cancer"}, {"n": 8, "stem": "A 58-year-old woman had an estrogen receptor-positive cancer treated with mastectomy 4 years ago. She now has a chest wall nodule, and imaging for distant disease is negative. She asks whether to repeat her earlier treatment without further testing. What is the best next step in management?", "opts": ["Give chemotherapy without any tissue confirmation", "Assume the same receptors and repeat the earlier plan", "Perform a mastectomy of the opposite breast only", "Start observation and image again in two years", "Biopsy the nodule and repeat receptor testing"], "a": 4, "e": "Receptor status can change between the primary tumor and a recurrence, and the change alters drug choice, so a recurrence should be biopsied and tested again. Repeating the earlier plan without testing risks treating the wrong subtype. Local recurrence after mastectomy is generally treated with wide excision and radiation when disease elsewhere is excluded. Systemic therapy then follows the receptors of the recurrence.", "k": "Biopsy a recurrence and repeat receptor testing before choosing therapy.", "t": "Recurrence biopsy"}]}, {"ch": 13, "title": "Metastatic Breast Cancer and Less Common Scenarios", "qs": [{"n": 1, "stem": "A 56-year-old woman has hormone receptor-positive metastatic breast cancer with liver and bone involvement. She progressed through an aromatase inhibitor with a CDK4/6 inhibitor and one line of chemotherapy. A biopsy shows HER2 2+ by immunohistochemistry with negative in situ hybridization. Her oncologist asks how the tumor is classified and what that means for treatment.", "opts": ["HER2-positive, which requires first-line trastuzumab alone", "HER2-ultralow, which excludes any conjugate therapy", "HER2-low, which can be treated with trastuzumab deruxtecan", "Indeterminate, which requires repeating adjuvant therapy", "HER2-negative, so no HER2-directed drug has a role"], "a": 2, "e": "HER2-low disease is defined by a score of 1+ by immunohistochemistry, or 2+ with negative in situ hybridization. In DESTINY-Breast04, hormone receptor-positive patients had median progression-free survival of 10.1 months with trastuzumab deruxtecan against 5.4 months with chemotherapy. The trap is treating the tumor as HER2-negative with no HER2-directed option, which would deny her a drug that has shown benefit. Pulmonary status should be documented before starting, and symptoms should be reviewed at every visit.", "k": "HER2 1+, or 2+ with negative hybridization, is HER2-low and can receive trastuzumab deruxtecan.", "t": "HER2-low classification"}, {"n": 2, "stem": "A 61-year-old woman has been treated with trastuzumab deruxtecan for 5 months for metastatic breast cancer. She develops a dry cough and mild exertional dyspnea over 1 week. She is afebrile, and oxygen saturation is 94% on room air. Her oncologist is deciding how to proceed with the drug.", "opts": ["Switch to an oral antibiotic and continue the drug", "Increase the dose to overcome the symptoms", "Reassure her that the cough is unrelated to treatment", "Hold the drug and obtain chest imaging", "Continue the drug and recheck in one month"], "a": 3, "e": "Interstitial lung disease is a recognized toxicity of trastuzumab deruxtecan, with adjudicated events in 12.1% of patients in DESTINY-Breast04 and grade 5 events at 0.8%. A new cough or dyspnea needs prompt imaging, and the drug is held while infection is excluded. Continuing therapy or treating the symptoms as an infection risks harm. Steroids are started when pneumonitis is confirmed.", "k": "New cough on trastuzumab deruxtecan: hold the drug and image the chest.", "t": "Interstitial lung disease"}, {"n": 3, "stem": "A 48-year-old woman presents with HER2-positive breast cancer metastatic to the lung and liver, with no prior therapy for metastatic disease. She received adjuvant trastuzumab 4 years ago, she is active and eager to continue her usual routine, and she asks which first-line regimen has the strongest randomized evidence for progression-free survival.", "opts": ["Endocrine therapy with a CDK4/6 inhibitor", "Pembrolizumab with a taxane regimen", "A taxane with trastuzumab alone", "Observation until symptoms develop", "Trastuzumab deruxtecan with pertuzumab"], "a": 4, "e": "DESTINY-Breast09 compared trastuzumab deruxtecan plus pertuzumab with the taxane, trastuzumab and pertuzumab regimen, and median progression-free survival was 40.7 months against 26.9 months, a hazard ratio of 0.56. Interstitial lung disease occurred in 12.1% against 1.0%, so vigilance is needed. Endocrine therapy belongs to hormone-positive disease. The conjugate regimen needs baseline chest imaging and a plan for any new cough, and the taxane regimen remains the comparator that the combination beat.", "k": "First-line HER2-positive disease: trastuzumab deruxtecan with pertuzumab is superior to the taxane regimen.", "t": "First-line HER2-positive therapy"}, {"n": 4, "stem": "A 59-year-old woman had a hormone receptor-positive, HER2-negative cancer treated with surgery and adjuvant endocrine therapy. Nine months after finishing it, she develops bone and lung metastases, and tumor testing shows a PIK3CA mutation. She has no history of diabetes. Which first-line regimen is supported by a randomized trial in this population?", "opts": ["Palbociclib and fulvestrant alone, without a targeted agent", "Inavolisib with palbociclib and fulvestrant", "Trastuzumab emtansine for fourteen cycles", "Pembrolizumab with chemotherapy for a high score", "Single-agent paclitaxel given for the first line"], "a": 1, "e": "INAVO120 enrolled patients with PIK3CA-mutated disease that relapsed during or within 12 months after adjuvant endocrine therapy. Median progression-free survival was 15.0 months with inavolisib against 7.3 months with placebo, each with palbociclib and fulvestrant, a hazard ratio of 0.43. Hyperglycemia and stomatitis were more frequent, so glucose needs monitoring from the start, and the dose of the targeted drug may need adjustment.", "k": "PIK3CA mutation with early relapse: add inavolisib to palbociclib and fulvestrant.", "t": "PIK3CA-mutated disease"}, {"n": 5, "stem": "A 53-year-old woman has a recurrence of triple-negative breast cancer 2 years after neoadjuvant therapy and surgery, with lung and nodal metastases. Biopsy confirms triple-negative disease with a PD-L1 combined positive score of 12, and she has not had chemotherapy for metastatic disease. Her oncologist weighs the options. Which approach is best supported?", "opts": ["Pembrolizumab with chemotherapy", "Endocrine therapy as the first treatment", "Trastuzumab deruxtecan as the first treatment", "Chemotherapy alone, because PD-L1 does not matter", "Pembrolizumab alone without chemotherapy"], "a": 0, "e": "In KEYNOTE-355, patients with a combined positive score of 10 or more had median overall survival of 23.0 months with pembrolizumab and chemotherapy against 16.1 months with chemotherapy alone, a hazard ratio of 0.73. With a score of 1 or more, the benefit was not significant. The biomarker therefore decides whether immunotherapy is added. Germline testing should also be sent.", "k": "Triple-negative metastatic disease with a score of 10 or more: pembrolizumab with chemotherapy.", "t": "PD-L1 score in triple-negative disease"}, {"n": 6, "stem": "A 62-year-old woman has hormone receptor-positive metastatic breast cancer that progressed on an aromatase inhibitor with a CDK4/6 inhibitor. She has never received chemotherapy for metastatic disease. HER2 is scored 1+. She asks whether chemotherapy must be the next step, and her oncologist reviews the evidence for trastuzumab deruxtecan in this setting.", "opts": ["It was studied only in hormone receptor-negative disease", "It was inferior to chemotherapy in HER2-low disease", "It had no activity in any tumor scored as 1+", "It improved progression-free survival over chemotherapy", "It was tested only after three lines of chemotherapy"], "a": 3, "e": "DESTINY-Breast06 randomized patients with hormone receptor-positive disease, one or more lines of endocrine-based therapy and no prior chemotherapy for metastatic disease. In the HER2-low group, median progression-free survival was 13.2 months against 8.1 months, a hazard ratio of 0.62, and results were consistent in the HER2-ultralow group. Overall survival was immature, so the survival benefit is not yet established. Interstitial lung disease needs monitoring, and baseline pulmonary status should be recorded before treatment begins.", "k": "After endocrine therapy, trastuzumab deruxtecan can precede chemotherapy in HER2-low disease.", "t": "Sequencing after endocrine therapy"}, {"n": 7, "stem": "A 34-year-old woman at 20 weeks of pregnancy has a 2 cm triple-negative breast cancer found on examination, with one suspicious axillary node on ultrasound. She is anxious, her partner is supportive, and she asks whether she must end the pregnancy to be treated. Which statement about management during pregnancy is correct?", "opts": ["Surgery is possible in any trimester; chemotherapy starts later", "Radiation should be given immediately during the pregnancy", "Treatment must be delayed until after delivery in every single case", "Termination is required before any treatment can begin", "Chemotherapy is safest in the first trimester of pregnancy"], "a": 0, "e": "Breast cancer during pregnancy is managed by a team that includes maternal-fetal medicine. Surgery is possible in any trimester, and chemotherapy is generally avoided in the first trimester but can be given afterward. Radiation, endocrine therapy and anti-HER2 agents are deferred until after delivery. Termination is not required for treatment. In practice, delivery is timed with obstetrics, with chemotherapy stopped a few weeks before.", "k": "Pregnancy: surgery in any trimester, chemotherapy after the first, radiation after delivery.", "t": "Pregnancy"}, {"n": 8, "stem": "A 67-year-old man has a firm retroareolar mass and an axillary node. Biopsy shows estrogen receptor-positive, HER2-negative invasive ductal carcinoma, and staging imaging shows no distant disease. He undergoes mastectomy with axillary staging and asks about further treatment and about his family. Which recommendation is most appropriate?", "opts": ["Observation only because male disease is benign", "Genetic testing only if a female relative is affected", "Endocrine therapy and germline genetic testing", "Radiation to the opposite chest wall as prevention", "Chemotherapy alone with no endocrine treatment"], "a": 2, "e": "Male breast cancer is treated by the same subtype logic as in women, so estrogen receptor-positive disease receives endocrine therapy. Germline testing is part of the workup, because BRCA2 variants are overrepresented in men with breast cancer. The result affects his relatives, who can be offered counseling. Treating the cancer as a different disease, or withholding testing, would miss an actionable finding.", "k": "Male breast cancer: treat by subtype, give endocrine therapy for hormone-positive disease, and test the germline.", "t": "Male breast cancer"}]}, {"ch": 14, "title": "Breast Genetics and Treatment Complications", "qs": [{"n": 1, "stem": "A 52-year-old woman with a hormone receptor-positive, HER2-negative breast cancer has developed bone and liver metastases. She has no family history of cancer and no earlier genetic testing. Her oncologist is considering a PARP inhibitor as a later treatment option and asks whether germline testing is indicated. What is the best answer?", "opts": ["No, because she has no family history of cancer", "No, because hormone-positive tumors are never hereditary", "Yes, because she is a PARP inhibitor candidate", "Yes, but only after a prophylactic mastectomy is done", "No, because testing is only for newly diagnosed patients"], "a": 2, "e": "The ASCO and Society of Surgical Oncology guideline offers BRCA1 and BRCA2 testing to patients with recurrent breast cancer who are candidates for PARP inhibitor therapy, regardless of family history. The absence of a family history therefore does not exclude her. Testing is not restricted to newly diagnosed patients. Pretest counseling and informed consent are part of the process, and a positive result also informs her relatives.", "k": "Recurrent disease and a PARP inhibitor candidate: test the germline regardless of family history.", "t": "Indications for germline testing"}, {"n": 2, "stem": "A 40-year-old woman with triple-negative breast cancer has a multigene panel that reports a pathogenic variant in RAD51C. She asks what is known about this gene and which subtype of breast cancer it is associated with. Her genetic counselor reviews a large population-based case-control study. Which statement is most accurate?", "opts": ["It is linked only to estrogen receptor-positive disease", "It affects only the male relatives of carriers", "It carries a higher risk than BRCA1 variants do", "It has no association with breast cancer risk", "It raises the risk of receptor-negative disease"], "a": 4, "e": "In the CARRIERS consortium, variants in BARD1, RAD51C and RAD51D were associated with increased risk of estrogen receptor-negative and triple-negative breast cancer. Variants in ATM, CDH1 and CHEK2 raised the risk of estrogen receptor-positive disease. The BRCA1 odds ratio was 7.62, higher than the moderate-risk genes. The result fits her phenotype, so her relatives can be offered counseling and her future screening should be planned with a genetics team.", "k": "RAD51C, RAD51D and BARD1: estrogen receptor-negative and triple-negative disease.", "t": "Gene-specific cancer risk"}, {"n": 3, "stem": "A 31-year-old woman has a 1.5 cm invasive ductal carcinoma and a germline TP53 pathogenic variant. She is otherwise healthy and asks whether she can have a lumpectomy followed by whole-breast radiation to preserve her breast. Her surgeon reviews the hereditary breast cancer guideline. What is the recommended approach?", "opts": ["Radiation alone given in place of any operation", "Lumpectomy with routine whole-breast radiation", "Observation with annual imaging and no surgery done", "Mastectomy; radiation only if recurrence risk is high", "Lumpectomy followed by radiation to the regional nodes"], "a": 3, "e": "The ASCO, ASTRO and SSO guideline advises that TP53 carriers should generally undergo mastectomy, and that radiation is contraindicated unless there is a significant risk of locoregional recurrence. By contrast, BRCA carriers may be considered for breast-conserving therapy, and radiation does not appear to increase toxicity in them. The trap is applying the BRCA approach to a TP53 carrier. She also needs surveillance for other cancers.", "k": "TP53 carrier: mastectomy, with radiation only for significant locoregional risk.", "t": "TP53 carrier local therapy"}, {"n": 4, "stem": "A 64-year-old man receiving pembrolizumab for another cancer reports 8 more watery stools a day than usual, with abdominal cramping, 4 weeks after the third dose. He is afebrile with no blood in the stool, and infection has been excluded. His oncologist grades the event as grade 3. What is the most appropriate management?", "opts": ["Continue the drug and treat only with loperamide", "Suspend the drug and start high-dose corticosteroids", "Permanently stop the drug and give no corticosteroids", "Add a second immunotherapy agent to the regimen", "Continue the drug and recheck the stool in one month"], "a": 1, "e": "The ASCO guideline update advises that grade 3 events generally lead to suspension of the checkpoint inhibitor and high-dose corticosteroids, tapered over at least 4 to 6 weeks. Refractory cases may need other immunosuppressive agents. Grade 1 events continue with monitoring, and grade 4 events generally lead to permanent discontinuation. Continuing treatment or giving only antidiarrheal drugs risks perforation, so the drug is suspended while infection and other causes are excluded.", "k": "Grade 3 immune-related event: suspend immunotherapy and give high-dose corticosteroids, then taper slowly.", "t": "Grade 3 immune-related colitis"}, {"n": 5, "stem": "A 57-year-old woman on weekly paclitaxel develops numbness in her fingers and difficulty buttoning her clothes by cycle 9. She asks whether a supplement could stop the numbness from getting worse, and she wants to continue treatment if possible. Her oncologist reviews the guideline on neuropathy. Which recommendation is correct?", "opts": ["Adjust chemotherapy; no agent prevents the neuropathy", "Duloxetine is recommended to prevent the neuropathy", "Stop all anticancer therapy permanently at once", "Continue the same dose because symptoms always resolve", "Acetyl-L-carnitine is recommended to prevent progression"], "a": 0, "e": "The ASCO update found that no agent is recommended to prevent chemotherapy-induced peripheral neuropathy, and it discouraged acetyl-L-carnitine. When neuropathy is intolerable or limits function, clinicians should evaluate delaying, reducing, substituting or stopping chemotherapy. Duloxetine is the only agent with adequate evidence for painful established neuropathy, and its benefit is limited. It treats pain; it does not prevent the condition.", "k": "No agent prevents neuropathy; adjust chemotherapy for function and use duloxetine for pain.", "t": "Chemotherapy-induced neuropathy"}]}, {"ch": 15, "title": "Prostate Cancer", "qs": [{"n": 1, "stem": "A 66-year-old man has a PSA of 180 ng/mL, multiple bone metastases and retroperitoneal nodes, and biopsy shows grade group 5 adenocarcinoma. He is active with normal blood counts and asks whether androgen-deprivation therapy alone is enough. His oncologist reviews randomized evidence for intensification in a man fit for chemotherapy. What is best supported?", "opts": ["Add docetaxel and darolutamide to androgen-deprivation therapy", "Give lutetium-177 PSMA-617 as the first systemic therapy", "Replace hormone therapy with radium-223 as first treatment", "Continue androgen-deprivation therapy alone and recheck PSA", "Add enzalutamide to chemotherapy given without hormone therapy"], "a": 0, "e": "ARASENS randomized 1,306 patients to darolutamide or placebo with androgen-deprivation therapy and docetaxel, and darolutamide lowered the risk of death by 32.5%, a hazard ratio of 0.68. Adverse events were similar between groups, and neutropenia was the most common serious event. Hormone therapy alone leaves survival on the table in a fit man. Radioligand therapy belongs to later castration-resistant disease.", "k": "Fit man with metastatic hormone-sensitive disease: add docetaxel and darolutamide to androgen deprivation.", "t": "Triplet therapy in metastatic hormone-sensitive disease"}, {"n": 2, "stem": "A 61-year-old man has newly diagnosed metastatic hormone-sensitive prostate cancer and controlled hypertension. He receives androgen-deprivation therapy with docetaxel, and his oncologist considers adding abiraterone. He is nervous about adding another drug, asks what the trial data show, and wants to know what to watch for. Which statement about PEACE-1 is correct?", "opts": ["Abiraterone was studied only after chemotherapy failed", "Abiraterone had no effect on progression-free survival", "Abiraterone lowered blood pressure in treated patients", "Abiraterone improved survival and increased hypertension", "Abiraterone was tested only in castration-resistant disease"], "a": 3, "e": "PEACE-1 randomized men with newly metastatic castration-sensitive disease, and abiraterone improved radiographic progression-free survival, with a hazard ratio of 0.54. In the group receiving docetaxel, the overall survival hazard ratio was 0.75. Hypertension occurred in 22% against 13%, so blood pressure needs close monitoring, with the antihypertensive regimen adjusted early. The trial tested the drug at the start of therapy, not after failure, so a delayed start is not what the evidence addresses.", "k": "Abiraterone added to hormone therapy and docetaxel improves outcomes and raises hypertension.", "t": "Abiraterone in PEACE-1"}, {"n": 3, "stem": "A 72-year-old man had radiation with hormone therapy 6 years ago. His PSA has risen from 2.1 to 6.8 ng/mL over a year, with a doubling time of 5 months, and PSMA PET shows no metastases. He is otherwise well and asks whether treatment now lowers his risk of metastasis. Which approach has randomized support?", "opts": ["Docetaxel alone without any hormone therapy", "Enzalutamide with androgen-deprivation therapy", "Radium-223 without androgen-deprivation therapy", "Lutetium-177 PSMA-617 as the first treatment", "Observation alone until imaging shows metastases"], "a": 1, "e": "EMBARK enrolled men with high-risk biochemical recurrence and a PSA doubling time of 9 months or less. At 5 years, metastasis-free survival was 87.3% with enzalutamide plus leuprolide against 71.4% with leuprolide alone, a hazard ratio of 0.42. Enzalutamide alone also helped, with a hazard ratio of 0.63. Observation is reasonable for slow rises, which this man does not have. Hot flashes and bone loss need a plan.", "k": "High-risk biochemical recurrence: enzalutamide with androgen deprivation lowers metastasis.", "t": "High-risk biochemical recurrence"}, {"n": 4, "stem": "A 70-year-old man has progressive metastatic castration-resistant prostate cancer after abiraterone and two taxane regimens. He has pain from bone metastases, adequate organ function and a good performance status. His oncologist asks which test is required before offering radioligand therapy and what survival evidence supports it. What is correct?", "opts": ["An MRI of the spine; the drug is given before taxanes", "A bone scan alone; progression-free survival did not change", "BRCA testing alone; the trial showed no survival gain", "Serum testosterone alone; the benefit was seen only in pain", "PSMA PET showing uptake; overall survival improved"], "a": 4, "e": "VISION enrolled patients with PSMA-positive gallium-68 PET who had received an androgen-receptor pathway inhibitor and one or two taxane regimens. Overall survival was 15.3 months with lutetium-177 PSMA-617 against 11.3 months with standard care, a hazard ratio of 0.62. Grade 3 or higher events were more frequent, but quality of life was not adversely affected. The therapy is given after, not before, taxanes.", "k": "Lutetium-177 PSMA-617 needs PSMA-positive imaging and follows androgen-receptor inhibitor and taxane therapy.", "t": "Radioligand therapy"}, {"n": 5, "stem": "A 68-year-old man has newly castration-resistant disease with a rising PSA and new bone lesions, and no prior taxane. Tumor testing shows a BRCA2 alteration. He asks whether adding a PARP inhibitor to enzalutamide is supported and what to monitor. His oncologist reviews the first-line trial. Which statement is correct?", "opts": ["The combination was tested only after taxane therapy had failed", "The benefit was limited to men without HRR alterations", "Talazoparib improved progression-free survival; monitor counts", "Talazoparib had no effect on radiographic progression", "Anemia was not a concern in the treated group"], "a": 2, "e": "TALAPRO-2 randomized 805 patients to talazoparib or placebo with enzalutamide, and the hazard ratio for radiographic progression was 0.63. Grade 3 or 4 anemia occurred in 46% of treated patients, and 8% discontinued talazoparib. Overall survival data were pending in that report. Blood counts should be checked often, and the dose can be reduced for anemia. The benefit of the combination was reported across the population, and survival data were still maturing, so counseling should say so.", "k": "First-line castration-resistant disease: talazoparib with enzalutamide improves progression-free survival and needs count monitoring.", "t": "PARP inhibitor with enzalutamide"}, {"n": 6, "stem": "A 74-year-old man with high-risk prostate cancer starts androgen-deprivation therapy with radiation. His baseline bone density shows osteopenia, and he has hot flashes and fatigue. He asks what he should do to protect his bones during several years of therapy. Which plan is most appropriate?", "opts": ["No action until a fracture occurs during treatment", "Order a bone scan every month to detect bone loss", "Calcium, vitamin D, exercise and repeat bone scans", "Start testosterone replacement to protect the skeleton", "Stop androgen deprivation at the first sign of osteopenia"], "a": 2, "e": "Long-term androgen deprivation lowers bone density, so a baseline scan, calcium and vitamin D intake, and weight-bearing exercise are standard. A bone-modifying agent is added for osteoporosis or high fracture risk, with dental review first. Waiting for a fracture misses the chance to prevent it, and stopping therapy exchanges bone health for cancer control. Testosterone replacement would counteract treatment, and monthly scans add cost without benefit.", "k": "Androgen deprivation: baseline bone density, calcium and vitamin D, exercise, and a bone agent for high risk.", "t": "Bone health on androgen deprivation"}, {"n": 7, "stem": "A 58-year-old man has a PSA of 6.2 ng/mL and a biopsy showing Gleason 4 plus 3 disease in two of 12 cores. MRI shows a single lesion confined to the prostate, and PSMA PET shows no spread. He asks how his cancer is classified and whether the order of the patterns matters. What is the grade group?", "opts": ["Grade group 3", "Grade group 1", "Grade group 5", "Grade group 2", "Grade group 4"], "a": 0, "e": "Gleason 4 plus 3 is grade group 3, whereas 3 plus 4 is grade group 2, so the order of the patterns matters because the dominant pattern carries the worse outlook. Grade group 1 is Gleason 6 or lower, and grade groups 4 and 5 correspond to Gleason 8 and 9 or 10. Grade group 3 with a PSA under 10 falls in the unfavorable intermediate-risk category, where radiation with short-term androgen deprivation and surgery are both options.", "k": "Gleason 4 plus 3 is grade group 3; the dominant pattern sets the group.", "t": "Grade group assignment"}]}, {"ch": 16, "title": "Germ Cell Tumors and Adrenal Tumors", "qs": [{"n": 1, "stem": "A 26-year-old man has a painless left testicular mass found by his partner. Ultrasound shows a solid hypoechoic mass, AFP is normal, hCG is mildly raised and LDH is slightly elevated. He has not had children and is anxious about treatment. His urologist asks what the first step in management should be. What is correct?", "opts": ["Immediate cisplatin chemotherapy without any surgery", "Retroperitoneal lymph node dissection as the first step", "Observation with repeat ultrasound in three months", "Inguinal orchiectomy, with sperm banking offered first", "Transscrotal biopsy to establish the diagnosis first"], "a": 3, "e": "A solid testicular mass with raised markers is cancer until proved otherwise, and the diagnosis and first treatment are a radical inguinal orchiectomy. Transscrotal biopsy risks spread to the inguinal nodes and is avoided. Sperm banking is offered before treatment because chemotherapy can impair fertility. Markers are repeated afterward, and a failure to fall points to residual disease. Chemotherapy and nodal surgery follow staging.", "k": "Testicular mass: radical inguinal orchiectomy, with sperm banking offered, then repeat markers.", "t": "Initial surgery for a testicular mass"}, {"n": 2, "stem": "A 34-year-old man has metastatic seminoma with retroperitoneal nodes and no visceral metastases. His LDH is 3 times the upper limit of normal, and he is classified as good prognosis. He asks whether the high LDH changes his outlook. Which statement from the IGCCCG update is correct?", "opts": ["LDH had no relationship with survival in seminoma", "High LDH lowered progression-free survival", "The update found survival worse than in 1975 to 1990", "Good-prognosis patients had worse survival than before", "High LDH made the cancer curable only with surgery"], "a": 1, "e": "The IGCCCG update analyzed 2,451 men with metastatic seminoma and identified LDH as an additional adverse factor. In good-prognosis patients with LDH over 2.5 times the upper limit of normal, 3-year progression-free survival was 80%, against 92% with lower LDH. Overall, 5-year overall survival in the good group rose from 86% to 95%, so his outlook remains very good.", "k": "Seminoma with LDH over 2.5 times normal: lower progression-free survival, but a very good outlook.", "t": "LDH in metastatic seminoma"}, {"n": 3, "stem": "A 29-year-old man has nonseminoma with lung and liver metastases, an AFP of 8,000 ng/mL and an hCG of 100,000 IU/L, and he is placed in the poor-prognosis group. His family, searching online, finds old survival figures and asks how they compare with current ones. What does the updated analysis show?", "opts": ["Survival could not be estimated for the poor group", "Five-year overall survival fell from 67% to 48%", "Five-year overall survival stayed close to 48% overall", "Survival rose in good groups and fell in poor groups", "Five-year overall survival rose from 48% to 67%"], "a": 4, "e": "The IGCCCG update analyzed 9,728 men who received cisplatin and etoposide chemotherapy between 1990 and 2013. In the poor-prognosis group, 5-year overall survival rose from 48% to 67%, and 5-year progression-free survival rose from 41% to 54%. Good and intermediate groups also improved, with 5-year overall survival of 96% and 89%. The old figures therefore understate current outcomes, and care at an experienced center remains important for a man with this risk profile.", "k": "Poor-prognosis nonseminoma: 5-year overall survival is now 67%, up from 48%.", "t": "Poor-prognosis nonseminoma survival"}, {"n": 4, "stem": "A 45-year-old woman has a completely resected, stage II adrenocortical carcinoma with a Ki67 of 8%, and imaging shows no residual disease. She asks whether two years of adjuvant mitotane would lower her risk of recurrence, and she is worried about side effects. Her oncologist reviews the randomized trial. What is the best summary?", "opts": ["Mitotane lowered survival in the treated group", "Mitotane doubled recurrence-free survival in all patients", "No clear benefit was shown in low-grade disease", "Mitotane was free of adverse effects in the trial", "The trial showed benefit only in metastatic disease"], "a": 2, "e": "ADIUVO randomized patients with R0, stage I to III disease and a Ki67 of 10% or more to mitotane or surveillance, and the trial ended early because recruitment was slow. Five-year recurrence-free survival was 79% against 75%, a hazard ratio of 0.74 with a wide interval, so efficacy cannot be ruled out. All treated patients had adverse events, and 19% discontinued. The decision is shared, and her Ki67 is under the trial threshold.", "k": "Low-grade localized adrenocortical carcinoma: adjuvant mitotane showed no clear benefit; decide together.", "t": "Adjuvant mitotane"}, {"n": 5, "stem": "A 40-year-old woman has episodes of headache, sweating and palpitations with blood pressure up to 210/110 mmHg. CT shows a 4 cm right adrenal mass, and plasma free metanephrines are markedly elevated. She is otherwise well and scheduled for adrenalectomy. Her surgeon asks about preoperative preparation. Which plan is appropriate?", "opts": ["Alpha blockade first, then beta blockade if needed", "Surgery without preparation because the mass is small", "Needle biopsy of the mass to confirm the diagnosis", "Radiation to the adrenal gland before any operation", "A beta blocker alone to control the heart rate"], "a": 0, "e": "Plasma free metanephrines confirm a catecholamine-secreting tumor, and alpha blockade is started before surgery to prevent a hypertensive crisis. A beta blocker is added only after alpha blockade, because used first it can leave alpha stimulation unopposed and worsen the crisis. Biopsy is avoided because it can provoke a catecholamine surge. Genetic testing is sent, since many patients carry a germline variant that affects family care.", "k": "Pheochromocytoma: alpha blockade before beta blockade and before surgery; test the germline.", "t": "Preoperative blockade"}]}, {"ch": 17, "title": "Renal and Urothelial Cancers", "qs": [{"n": 1, "stem": "A 58-year-old man underwent radical nephrectomy for a 9 cm clear-cell renal carcinoma with renal vein invasion and grade 4 features. Margins were negative, and imaging shows no metastases. He is well and asks whether any treatment after surgery lowers his risk of relapse. Which approach has randomized support in this setting?", "opts": ["Radiation to the renal fossa given alone", "Observation because no adjuvant therapy is effective", "Adjuvant everolimus with surveillance imaging only", "Adjuvant sunitinib for six months in all patients", "Adjuvant pembrolizumab for about a year"], "a": 4, "e": "KEYNOTE-564 randomized patients with clear-cell carcinoma at high recurrence risk after nephrectomy to pembrolizumab or placebo for up to 17 cycles. Disease-free survival at 24 months was 77.3% against 68.1%, a hazard ratio of 0.68. Grade 3 or higher events were more common with pembrolizumab, at 32.4% against 17.7%. Counseling should cover lasting immune-related events and the need for thyroid monitoring.", "k": "High-risk clear-cell carcinoma after nephrectomy: adjuvant pembrolizumab improves disease-free survival.", "t": "Adjuvant therapy after nephrectomy"}, {"n": 2, "stem": "A 63-year-old woman has metastatic clear-cell renal carcinoma to the lungs and bone, with controlled hypertension and good performance status. She has had no prior systemic treatment. She asks which first-line regimen was shown to beat sunitinib for both progression-free and overall survival. What is the best answer?", "opts": ["Sunitinib given on a longer schedule", "Lenvatinib plus pembrolizumab", "Pembrolizumab alone without a kinase inhibitor", "Everolimus alone as first-line therapy", "Lenvatinib plus everolimus"], "a": 1, "e": "In CLEAR, lenvatinib plus pembrolizumab improved median progression-free survival to 23.9 months from 9.2 months with sunitinib, a hazard ratio of 0.39, and improved overall survival, with a hazard ratio for death of 0.66. Lenvatinib plus everolimus improved progression-free survival but did not improve overall survival. The trap is treating both lenvatinib combinations as equivalent. Blood pressure needs early attention.", "k": "First-line advanced renal carcinoma: lenvatinib plus pembrolizumab beat sunitinib for survival.", "t": "First-line advanced renal cell carcinoma"}, {"n": 3, "stem": "A 60-year-old man has been on lenvatinib plus pembrolizumab for metastatic renal cancer for 3 weeks. His blood pressure is 170/100 mmHg, and he has watery diarrhea 3 times a day. He feels reasonably well and wants to stay on treatment. What is the best management approach?", "opts": ["Stop all anticancer therapy permanently at once", "Ignore the symptoms because they always resolve", "Treat both problems and reduce the dose if needed", "Add radiation to the kidney to control symptoms", "Switch to everolimus alone without any further review"], "a": 2, "e": "In CLEAR, grade 3 or higher adverse events occurred in 82.4% of patients on lenvatinib plus pembrolizumab, and hypertension, diarrhea and elevated lipase were among the common events. Active management keeps patients on an effective regimen. Blood pressure is controlled, diarrhea is treated promptly, and the lenvatinib dose is reduced when needed. Stopping at the first toxicity forfeits benefit that the trial showed.", "k": "Manage hypertension and diarrhea actively and reduce the dose rather than stopping.", "t": "Toxicity of lenvatinib plus pembrolizumab"}, {"n": 4, "stem": "A 66-year-old man has muscle-invasive bladder cancer on transurethral resection. His kidney function is normal and his hearing is intact, so he is eligible for cisplatin, and he is fit for cystectomy. He asks whether adding immunotherapy to chemotherapy before and after surgery improves outcomes. What does randomized evidence show?", "opts": ["Event-free and overall survival improved with durvalumab", "Only event-free survival changed, with no survival signal", "Durvalumab prevented the need for cystectomy in all", "Survival improved only in cisplatin-ineligible patients", "Immunotherapy was inferior to chemotherapy alone"], "a": 0, "e": "NIAGARA randomized cisplatin-eligible patients to perioperative durvalumab with gemcitabine and cisplatin or to chemotherapy and cystectomy alone. Event-free survival at 24 months was 67.8% against 59.8%, a hazard ratio of 0.68, and overall survival at 24 months was 82.2% against 75.2%. Grade 3 or 4 events were similar, and cystectomy was performed in 88.0% against 83.2%. The trap is assuming the benefit applies to patients who cannot receive cisplatin, who were not enrolled.", "k": "Cisplatin-eligible mus
