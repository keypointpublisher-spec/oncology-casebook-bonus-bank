: "Nasopharyngeal carcinoma is linked to Epstein-Barr virus and is often sensitive to radiotherapy and chemotherapy. Locoregionally advanced disease is treated with chemoradiotherapy, sometimes with induction or adjuvant chemotherapy, and plasma EBV DNA is used at diagnosis and during follow-up. Surgery of the nasopharynx is difficult and is not the primary treatment. A dental evaluation before radiation and swallowing support complete the plan.", "k": "Locoregionally advanced nasopharyngeal carcinoma: chemoradiotherapy with EBV DNA monitoring.", "t": "Nasopharyngeal carcinoma"}, {"n": 7, "stem": "A 63-year-old woman is about to start radiotherapy for a base of tongue cancer. She has several broken teeth and has not seen a dentist for years. She asks whether dental care can wait until after treatment, to avoid delaying the start of radiotherapy. Which step is most appropriate now?", "opts": ["Dental review and extraction of broken teeth first", "Defer all dental care until after radiotherapy", "Skip radiotherapy to protect the teeth", "Start cetuximab to prevent osteoradionecrosis", "Extract all teeth during the last week of treatment"], "a": 0, "e": "Radiotherapy to the head and neck causes mucositis, dry mouth, dysphagia and a risk of osteoradionecrosis. A dental evaluation and treatment of unsalvageable teeth before radiotherapy lowers that risk, because extractions after high-dose radiation heal poorly. Speech and swallowing therapy begin early, and nutrition support is arranged. Deferring care until after treatment raises the chance of bone injury and infection.", "k": "Before head and neck radiotherapy, treat unsalvageable teeth to lower osteoradionecrosis risk.", "t": "Dental care before radiotherapy"}]}, {"ch": 27, "title": "Thyroid and Central Nervous System Cancers, Genetics, and Complications", "qs": [{"n": 1, "stem": "A 46-year-old woman has medullary thyroid cancer with a RET variant and growing liver and bone metastases. Her calcitonin is rising, and she has had no systemic therapy. Germline testing is pending. Her oncologist reviews the randomized trial that compared a selective RET inhibitor with the multikinase inhibitors. What is the best first-line choice?", "opts": ["Vandetanib as first-line therapy", "Observation with calcitonin follow-up", "Selpercatinib", "Radioactive iodine for metastatic disease", "Cabozantinib as first-line therapy"], "a": 2, "e": "LIBRETTO-531 randomized 291 patients with advanced RET-mutant medullary thyroid cancer to first-line selpercatinib or physician's choice of cabozantinib or vandetanib. Progression-free survival at 12 months was 86.8% against 65.7%, a hazard ratio of 0.28. Dose reductions were 38.9% against 77.3%, and discontinuations 4.7% against 26.8%. Blood pressure and liver tests are monitored, and her germline result is reviewed because medullary thyroid cancer is often hereditary.", "k": "Advanced RET-mutant medullary thyroid cancer: first-line selpercatinib.", "t": "RET-mutant medullary thyroid cancer"}, {"n": 2, "stem": "A 36-year-old man had subtotal resection of a grade 2 IDH-mutant astrocytoma after a seizure. MRI shows residual tumor, and he has had no radiotherapy or chemotherapy. His seizures are controlled, and he asks whether a targeted drug could delay progression. His neuro-oncologist reviews the randomized trial. What is the best recommendation?", "opts": ["Whole-brain radiotherapy as first treatment", "Observation only, with no drug option", "Pembrolizumab with chemotherapy", "Selpercatinib for the RET variant", "Vorasidenib"], "a": 4, "e": "INDIGO enrolled patients with residual or recurrent grade 2 IDH-mutant glioma who had received no treatment beyond surgery, and randomized 168 to vorasidenib and 163 to placebo. Median progression-free survival was 27.7 months against 11.1 months, a hazard ratio of 0.39. The only severe event in at least 10% was increased alanine aminotransferase, so liver enzymes are monitored at intervals.", "k": "Residual grade 2 IDH-mutant glioma after surgery: vorasidenib delays progression.", "t": "Vorasidenib in IDH-mutant glioma"}, {"n": 3, "stem": "A 62-year-old man with metastatic colorectal cancer has three asymptomatic brain metastases, the largest 1.8 cm, found on surveillance MRI. His systemic disease is controlled, and he has no neurologic deficits or seizures. His team asks which local approach the guideline supports for his situation. What is the best plan?", "opts": ["Stereotactic radiosurgery alone", "Craniotomy for all three lesions", "Intrathecal chemotherapy as primary treatment", "Whole-brain radiotherapy for every patient", "Defer all local therapy and observe indefinitely"], "a": 0, "e": "The ASCO-SNO-ASTRO guideline drew on 32 randomized trials. Asymptomatic patients with no systemic therapy options should be offered radiosurgery alone for one to four unresected metastases, except in small-cell lung carcinoma. Local therapy should not be deferred for asymptomatic patients unless the guideline recommends deferral, and any deferral follows multidisciplinary discussion. MRI follow-up is arranged at intervals, and the multidisciplinary team reviews the plan if new lesions appear.", "k": "One to four unresected brain metastases: radiosurgery alone is offered.", "t": "Radiosurgery for few brain metastases"}, {"n": 4, "stem": "A 58-year-old woman with small-cell lung cancer has multiple new brain metastases and is to receive whole-brain radiotherapy. MRI shows no lesions near the hippocampi, and her expected survival is over 4 months. She asks how cognitive side effects can be reduced. What is the best recommendation?", "opts": ["Whole-brain radiotherapy without any protection", "Hippocampal avoidance with memantine", "Observation with symptom treatment only", "Dexamethasone alone with no radiation", "Single-fraction radiosurgery to every lesion"], "a": 1, "e": "The guideline recommends that memantine and hippocampal avoidance be offered with whole-brain radiotherapy to patients with no hippocampal lesions and expected survival of 4 months or more. She meets both conditions. Radiosurgery alone is reserved for one to four unresected metastases, and small-cell lung carcinoma is excluded from that recommendation. Her team reviews cognition during follow-up, and symptoms such as memory change are reported early.", "k": "Whole-brain radiotherapy: offer memantine and hippocampal avoidance when survival is expected to be 4 months or more.", "t": "Whole-brain radiotherapy with memantine"}, {"n": 5, "stem": "A 74-year-old woman has a neck mass that enlarged rapidly over three weeks, with hoarseness and early airway narrowing. Core biopsy shows anaplastic thyroid cancer, and imaging shows lung metastases. Her family asks about the steps that should follow, and her care team wants to avoid any delay in treatment planning. Which action should begin immediately?", "opts": ["Radioactive iodine as primary therapy", "Selpercatinib for medullary thyroid cancer", "Thyroid hormone suppression alone", "Rapid BRAF testing and airway planning", "Observation with repeat ultrasound in three months"], "a": 3, "e": "Anaplastic thyroid cancer is rare and highly lethal, and it grows over days to weeks. Tissue diagnosis, staging and rapid BRAF testing start at once, and targeted therapy is chosen for BRAF V600E tumors. Airway and goals of care are addressed early, with palliative care involved in parallel. Radioactive iodine has no role because these tumors do not take up iodine, and selpercatinib belongs to RET-mutant medullary disease.", "k": "Anaplastic thyroid cancer: urgent diagnosis, rapid BRAF testing and early airway planning.", "t": "Anaplastic thyroid cancer"}, {"n": 6, "stem": "A 67-year-old man has a 3 cm metastasis in the left frontal lobe with surrounding edema that causes headache and mild right arm weakness. He has had no seizures. He asks whether he needs an antiseizure drug and how to treat the swelling. His team plans local therapy. What is the best management?", "opts": ["Dexamethasone for edema and no antiseizure drug", "Antiseizure drug for every patient with brain metastases", "Enzyme-inducing antiseizure drug as prophylaxis", "Dexamethasone for six months with no taper", "No treatment until neurologic deficits worsen"], "a": 0, "e": "Vasogenic edema from tumor causes headache and focal deficits, and dexamethasone gives rapid relief. The lowest effective dose is used for the shortest time, because corticosteroids cause hyperglycemia, myopathy, infection and mood change. Antiseizure drugs are given after a seizure, and routine prophylaxis in patients who have not had a seizure is not recommended. He is referred for local therapy, with glucose monitoring during steroid treatment.", "k": "Vasogenic edema: dexamethasone at the lowest effective dose, with no routine antiseizure prophylaxis.", "t": "Vasogenic edema and seizure prophylaxis"}]}], "T": [{"h": "Eastern Cooperative Oncology Group performance status", "notes": ["The score describes how illness limits daily activity and is used to judge fitness for treatment and trial entry.", "Source. Oken MM, Creech RH, Tormey DC, et al. Toxicity and response criteria of the Eastern Cooperative Oncology Group. Am J Clin Oncol. 1982;5(6):649-656. doi:10.1097/00000421-198212000-00014"], "rows": [["Score", "Definition"], ["0", "Fully active and able to carry on all predisease activity without restriction."], ["1", "Restricted in physically strenuous activity but ambulatory and able to carry out light or sedentary work."], ["2", "Ambulatory and capable of all self-care but unable to work; up and about for more than half of waking hours."], ["3", "Capable of only limited self-care; confined to bed or chair for more than half of waking hours."], ["4", "Completely disabled; cannot carry on any self-care; totally confined to bed or chair."], ["5", "Dead."]]}, {"h": "Response categories in RECIST version 1.1", "notes": ["Response is judged on the sum of the longest diameters of target lesions, with up to five target lesions in total and no more than two per organ.", "Source. Eisenhauer EA, Therasse P, Bogaerts J, et al. New response evaluation criteria in solid tumours: revised RECIST guideline (version 1.1). Eur J Cancer. 2009;45(2):228-247. doi:10.1016/j.ejca.2008.10.026", "Treatment Toxicity"], "rows": [["Category", "Definition"], ["Complete response", "Disappearance of all target lesions. Any pathologic lymph node must shrink to under 10 mm in the short axis."], ["Partial response", "At least a 30 percent decrease in the sum of diameters, taking the baseline sum as the reference."], ["Progressive disease", "At least a 20 percent increase in the sum of diameters, taking the smallest sum on study as the reference, plus an absolute increase of at least 5 mm. A new lesion also counts."], ["Stable disease", "Neither enough shrinkage for partial response nor enough increase for progressive disease."], ["Measurable lesion", "At least 10 mm in the longest diameter on CT. A lymph node must measure at least 15 mm in the short axis."]]}, {"h": "General grading of adverse events", "notes": ["Each adverse event in the Common Terminology Criteria has its own definitions. This table gives the general rule that frames every grade.", "Source. National Cancer Institute. Common Terminology Criteria for Adverse Events (CTCAE), version 5.0. US Department of Health and Human Services; November 27, 2017.", "Liver"], "rows": [["Grade", "General meaning"], ["1", "Mild. Asymptomatic or mild symptoms; clinical or diagnostic observations only; intervention not indicated."], ["2", "Moderate. Minimal, local or noninvasive intervention indicated; limits age-appropriate instrumental activities of daily living."], ["3", "Severe or medically significant but not immediately life-threatening. Hospitalization or prolonged hospitalization indicated; disabling; limits self-care activities of daily living."], ["4", "Life-threatening consequences. Urgent intervention indicated."], ["5", "Death related to the adverse event."]]}, {"h": "Child-Pugh classification of liver function", "notes": ["Add the points from the five measures. The total sets the class, which is used in hepatocellular carcinoma to judge liver reserve.", "Note. The original score graded prothrombin time prolongation in seconds. Current practice replaces it with the INR cutoffs shown here, a widely used modification, so the INR rows are not the published values.", "Source. Pugh RNH, Murray-Lyon IM, Dawson JL, Pietroni MC, Williams R. Transection of the oesophagus for bleeding oesophageal varices. Br J Surg. 1973;60(8):646-649. doi:10.1002/bjs.1800600817", "Prostate"], "rows": [["Measure", "1 point", "2 points", "3 points"], ["Bilirubin (mg/dL)", "Under 2", "2 to 3", "Over 3"], ["Albumin (g/dL)", "Over 3.5", "2.8 to 3.5", "Under 2.8"], ["INR", "Under 1.7", "1.7 to 2.3", "Over 2.3"], ["Ascites", "None", "Mild or controlled with diuretics", "Moderate or refractory"], ["Encephalopathy", "None", "Grade 1 or 2, or controlled with medication", "Grade 3 or 4, or refractory"], ["Total and class", "Class A: 5 to 6 points", "Class B: 7 to 9 points", "Class C: 10 to 15 points"]]}, {"h": "ISUP grade groups for prostate cancer", "notes": ["Grade groups summarize the Gleason score and are reported on every prostate biopsy and prostatectomy specimen.", "Source. Epstein JI, Egevad L, Amin MB, et al. The 2014 International Society of Urological Pathology (ISUP) consensus conference on Gleason grading of prostatic carcinoma: definition of grading patterns and proposal for a new grading system. Am J Surg Pathol. 2016;40(2):244-252. doi:10.1097/PAS.0000000000000530", "Kidney"], "rows": [["Grade group", "Gleason score", "Pattern"], ["1", "6 or lower", "Only individual, discrete, well-formed glands"], ["2", "7", "Predominantly well-formed glands with a lesser poorly formed component (3 + 4)"], ["3", "7", "Predominantly poorly formed or fused glands with a lesser well-formed component (4 + 3)"], ["4", "8", "4 + 4, 3 + 5 or 5 + 3"], ["5", "9 or 10", "Lack of gland formation or necrosis, with or without poorly formed glands"]]}, {"h": "IMDC prognostic model for metastatic renal cell carcinoma", "notes": ["Count the adverse factors present at the start of first-line systemic therapy. The count sets the risk group.", "Note. The model was built in the era of VEGF-targeted therapy. It remains the risk system used in trials of later regimens, but it was not derived in patients treated with immune checkpoint inhibitors.", "Source. Heng DYC, Xie W, Regan MM, et al. Prognostic factors for overall survival in patients with metastatic renal cell carcinoma treated with vascular endothelial growth factor-targeted agents: results from a large, multicenter study. J Clin Oncol. 2009;27(34):5794-5799. doi:10.1200/JCO.2008.21.4809"], "rows": [["Item", "Definition"], ["Adverse factor 1", "Karnofsky performance status below 80 percent"], ["Adverse factor 2", "Under 1 year from diagnosis to start of systemic therapy"], ["Adverse factor 3", "Hemoglobin below the lower limit of normal"], ["Adverse factor 4", "Corrected calcium above the upper limit of normal"], ["Adverse factor 5", "Neutrophil count above the upper limit of normal"], ["Adverse factor 6", "Platelet count above the upper limit of normal"], ["Favorable risk", "No adverse factors"], ["Intermediate risk", "One or two adverse factors"], ["Poor risk", "Three or more adverse factors"]]}]};const HASH="aa39fcc29815e9631af88d30559374bb19a943bd06b96a22488ae395b932f53d";const TOTAL=DATA.D.reduce((a,c)=>a+c.qs.length,0);
const LS={get(k,d){try{const v=localStorage.getItem('moc_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('moc_'+k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const norm=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,'');
let tab='home';let prog=LS.get('prog',{});/* prog[id]={r:right count,w:wrong count,last:bool} */
const qid=(c,q)=>c.ch+'.'+q.n;
function gate(){ $('app').innerHTML=`<div class="gate"><div class="tag" style="color:#6E1E3A;font-weight:700">MEDICAL ONCOLOGY CLINICAL CASEBOOK, 2027 EDITION</div><h1 style="color:#6E1E3A;margin:6px 0">Online Companion</h1><p>Enter the access code printed beneath the QR code on the last page of your book.</p><input id="code" autocomplete="off" placeholder="ACCESS CODE" aria-label="Access code"><div class="err" id="err"></div><button class="btn" id="go" style="width:100%">Unlock</button><p class="foot">Your progress is saved on this device only. No account is needed.</p></div>`;
 const go=async()=>{const v=norm($('code').value);if(v&&await sha(v)===HASH){LS.set('ok',HASH);shell()}else $('err').textContent='That code does not match. Check the code beneath the QR code and try again.'};
 $('go').onclick=go;$('code').onkeydown=e=>{if(e.key==='Enter')go()}}
function shell(){ $('app').innerHTML=`<header><div class="bar"><div class="brand">Medical Oncology Clinical Casebook<small>ONLINE COMPANION · 2027 EDITION</small></div><nav id="nav"></nav></div></header><main id="main"></main>`;
 const T=[['home','Home'],['practice','Practice'],['mock','Mock exam'],['cards','Flashcards'],['progress','Progress'],['tables','Tables']];
 $('nav').innerHTML=T.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?'on':''}">${t[1]}</button>`).join('');
 $('nav').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;shell()}};
 ({home,practice:practiceHome,mock:mockHome,cards:cardsHome,progress,tables})[tab]()}
function stats(){let seen=0,right=0,att=0;DATA.D.forEach(c=>c.qs.forEach(q=>{const p=prog[qid(c,q)];if(p){seen++;right+=p.r;att+=p.r+p.w}}));return{seen,right,att}}
function home(){const s=stats();const acc=s.att?Math.round(100*s.right/s.att)+'%':'--';
 $('main').innerHTML=`<div class="hero"><div class="eb">2027 EDITION</div><h1>${TOTAL} practice questions,<br>self-scoring</h1><p>Every question from the book with instant feedback, a full explanation and the key principle. Timed mock exams, flashcards built from the key principles, and the book's reference tables. Your progress stays on this device.</p><div class="row"><button class="btn gold" onclick="tab='practice';shell()">Practice by chapter</button><button class="btn alt" onclick="tab='mock';shell()">Mock exam</button><button class="btn alt" onclick="tab='cards';shell()">Flashcards</button></div></div>
 <div class="stats"><div class="stat"><span>Questions</span><b>${TOTAL}</b></div><div class="stat"><span>Chapters</span><b>${DATA.D.length}</b></div><div class="stat"><span>Questions seen</span><b>${s.seen}</b></div><div class="stat"><span>Accuracy</span><b>${acc}</b></div></div>
 <div class="card"><b>How to use this page.</b> Attempt a chapter's questions in the book first, then use Practice here for instant scoring and to repeat what you missed. Use Mock exam for timed sets across all chapters. These questions are the same ones printed in the book, so the page adds scoring, review and tracking.</div>`}
function chapterStat(c){let a=0,r=0,w=0;c.qs.forEach(q=>{const p=prog[qid(c,q)];if(p){a++;r+=p.r;w+=p.w}});return{a,r,w}}
function practiceHome(){ $('main').innerHTML=`<h2>Practice by chapter</h2><div class="grid">`+DATA.D.map(c=>{const s=chapterStat(c);return `<button class="ch" data-c="${c.ch}"><b>Chapter ${c.ch}</b> · ${c.qs.length} questions<br>${esc(c.title)}<small>${s.a} seen${s.r+s.w?' · '+Math.round(100*s.r/(s.r+s.w))+'% correct':''}</small></button>`}).join('')+`</div>`;
 $('main').querySelector('.grid').onclick=e=>{const b=e.target.closest('.ch');if(b)runSet(DATA.D.find(c=>c.ch==b.dataset.c).qs.map(q=>({c:DATA.D.find(c=>c.ch==b.dataset.c),q})),'Chapter '+b.dataset.c,false)}}
function runSet(items,title,exam){let i=0,score=0;const ans={};const start=Date.now();let timer=null;
 if(exam){const end=start+60*60*1000;timer=setInterval(()=>{const el=$('clock');if(!el)return clearInterval(timer);const m=Math.max(0,end-Date.now());el.textContent=Math.floor(m/60000)+':'+String(Math.floor(m/1000)%60).padStart(2,'0');if(m<=0){clearInterval(timer);finish()}},1000)}
 function show(){const {c,q}=items[i];const a=ans[i];
  $('main').innerHTML=`<div class="row" style="justify-content:space-between"><b style="color:#6E1E3A">${esc(title)} · Question ${i+1} of ${items.length}</b>${exam?'<b id="clock"></b>':''}</div><div class="bar2" style="margin:8px 0"><i style="width:${100*i/items.length}%"></i></div><div class="card"><div class="tag">Chapter ${c.ch}</div><p class="q">${esc(q.stem)}</p>`+
  q.opts.map((o,k)=>{let cl='opt';if(a!==undefined){if(!exam){if(k===q.a)cl+=' ok';else if(k===a)cl+=' bad'}else if(k===a)cl+=' sel'}return `<button class="${cl}" data-k="${k}"><b>${'ABCDE'[k]}.</b> ${esc(o)}</button>`}).join('')+
  (a!==undefined&&!exam?`<div class="kp"><b>${a===q.a?'Correct.':'Best answer: '+'ABCDE'[q.a]+'.'}</b> ${esc(q.e)}</div><div class="kp"><b>Key principle:</b> ${esc(q.k)}</div>`:'')+
  `</div><div class="row"><button class="btn alt" id="prev" ${i?'':'disabled'}>Back</button><button class="btn" id="next">${i===items.length-1?'Finish':'Next'}</button><button class="btn alt" id="quit">Exit</button></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(ans[i]!==undefined&&!exam)return;ans[i]=+b.dataset.k;if(!exam){record(c,q,ans[i]===q.a)}show()});
  $('prev').onclick=()=>{i--;show()};$('next').onclick=()=>{if(i===items.length-1)finish();else{i++;show()}};$('quit').onclick=()=>{clearInterval(timer);shell()}}
 function finish(){clearInterval(timer);if(exam)items.forEach((it,k)=>{if(ans[k]!==undefined)record(it.c,it.q,ans[k]===it.q.a)});
  const n=items.length;const sc=items.reduce((s,it,k)=>s+(ans[k]===it.q.a?1:0),0);const missed=items.map((it,k)=>({it,k})).filter(x=>ans[x.k]!==x.it.q.a);
  $('main').innerHTML=`<div class="card"><h2 style="margin-top:0">${esc(title)} finished</h2><p style="font-size:28px;margin:6px 0"><b>${sc} / ${n}</b> (${Math.round(100*sc/n)}%)</p><button class="btn" onclick="shell()">Done</button></div>`+(missed.length?`<h2>Review what you missed (${missed.length})</h2>`+missed.map(({it,k})=>`<div class="card"><div class="tag">Chapter ${it.c.ch}</div><p>${esc(it.q.stem)}</p><p><b>Your answer:</b> ${ans[k]===undefined?'(none)':'ABCDE'[ans[k]]+'. '+esc(it.q.opts[ans[k]])}<br><b>Best answer:</b> ${'ABCDE'[it.q.a]}. ${esc(it.q.opts[it.q.a])}</p><p>${esc(it.q.e)}</p><div class="kp"><b>Key principle:</b> ${esc(it.q.k)}</div></div>`).join(''):'<div class="card">No missed questions.</div>')}
 show()}
function record(c,q,ok){const k=qid(c,q);const p=prog[k]||{r:0,w:0};ok?p.r++:p.w++;p.last=ok;prog[k]=p;LS.set('prog',prog)}
function mockHome(){ $('main').innerHTML=`<h2>Mock exam</h2><div class="card"><p>Forty questions drawn at random from all chapters, 60 minutes, no feedback until you finish. At the end you see your score and an explanation for every question you missed.</p><div class="row"><button class="btn" id="m40">Start 40-question mock</button><button class="btn alt" id="mm">Review my missed questions</button></div></div>`;
 const all=()=>DATA.D.flatMap(c=>c.qs.map(q=>({c,q})));const sh=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
 $('m40').onclick=()=>runSet(sh(all()).slice(0,40),'Mock exam',true);
 $('mm').onclick=()=>{const m=all().filter(x=>{const p=prog[qid(x.c,x.q)];return p&&p.last===false});if(!m.length){alert('No missed questions yet.');return}runSet(sh(m),'Missed questions',false)}}
let cdeck=[],ci=0,flip=false;
function cardsHome(){ $('main').innerHTML=`<h2>Flashcards</h2><div class="card"><p>One card per question, built from the key principles. The front names the chapter and topic; flip to read the principle.</p><div class="row"><select id="cs" style="font:inherit;padding:8px;border-radius:8px"><option value="0">All chapters (${TOTAL})</option>${DATA.D.map(c=>`<option value="${c.ch}">Chapter ${c.ch}: ${esc(c.title)}</option>`).join('')}</select><button class="btn" id="cstart">Start</button></div></div><div id="cwrap"></div>`;
 $('cstart').onclick=()=>{const v=+$('cs').value;cdeck=DATA.D.filter(c=>!v||c.ch===v).flatMap(c=>c.qs.map(q=>({c,q})));cdeck.sort(()=>Math.random()-.5);ci=0;flip=false;drawCard()}}
function drawCard(){const {c,q}=cdeck[ci];const front=`Chapter ${c.ch}: ${c.title}`+(q.t?`<br><br><b>${esc(q.t)}</b>`:`<br><br><b>Question ${q.n}</b>`);
 $('cwrap').innerHTML=`<div class="tag">Card ${ci+1} of ${cdeck.length}</div><div class="fc ${flip?'back':''}" id="fc">${flip?esc(q.k):front}</div><div class="row" style="margin-top:10px"><button class="btn alt" id="cp" ${ci?'':'disabled'}>Back</button><button class="btn" id="cf">Flip</button><button class="btn alt" id="cn" ${ci<cdeck.length-1?'':'disabled'}>Next</button></div>`;
 $('fc').onclick=$('cf').onclick=()=>{flip=!flip;drawCard()};$('cp').onclick=()=>{ci--;flip=false;drawCard()};$('cn').onclick=()=>{ci++;flip=false;drawCard()}}
function progress(){const s=stats();$('main').innerHTML=`<h2>Progress</h2><div class="stats"><div class="stat"><span>Questions seen</span><b>${s.seen} / ${TOTAL}</b></div><div class="stat"><span>Answers correct</span><b>${s.att?Math.round(100*s.right/s.att)+'%':'--'}</b></div></div><div class="card">`+DATA.D.map(c=>{const t=chapterStat(c);const pct=t.r+t.w?Math.round(100*t.r/(t.r+t.w)):0;return `<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>Chapter ${c.ch}: ${esc(c.title)}</span><b>${t.a}/${c.qs.length} seen · ${t.r+t.w?pct+'%':'--'}</b></div><div class="bar2"><i style="width:${pct}%"></i></div></div>`}).join('')+`</div><button class="btn alt" id="rs">Reset my progress</button>`;
 $('rs').onclick=()=>{if(confirm('Erase all saved progress on this device?')){prog={};LS.set('prog',prog);progress()}}}
function tables(){ $('main').innerHTML=`<h2>Reference tables</h2><p>The same published scales as the book's Appendix, for quick lookup.</p>`+DATA.T.map(t=>`<div class="card"><h3 style="margin-top:0;color:#6E1E3A">${esc(t.h)}</h3><p>${esc(t.notes[0]||'')}</p><div style="overflow-x:auto"><table><tr>${t.rows[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${t.rows.slice(1).map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table></div>${t.notes.slice(1).map(n=>`<p class="foot">${esc(n)}</p>`).join('')}</div>`).join('')}
if(LS.get('ok','')===HASH)shell();else gate();
</script></body></html>
