 biopsy stages melanoma thicker than 1 mm.","t":"Sentinel node"},{"n":3,"stem":"Which feature is the strongest prognostic factor for localized melanoma?","opts":["Hair color","Family history","Site of the toe","Breslow thickness","Patient height"],"a":3,"e":"Breslow thickness, ulceration and nodal status determine stage and prognosis.","k":"Breslow thickness is the key prognostic factor in localized melanoma.","t":"Breslow thickness"},{"n":4,"stem":"A man with resected stage IIIB melanoma and BRAF V600E mutation needs adjuvant therapy. Which options have evidence?","opts":["Observation only","Radiotherapy to the whole body","Interferon alone","Chemotherapy with dacarbazine","Anti-PD-1 therapy or dabrafenib with trametinib"],"a":4,"e":"Adjuvant pembrolizumab or nivolumab, or BRAF and MEK inhibitors in BRAF-mutant disease, reduce recurrence in resected stage III melanoma.","k":"Adjuvant anti-PD-1 or BRAF and MEK inhibition is used after resection of stage III melanoma.","t":"Adjuvant stage III"},{"n":5,"stem":"A man with asymptomatic metastatic BRAF wild-type melanoma and normal LDH is starting treatment. Which regimen has the longest survival data?","opts":["Interferon","Vemurafenib","Ipilimumab with nivolumab","Dacarbazine","Radiotherapy alone"],"a":2,"e":"CheckMate 067 showed durable survival benefit with combined immunotherapy, with more toxicity than nivolumab alone. Nivolumab with relatlimab is another option.","k":"Combined ipilimumab and nivolumab gives the most durable benefit in advanced melanoma.","t":"First-line advanced melanoma"},{"n":6,"stem":"A woman on dabrafenib and trametinib has recurrent fevers up to 39 C without infection. What is the management?","opts":["Give antibiotics for months","Add chemotherapy","Stop permanently","Double the dose","Hold both drugs during the fever and restart at the same or reduced dose"],"a":4,"e":"Pyrexia is a common toxicity of dabrafenib and trametinib, managed by interruption until resolution, with antipyretics and steroids if recurrent.","k":"Pyrexia on dabrafenib and trametinib is managed by interruption.","t":"BRAF inhibitor pyrexia"},{"n":7,"stem":"A man on vemurafenib develops new keratoacanthomas and squamous cell carcinomas. What explains this?","opts":["Paradoxical MAPK activation in cells with RAS mutations","Bone marrow failure","Direct DNA damage","Immune suppression","Hypothyroidism"],"a":0,"e":"BRAF inhibitors alone activate the MAPK pathway in BRAF wild-type cells, causing cutaneous squamous cell carcinomas. Adding a MEK inhibitor lowers this risk.","k":"BRAF inhibitors alone cause squamous lesions through paradoxical MAPK activation.","t":"Vemurafenib photosensitivity"},{"n":8,"stem":"A patient has metastatic uveal melanoma with a high rate of liver involvement. Which agent has shown survival benefit?","opts":["Vemurafenib","Cisplatin","Dabrafenib","Tebentafusp in HLA-A*02:01-positive patients","Imatinib"],"a":3,"e":"Uveal melanoma rarely has BRAF mutations, and tebentafusp, a bispecific T-cell engager, improved survival. Cytokine release occurs early in treatment.","k":"Tebentafusp improves survival in HLA-A*02:01-positive metastatic uveal melanoma.","t":"Uveal melanoma"},{"n":9,"stem":"A patient with acral melanoma has a KIT mutation and progresses on immunotherapy. Which agent may be considered?","opts":["Trametinib","Imatinib","Cetuximab","Vemurafenib","Sorafenib"],"a":1,"e":"KIT mutations occur more often in acral and mucosal melanoma, and KIT inhibitors can produce responses.","k":"KIT-mutant acral or mucosal melanoma may respond to imatinib.","t":"KIT melanoma"},{"n":10,"stem":"A patient with metastatic melanoma progressed on anti-PD-1 and BRAF therapy. Which cellular therapy is approved?","opts":["Lifileucel, a tumor-infiltrating lymphocyte therapy","Radium-223","Bacillus Calmette-Guerin","CAR T cells against CD19","Stem cell transplant"],"a":0,"e":"Lifileucel, a tumor-infiltrating lymphocyte product, received approval in previously treated melanoma and requires lymphodepletion and interleukin-2.","k":"Lifileucel is a tumor-infiltrating lymphocyte therapy for previously treated melanoma.","t":"TIL therapy"},{"n":11,"stem":"Which factor increases risk and aggressiveness of cutaneous squamous cell carcinoma?","opts":["Dark skin only","Young age","Chronic immunosuppression, as in organ transplant recipients","Vegetarian diet","Cold weather"],"a":2,"e":"Immunosuppressed patients have a much higher rate of cutaneous squamous cell carcinoma and metastasis. Ultraviolet exposure is the main environmental cause.","k":"Immunosuppression raises the risk and aggressiveness of cutaneous squamous cell carcinoma.","t":"Cutaneous SCC risk"},{"n":12,"stem":"Which feature classifies a cutaneous squamous cell carcinoma as high risk?","opts":["Patient age under 40","Location on the trunk","Well-differentiated histology","Small size","Perineural invasion, size over 2 cm, or poor differentiation"],"a":4,"e":"Size, depth, perineural invasion, poor differentiation and immunosuppression raise risk of recurrence and spread.","k":"Perineural invasion, large size and poor differentiation define high-risk squamous carcinoma.","t":"High-risk SCC"},{"n":13,"stem":"A woman has locally advanced cutaneous squamous cell carcinoma that cannot be resected or irradiated. What systemic therapy is approved?","opts":["Dacarbazine","Cemiplimab or pembrolizumab","Interferon","Vemurafenib","Imatinib"],"a":1,"e":"Anti-PD-1 therapy produces response rates near 50 percent in advanced cutaneous squamous cell carcinoma.","k":"Anti-PD-1 therapy treats advanced cutaneous squamous cell carcinoma.","t":"Cemiplimab"},{"n":14,"stem":"A man has a basal cell carcinoma on the nose in a cosmetically sensitive area. Which surgical approach gives the highest cure with tissue sparing?","opts":["Observation","Cryotherapy in all cases","Wide excision with 2 cm margins","Mohs micrographic surgery","Radiotherapy only"],"a":3,"e":"Mohs surgery gives complete margin control and is preferred for high-risk locations on the face, with the highest cure rates.","k":"Mohs surgery is preferred for facial basal cell carcinoma.","t":"Mohs surgery"},{"n":15,"stem":"A patient with advanced basal cell carcinoma is started on vismodegib. Which adverse effects are characteristic?","opts":["Hemorrhagic cystitis","Ototoxicity","Muscle cramps, hair loss, and taste disturbance","Neuropathy","Hand-foot syndrome"],"a":2,"e":"Hedgehog pathway inhibitors cause muscle spasms, alopecia and dysgeusia, and are teratogenic.","k":"Hedgehog inhibitors cause cramps, alopecia and taste change, and are teratogenic.","t":"Hedgehog inhibitors"},{"n":16,"stem":"A young man has multiple basal cell carcinomas, jaw keratocysts and palmar pits. Which gene is mutated?","opts":["BRCA1","TP53","NF1","PTCH1","APC"],"a":3,"e":"Basal cell nevus syndrome, or Gorlin syndrome, results from PTCH1 variants that activate hedgehog signaling. Radiotherapy is avoided because it provokes new tumors.","k":"PTCH1 variants cause Gorlin syndrome with multiple basal cell carcinomas.","t":"Gorlin syndrome"},{"n":17,"stem":"A man has a rapidly growing violaceous nodule on the face, and biopsy shows small round blue cells positive for CK20. What is the diagnosis?","opts":["Lymphoma","Merkel cell carcinoma","Amelanotic melanoma","Dermatofibroma","Basal cell carcinoma"],"a":1,"e":"Merkel cell carcinoma is an aggressive neuroendocrine skin tumor linked to Merkel cell polyomavirus and sun exposure, with positive cytokeratin 20.","k":"Merkel cell carcinoma shows CK20 positivity and is linked to polyomavirus.","t":"Merkel cell"},{"n":18,"stem":"A woman has completely resected stage I Merkel cell carcinoma. What is commonly added after surgery?","opts":["Radiotherapy to the primary site, and sentinel node evaluation","No therapy ever","Vismodegib","Interferon","Imatinib"],"a":0,"e":"Merkel cell carcinoma frequently recurs locally, so adjuvant radiotherapy is typical, and sentinel node biopsy informs staging.","k":"Merkel cell carcinoma usually receives adjuvant radiotherapy and nodal staging.","t":"Merkel adjuvant"},{"n":19,"stem":"A kidney transplant recipient develops metastatic melanoma. What is the concern with checkpoint inhibitors?","opts":["Immunotherapy is contraindicated for all cancers","No effect on the graft","Higher response rates only","Improved graft function","Risk of graft rejection, requiring individualized planning"],"a":4,"e":"Checkpoint inhibitors can precipitate graft rejection and loss. Decisions are individualized and may use BRAF therapy or other options.","k":"Checkpoint inhibitors can trigger graft rejection in transplant recipients.","t":"Transplant immunotherapy"},{"n":20,"stem":"What follow-up is advised for a patient treated for stage IIB melanoma?","opts":["No follow-up","Annual chest radiograph only","Weekly CT","Regular skin and nodal examinations, with imaging at intervals per guidelines","Annual brain MRI only"],"a":3,"e":"Surveillance combines skin examination, nodal palpation and periodic imaging for higher-stage disease, as the risk of recurrence is highest in the first years.","k":"Melanoma follow-up combines skin and nodal examination with selective imaging.","t":"Skin surveillance"},{"n":21,"stem":"Which melanoma subtype is most common?","opts":["Desmoplastic","Superficial spreading","Nodular","Acral lentiginous","Lentigo maligna"],"a":1,"e":"Superficial spreading melanoma accounts for most cases. Nodular melanoma grows vertically and is often thick at diagnosis.","k":"Superficial spreading melanoma is the most common subtype.","t":"Lentigo"},{"n":22,"stem":"Which feature suggests melanoma in a pigmented lesion?","opts":["Asymmetry, irregular border, color variation, diameter over 6 mm, evolution","Uniform color and symmetry","Soft texture","Smooth round border","Stable size for years"],"a":0,"e":"The ABCDE criteria help recognize melanoma, and evolution is the most reliable single sign.","k":"The ABCDE criteria, especially evolution, identify suspicious pigmented lesions.","t":"ABCDE"}]},{"ch":25,"title":"Sarcomas, Unknown Primary, Genetics, and Complications","qs":[{"n":1,"stem":"A 50-year-old woman has a deep, 9 cm enlarging thigh mass. What is the correct first step?","opts":["Immediate marginal excision","Radiotherapy without tissue diagnosis","Excision in the clinic","Observation for 3 months","Imaging with MRI, then core needle biopsy planned with the surgeon, before any excision"],"a":4,"e":"A large or deep mass needs imaging and a planned biopsy, with the track placed so it can be excised. Unplanned excision can contaminate tissues and compromise later surgery.","k":"Biopsy, planned with the sarcoma surgeon, comes before excision of a large deep mass.","t":"Sarcoma biopsy"},{"n":2,"stem":"What is the goal of surgery for a localized extremity soft tissue sarcoma?","opts":["Amputation in all cases","Chemotherapy instead of surgery","Wide excision with negative margins, usually with radiotherapy, preserving the limb","Observation","Intralesional shelling out"],"a":2,"e":"Limb-sparing surgery with radiotherapy achieves local control equal to amputation in most cases.","k":"Limb-sparing wide excision with radiotherapy is the standard for extremity sarcoma.","t":"Sarcoma surgery"},{"n":3,"stem":"A man has a large retroperitoneal liposarcoma. Which feature affects the approach?","opts":["Resection at an experienced center, because local recurrence is the main cause of death","Biopsy is always unsafe","Radiotherapy cures all cases","Observation is the standard","Chemotherapy is curative"],"a":0,"e":"Retroperitoneal sarcomas often recur locally, so complete en bloc resection by an experienced team is key. Well-differentiated tumors are relatively chemoresistant.","k":"Complete en bloc resection at an experienced center is key for retroperitoneal sarcoma.","t":"Retroperitoneal sarcoma"},{"n":4,"stem":"Which molecular finding confirms well-differentiated or dedifferentiated liposarcoma?","opts":["EWSR1 fusion","HER2 amplification","SS18-SSX fusion","KIT mutation","MDM2 amplification"],"a":4,"e":"MDM2 and CDK4 amplification are characteristic of well-differentiated and dedifferentiated liposarcoma and help to distinguish it from lipoma.","k":"MDM2 amplification confirms well-differentiated and dedifferentiated liposarcoma.","t":"MDM2 amplification"},{"n":5,"stem":"A 25-year-old has a soft tissue sarcoma with a t(X;18) translocation. What is the diagnosis?","opts":["Liposarcoma","Rhabdomyosarcoma","Synovial sarcoma, which is relatively chemosensitive to ifosfamide","Leiomyosarcoma","Ewing sarcoma"],"a":2,"e":"The SS18-SSX fusion defines synovial sarcoma, which often affects young adults and responds to anthracycline and ifosfamide regimens.","k":"The t(X;18) translocation defines synovial sarcoma.","t":"Synovial sarcoma"},{"n":6,"stem":"A woman who received breast radiotherapy 8 years ago develops violaceous skin lesions on the breast. What is suspected?","opts":["Recurrent ductal carcinoma","Lymphedema","Cellulitis","Radiation-associated angiosarcoma","Inflammatory breast cancer"],"a":3,"e":"Angiosarcoma may arise in irradiated skin years after treatment and spreads widely in skin. Paclitaxel is active.","k":"Radiation-associated angiosarcoma arises years after radiotherapy.","t":"Angiosarcoma"},{"n":7,"stem":"Which cumulative dose of doxorubicin requires cardiac attention?","opts":["Only below 100 mg per square meter","Risk rises sharply above about 450 to 550 mg per square meter","Cardiac risk is unrelated to dose","Any dose over 50 mg total","Only above 5,000 mg per square meter"],"a":1,"e":"Anthracycline cardiomyopathy is dose-dependent, so a lifetime cumulative limit is respected and dexrazoxane or liposomal forms may be used.","k":"Doxorubicin cardiotoxicity rises sharply above about 450 to 550 mg per square meter.","t":"First-line anthracycline"},{"n":8,"stem":"A woman has a gastric spindle cell tumor positive for CD117 and DOG1. What is the diagnosis?","opts":["Adenocarcinoma","Carcinoid","Lymphoma","Gastrointestinal stromal tumor","Leiomyosarcoma"],"a":3,"e":"CD117 (KIT) and DOG1 staining define GIST, which is driven by KIT or PDGFRA mutations.","k":"CD117 and DOG1 positivity defines gastrointestinal stromal tumor.","t":"GIST diagnosis"},{"n":9,"stem":"A man has metastatic GIST with a KIT exon 11 mutation. Which treatment is first line?","opts":["Imatinib","Paclitaxel","Doxorubicin","Gemcitabine","Cisplatin"],"a":0,"e":"Imatinib produces long disease control in KIT-mutant GIST. Exon 9 mutations may need a higher dose.","k":"Imatinib is first-line therapy for KIT-mutant GIST.","t":"GIST imatinib"},{"n":10,"stem":"A patient with GIST has a PDGFRA D842V mutation. What does this predict?","opts":["Excellent imatinib response","Resistance to all drugs","Response to cetuximab","Need for radiotherapy","Resistance to imatinib, with avapritinib as an active agent"],"a":4,"e":"PDGFRA D842V is insensitive to imatinib, and avapritinib is active against it.","k":"PDGFRA D842V predicts imatinib resistance and responds to avapritinib.","t":"PDGFRA D842V"},{"n":11,"stem":"After resection of a high-risk GIST with KIT exon 11 mutation, how long is adjuvant imatinib recommended?","opts":["Not recommended","At least 3 years, and often longer for high-risk disease","1 month","Lifelong chemotherapy","6 weeks"],"a":1,"e":"Three years of adjuvant imatinib improved survival over one year in high-risk disease, and longer treatment is also considered.","k":"Adjuvant imatinib is given for at least 3 years in high-risk GIST.","t":"Adjuvant GIST"},{"n":12,"stem":"A 15-year-old has a painful femoral mass with an onion-skin periosteal reaction and a t(11;22) translocation. What is the diagnosis?","opts":["Giant cell tumor","Osteoid osteoma","Ewing sarcoma","Chondrosarcoma","Osteosarcoma"],"a":2,"e":"Ewing sarcoma carries an EWSR1-FLI1 fusion and is treated with multiagent chemotherapy and local control by surgery or radiotherapy.","k":"The t(11;22) EWSR1-FLI1 fusion defines Ewing sarcoma.","t":"Ewing biology"},{"n":13,"stem":"A teenager has a distal femoral mass with sunburst periosteal reaction and osteoid on biopsy. Which treatment is standard?","opts":["Observation","Surgery alone","Hormone therapy","Neoadjuvant chemotherapy, surgery, then adjuvant chemotherapy","Radiotherapy alone"],"a":3,"e":"Osteosarcoma is treated with methotrexate, doxorubicin and cisplatin around limb-salvage surgery. It is relatively radioresistant.","k":"Osteosarcoma requires chemotherapy before and after surgery.","t":"Osteosarcoma"},{"n":14,"stem":"Why is leucovorin given after high-dose methotrexate for osteosarcoma?","opts":["To lower blood pressure","To increase tumor kill","To treat anemia only","To prevent nausea","To rescue normal cells from methotrexate toxicity"],"a":4,"e":"Leucovorin bypasses the dihydrofolate reductase block in normal cells. Hydration, urinary alkalinization and drug level monitoring are also needed.","k":"Leucovorin rescues normal cells after high-dose methotrexate.","t":"Methotrexate rescue"},{"n":15,"stem":"A woman has a stable, asymptomatic desmoid tumor of the abdominal wall. What is the preferred initial approach?","opts":["Immediate chemotherapy","Active surveillance","Radical surgery","Hormone therapy only","Wide radiotherapy"],"a":1,"e":"Many desmoid tumors stay stable or regress, so observation is the first approach. Systemic therapy is for progression or symptoms.","k":"Active surveillance is the first approach to asymptomatic desmoid tumors.","t":"Desmoid tumors"},{"n":16,"stem":"Desmoid tumors in a young man should raise suspicion of which hereditary syndrome?","opts":["Familial adenomatous polyposis","Lynch syndrome","Li-Fraumeni syndrome","Cowden syndrome","BRCA2 carrier status"],"a":0,"e":"Desmoid tumors occur in FAP, particularly after abdominal surgery, and sporadic ones usually carry CTNNB1 mutations.","k":"Desmoid tumors are associated with FAP and CTNNB1 mutations.","t":"Desmoid association"},{"n":17,"stem":"A man has adenocarcinoma in the liver with no primary found after CT, endoscopy and mammography-equivalent workup. What is the next step?","opts":["Observation","Empiric surgery","Immunohistochemistry and molecular profiling to find a treatable subtype","Radiotherapy to the liver only","Random organ biopsies"],"a":2,"e":"Pathology and molecular profiling identify favorable subsets and treatable alterations, which guide therapy in cancer of unknown primary.","k":"Molecular profiling guides therapy in cancer of unknown primary.","t":"CUP workup"},{"n":18,"stem":"Which presentation of unknown primary has a favorable prognosis?","opts":["A woman with isolated axillary nodal adenocarcinoma","Pleural effusion","Multiple liver metastases","Poorly differentiated carcinoma with widespread disease","Bone and brain metastases"],"a":0,"e":"Isolated axillary adenocarcinoma in women is treated as breast cancer. Squamous cervical nodes are treated as head and neck cancer.","k":"Axillary nodal adenocarcinoma in women is treated as breast cancer.","t":"Favorable CUP"},{"n":19,"stem":"A young man has a midline mass with high alpha-fetoprotein and beta-hCG. What should be suspected?","opts":["Lung adenocarcinoma","Mesothelioma","Lymphoma","Extragonadal germ cell tumor","Sarcoma"],"a":3,"e":"Germ cell tumors respond to cisplatin-based chemotherapy even when advanced, so recognition is essential.","k":"Midline masses with raised markers suggest extragonadal germ cell tumor.","t":"Midline carcinoma"},{"n":20,"stem":"Which gene is altered in Li-Fraumeni syndrome?","opts":["VHL","BRCA1","TP53","APC","RB1"],"a":2,"e":"TP53 germline variants predispose to sarcomas, breast cancer, brain tumors, adrenocortical carcinoma and leukemia, and call for whole-body MRI surveillance.","k":"Li-Fraumeni syndrome is caused by germline TP53 variants.","t":"Li-Fraumeni"},{"n":21,"stem":"A woman with Li-Fraumeni syndrome develops early breast cancer. What is considered regarding local treatment?","opts":["Brachytherapy","Radiotherapy is preferred","Mammography only","No local treatment","Mastectomy is favored to avoid radiotherapy"],"a":4,"e":"Radiation raises the risk of second cancers in carriers of germline TP53 variants, so it is avoided when alternatives exist.","k":"Radiation is avoided in Li-Fraumeni syndrome when other options exist.","t":"Radiation in Li-Fraumeni"},{"n":22,"stem":"A woman on trastuzumab has a left ventricular ejection fraction fall from 60 to 42 percent without symptoms. What is the usual response?","opts":["Continue without change","Hold trastuzumab, start cardioprotective therapy, and repeat imaging","Switch to doxorubicin","Double the dose","Stop all cancer therapy permanently"],"a":1,"e":"Trastuzumab cardiotoxicity is often reversible. Therapy is held, heart failure drugs are started, and treatment can resume after recovery.","k":"Trastuzumab cardiotoxicity is often reversible with a hold and cardiac therapy.","t":"Trastuzumab cardiotoxicity"},{"n":23,"stem":"Which test is recommended to monitor for anthracycline cardiotoxicity?","opts":["Chest radiograph","Pulmonary function","Exercise stress alone","Carotid ultrasound","Echocardiography with global longitudinal strain or MUGA"],"a":4,"e":"Left ventricular ejection fraction and strain detect early dysfunction, and troponin can add information.","k":"Echocardiography with strain monitors anthracycline cardiotoxicity.","t":"Cardiac monitoring"},{"n":24,"stem":"Which agent reduces anthracycline cardiotoxicity?","opts":["Amifostine for neuropathy","Dexrazoxane","Mesna","Rasburicase","Leucovorin"],"a":1,"e":"Dexrazoxane chelates iron and lowers anthracycline-induced cardiomyopathy risk in patients who need high cumulative doses.","k":"Dexrazoxane protects against anthracycline cardiomyopathy.","t":"Dexrazoxane"},{"n":25,"stem":"A 6-year-old has an orbital rhabdomyosarcoma. What is the general treatment?","opts":["Observation","Surgery alone","Multiagent chemotherapy with radiotherapy, with limited surgery","Hormone therapy","Exenteration in all"],"a":2,"e":"Pediatric rhabdomyosarcoma is chemosensitive, and orbital tumors have a favorable prognosis treated with chemotherapy and radiotherapy.","k":"Orbital rhabdomyosarcoma is treated with chemotherapy and radiotherapy.","t":"Rhabdomyosarcoma"},{"n":26,"stem":"A patient with Burkitt lymphoma starts chemotherapy and develops high potassium, phosphate and uric acid, with low calcium. What is the diagnosis?","opts":["Tumor lysis syndrome","Sepsis","Hemolysis","Hypoparathyroidism alone","Adrenal crisis"],"a":0,"e":"Rapid cell death releases intracellular contents. Hydration and rasburicase or allopurinol prevent and treat it.","k":"Tumor lysis syndrome causes high potassium, phosphate and uric acid with low calcium.","t":"Tumor lysis"}]},{"ch":26,"title":"Head and Neck, Salivary, and Nasopharyngeal Cancers","qs":[{"n":1,"stem":"A 52-year-old nonsmoker has a tonsil mass and a cystic neck node. Which marker is expected and implies a better prognosis?","opts":["BRCA mutation","HER2 positivity","EBV positivity","p16 positivity, from HPV-associated oropharyngeal cancer","KRAS mutation"],"a":3,"e":"HPV-related oropharyngeal cancer has a better response and survival than tobacco-related disease, and has its own staging.","k":"HPV-associated oropharyngeal cancer is p16-positive with a favorable prognosis.","t":"HPV oropharynx"},{"n":2,"stem":"A fit man has stage III laryngeal cancer and wants to preserve his larynx. What is the standard?","opts":["Observation","Total laryngectomy only","Concurrent cisplatin with radiotherapy","Radiotherapy alone","Chemotherapy alone"],"a":2,"e":"Organ-preservation protocols use concurrent chemoradiation, with surgery for persistent disease. Cisplatin is given every 3 weeks at 100 mg per square meter or weekly.","k":"Concurrent cisplatin and radiotherapy preserves the larynx in locally advanced disease.","t":"Cisplatin and radiation"},{"n":3,"stem":"A patient with head and neck cancer has hearing loss and a creatinine clearance of 40 mL/min. Which approach may be used with radiotherapy?","opts":["Imatinib","Carboplatin-based therapy or other alternatives, with careful discussion","High-dose cisplatin anyway","No treatment","Chemotherapy alone"],"a":1,"e":"Cisplatin is avoided in significant renal impairment, hearing loss or neuropathy. Alternatives include carboplatin with fluorouracil or docetaxel.","k":"Cisplatin is avoided in renal impairment or hearing loss, with alternatives used.","t":"Cisplatin ineligible"},{"n":4,"stem":"After surgery for oral cavity cancer, pathology shows extranodal extension and a positive margin. What is adjuvant treatment?","opts":["Observation","Radiotherapy alone","Cetuximab alone","Chemotherapy alone","Postoperative chemoradiation with cisplatin"],"a":4,"e":"Extranodal extension and positive margins are high-risk features, and adding cisplatin to radiotherapy improved outcomes in the pooled trials.","k":"Extranodal extension or positive margin calls for postoperative chemoradiation.","t":"Extranodal extension"},{"n":5,"stem":"What is the primary treatment for a resectable T2N0 oral tongue cancer?","opts":["Chemotherapy alone","Immunotherapy","Radiotherapy alone","Surgical resection, with neck dissection","Observation"],"a":3,"e":"Oral cavity cancers are managed surgically with elective neck dissection, which improves survival in early disease. Adjuvant therapy depends on pathology.","k":"Oral cavity cancer is treated primarily by surgery with neck dissection.","t":"Oral cavity surgery"},{"n":6,"stem":"A man receiving radiotherapy with cetuximab develops a severe acneiform rash and low magnesium. What is the mechanism?","opts":["EGFR inhibition of skin and renal tubules","HER2 inhibition","PD-1 blockade","VEGF inhibition","BRAF inhibition"],"a":0,"e":"EGFR blockade affects skin and renal magnesium handling, and infusion reactions are also a concern.","k":"Cetuximab causes rash and hypomagnesemia through EGFR inhibition.","t":"Cetuximab toxicity"},{"n":7,"stem":"A man with recurrent platinum-refractory head and neck cancer has progression within 6 months of platinum. Which agent improved survival in CheckMate 141?","opts":["Methotrexate","Imatinib","Nivolumab","Cetuximab","Docetaxel"],"a":2,"e":"Nivolumab improved overall survival compared with single-agent chemotherapy in platinum-refractory disease.","k":"Nivolumab improves survival in platinum-refractory head and neck cancer.","t":"Recurrent head and neck"},{"n":8,"stem":"What does the combined positive score measure in head and neck cancer?","opts":["Serum PD-L1","PD-L1-staining tumor and immune cells relative to viable tumor cells","HPV viral load","Number of mutations","Tumor size"],"a":1,"e":"The combined positive score guides first-line pembrolizumab use, with monotherapy options for scores of 1 or more.","k":"The combined positive score counts PD-L1-positive tumor and immune cells per 100 tumor cells.","t":"PD-L1 score"},{"n":9,"stem":"What is osteoradionecrosis of the jaw?","opts":["A form of osteosarcoma","Bone infection from hematogenous spread","Gout of the jaw","Exposed, non-healing irradiated bone, often after tooth extraction","Vitamin D deficiency"],"a":3,"e":"Irradiated bone has reduced healing, so dental problems are treated before radiotherapy, and extractions afterward are risky. Pentoxifylline with tocopherol may help.","k":"Dental evaluation before radiotherapy lowers risk of osteoradionecrosis.","t":"Osteoradionecrosis"},{"n":10,"stem":"A woman has persistent dry mouth after head and neck radiotherapy. Which preventive technique helps?","opts":["Surgery","Higher radiation doses","Cisplatin dose increase","Observation","Intensity-modulated radiotherapy sparing the parotid glands"],"a":4,"e":"Intensity-modulated radiotherapy lowers dose to the salivary glands. Pilocarpine and saliva substitutes give symptomatic help.","k":"Parotid-sparing intensity-modulated radiotherapy reduces xerostomia.","t":"Xerostomia"},{"n":11,"stem":"A man on chemoradiation has painful mucositis and cannot swallow. What is the supportive management?","opts":["Analgesics, oral care, and nutritional support such as feeding tube if needed","Surgery","Antibiotics routinely","Avoid pain control","Stop all treatment forever"],"a":0,"e":"Mucositis is expected and managed with oral hygiene, topical analgesics, systemic pain control and nutrition. Weight loss is monitored.","k":"Mucositis is managed with analgesia, oral care and nutrition support.","t":"Mucositis"},{"n":12,"stem":"A man treated with neck radiotherapy 3 years ago has fatigue and weight gain. Which test is indicated?","opts":["Thyroid-stimulating hormone","Parathyroid hormone","Urine catecholamines","Calcitonin","Cortisol only"],"a":0,"e":"Neck radiation causes hypothyroidism in a large fraction of patients, so thyroid function is checked periodically.","k":"Thyroid function is monitored after neck radiotherapy.","t":"Hypothyroidism after radiation"},{"n":13,"stem":"Which virus is associated with undifferentiated nasopharyngeal carcinoma?","opts":["Human papillomavirus alone","Hepatitis B virus","Epstein-Barr virus","Cytomegalovirus","Human herpesvirus 8"],"a":2,"e":"Nasopharyngeal carcinoma is strongly linked to Epstein-Barr virus, and plasma EBV DNA is used for screening, prognosis and surveillance.","k":"Nasopharyngeal carcinoma is linked to Epstein-Barr virus.","t":"Nasopharyngeal epidemiology"},{"n":14,"stem":"A patient has stage III nasopharyngeal carcinoma. What is the standard treatment?","opts":["Surgery alone","Immunotherapy alone","Observation","Concurrent chemoradiation, with consideration of induction or adjuvant chemotherapy","Radiotherapy alone"],"a":3,"e":"Nasopharyngeal carcinoma is chemosensitive and radiosensitive, and surgery has a limited role because of anatomy.","k":"Nasopharyngeal carcinoma is treated with chemoradiation rather than surgery.","t":"Nasopharyngeal treatment"},{"n":15,"stem":"A man has metastatic nasopharyngeal carcinoma. Which first-line regimen improved survival?","opts":["Imatinib","Radium-223","Cetuximab alone","Tamoxifen","Gemcitabine and cisplatin, with a PD-1 antibody"],"a":4,"e":"Gemcitabine and cisplatin improved survival over fluorouracil and cisplatin, and adding toripalimab or tislelizumab further improved progression-free survival.","k":"Gemcitabine and cisplatin with a PD-1 antibody is first line for metastatic nasopharyngeal carcinoma.","t":"Gemcitabine cisplatin NPC"},{"n":16,"stem":"A man has a parotid mass and biopsy shows mucoepidermoid carcinoma. What is the primary treatment?","opts":["Hormone therapy","Surgical resection with facial nerve preservation when possible","Radiotherapy alone","Observation","Chemotherapy alone"],"a":1,"e":"Salivary gland cancers are treated surgically, and adjuvant radiotherapy is added for high-grade features or positive margins.","k":"Surgery is the primary treatment for salivary gland cancer.","t":"Salivary mucoepidermoid"},{"n":17,"stem":"A woman has adenoid cystic carcinoma of the parotid with pain and facial weakness. What feature is typical?","opts":["Rapid response to chemotherapy","Spontaneous regression","Perineural spread, with late distant recurrence","Absence of nerve involvement","Early lymph node spread"],"a":2,"e":"Adenoid cystic carcinoma grows slowly, invades nerves, and metastasizes to lung years later.","k":"Adenoid cystic carcinoma spreads along nerves and recurs late.","t":"Adenoid cystic"},{"n":18,"stem":"A man has androgen receptor-positive salivary duct carcinoma, which also expresses HER2. Which drug classes have activity?","opts":["Radioiodine","Androgen deprivation therapy and HER2-directed therapy","Hedgehog inhibitors","Imatinib","BRAF inhibitors only"],"a":1,"e":"Salivary duct carcinoma resembles breast cancer in biology, and androgen blockade and trastuzumab-based therapy are options.","k":"Salivary duct carcinoma responds to androgen blockade and HER2 therapy.","t":"Salivary duct carcinoma"},{"n":19,"stem":"A tumor of the salivary gland carries an ETV6-NTRK3 fusion. What therapy is relevant?","opts":["A TRK inhibitor such as larotrectinib","Cetuximab","Vemurafenib","Imatinib","Cisplatin"],"a":0,"e":"NTRK fusions respond to TRK inhibitors across tumor types, and secretory carcinoma carries ETV6-NTRK3.","k":"NTRK fusion-positive tumors respond to TRK inhibitors.","t":"NTRK secretory carcinoma"},{"n":20,"stem":"After chemoradiation, a patient with head and neck cancer coughs with meals. What is advised?","opts":["Ignore symptoms","Surgery","Antibiotics only","Swallowing evaluation and therapy","Stop eating"],"a":3,"e":"Late dysphagia and aspiration are common and cause pneumonia, so swallow therapy and early assessment are important.","k":"Swallowing evaluation and therapy are needed after head and neck chemoradiation.","t":"Dysphagia monitoring"},{"n":21,"stem":"A man with head and neck cancer continues to smoke during radiotherapy. What is the effect?","opts":["Faster healing","No effect","Improved response","Reduced toxicity","Worse tumor control and survival, with more complications"],"a":4,"e":"Continued smoking lowers response, increases second primary cancers and toxicity, so cessation support is part of care.","k":"Smoking cessation improves outcomes in head and neck cancer.","t":"Smoking cessation"},{"n":22,"stem":"Why are patients with tobacco-related head and neck cancer at risk of second cancers?","opts":["Hormonal exposure","Contagious spread","Age alone","Field cancerization of the upper aerodigestive tract","Radiation only"],"a":3,"e":"Carcinogen exposure affects the whole mucosal field, so second primaries in the lung, esophagus and head and neck are common and are looked for.","k":"Field cancerization explains second primary tumors in smokers.","t":"Second primary"},{"n":23,"stem":"A man has a node-positive oropharyngeal cancer treated by definitive chemoradiation, with a residual neck node on PET at 12 weeks. What is considered?","opts":["No treatment","Repeat chemotherapy only","Radioiodine","Observation without evaluation","Neck dissection"],"a":4,"e":"Persistent nodal disease after chemoradiation is assessed with PET at about 12 weeks, and salvage neck dissection is offered for residual disease.","k":"Residual nodal disease after chemoradiation is managed with neck dissection.","t":"Neck dissection"},{"n":24,"stem":"A smoker with hoarseness lasting more than 3 weeks needs which evaluation?","opts":["Laryngoscopy","Chest radiograph only","Antibiotics only","Voice rest only","No evaluation"],"a":0,"e":"Persistent hoarseness in a smoker suggests laryngeal cancer until proven otherwise, and visualization with laryngoscopy and biopsy is needed.","k":"Persistent hoarseness in a smoker warrants laryngoscopy.","t":"Larynx screening"}]},{"ch":27,"title":"Thyroid and Central Nervous System Cancers, Genetics, and Complications","qs":[{"n":1,"stem":"A 45-year-old woman has a 2 cm thyroid nodule with suspicious ultrasound features. What is the next step?","opts":["Thyroxine suppression alone","Ultrasound-guided fine-needle aspiration","Thyroidectomy without biopsy","Observation for 5 years","Radioiodine"],"a":1,"e":"Fine-needle aspiration classified by Bethesda category directs management of thyroid nodules.","k":"Fine-needle aspiration evaluates suspicious thyroid nodules.","t":"Thyroid nodule"},{"n":2,"stem":"A woman has a 0.8 cm papillary thyroid microcarcinoma without nodal disease. What management is acceptable?","opts":["External beam radiotherapy","Chemotherapy","Lobectomy or active surveillance in selected patients","Neck dissection always","Total thyroidectomy with radioiodine always"],"a":2,"e":"Low-risk papillary microcarcinomas have an excellent prognosis, so conservative approaches avoid overtreatment.","k":"Low-risk papillary microcarcinoma may be managed by lobectomy or surveillance.","t":"Papillary low risk"},{"n":3,"stem":"After total thyroidectomy for high-risk differentiated thyroid cancer, which therapy targets residual cells?","opts":["Tamoxifen","Cisplatin","Imatinib","Radioactive iodine after TSH stimulation","External beam radiotherapy always"],"a":3,"e":"Differentiated thyroid cells take up iodine, and radioiodine ablates remnant tissue and treats metastases. TSH suppression follows.","k":"Radioiodine treats iodine-avid differentiated thyroid cancer after thyroidectomy.","t":"Radioiodine"},{"n":4,"stem":"After total thyroidectomy and radioiodine, which marker is used for surveillance?","opts":["CEA only","CA 19-9","Serum thyroglobulin with antibodies","Calcitonin","Alpha-fetoprotein"],"a":2,"e":"Thyroglobulin should become very low after ablation, and a rise suggests recurrence. Antibodies can interfere with the assay.","k":"Thyroglobulin monitors differentiated thyroid cancer after thyroidectomy.","t":"Thyroglobulin"},{"n":5,"stem":"A man has radioiodine-refractory progressive differentiated thyroid cancer. Which agents have evidence?","opts":["Tamoxifen","Methotrexate","Rituximab","Cisplatin","Lenvatinib or sorafenib"],"a":4,"e":"Multikinase inhibitors improve progression-free survival in radioiodine-refractory disease, and cabozantinib is used after prior VEGFR therapy.","k":"Lenvatinib and sorafenib are used for radioiodine-refractory thyroid cancer.","t":"RAI-refractory"},{"n":6,"stem":"A man has a thyroid mass, elevated calcitonin, and diarrhea. Which cell type is involved?","opts":["Follicular cells","Parafollicular C cells","Oncocytes","Parathyroid cells","Lymphocytes"],"a":1,"e":"Medullary thyroid carcinoma arises from C cells and produces calcitonin and CEA. RET testing identifies hereditary forms.","k":"Medullary thyroid carcinoma arises from C cells and secretes calcitonin.","t":"Medullary thyroid"},{"n":7,"stem":"A patient has medullary thyroid cancer, pheochromocytoma, and hyperparathyroidism. Which gene is involved?","opts":["RET","MEN1","VHL","SDHB only","APC"],"a":0,"e":"MEN2A is caused by RET germline variants. Pheochromocytoma must be excluded before thyroid surgery.","k":"MEN2 is caused by germline RET variants.","t":"MEN2"},{"n":8,"stem":"Before thyroidectomy in a patient with MEN2, why is pheochromocytoma excluded?","opts":["It blocks anesthesia","Unrecognized pheochromocytoma can cause a fatal hypertensive crisis during surgery","It lowers calcium","It has no relevance","It makes thyroid surgery easier"],"a":1,"e":"Alpha blockade is started before surgery when a pheochromocytoma is found, and the adrenal tumor is removed first.","k":"Exclude pheochromocytoma before surgery in patients with MEN2.","t":"Pheochromocytoma first"},{"n":9,"stem":"A child carries a highest-risk RET M918T variant. When is prophylactic thyroidectomy advised?","opts":["At age 60","After cancer develops","Never","At age 40","In the first year of life"],"a":4,"e":"The timing of prophylactic thyroidectomy depends on the RET risk category, and the highest-risk variants call for surgery in infancy.","k":"Highest-risk RET variants call for prophylactic thyroidectomy in the first year.","t":"Prophylactic thyroidectomy"},{"n":10,"stem":"Which toxicity is common with selective RET inhibitors such as selpercatinib?","opts":["Ototoxicity","Hand-foot syndrome","Hemorrhagic cystitis","Hypertension, liver enzyme elevation and QT prolongation","Pulmonary fibrosis"],"a":3,"e":"Selective RET inhibitors are better tolerated than multikinase inhibitors but still need monitoring of blood pressure, liver tests and QT interval.","k":"Selpercatinib causes hypertension, transaminase elevation and QT prolongation.","t":"Selpercatinib"},{"n":11,"stem":"An older man has a rapidly enlarging neck mass with hoarseness and airway compromise. Biopsy shows undifferentiated carcinoma. What test is urgent?","opts":["PD-L1 only","HER2 testing","BRAF V600E testing","BRCA testing","KRAS testing only"],"a":2,"e":"Anaplastic thyroid cancer is aggressive, and dabrafenib with trametinib offers high response rates in BRAF V600E-mutant disease, so rapid testing matters.","k":"Anaplastic thyroid cancer needs rapid BRAF testing.","t":"Anaplastic thyroid"},{"n":12,"stem":"Which molecular feature defines an oligodendroglioma?","opts":["IDH mutation with 1p/19q codeletion","EGFR amplification only","MGMT absence","IDH wild-type","BRAF fusion"],"a":0,"e":"Oligodendroglioma requires IDH mutation and 1p/19q codeletion, and has a better prognosis than astrocytoma.","k":"Oligodendroglioma is defined by IDH mutation and 1p/19q codeletion.","t":"Glioma grading"},{"n":13,"stem":"A 62-year-old man has an IDH wild-type glioblastoma and good performance status after resection. What is the standard adjuvant treatment?","opts":["Observation","Imatinib","Radiotherapy with concurrent and adjuvant temozolomide","Chemotherapy alone","Whole-brain radiotherapy only"],"a":2,"e":"The Stupp regimen of radiotherapy with temozolomide improved survival in glioblastoma, with greater benefit when MGMT is methylated.","k":"Glioblastoma is treated with radiotherapy plus temozolomide.","t":"Glioblastoma"},{"n":14,"stem":"What does MGMT promoter methylation predict in glioblastoma?","opts":["Greater benefit from temozolomide","No effect","Absence of recurrence","Greater benefit from bevacizumab","Resistance to radiotherapy"],"a":0,"e":"Methylation silences the repair enzyme MGMT, so tumors are more sensitive to alkylating chemotherapy.","k":"MGMT methylation predicts temozolomide benefit.","t":"MGMT promoter"},{"n":15,"stem":"Which device therapy added to temozolomide improved survival in newly diagnosed glioblastoma?","opts":["Laser ablation alone","Tumor treating fields","Magnetic seizure therapy","Hyperbaric oxygen","Hyperthermia"],"a":1,"e":"Alternating electric fields applied to the scalp improved overall survival in a randomized trial but require long daily use.","k":"Tumor treating fields prolong survival when added to temozolomide in glioblastoma.","t":"Tumor treating fields"},{"n":16,"stem":"A man with recurrent glioblastoma has symptomatic radiation necrosis and edema. What drug can reduce it?","opts":["Cisplatin","Methotrexate","Imatinib","Cetuximab","Bevacizumab"],"a":4,"e":"Bevacizumab reduces edema and steroid need and improves progression-free survival, but has not shown overall survival benefit.","k":"Bevacizumab reduces edema in recurrent glioblastoma and radiation necrosis.","t":"Bevacizumab glioma"},{"n":17,"stem":"A woman with brain metastases has headache and vasogenic edema. What is the initial medical therapy?","opts":["Mannitol alone","Aspirin","Chemotherapy","Dexamethasone","Antiseizure drug prophylaxis"],"a":3,"e":"Corticosteroids rapidly reduce vasogenic edema and symptoms, using the lowest effective dose to limit toxicity.","k":"Dexamethasone treats vasogenic edema from brain metastases.","t":"Dexamethasone"},{"n":18,"stem":"A man with a brain metastasis has never had a seizure. What is recommended regarding antiseizure drugs?","opts":["Start carbamazepine","No routine prophylaxis","Start valproate","Start levetiracetam in all","Start phenytoin"],"a":1,"e":"Prophylactic antiseizure drugs do not prevent a first seizure and add toxicity, so they are given only after a seizure.","k":"Routine antiseizure prophylaxis is not recommended without prior seizures.","t":"Seizure prophylaxis"},{"n":19,"stem":"A patient has a solitary 4.5 cm symptomatic brain metastasis with mass effect. What is typically preferred?","opts":["Chemotherapy alone","Whole-brain radiotherapy alone","Observation","Radiosurgery alone without resection","Surgical resection, followed by radiotherapy to the cavity"],"a":4,"e":"Large symptomatic lesions benefit from resection, and postoperative radiosurgery lowers local recurrence.","k":"Large symptomatic brain metastases are resected, followed by cavity radiotherapy.","t":"Large metastasis"},{"n":20,"stem":"A woman with EGFR-mutant lung cancer has asymptomatic brain metastases. Which targeted drug has good brain penetration?","opts":["Osimertinib","Cetuximab","Erlotinib only","Imatinib","Gefitinib only"],"a":0,"e":"Osimertinib has substantial central nervous system activity and is often used first, with radiotherapy reserved for progression or symptoms.","k":"Osimertinib has good brain penetration in EGFR-mutant lung cancer.","t":"EGFR brain"},{"n":21,"stem":"A woman with breast cancer has headaches, cranial neuropathies, and positive cerebrospinal fluid cytology. What is diagnosed?","opts":["Pseudotumor","Normal-pressure hydrocephalus","Migraine","Leptomeningeal metastasis","Meningitis from bacteria"],"a":3,"e":"Leptomeningeal disease is diagnosed by MRI and cerebrospinal fluid cytology, and carries a poor prognosis, with radiotherapy or intrathecal therapy for symptoms.","k":"Cranial neuropathies with positive cytology indicate leptomeningeal metastasis.","t":"Leptomeningeal"},{"n":22,"stem":"A man with prostate cancer has back pain, leg weakness and urinary retention. What is the immediate step?","opts":["Oral analgesics only","Chemotherapy","Urgent MRI of the spine and high-dose dexamethasone","Delay imaging for a week","Bone scan"],"a":2,"e":"Metastatic spinal cord compression is an emergency. Steroids are started, imaging confirms, and radiotherapy or surgery follows quickly.","k":"Suspected spinal cord compression needs urgent MRI and corticosteroids.","t":"Spinal cord compression"},{"n":23,"stem":"A patient with cord compression has a single level and unstable spine. What improves outcome?","opts":["Radiotherapy alone always","Hormones","Surgical decompression and stabilization followed by radiotherapy","Chemotherapy alone","Observation"],"a":2,"e":"Surgery followed by radiotherapy improved ambulation over radiotherapy alone in selected patients with unstable or single-level compression.","k":"Selected patients with cord compression benefit from surgery plus radiotherapy.","t":"Cord compression treatment"},{"n":24,"stem":"A man treated with radiosurgery 8 months ago has an enlarging enhancing lesion with edema. What is considered?","opts":["Radiation necrosis versus tumor progression, evaluated with advanced imaging","Migraine","Stroke only","Abscess only","Normal finding"],"a":0,"e":"Radiation necrosis mimics recurrence, and perfusion MRI, PET or biopsy help distinguish them. Steroids or bevacizumab treat necrosis.","k":"Radiation necrosis can mimic recurrence after radiosurgery.","t":"Radiation necrosis"},{"n":25,"stem":"A man with an enhancing periventricular lesion shows rapid shrinkage after steroids. What is suspected?","opts":["Abscess","Primary central nervous system lymphoma","Metastasis","Glioblastoma","Meningioma"],"a":1,"e":"Steroids can render lymphoma undiagnosable, so they are withheld before biopsy when possible. High-dose methotrexate is the backbone of treatment.","k":"Primary CNS lymphoma shrinks with steroids, so biopsy precedes steroids when possible.","t":"Primary CNS lymphoma"},{"n":26,"stem":"A woman has an incidental, asymptomatic 1.5 cm convexity meningioma. What is the usual approach?","opts":["Whole-brain radiotherapy","Biopsy only","Chemotherapy","Immediate craniotomy","Observation with serial MRI"],"a":4,"e":"Many meningiomas grow slowly, so small asymptomatic lesions are watched. Treatment is for growth or symptoms, with surgery or radiosurgery.","k":"Small asymptomatic meningiomas are observed with serial MRI.","t":"Meningioma"},{"n":27,"stem":"A woman with breast cancer has confusion, polyuria and a corrected calcium of 14 mg/dL. What is first-line treatment?","opts":["Thiazide diuretics","Calcium supplements","Vitamin D","Intravenous fluids followed by a bisphosphonate","Observation"],"a":3,"e":"Hypercalcemia of malignancy is treated with saline hydration and zoledronic acid, with calcitonin for rapid effect and denosumab for refractory cases.","k":"Hypercalcemia of malignancy is treated with hydration and a bisphosphonate.","t":"Hypercalcemia"}]}],"T":[{"h":"Eastern Cooperative Oncology Group performance status","notes":["The score describes how illness limits daily activity and is used to judge fitness for treatment and trial entry.","Source. Oken MM, Creech RH, Tormey DC, et al. Toxicity and response criteria of the Eastern Cooperative Oncology Group. Am J Clin Oncol. 1982;5(6):649-656. doi:10.1097/00000421-198212000-00014"],"rows":[["Score","Definition"],["0","Fully active and able to carry on all predisease activity without restriction."],["1","Restricted in physically strenuous activity but ambulatory and able to carry out light or sedentary work."],["2","Ambulatory and capable of all self-care but unable to work; up and about for more than half of waking hours."],["3","Capable of only limited self-care; confined to bed or chair for more than half of waking hours."],["4","Completely disabled; cannot carry on any self-care; totally confined to bed or chair."],["5","Dead."]]},{"h":"Response categories in RECIST version 1.1","notes":["Response is judged on the sum of the longest diameters of target lesions, with up to five target lesions in total and no more than two per organ.","Source. Eisenhauer EA, Therasse P, Bogaerts J, et al. New response evaluation criteria in solid tumours: revised RECIST guideline (version 1.1). Eur J Cancer. 2009;45(2):228-247. doi:10.1016/j.ejca.2008.10.026","Treatment Toxicity"],"rows":[["Category","Definition"],["Complete response","Disappearance of all target lesions. Any pathologic lymph node must shrink to under 10 mm in the short axis."],["Partial response","At least a 30 percent decrease in the sum of diameters, taking the baseline sum as the reference."],["Progressive disease","At least a 20 percent increase in the sum of diameters, taking the smallest sum on study as the reference, plus an absolute increase of at least 5 mm. A new lesion also counts."],["Stable disease","Neither enough shrinkage for partial response nor enough increase for progressive disease."],["Measurable lesion","At least 10 mm in the longest diameter on CT. A lymph node must measure at least 15 mm in the short axis."]]},{"h":"General grading of adverse events","notes":["Each adverse event in the Common Terminology Criteria has its own definitions. This table gives the general rule that frames every grade.","Source. National Cancer Institute. Common Terminology Criteria for Adverse Events (CTCAE), version 5.0. US Department of Health and Human Services; November 27, 2017.","Liver"],"rows":[["Grade","General meaning"],["1","Mild. Asymptomatic or mild symptoms; clinical or diagnostic observations only; intervention not indicated."],["2","Moderate. Minimal, local or noninvasive intervention indicated; limits age-appropriate instrumental activities of daily living."],["3","Severe or medically significant but not immediately life-threatening. Hospitalization or prolonged hospitalization indicated; disabling; limits self-care activities of daily living."],["4","Life-threatening consequences. Urgent intervention indicated."],["5","Death related to the adverse event."]]},{"h":"Child-Pugh classification of liver function","notes":["Add the points from the five measures. The total sets the class, which is used in hepatocellular carcinoma to judge liver reserve.","Note. The original score graded prothrombin time prolongation in seconds. Current practice replaces it with the INR cutoffs shown here, a widely used modification, so the INR rows are not the published values.","Source. Pugh RNH, Murray-Lyon IM, Dawson JL, Pietroni MC, Williams R. Transection of the oesophagus for bleeding oesophageal varices. Br J Surg. 1973;60(8):646-649. doi:10.1002/bjs.1800600817","Prostate"],"rows":[["Measure","1 point","2 points","3 points"],["Bilirubin (mg/dL)","Under 2","2 to 3","Over 3"],["Albumin (g/dL)","Over 3.5","2.8 to 3.5","Under 2.8"],["INR","Under 1.7","1.7 to 2.3","Over 2.3"],["Ascites","None","Mild or controlled with diuretics","Moderate or refractory"],["Encephalopathy","None","Grade 1 or 2, or controlled with medication","Grade 3 or 4, or refractory"],["Total and class","Class A: 5 to 6 points","Class B: 7 to 9 points","Class C: 10 to 15 points"]]},{"h":"ISUP grade groups for prostate cancer","notes":["Grade groups summarize the Gleason score and are reported on every prostate biopsy and prostatectomy specimen.","Source. Epstein JI, Egevad L, Amin MB, et al. The 2014 International Society of Urological Pathology (ISUP) consensus conference on Gleason grading of prostatic carcinoma: definition of grading patterns and proposal for a new grading system. Am J Surg Pathol. 2016;40(2):244-252. doi:10.1097/PAS.0000000000000530","Kidney"],"rows":[["Grade group","Gleason score","Pattern"],["1","6 or lower","Only individual, discrete, well-formed glands"],["2","7","Predominantly well-formed glands with a lesser poorly formed component (3 + 4)"],["3","7","Predominantly poorly formed or fused glands with a lesser well-formed component (4 + 3)"],["4","8","4 + 4, 3 + 5 or 5 + 3"],["5","9 or 10","Lack of gland formation or necrosis, with or without poorly formed glands"]]},{"h":"IMDC prognostic model for metastatic renal cell carcinoma","notes":["Count the adverse factors present at the start of first-line systemic therapy. The count sets the risk group.","Note. The model was built in the era of VEGF-targeted therapy. It remains the risk system used in trials of later regimens, but it was not derived in patients treated with immune checkpoint inhibitors.","Source. Heng DYC, Xie W, Regan MM, et al. Prognostic factors for overall survival in patients with metastatic renal cell carcinoma treated with vascular endothelial growth factor-targeted agents: results from a large, multicenter study. J Clin Oncol. 2009;27(34):5794-5799. doi:10.1200/JCO.2008.21.4809"],"rows":[["Item","Definition"],["Adverse factor 1","Karnofsky performance status below 80 percent"],["Adverse factor 2","Under 1 year from diagnosis to start of systemic therapy"],["Adverse factor 3","Hemoglobin below the lower limit of normal"],["Adve <div class="panel"><b style="font-size:16px">Appearance</b><span class="lbl" style="margin-top:12px">Theme</span><div class="seg" id="st">${[['auto','Auto'],['light','Light'],['dark','Dark']].map(o=>`<button data-v="${o[0]}" class="${S.theme===o[0]?'on':''}">${o[1]}</button>`).join('')}</div><span class="lbl" style="margin-top:14px">Text size</span><div class="seg" id="ss">${[['s','Small'],['m','Medium'],['l','Large'],['x','XL']].map(o=>`<button data-v="${o[0]}" class="${S.size===o[0]?'on':''}">${o[1]}</button>`).join('')}</div><label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:600"><input type="checkbox" id="sm" ${S.nomo?'checked':''}> Reduce motion</label></div></div>
<h2 class="sec">Keyboard shortcuts</h2><div class="panel kb"><div><kbd>1</kbd>–<kbd>5</kbd> or <kbd>A</kbd>–<kbd>E</kbd> pick an answer</div><div><kbd>F</kbd> flag the question</div><div><kbd>Shift</kbd>+letter cross out an option</div><div><kbd>P</kbd> pause and resume</div><div><kbd>Enter</kbd> check or next</div><div>Cards: <kbd>Space</kbd> flip, <kbd>1</kbd>–<kbd>4</kbd> rate</div><div><kbd>←</kbd> <kbd>→</kbd> previous or next</div></div>
<h2 class="sec">Reference tables</h2>${TABLES.map(t=>`<details class="panel" style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:700;color:var(--g)">${esc(t.h)}</summary><p style="color:var(--mu)">${esc(t.notes[0]||'')}</p><div style="overflow-x:auto"><table class="tbl"><tr>${t.rows[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${t.rows.slice(1).map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table></div>${t.notes.slice(1).map(n=>`<p class="disc" style="margin:6px 0 0">${esc(n)}</p>`).join('')}</details>`).join('')}
<h2 class="sec">Your data</h2><div class="panel"><p style="margin-top:0;color:var(--mu)">Progress is saved in this browser only. Export a backup to move it to another device.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="b" id="dx">${ic('down',16)}Export progress</button><button class="b line" id="di">Import</button><input type="file" id="df" accept=".json" hidden><button class="b line" id="dr" style="color:var(--bad)">Reset everything</button><button class="b line" id="dl">Lock companion</button></div></div>${disclaimer()}`;
const sv=()=>{S.exam=$('sx').value;S.goal=Math.max(1,+$('sg').value||20);S.newc=Math.max(0,+$('sn').value||0);save()};
['sx','sg','sn'].forEach(i=>$(i).onchange=sv);
$('st').onclick=e=>{const b=e.target.closest('button');if(b){S.theme=b.dataset.v;save();applyPrefs();morePage()}};$('ss').onclick=e=>{const b=e.target.closest('button');if(b){S.size=b.dataset.v;save();applyPrefs();morePage()}};
$('sm').onchange=e=>{S.nomo=e.target.checked;save();applyPrefs()};
$('dx').onclick=()=>{const b=new Blob([JSON.stringify({v:3,S,P,F,NT,DY,EX,CD})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='oncology-casebook-progress-'+ymd()+'.json';a.click();toast('Backup downloaded')};
$('di').onclick=()=>$('df').click();
$('df').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.v!==3)throw 0;S=Object.assign(S,j.S);P=j.P||{};F=j.F||{};NT=j.NT||{};DY=j.DY||{};EX=j.EX||[];CD=j.CD||{};save();applyPrefs();toast('Progress imported');morePage()}catch(x){toast('That file is not a valid backup')}};r.readAsText(f)};
$('dr').onclick=()=>{if(confirm('Erase all progress, notes, flags and flashcard schedules on this device?')){P={};F={};NT={};DY={};EX=[];CD={};save();toast('Progress reset');morePage()}};
$('dl').onclick=()=>{LS.set('ok','');location.reload()}}
/* ---------- keys + boot ---------- */
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key;
if(ROUTE==='session'&&SES){const s=SES,q=s.items[s.i].q;
if(/^[1-5]$/.test(k)&&!e.shiftKey&&!s.chk[s.i]){s.ans[s.i]=+k-1;sessionView()}
else if(/^[a-eA-E]$/.test(k)){const n='abcde'.indexOf(k.toLowerCase());if(e.shiftKey){const c=s.cut[s.i]||(s.cut[s.i]={});c[n]=!c[n];sessionView()}else if(!s.chk[s.i]){s.ans[s.i]=n;sessionView()}}
else if(k==='Enter'){if(s.mode==='review')return;if(s.chk[s.i]||s.mode==='exam')nextQ();else checkAns()}
else if(k==='ArrowRight')goto(s.i+1);else if(k==='ArrowLeft')goto(s.i-1);else if(k==='f'||k==='F')flag();
else if((k==='p'||k==='P')&&s.mode!=='exam'&&s.mode!=='review'){s.paused=!s.paused;sessionView()}}
else if(ROUTE==='cardrun'&&CR&&CR.i<CR.q.length){if(k===' '){e.preventDefault();if(!CR.flip){CR.flip=true;cardRun()}}else if(/^[1-4]$/.test(k)&&CR.flip)rate(+k)}});
function boot(){applyPrefs();if(LS.get('ok','')!==HASH){gate();return}shell();route()}
window.addEventListener('hashchange',route);
document.addEventListener('DOMContentLoaded',()=>{try{const old=localStorage.getItem('moc2_ok');if(old&&old===JSON.stringify(HASH))LS.set('ok',HASH)}catch(e){}boot()});
</script></body></html>
