rozole alone","Fulvestrant","Letrozole alone","No therapy is ever effective"],"a":0,"e":"Tamoxifen lowers breast events in hormone-positive DCIS and is the choice in premenopausal women. Aromatase inhibitors are used in postmenopausal women.","k":"Premenopausal women with hormone-positive DCIS receive tamoxifen.","t":"Endocrine therapy for DCIS"},{"n":13,"stem":"A woman has an eczema-like rash of the nipple that does not heal with topical steroids. What is next?","opts":["Antibiotics","Observation","Antifungal cream","A biopsy of the nipple and breast imaging","Long-term topical steroids"],"a":3,"e":"Paget disease of the nipple is associated with underlying DCIS or invasive cancer in most cases. A skin biopsy confirms the diagnosis, and imaging looks for an underlying lesion.","k":"A persistent nipple rash needs biopsy to exclude Paget disease.","t":"Paget disease"},{"n":14,"stem":"A 42-year-old BRCA1 carrier has completed childbearing. Which surgery lowers ovarian cancer risk and mortality?","opts":["Oophoropexy","Hysterectomy alone","Risk-reducing salpingo-oophorectomy","Appendectomy","Tubal ligation alone"],"a":2,"e":"Risk-reducing salpingo-oophorectomy is advised between ages 35 and 40 for BRCA1 and 40 to 45 for BRCA2 carriers after childbearing, and it lowers breast cancer risk in premenopausal carriers modestly.","k":"BRCA carriers should consider risk-reducing salpingo-oophorectomy after childbearing.","t":"BRCA risk reduction"},{"n":15,"stem":"What does bilateral risk-reducing mastectomy achieve in BRCA carriers?","opts":["A survival gain proven in randomized trials","No reduction","A reduction in breast cancer risk of about 90 percent or more","Elimination of all breast cancer risk","Elimination of ovarian cancer"],"a":2,"e":"Bilateral mastectomy lowers risk by 90 percent or more, but not to zero because breast tissue remains. Randomized survival data are lacking, so choice is individual.","k":"Risk-reducing mastectomy lowers breast cancer risk by 90 percent or more.","t":"Mastectomy for risk"},{"n":16,"stem":"Which menopausal hormone therapy is associated with a higher risk of breast cancer?","opts":["Vaginal estrogen cream at low dose","Raloxifene","Tamoxifen","Estrogen alone after hysterectomy for short use","Combined estrogen and progestin"],"a":4,"e":"The Women's Health Initiative showed higher breast cancer incidence with combined estrogen and progestin. Estrogen alone after hysterectomy showed a neutral or lower risk.","k":"Combined estrogen-progestin therapy raises breast cancer risk.","t":"Hormone therapy"},{"n":17,"stem":"Which modifiable lifestyle factor increases breast cancer risk in a dose-dependent way?","opts":["Alcohol consumption","Coffee consumption","Antiperspirant use","Cell phone use","Wearing underwire bras"],"a":0,"e":"Alcohol raises breast cancer risk with a dose-response relationship. Obesity after menopause and low physical activity also contribute.","k":"Alcohol raises breast cancer risk in a dose-dependent manner.","t":"Alcohol and risk"},{"n":18,"stem":"A woman has extremely dense breasts on mammography and average risk. Which statement is correct?","opts":["Density has no effect on risk","Dense breasts raise risk and lower mammography sensitivity, and supplemental imaging may be considered","Chemoprevention is mandatory","Mastectomy is recommended","Density improves mammography sensitivity"],"a":1,"e":"Dense tissue masks tumors and is an independent risk factor. Supplemental ultrasound or MRI may be discussed, and decisions depend on overall risk and resources.","k":"Dense breasts mask tumors on mammography and raise risk.","t":"Breast density"},{"n":19,"stem":"At what interval and starting age does the 2024 US Preventive Services Task Force recommend screening mammography for average-risk women?","opts":["Every 2 years from ages 25 to 50","Yearly from age 30","Only after age 65","Every 2 years from ages 40 to 74","Every 5 years from age 50"],"a":3,"e":"The 2024 update lowered the starting age to 40, with biennial screening through age 74. Women at higher risk follow separate schedules.","k":"Biennial mammography is recommended from ages 40 to 74 for average-risk women.","t":"Screening age"},{"n":20,"stem":"Which patient would have been eligible for a trial of active monitoring instead of surgery for DCIS?","opts":["A woman aged 40 or older with low-grade, asymptomatic, mammographically detected DCIS","A woman with a palpable high-grade mass","A woman with BRCA1 and high-grade DCIS","A woman with DCIS and microinvasion","A woman with Paget disease"],"a":0,"e":"The COMET trial enrolled women with low-risk DCIS, defined by grade 1 or 2, hormone receptor positivity, and detection by imaging. Short-term data support monitoring in selected patients.","k":"Active monitoring is studied in low-grade, imaging-detected DCIS.","t":"Active monitoring"},{"n":21,"stem":"A core biopsy of a spiculated mammographic lesion shows a radial scar without atypia. How is it managed in most centers?","opts":["Mastectomy","Chemotherapy","Tamoxifen for 5 years in all cases","Excision or careful follow-up depending on imaging concordance and local protocol","No follow-up ever"],"a":3,"e":"Radial scars can be associated with atypia or carcinoma at the periphery, so excision is considered when sampling is limited or imaging is discordant.","k":"A radial scar may be excised to exclude associated atypia or cancer.","t":"Radial scar"}]},{"ch":12,"title":"Early, Locally Advanced, Inflammatory, and Recurrent Breast Cancer","qs":[{"n":1,"stem":"A 58-year-old woman with a 1.8 cm hormone receptor-positive cancer undergoes lumpectomy and sentinel node biopsy. Two of three sentinel nodes contain macrometastases. She will receive whole-breast radiotherapy and systemic therapy. What is appropriate for the axilla?","opts":["Bilateral oophorectomy","No further axillary surgery, based on the randomized evidence in this setting","Completion axillary dissection in all patients","Mastectomy","No radiotherapy"],"a":1,"e":"The ACOSOG Z0011 trial showed that patients with one or two positive sentinel nodes treated with breast conservation, whole-breast radiotherapy and systemic therapy did not need dissection, with no survival difference.","k":"Patients with one or two positive sentinel nodes undergoing breast conservation and radiotherapy may omit axillary dissection.","t":"Axillary surgery after lumpectomy"},{"n":2,"stem":"A woman undergoes mastectomy for a 3 cm tumor with 4 positive axillary nodes. What is recommended?","opts":["No radiotherapy","Whole-brain radiotherapy","Postmastectomy radiotherapy to the chest wall and regional nodes","Radiotherapy only if she is younger than 40","Axillary radiotherapy alone"],"a":2,"e":"Postmastectomy radiotherapy lowers recurrence and improves survival in patients with four or more positive nodes, and is considered for one to three nodes or large tumors.","k":"Four or more positive nodes call for postmastectomy radiotherapy.","t":"Postmastectomy radiotherapy"},{"n":3,"stem":"A 74-year-old woman has a 1.2 cm node-negative, estrogen receptor-positive cancer removed with clear margins, and she will take endocrine therapy. What is a reasonable approach?","opts":["Chemotherapy is mandatory","Radiotherapy is mandatory","Mastectomy is mandatory","No endocrine therapy","Omit radiotherapy after discussion, with higher local recurrence accepted"],"a":4,"e":"In older women with low-risk disease on endocrine therapy, trials show small absolute benefits from radiotherapy, with no survival difference. Omission is an acceptable option.","k":"Older women with small low-risk hormone-positive cancers may omit radiotherapy if taking endocrine therapy.","t":"Omission of radiotherapy"},{"n":4,"stem":"What margin is adequate after lumpectomy for invasive breast cancer when radiotherapy is given?","opts":["2 cm of normal tissue","5 mm of normal tissue","1 cm of normal tissue","Margins are never assessed","No tumor on ink"],"a":4,"e":"The consensus guideline states that no tumor on ink is an adequate margin for invasive cancer with whole-breast radiotherapy, and wider margins do not lower recurrence.","k":"No tumor on ink is an adequate margin for invasive breast cancer.","t":"Margin definition"},{"n":5,"stem":"A 36-year-old woman has a high-risk hormone receptor-positive cancer and remains premenopausal after chemotherapy. Which strategy lowers recurrence?","opts":["Raloxifene","Observation","Ovarian function suppression added to tamoxifen or an aromatase inhibitor","Anastrozole without ovarian suppression","Tamoxifen alone"],"a":2,"e":"The SOFT and TEXT trials showed that ovarian suppression improves outcomes in higher-risk premenopausal women, particularly those under 35 and those who received chemotherapy.","k":"High-risk premenopausal women benefit from ovarian suppression with endocrine therapy.","t":"Ovarian suppression"},{"n":6,"stem":"What must accompany an aromatase inhibitor in a premenopausal woman?","opts":["Calcium alone","Ovarian function suppression, since the drug alone does not suppress ovarian estrogen","Nothing","Raloxifene","Progesterone"],"a":1,"e":"In premenopausal women, aromatase inhibition raises gonadotropins and stimulates the ovaries. An aromatase inhibitor is used only with effective ovarian suppression and estradiol monitoring.","k":"Aromatase inhibitors require ovarian suppression in premenopausal women.","t":"Aromatase inhibitor with suppression"},{"n":7,"stem":"A postmenopausal woman on letrozole has joint pain and stiffness. Which intervention has randomized support?","opts":["Methotrexate","Estrogen replacement","Stopping all treatment immediately","Acupuncture or exercise","Opioids long term"],"a":3,"e":"Aromatase inhibitor-associated musculoskeletal symptoms are common. Exercise, acupuncture and duloxetine can help, and switching agents may be tried before stopping therapy.","k":"Exercise and acupuncture help aromatase inhibitor arthralgia.","t":"Aromatase inhibitor arthralgia"},{"n":8,"stem":"A postmenopausal woman starts an aromatase inhibitor and has a T-score of minus 2.7. Which treatment should be added?","opts":["A bisphosphonate or denosumab, with calcium and vitamin D","Hormone replacement","Raloxifene alone","Thyroid hormone","No treatment"],"a":0,"e":"Aromatase inhibitors accelerate bone loss. Bone density is monitored, and antiresorptive therapy is advised for osteoporosis. Adjuvant bisphosphonates also lower bone recurrence in postmenopausal women.","k":"Aromatase inhibitor users with osteoporosis need antiresorptive therapy.","t":"Bone health"},{"n":9,"stem":"A woman receiving adjuvant trastuzumab after anthracycline chemotherapy has an ejection fraction fall from 60 to 42 percent. What is the appropriate action?","opts":["Stop all therapy permanently with no reassessment","Double the dose","Continue unchanged","Hold trastuzumab and start cardiac treatment, then repeat the assessment","Add doxorubicin"],"a":3,"e":"Trastuzumab can cause reversible cardiac dysfunction. It is held for a significant fall in ejection fraction, heart failure therapy is started, and treatment can often resume when function recovers.","k":"Hold trastuzumab for a significant fall in ejection fraction and treat cardiac dysfunction.","t":"Trastuzumab cardiac monitoring"},{"n":10,"stem":"A woman has a 0.8 cm node-negative HER2-positive invasive cancer. Which adjuvant regimen was evaluated in a single-arm trial for such small tumors?","opts":["Paclitaxel with trastuzumab","Doxorubicin with cyclophosphamide","No treatment","Lapatinib alone","Capecitabine alone"],"a":0,"e":"The APT trial showed excellent outcomes with 12 weeks of paclitaxel and trastuzumab, followed by trastuzumab to complete a year, for node-negative HER2-positive tumors up to 3 cm.","k":"Paclitaxel with trastuzumab is a regimen for small node-negative HER2-positive cancers.","t":"HER2-positive small tumor"},{"n":11,"stem":"A woman has a 3 cm HER2-positive cancer with positive axillary nodes. Which agent added to chemotherapy and trastuzumab lowers recurrence?","opts":["Lapatinib alone","Bevacizumab","Pertuzumab","Everolimus","Atezolizumab"],"a":2,"e":"In the APHINITY trial, adding pertuzumab to chemotherapy and trastuzumab reduced invasive disease events, with the greatest benefit in node-positive disease.","k":"Pertuzumab added to trastuzumab benefits node-positive HER2-positive disease.","t":"Pertuzumab"},{"n":12,"stem":"Which is a main purpose of neoadjuvant systemic therapy in HER2-positive and triple-negative breast cancer?","opts":["To prevent all recurrence","To reduce hormone receptor expression","To replace radiotherapy","To avoid all surgery","To assess response and guide additional adjuvant treatment"],"a":4,"e":"Neoadjuvant therapy can downstage tumors and shows biologic response. Pathologic complete response predicts outcome, and residual disease leads to escalation, such as trastuzumab emtansine or capecitabine.","k":"Neoadjuvant therapy tests response and directs adjuvant escalation.","t":"Neoadjuvant therapy goal"},{"n":13,"stem":"A woman with triple-negative breast cancer has residual invasive disease after neoadjuvant chemotherapy and cannot receive other adjuvant agents. Which oral drug improved survival in an Asian trial?","opts":["Lapatinib","Capecitabine","Anastrozole","Olaparib in all patients","Imatinib"],"a":1,"e":"The CREATE-X trial found that adjuvant capecitabine improved disease-free and overall survival in patients with residual disease after neoadjuvant chemotherapy, with the largest benefit in triple-negative disease.","k":"Capecitabine improves survival for triple-negative disease with residual tumor after neoadjuvant therapy.","t":"Capecitabine after residual disease"},{"n":14,"stem":"A tumor has HER2 immunohistochemistry 1 plus. How is it classified?","opts":["HER2-negative with no treatment relevance","Triple-negative by definition","Not testable","HER2-positive","HER2-low, which is not eligible for trastuzumab"],"a":4,"e":"HER2-low is defined as immunohistochemistry 1 plus or 2 plus with negative in situ hybridization. It is not treated with anti-HER2 antibody in the early-stage setting, though it has relevance in metastatic therapy.","k":"HER2-low disease is immunohistochemistry 1 plus or 2 plus without amplification.","t":"HER2-low"},{"n":15,"stem":"A tumor shows estrogen receptor expression in 5 percent of cells and negative progesterone receptor and HER2. How is it typically managed?","opts":["Observed","Treated exactly like strongly hormone receptor-positive disease only","Considered biologically similar to triple-negative disease, with endocrine therapy discussed","Ignored","Treated with trastuzumab"],"a":2,"e":"Estrogen receptor-low tumors of 1 to 10 percent behave more like triple-negative cancers. Guidelines recommend considering them under both pathways, with the benefit of endocrine therapy uncertain.","k":"ER-low disease behaves like triple-negative disease.","t":"ER-low disease"},{"n":16,"stem":"A woman has a rapidly enlarging red, edematous breast with peau d'orange skin that developed over 2 months. Which is correct?","opts":["This is inflammatory breast cancer, treated with neoadjuvant therapy, mastectomy and radiotherapy","Benign and observed","Treated with lumpectomy alone","Mastitis requiring antibiotics alone","Treated with radiotherapy alone"],"a":0,"e":"Inflammatory breast cancer is a clinical diagnosis with rapid onset, and one-third of the breast involved by erythema. Multimodality therapy includes neoadjuvant chemotherapy, modified radical mastectomy and radiation.","k":"Inflammatory breast cancer needs neoadjuvant therapy, mastectomy and radiotherapy.","t":"Inflammatory breast cancer features"},{"n":17,"stem":"A woman has an isolated chest wall recurrence 3 years after mastectomy. What is the standard approach?","opts":["Observation","Biopsy to confirm and reassess receptors, then multimodality therapy with curative intent","Palliative care only","Whole-body irradiation","Chemotherapy without biopsy"],"a":1,"e":"Isolated locoregional recurrence can be curable. Staging excludes distant disease, receptors are rechecked, and surgery, radiotherapy and systemic therapy are combined.","k":"Isolated locoregional breast cancer recurrence is treated with curative intent.","t":"Local recurrence"},{"n":18,"stem":"A postmenopausal woman has completed 5 years of tamoxifen for node-positive hormone receptor-positive cancer. What may reduce late recurrence?","opts":["Chemotherapy","Trastuzumab","Radiation","A further 5 years of an aromatase inhibitor, or extended endocrine therapy chosen by risk","No further therapy for anyone"],"a":3,"e":"Late recurrences occur in hormone-positive disease. After tamoxifen, extended therapy with an aromatase inhibitor reduces recurrence, and decisions weigh risk and toxicity.","k":"Extended endocrine therapy lowers late recurrence in selected hormone-positive patients.","t":"Extended endocrine therapy"},{"n":19,"stem":"A 43-year-old premenopausal woman has a node-negative tumor and a recurrence score of 22. What did TAILORx suggest?","opts":["Chemotherapy benefit only above a score of 35","No benefit in any case","Radiotherapy is always superior","Observation is always correct","Some benefit from chemotherapy may exist at ages 50 and younger with scores of 16 to 25"],"a":4,"e":"In TAILORx, women aged 50 or younger with scores of 16 to 25 had some chemotherapy benefit, possibly from ovarian suppression effects, so chemotherapy is discussed.","k":"Younger women with intermediate scores may benefit from chemotherapy.","t":"Genomic assay in premenopause"},{"n":20,"stem":"A woman at 18 weeks of pregnancy is diagnosed with invasive breast cancer. Which statement is correct?","opts":["Chemotherapy is safe in all trimesters","Chemotherapy can be given in the second and third trimesters, but not endocrine therapy or trastuzumab","Termination is required","Trastuzumab is preferred","Radiotherapy is the first treatment"],"a":1,"e":"Anthracycline-based chemotherapy is used after the first trimester. Endocrine therapy, trastuzumab and radiotherapy are deferred until after delivery.","k":"In pregnancy, chemotherapy is possible after the first trimester, but trastuzumab and endocrine therapy are deferred.","t":"Pregnancy-associated breast cancer"},{"n":21,"stem":"A 65-year-old man has a hormone receptor-positive invasive breast cancer. Which risk factor is most important?","opts":["Alcohol","Smoking","Diabetes alone","A BRCA2 pathogenic variant","Use of cell phones"],"a":3,"e":"BRCA2 is the most important hereditary risk factor in male breast cancer. Treatment mirrors that of women, with tamoxifen the usual endocrine agent.","k":"BRCA2 is the strongest hereditary risk factor for male breast cancer.","t":"Male breast cancer"},{"n":22,"stem":"A woman has early-stage breast cancer after lumpectomy and needs whole-breast radiotherapy. Which schedule is standard in most patients?","opts":["Hypofractionated radiotherapy over about 3 weeks","Only 7 weeks is acceptable","Single fraction","10 weeks","No schedule is established"],"a":0,"e":"Randomized trials showed hypofractionated whole-breast radiotherapy has equivalent local control and similar or better cosmesis than conventional 5 to 6 week schedules.","k":"Hypofractionated whole-breast radiotherapy is the standard schedule.","t":"Radiotherapy fractionation"},{"n":23,"stem":"A 78-year-old woman has a large strongly ER-positive, HER2-negative cancer and comorbidities that preclude chemotherapy. What option can shrink the tumor?","opts":["Neoadjuvant pembrolizumab","No therapy","Neoadjuvant aromatase inhibitor","Neoadjuvant trastuzumab","Radiotherapy alone"],"a":2,"e":"Neoadjuvant endocrine therapy, typically with an aromatase inhibitor for several months, can reduce tumor size and permit breast conservation in older patients.","k":"Neoadjuvant aromatase inhibitor therapy can downstage hormone-positive tumors in older women.","t":"Neoadjuvant endocrine"}]},{"ch":13,"title":"Metastatic Breast Cancer and Less Common Scenarios","qs":[{"n":1,"stem":"A postmenopausal woman has newly diagnosed hormone receptor-positive, HER2-negative metastatic breast cancer with bone and nodal disease and no visceral crisis. What is the standard first-line treatment?","opts":["A CDK4/6 inhibitor with an aromatase inhibitor","Weekly paclitaxel","Anthracycline-based chemotherapy","Single-agent capecitabine","Trastuzumab"],"a":0,"e":"CDK4/6 inhibitors added to endocrine therapy lengthen progression-free survival in first-line hormone receptor-positive disease, and some have shown overall survival benefit.","k":"First-line endocrine therapy combined with a CDK4/6 inhibitor is standard for hormone receptor-positive metastatic disease.","t":"First-line endocrine combination"},{"n":2,"stem":"A woman with hormone receptor-positive metastatic breast cancer has rapidly rising bilirubin, hepatic failure from liver metastases, and poor symptom control. Which approach is more appropriate than endocrine therapy?","opts":["Fulvestrant alone","Tamoxifen alone","Chemotherapy, because a rapid response is needed","Letrozole alone","Observation"],"a":2,"e":"Visceral crisis means severe organ dysfunction with rapid progression, where fast tumor control is needed. Chemotherapy is used in this situation, while endocrine therapy with a CDK4/6 inhibitor is preferred otherwise.","k":"Visceral crisis is an indication for chemotherapy over endocrine therapy.","t":"Visceral crisis"},{"n":3,"stem":"Before starting ribociclib, which assessment is required?","opts":["Audiometry","Echocardiogram only","A bone scan","A pulmonary function test","An electrocardiogram for the QT interval and liver function tests"],"a":4,"e":"Ribociclib can prolong the QT interval and cause hepatotoxicity. ECG, electrolytes and liver tests are checked at baseline and during the first cycles.","k":"Ribociclib needs QT and liver monitoring.","t":"Ribociclib monitoring"},{"n":4,"stem":"Which toxicity is most characteristic of palbociclib?","opts":["Stomatitis","Hyperglycemia","Severe diarrhea","Neutropenia","Hand-foot syndrome"],"a":3,"e":"Palbociclib commonly causes asymptomatic neutropenia. Febrile neutropenia is uncommon, and dose reductions manage counts. Diarrhea is typical of abemaciclib.","k":"Neutropenia is the main toxicity of palbociclib, and diarrhea is the main toxicity of abemaciclib.","t":"Palbociclib toxicity"},{"n":5,"stem":"A woman on abemaciclib has five loose stools daily. What is the first step?","opts":["Increase the dose","Start loperamide, ensure hydration, and reduce or hold the dose if persistent","Give no treatment","Start antibiotics for all patients","Stop all endocrine therapy forever"],"a":1,"e":"Diarrhea is the most frequent toxicity of abemaciclib, mostly early and mild to moderate. Antidiarrheals, hydration and dose adjustments are standard.","k":"Abemaciclib causes diarrhea, managed with loperamide and dose adjustment.","t":"Abemaciclib toxicity"},{"n":6,"stem":"A woman progresses on an aromatase inhibitor with a CDK4/6 inhibitor, and plasma testing finds an ESR1 mutation. Which agent is appropriate?","opts":["Exemestane alone","Imatinib","Anastrozole","Letrozole","Elacestrant or another oral selective estrogen receptor degrader"],"a":4,"e":"ESR1 mutations confer resistance to aromatase inhibitors. Oral estrogen receptor degraders such as elacestrant improved progression-free survival in patients with ESR1 mutations after prior endocrine and CDK4/6 inhibitor therapy.","k":"ESR1 mutations predict benefit from oral selective estrogen receptor degraders.","t":"ESR1 mutation"},{"n":7,"stem":"A woman with hormone receptor-positive metastatic disease and a PIK3CA mutation progresses on endocrine therapy. Which drug added to fulvestrant improved progression-free survival?","opts":["Lapatinib","Olaparib","Imatinib","Alpelisib","Bevacizumab"],"a":3,"e":"Alpelisib, a PI3K alpha inhibitor, prolongs progression-free survival with fulvestrant in PIK3CA-mutated disease. Hyperglycemia and rash are key toxicities, and glucose is monitored.","k":"Alpelisib targets PIK3CA mutations and causes hyperglycemia.","t":"PIK3CA mutation"},{"n":8,"stem":"Which biomarker pattern predicts benefit from capivasertib with fulvestrant?","opts":["BRCA1 mutation","Alterations in PIK3CA, AKT1 or PTEN","NTRK fusion","MSI-high","HER2 amplification"],"a":1,"e":"Capivasertib is an AKT inhibitor that improved progression-free survival with fulvestrant in patients with pathway alterations after endocrine therapy. Hyperglycemia, diarrhea and rash are adverse effects.","k":"Capivasertib with fulvestrant is used for PIK3CA, AKT1 or PTEN-altered disease.","t":"Capivasertib"},{"n":9,"stem":"A woman on everolimus with exemestane develops painful mouth ulcers. Which preventive measure has randomized support?","opts":["Chlorhexidine alone","Higher everolimus dose","Dexamethasone alcohol-free mouthwash","Fluoride rinse","Antifungal prophylaxis alone"],"a":2,"e":"A dexamethasone oral solution used as a mouthwash markedly lowers the incidence and severity of everolimus-associated stomatitis.","k":"Dexamethasone mouthwash prevents everolimus stomatitis.","t":"Everolimus stomatitis"},{"n":10,"stem":"A woman with HER2-negative metastatic breast cancer and a germline BRCA2 variant has received prior chemotherapy. Which treatment improved progression-free survival over chemotherapy of physician's choice?","opts":["Olaparib or talazoparib","Anastrozole","Atezolizumab","Everolimus","Tamoxifen"],"a":0,"e":"The OlympiAD and EMBRACA trials showed that PARP inhibitors improved progression-free survival over standard chemotherapy in patients with germline BRCA variants.","k":"PARP inhibitors are used for germline BRCA-associated metastatic breast cancer.","t":"Germline BRCA metastatic"},{"n":11,"stem":"A woman with metastatic triple-negative breast cancer has progressed after two prior chemotherapy regimens. Which antibody-drug conjugate improved survival?","opts":["Sacituzumab govitecan","Trastuzumab emtansine","Enfortumab vedotin","Polatuzumab vedotin","Brentuximab vedotin"],"a":0,"e":"Sacituzumab govitecan, targeting Trop-2, improved survival over chemotherapy in the ASCENT trial. Neutropenia and diarrhea are the main toxicities.","k":"Sacituzumab govitecan improves survival in previously treated triple-negative disease.","t":"Sacituzumab"},{"n":12,"stem":"Which PD-L1 result is used to select patients with metastatic triple-negative breast cancer for pembrolizumab with chemotherapy?","opts":["PD-L1 is not used","Any staining","Combined positive score of 1 using any assay","Tumor proportion score of 50 percent","Combined positive score of 10 or more using the 22C3 assay"],"a":4,"e":"KEYNOTE-355 found an overall survival benefit at a combined positive score of 10 or more, and not at 1 or more.","k":"A combined positive score of 10 or more selects patients for pembrolizumab in metastatic triple-negative disease.","t":"PD-L1 score"},{"n":13,"stem":"A woman with newly diagnosed HER2-positive metastatic breast cancer needs first-line therapy. Which regimen has long established survival benefit?","opts":["Capecitabine alone","Lapatinib alone","Trastuzumab, pertuzumab, and a taxane","Bevacizumab","Trastuzumab alone"],"a":2,"e":"The CLEOPATRA trial showed a survival benefit with dual HER2 blockade added to a taxane. Newer data support trastuzumab deruxtecan in the first line.","k":"Dual HER2 blockade with a taxane is a first-line regimen for HER2-positive metastatic disease.","t":"HER2-positive first line"},{"n":14,"stem":"A woman with HER2-positive metastatic breast cancer has progressive brain metastases after trastuzumab, pertuzumab and trastuzumab emtansine. Which regimen improved survival including with brain disease?","opts":["Anastrozole","Tucatinib with trastuzumab and capecitabine","Eribulin","Olaparib","Atezolizumab"],"a":1,"e":"The HER2CLIMB trial included patients with brain metastases, and tucatinib with trastuzumab and capecitabine improved progression-free and overall survival.","k":"Tucatinib with trastuzumab and capecitabine is active in HER2-positive brain metastases.","t":"HER2 brain metastases"},{"n":15,"stem":"A woman on trastuzumab deruxtecan develops a dry cough and low-grade fever. What is the most important consideration?","opts":["Continue and observe for 4 weeks","Add trastuzumab emtansine","This is expected and requires no action","Interstitial lung disease requires prompt imaging, and the drug is held if confirmed","Increase the dose"],"a":3,"e":"Interstitial lung disease occurs in about 10 to 12 percent of patients and can be fatal. New respiratory symptoms prompt CT and holding of the drug, with steroids if confirmed.","k":"New cough on trastuzumab deruxtecan requires evaluation for interstitial lung disease.","t":"Trastuzumab deruxtecan monitoring"},{"n":16,"stem":"A woman with metastatic breast cancer has three small asymptomatic brain metastases and controlled systemic disease. Which local therapy is preferred over whole-brain radiotherapy?","opts":["Whole-brain radiotherapy alone","Stereotactic radiosurgery","No treatment","Intrathecal therapy","Craniotomy for each lesion"],"a":1,"e":"Stereotactic radiosurgery controls limited brain metastases and spares cognition compared with whole-brain radiotherapy, and is preferred for a small number of lesions.","k":"Stereotactic radiosurgery is preferred for limited brain metastases.","t":"Brain metastases local therapy"},{"n":17,"stem":"A woman with bone-dominant metastatic breast cancer is asked about bone-modifying therapy. Which regimen reduces skeletal events?","opts":["Calcium alone","Oral prednisone","Vitamin D alone","Radium-223","Denosumab or zoledronic acid every 12 weeks or monthly"],"a":4,"e":"Bone-modifying agents lower skeletal-related events in bone metastases. Dosing every 12 weeks after initial monthly therapy is noninferior for zoledronic acid.","k":"Bone-modifying agents lower skeletal events in metastatic breast cancer.","t":"Bone-modifying agents"},{"n":18,"stem":"A woman who had an estrogen receptor-positive primary now has a new liver lesion. What is the next step?","opts":["Assume the receptors are unchanged","Treat as triple-negative without testing","Biopsy the lesion and repeat receptor testing","Start chemotherapy empirically","Observe"],"a":2,"e":"Receptor status can change between primary and metastasis. Biopsy confirms the diagnosis and updates hormone and HER2 status, and may change treatment.","k":"Biopsy a metastatic recurrence to confirm receptors.","t":"Biopsy of recurrence"},{"n":19,"stem":"A woman with metastatic breast cancer has headaches, cranial nerve palsies and radicular pain. MRI shows linear leptomeningeal enhancement. Which is correct?","opts":["Benign meningitis","Treatable with antibiotics alone","A complication of radiotherapy","Leptomeningeal metastasis, confirmed by cerebrospinal fluid cytology, with poor prognosis","A common finding with no prognostic effect"],"a":3,"e":"Leptomeningeal metastasis is a serious complication of breast cancer. CSF cytology and MRI confirm it, and treatment may include radiotherapy and intrathecal or systemic agents.","k":"Leptomeningeal metastasis causes multifocal neurologic signs and a poor prognosis.","t":"Leptomeningeal disease"},{"n":20,"stem":"A woman with metastatic breast cancer has recurrent pericardial effusion with tamponade physiology. What is the first step?","opts":["Urgent pericardiocentesis","Diuretics only","Pericardiectomy at once for all","Observation","Start chemotherapy only"],"a":0,"e":"Tamponade is life-threatening and needs urgent drainage. Systemic therapy and a pericardial window or sclerosis are considered afterward for recurrence.","k":"Cardiac tamponade requires urgent pericardiocentesis.","t":"Malignant effusion"},{"n":21,"stem":"A woman with heavily pretreated metastatic breast cancer receives eribulin. Which toxicity is notable?","opts":["Neutropenia and peripheral neuropathy","Hemorrhagic cystitis","Pulmonary fibrosis","Hand-foot syndrome","Ototoxicity"],"a":0,"e":"Eribulin is a microtubule inhibitor that causes neutropenia and neuropathy. It improved overall survival in heavily pretreated patients in one trial.","k":"Eribulin causes neutropenia and peripheral neuropathy.","t":"Eribulin"}]},{"ch":14,"title":"Breast Genetics and Treatment Complications","qs":[{"n":1,"stem":"A 38-year-old woman has newly diagnosed triple-negative breast cancer and no family history. Which statement about germline testing is correct?","opts":["Testing is indicated only after age 60","Testing is not indicated without family history","She should be offered germline testing, since the result affects surgery and systemic therapy","Testing should wait for recurrence","Testing is indicated only for hormone receptor-positive disease"],"a":2,"e":"Guidelines recommend testing for young patients and those with triple-negative disease, because the result informs surgical choice, adjuvant olaparib, and relatives' care.","k":"Young patients with triple-negative breast cancer should be offered germline testing.","t":"Testing criteria"},{"n":2,"stem":"Which patient is a candidate for adjuvant olaparib?","opts":["A patient with ductal carcinoma in situ","A patient with a germline BRCA variant and high-risk HER2-negative disease","A patient with a somatic ESR1 mutation","A patient with HER2-positive disease","A patient with BRCA wild-type tumor"],"a":1,"e":"The OlympiA trial enrolled patients with germline BRCA1 or BRCA2 pathogenic variants and high-risk HER2-negative disease after local and systemic therapy.","k":"Adjuvant olaparib is for germline BRCA carriers with high-risk HER2-negative disease.","t":"Adjuvant olaparib eligibility"},{"n":3,"stem":"A woman has a CHEK2 c.1100delC pathogenic variant and is 45 years old. Which approach to screening is typical?","opts":["No screening","Prophylactic mastectomy now","Screening only after age 70","Annual mammography and consideration of breast MRI","Ovarian screening with CA-125"],"a":3,"e":"CHEK2 confers moderate risk of breast cancer. Screening includes annual mammography and often MRI, and mastectomy is not routinely recommended without strong family history.","k":"CHEK2 carriers need enhanced breast screening, not routine prophylactic surgery.","t":"CHEK2 carrier"},{"n":4,"stem":"A woman with a CDH1 pathogenic variant and a family history of diffuse gastric cancer seeks advice. Which cancers are associated?","opts":["Ovarian cancer only","Thyroid cancer and renal cancer","Pancreatic cancer and melanoma","Colon cancer and endometrial cancer","Diffuse gastric cancer and lobular breast cancer"],"a":4,"e":"CDH1 variants cause hereditary diffuse gastric cancer and increase risk of lobular breast cancer. Prophylactic gastrectomy is discussed, and breast MRI is advised.","k":"CDH1 variants cause diffuse gastric and lobular breast cancer.","t":"CDH1 carrier"},{"n":5,"stem":"A woman with macrocephaly, trichilemmomas, and a PTEN pathogenic variant is evaluated. Which condition is this?","opts":["PTEN hamartoma tumor syndrome, including Cowden syndrome","Peutz-Jeghers syndrome","Lynch syndrome","Li-Fraumeni syndrome","Familial adenomatous polyposis"],"a":0,"e":"PTEN variants increase risk of breast, thyroid and endometrial cancers. Surveillance includes breast imaging, thyroid ultrasound and attention to endometrial symptoms.","k":"PTEN variants cause Cowden syndrome with breast, thyroid and endometrial cancer risk.","t":"PTEN carrier"},{"n":6,"stem":"A woman with mucocutaneous pigmentation, small bowel intussusception, and a STK11 pathogenic variant is at increased risk of which cancer?","opts":["Leukemia only","Prostate cancer only","Breast, gastrointestinal and pancreatic cancers","Lymphoma only","Melanoma only"],"a":2,"e":"STK11 variants cause Peutz-Jeghers syndrome with hamartomatous polyps and raised risks of breast, colorectal, pancreatic and gynecologic cancers.","k":"STK11 variants raise breast and gastrointestinal cancer risks.","t":"Peutz-Jeghers syndrome"},{"n":7,"stem":"A woman's panel shows a variant of uncertain significance in BRCA2. What should management be based on?","opts":["Testing every relative","Immediate oophorectomy","Immediate bilateral mastectomy","Personal and family history, not the variant","The variant as if it were pathogenic"],"a":3,"e":"Variants of uncertain significance are not used to guide risk-reducing surgery. Reclassification occurs over time, and relatives are not tested for it.","k":"Manage a variant of uncertain significance by history, not by the variant.","t":"Variant of uncertain significance"},{"n":8,"stem":"After a BRCA1 variant is found in a patient, which approach identifies relatives at risk?","opts":["No testing","Targeted testing of relatives for the familial variant","Whole-genome sequencing of all relatives","Tumor markers for relatives","Testing of unrelated persons"],"a":1,"e":"Cascade testing offers relatives a test for the known familial variant, which is cheaper and unambiguous. Carriers enter risk-reducing programs, and non-carriers return to average-risk care.","k":"Cascade testing checks relatives for the known familial variant.","t":"Cascade testing"},{"n":9,"stem":"A BRCA carrier is treated for hormone receptor-positive breast cancer. What does tamoxifen also lower?","opts":["Ovarian cancer only","Pancreatic cancer","Colon cancer","Melanoma","The risk of contralateral breast cancer"],"a":4,"e":"Tamoxifen reduces the risk of contralateral breast cancer in carriers, though evidence is stronger for BRCA2, and it should be weighed against risk-reducing surgery.","k":"Tamoxifen lowers contralateral breast cancer risk in carriers.","t":"Tamoxifen in carriers"},{"n":10,"stem":"A BRCA2 carrier with early-stage cancer asks whether contralateral mastectomy improves survival. What is the best answer?","opts":["It always improves survival","It lowers contralateral cancer risk, with survival benefit depending mainly on the stage of the index cancer","It must be done within 3 days","It replaces systemic therapy","It never has any effect"],"a":1,"e":"Contralateral mastectomy reduces contralateral cancer risk, but prognosis is determined largely by the index tumor. Timing is flexible, and the decision is individual.","k":"Contralateral mastectomy lowers new cancer risk, but survival depends on the index tumor.","t":"Contralateral mastectomy"},{"n":11,"stem":"A BRCA2 carrier has a first-degree relative with pancreatic cancer. What is recommended?","opts":["Annual CA 19-9 only","Routine abdominal ultrasound","Consider pancreatic surveillance with MRI or endoscopic ultrasound at a specialized center","Annual chest radiograph","No surveillance ever"],"a":2,"e":"Carriers of BRCA1, BRCA2 or PALB2 variants with a family history of pancreatic cancer may undergo surveillance, usually starting at age 50 or 10 years before the youngest case.","k":"Pancreatic surveillance is considered for carriers with a family history.","t":"Pancreatic surveillance"},{"n":12,"stem":"A 42-year-old man has a BRCA2 pathogenic variant. Which screening is recommended?","opts":["Screening from age 70","Colonoscopy only","Bone scan yearly","Annual prostate-specific antigen testing starting at age 40","No screening"],"a":3,"e":"BRCA2 raises prostate cancer risk and aggressive disease. Guidelines recommend considering PSA screening from age 40, with annual testing.","k":"BRCA2 carriers should consider annual PSA screening from age 40.","t":"Prostate screening BRCA2"},{"n":13,"stem":"Which set of cancers is characteristic of Li-Fraumeni syndrome?","opts":["Colorectal and endometrial cancer","Thyroid and parathyroid tumors","Renal cell carcinoma and pheochromocytoma","Melanoma and pancreatic cancer","Sarcoma, breast cancer, brain tumors, and adrenocortical carcinoma"],"a":4,"e":"TP53 pathogenic variants cause early-onset sarcomas, breast cancers, brain tumors and adrenocortical carcinoma, among others. Whole-body MRI surveillance is recommended.","k":"Li-Fraumeni syndrome includes sarcoma, breast, brain, and adrenocortical cancers.","t":"Li-Fraumeni cancers"},{"n":14,"stem":"A patient worries that genetic testing may affect her health insurance. Which US law offers protection?","opts":["The Genetic Information Nondiscrimination Act, which covers health insurance and employment","No law protects her","The Affordable Care Act covers life insurance","HIPAA covers life insurance discrimination","The Americans with Disabilities Act covers all insurance types"],"a":0,"e":"GINA prohibits discrimination in health insurance and employment based on genetic information. It does not cover life, disability or long-term care insurance.","k":"GINA protects against genetic discrimination in health insurance and employment but not life insurance.","t":"Genetic discrimination"},{"n":15,"stem":"A woman on pembrolizumab for triple-negative breast cancer develops polyuria, nausea, and glucose of 480 mg/dL with ketones. What is the diagnosis?","opts":["Type 2 diabetes","Hypothyroidism","Hypophysitis","Immune-related diabetes with ketoacidosis requiring insulin","Steroid effect"],"a":3,"e":"Checkpoint inhibitors can cause abrupt autoimmune insulin-deficient diabetes, which presents with diabetic ketoacidosis. Insulin is lifelong, and immunotherapy can often continue.","k":"Immunotherapy can cause insulin-deficient diabetes with ketoacidosis.","t":"Immune endocrine toxicity"},{"n":16,"stem":"A woman on immunotherapy has symmetric small joint swelling and morning stiffness for an hour. What is the approach for grade 2 disease?","opts":["Stop all therapy permanently in all cases","Ignore","Perform arthroplasty","Give methotrexate immediately","Consider holding the drug, treat with NSAIDs or low-dose steroids, and refer to rheumatology"],"a":4,"e":"Immune-related inflammatory arthritis is treated by severity. Low-dose prednisone is used, and refractory disease may need disease-modifying drugs with rheumatology input.","k":"Immune-related arthritis is treated with steroids and rheumatology input.","t":"Immune arthritis"},{"n":17,"stem":"A patient on immunotherapy develops ascending weakness and absent reflexes over 5 days. What is the first step?","opts":["Hold immunotherapy and evaluate for Guillain-Barre syndrome, with intravenous immunoglobulin or plasma exchange","Stop all movement","Continue and observe","Start gabapentin","Give antibiotics alone"],"a":0,"e":"Immune checkpoint inhibitors can cause Guillain-Barre-like syndromes, and myasthenia gravis and encephalitis. Early recognition, holding the drug, and immunotherapy for the neuropathy are needed.","k":"Rapid ascending weakness on immunotherapy suggests Guillain-Barre syndrome.","t":"Neurologic immune toxicity"},{"n":18,"stem":"A 31-year-old woman is about to start chemotherapy for breast cancer and wants a future pregnancy. Which option should be discussed before starting?","opts":["Tubal ligation","Only adoption","Referral for fertility preservation such as oocyte or embryo cryopreservation","Hormone replacement","No discussion until after chemotherapy"],"a":2,"e":"Chemotherapy can cause premature ovarian insufficiency. Referral before treatment allows cryopreservation, and GnRH agonists during chemotherapy may lower the risk of ovarian failure.","k":"Discuss fertility preservation before chemotherapy begins.","t":"Fertility preservation"},{"n":19,"stem":"A woman receiving a taxane for breast cancer is concerned about hair loss. Which measure can reduce alopecia?","opts":["No measure works","Scalp cooling","Biotin supplements","Shampoo changes","Minoxidil during treatment"],"a":1,"e":"Scalp cooling reduces chemotherapy-induced alopecia in solid tumors and is effective with taxane regimens. Efficacy is lower with anthracycline regimens.","k":"Scalp cooling reduces chemotherapy-induced hair loss.","t":"Scalp cooling"},{"n":20,"stem":"A woman on capecitabine has painful redness and peeling of her palms and soles. What is the appropriate step?","opts":["Add cisplatin","Ignore","Increase the dose","Hold or reduce the dose until grade 1 and use emollients","Cool the hands with ice permanently"],"a":3,"e":"Hand-foot syndrome is a dose-limiting effect of capecitabine. Dose interruption and reduction, along with emollients and urea cream, are used.","k":"Capecitabine hand-foot syndrome needs dose interruption and reduction.","t":"Hand-foot syndrome"},{"n":21,"stem":"Which agent reduces anthracycline cardiomyopathy risk in patients with high cumulative doses?","opts":["Dexrazoxane","Mesna","Amifostine","Leucovorin","Allopurinol"],"a":0,"e":"Dexrazoxane is a cardioprotectant used with high cumulative doxorubicin exposure. Liposomal formulations and limited dosing are other strategies.","k":"Dexrazoxane reduces anthracycline-related cardiomyopathy.","t":"Dexrazoxane"}]},{"ch":15,"title":"Prostate Cancer","qs":[{"n":1,"stem":"A 60-year-old healthy Black man asks about prostate cancer screening. Which statement reflects current guidance?","opts":["Screening is prohibited","Screening has no effect on cancer detection","Shared decision-making is advised, and he may be at higher risk and benefit from discussion","Digital rectal examination alone is superior","PSA screening is mandatory annually after age 40 for all men"],"a":2,"e":"Guidelines recommend an informed discussion of benefits and harms at ages 55 to 69, with attention to higher-risk groups such as Black men and those with family history, because overdiagnosis is a concern.","k":"Prostate cancer screening decisions are shared, with higher-risk men considered for earlier discussion.","t":"PSA screening"},{"n":2,"stem":"A man has an elevated PSA and no prior biopsy. Which step lowers detection of insignificant cancer while improving detection of significant cancer?","opts":["PSMA therapy","Multiparametric MRI with targeted biopsy","Bone scan","Observation","Systematic biopsy alone"],"a":1,"e":"MRI-guided targeted biopsy, with or without systematic cores, detects more clinically significant cancers and fewer insignificant ones than systematic biopsy alone.","k":"Multiparametric MRI before biopsy improves detection of significant prostate cancer.","t":"MRI before biopsy"},{"n":3,"stem":"A 65-year-old man has Gleason 3+3 (grade group 1) cancer in 2 of 12 cores, PSA 5.2, and a normal examination. What is the preferred management?","opts":["Androgen deprivation therapy","Radical prostatectomy","Radium-223","Docetaxel","Active surveillance"],"a":4,"e":"Low-risk disease with grade group 1 has a very low risk of metastasis, and active surveillance with PSA, MRI and repeat biopsy avoids overtreatment while keeping curative options.","k":"Low-risk grade group 1 prostate cancer is managed by active surveillance.","t":"Active surveillance"},{"n":4,"stem":"A biopsy shows Gleason score 4+3=7. What is the ISUP grade group?","opts":["Grade group 4","Grade group 3","Grade group 5","Grade group 2","Grade group 1"],"a":1,"e":"Gleason 3+4 is grade group 2 and 4+3 is grade group 3, because the predominant pattern carries prognostic weight.","k":"Gleason 4+3 is grade group 3.","t":"Grade group"},{"n":5,"stem":"A 68-year-old man has cT3a, Gleason 9, PSA 28, and no metastases on PSMA PET. Which approach has randomized support for survival?","opts":["Observation","Active surveillance","Radiotherapy alone","Radiotherapy with long-term androgen deprivation therapy","Androgen deprivation alone for 3 months"],"a":3,"e":"Adding long-term androgen deprivation, typically 18 to 36 months, to radiotherapy improves survival in high-risk localized disease.","k":"High-risk localized prostate cancer is treated with radiotherapy plus long-term androgen deprivation.","t":"High-risk localized"},{"n":6,"stem":"After radical prostatectomy for pT3a disease, a man's PSA is undetectable and then rises to 0.2 ng/mL on two measurements. What is the best next step?","opts":["Radium-223","Orchiectomy","Early salvage radiotherapy to the prostate bed, with consideration of androgen deprivation","Observation until PSA 20","Docetaxel"],"a":2,"e":"Early salvage radiotherapy at a low PSA gives better control than delayed treatment. Restaging with PSMA PET can guide the field.","k":"Salvage radiotherapy is most effective at a low PSA after prostatectomy.","t":"Salvage radiotherapy"},{"n":7,"stem":"After radiotherapy, which PSA rise defines biochemical failure under the Phoenix criteria?","opts":["A rise of 2 ng/mL or more above the nadir","Any rise","A rise of 0.2 ng/mL","A PSA above 4","A rise of 10 percent"],"a":0,"e":"The Phoenix definition of biochemical failure after radiotherapy is the nadir plus 2 ng/mL. A benign PSA bounce can occur within the first years.","k":"Biochemical failure after radiotherapy is the nadir plus 2 ng/mL.","t":"Phoenix definition"},{"n":8,"stem":"A man with metastatic prostate cancer and spinal metastases starts a GnRH agonist. Which measure prevents symptom flare?","opts":["Zoledronic acid alone","Radium-223","Higher agonist dose","Docetaxel","A short course of an oral antiandrogen before and during the first weeks"],"a":4,"e":"A GnRH agonist causes an initial surge of testosterone, which can worsen bone pain or cord compression. An antiandrogen blocks the receptor during this period, and a GnRH antagonist avoids the surge.","k":"Cover GnRH agonist initiation with an antiandrogen when flare would be dangerous.","t":"GnRH flare"},{"n":9,"stem":"Which agent is an oral GnRH receptor antagonist for androgen deprivation?","opts":["Goserelin","Leuprolide","Relugolix","Darolutamide","Abiraterone"],"a":2,"e":"Relugolix is an oral GnRH antagonist that lowers testosterone rapidly without a flare. In the HERO trial it was associated with fewer major cardiovascular events than leuprolide.","k":"Relugolix is an oral GnRH antagonist that avoids testosterone flare.","t":"Relugolix"},{"n":10,"stem":"A man on abiraterone develops hypertension, hypokalemia and edema. Which mechanism and treatment are correct?","opts":["Primary aldosteronism requiring surgery","Adrenal failure, treated with fludrocortisone alone","Hypothyroidism","Mineralocorticoid excess, managed by prednisone and correction of potassium","Renal artery stenosis"],"a":3,"e":"Abiraterone blocks CYP17 and raises mineralocorticoids upstream. Concurrent prednisone prevents adrenal insufficiency and compensates for the mineralocorticoid excess.","k":"Abiraterone causes mineralocorticoid excess, so it is given with prednisone.","t":"Abiraterone toxicity"},{"n":11,"stem":"Which adverse effect is notable with enzalutamide?","opts":["Fatigue, falls, and rarely seizures","Hemorrhagic cystitis","Pulmonary fibrosis","Ototoxicity","Mineralocorticoid excess"],"a":0,"e":"Enzalutamide can cause fatigue, hypertension, cognitive effects and, rarely, seizures. It requires no prednisone.","k":"Enzalutamide is associated with fatigue, falls and rarely seizures.","t":"Enzalutamide toxicity"},{"n":12,"stem":"A man with newly diagnosed low-volume metastatic hormone-sensitive prostate cancer receives systemic therapy. What additional local treatment improved survival in this group in a randomized trial?","opts":["Whole-brain radiotherapy","Radical cystectomy","Radium-223","Orchiectomy alone","Radiotherapy to the prostate"],"a":4,"e":"The STAMPEDE trial showed improved survival with prostate radiotherapy in men with low metastatic burden, and not in those with high burden.","k":"Prostate radiotherapy improves survival in low-volume metastatic hormone-sensitive disease.","t":"Low-volume metastatic"},{"n":13,"stem":"A fit man has newly diagnosed high-volume metastatic hormone-sensitive prostate cancer. Which regimen improved survival over androgen deprivation alone?","opts":["Androgen deprivation alone","Docetaxel or an androgen receptor pathway inhibitor added to androgen deprivation","Ketoconazole","Estrogen patches","Observation"],"a":1,"e":"Docetaxel, abiraterone, enzalutamide, apalutamide and darolutamide all improved survival when added to androgen deprivation, and combinations of three agents have shown further benefit.","k":"Intensification beyond androgen deprivation improves survival in metastatic hormone-sensitive disease.","t":"Docetaxel in hormone-sensitive"},{"n":14,"stem":"What serum testosterone level is accepted as castrate in androgen deprivation therapy?","opts":["Below 500 ng/dL","Below 50 ng/dL","Below 200 ng/dL","Any decrease","Below 300 ng/dL"],"a":1,"e":"Castration is defined as a testosterone below 50 ng/dL, and many aim for below 20 ng/dL. Castration-resistant disease is defined by progression at this level.","k":"Castrate testosterone is below 50 ng/dL.","t":"Castration level"},{"n":15,"stem":"A man with metastatic castration-resistant prostate cancer has a BRCA2 mutation and progressed on an androgen receptor inhibitor. Which drug has survival benefit in this setting?","opts":["Imatinib","Sipuleucel-T","Sunitinib","Olaparib","Vemurafenib"],"a":3,"e":"In the PROfound trial, olaparib improved radiographic progression-free survival and overall survival over a second androgen receptor inhibitor in men with BRCA1, BRCA2 or ATM alterations.","k":"Olaparib is used for BRCA-altered metastatic castration-resistant prostate cancer after androgen receptor inhibition.","t":"PARP inhibitor selection"},{"n":16,"stem":"A man with metastatic castration-resistant prostate cancer progressed on docetaxel and an androgen receptor inhibitor. Which taxane is next?","opts":["Vincristine","Paclitaxel","Cabazitaxel","Eribulin","Gemcitabine"],"a":2,"e":"Cabazitaxel improved survival after docetaxel in prior trials and over a second androgen receptor inhibitor in the CARD trial. Neutropenia is the main toxicity, and growth factor support is considered.","k":"Cabazitaxel is the taxane after docetaxel in castration-resistant prostate cancer.","t":"Cabazitaxel"},{"n":17,"stem":"A man with castration-resistant prostate cancer has painful bone metastases without visceral disease. Which agent improved survival in this group?","opts":["Radium-223","Sipuleucel-T","Pembrolizumab in all patients","Imatinib","Lutetium PSMA in all patients"],"a":0,"e":"Radium-223 is an alpha emitter that improved survival in symptomatic bone-only castration-resistant prostate cancer. It is not combined with abiraterone and prednisone because of increased fractures.","k":"Radium-223 treats symptomatic bone-only castration-resistant disease.","t":"Radium-223"},{"n":18,"stem":"A man with asymptomatic metastatic castration-resistant prostate cancer wishes to consider autologous cellular immunotherapy. Which agent applies?","opts":["Brentuximab","Atezolizumab","Nivolumab","Pembrolizumab","Sipuleucel-T"],"a":4,"e":"Sipuleucel-T is an autologous cellular immunotherapy that prolonged survival in asymptomatic or minimally symptomatic disease, without PSA declines.","k":"Sipuleucel-T is used in asymptomatic metastatic castration-resistant prostate cancer.","t":"Sipuleucel-T"},{"n":19,"stem":"A man with metastatic castration-resistant prostate cancer has a tumor with high microsatellite instability. Which therapy is approved?","opts":["Docetaxel only","Pembrolizumab","Radium-223","Olaparib only","Sipuleucel-T"],"a":1,"e":"Pembrolizumab is approved for any unresectable or metastatic solid tumor with high microsatellite instability or mismatch repair deficiency.","k":"Pembrolizumab is approved for MSI-high tumors including prostate cancer.","t":"MSI-high prostate"},{"n":20,"stem":"A 70-year-old man with diabetes and prior myocardial infarction begins androgen deprivation therapy. What is recommended?","opts":["Cardiovascular risk assessment and management, including glucose and lipid monitoring","No monitoring","Starting testosterone","Stopping all therapy","Daily NSAIDs"],"a":0,"e":"Androgen deprivation raises risk of metabolic syndrome, diabetes and cardiovascular events. Monitoring and risk-factor management are part of care.","k":"Androgen deprivation therapy requires metabolic and cardiovascular risk management.","t":"Cardiovascular risk of ADT"},{"n":21,"stem":"A man starting bicalutamide wants to prevent breast tenderness and gynecomastia. Which option has evidence?","opts":["Vitamin E","Aspirin","No intervention exists","Calcium","Prophylactic breast radiotherapy or tamoxifen"],"a":4,"e":"Low-dose breast radiotherapy or tamoxifen prevents gynecomastia from antiandrogen therapy, and tamoxifen has evidence for treatment of established breast pain.","k":"Gynecomastia from antiandrogens is prevented by breast radiotherapy or tamoxifen.","t":"Gynecomastia prevention"}]},{"ch":16,"title":"Germ Cell Tumors and Adrenal Tumors","qs":[{"n":1,"stem":"A 28-year-old man has a testicular mass with a serum alpha-fetoprotein of 900 ng/mL and normal hCG. Which statement about histology is correct?","opts":["The tumor is benign","The tumor is a Leydig cell tumor","The tumor is lymphoma","The tumor contains nonseminomatous elements, because pure seminoma does not raise alpha-fetoprotein","The tumor is a pure seminoma"],"a":3,"e":"An elevated alpha-fetoprotein indicates nonseminomatous germ cell elements, as pure seminoma does not secrete it. Human chorionic gonadotropin may be mildly raised in seminoma.","k":"A raised alpha-fetoprotein means nonseminomatous elements are present.","t":"Tumor markers"},{"n":2,"stem":"After orchiectomy for a nonseminoma, what are the half-lives of AFP and hCG used to judge whether marker decline is appropriate?","opts":["About 1 week for hCG","About 3 months for AFP","About 5 to 7 days for AFP and 24 to 36 hours for hCG","About 1 hour for both","About 30 days for both"],"a":2,"e":"Markers should fall according to their half-lives after surgery. A slower decline suggests persistent disease.","k":"AFP half-life is about 5 to 7 days, and hCG half-life is about 1 to 2 days.","t":"Marker half-life"},{"n":3,"stem":"Before chemotherapy for testicular cancer, which step should be offered?","opts":["No discussion is necessary","Radiotherapy","Sperm banking","Scrotal cooling","Testosterone injections"],"a":2,"e":"Chemotherapy and retroperitoneal surgery can impair fertility. Sperm cryopreservation before treatment is standard, ideally after orchiectomy and before chemotherapy.","k":"Offer sperm banking before cisplatin chemotherapy.","t":"Fertility preservation"},{"n":4,"stem":"A 34-year-old man has stage I seminoma after orchiectomy with normal markers. Which options are acceptable?","opts":["Surveillance, single-dose carboplatin, or radiotherapy","Four cycles of BEP only","RPLND only","High-dose chemotherapy","Mitotane"],"a":0,"e":"Stage I seminoma has an excellent prognosis. Surveillance is preferred in many centers, and adjuvant carboplatin or radiotherapy lowers relapse risk.","k":"Stage I seminoma can be managed by surveillance, carboplatin, or radiotherapy.","t":"Stage I seminoma"},{"n":5,"stem":"A man has stage I nonseminoma with lymphovascular invasion. Which strategy lowers relapse risk?","opts":["High-dose chemotherapy","One cycle of BEP or RPLND, or surveillance with counseling","Radiotherapy to the abdomen","Imatinib","Mitotane"],"a":1,"e":"Lymphovascular invasion raises relapse risk to about half in nonseminoma. Adjuvant BEP for one or two cycles or nerve-sparing RPLND are options, and surveillance is acceptable.","k":"Lymphovascular invasion raises relapse risk in stage I nonseminoma and favors adjuvant therapy.","t":"Stage I nonseminoma"},{"n":6,"stem":"A man has metastatic nonseminoma with good-prognosis features. Which regimens are standard?","opts":["Single-agent carboplatin","Observation","Two cycles of CHOP","Three cycles of BEP or four cycles of EP","ABVD"],"a":3,"e":"Three cycles of bleomycin, etoposide and cisplatin or four of etoposide and cisplatin cure most patients with good-prognosis disease. EP avoids bleomycin when lung risk is high.","k":"Good-prognosis germ cell tumors receive BEP for 3 cycles or EP for 4.","t":"Good-prognosis metastatic"},{"n":7,"stem":"A man who received bleomycin needs general anesthesia for surgery. Which precaution lowers the risk of pulmonary toxicity?","opts":["Avoid all anesthesia","Give steroids prophylactically","Give bleomycin again","Use 100 percent oxygen","Use the lowest inspired oxygen concentration that maintains saturation"],"a":4,"e":"High inspired oxygen concentrations can precipitate bleomycin lung injury even years later. Anesthesia teams should be told.","k":"Avoid high inspired oxygen after bleomycin exposure.","t":"Bleomycin and oxygen"},{"n":8,"stem":"A man has a primary mediastinal nonseminoma with elevated markers and lung and liver metastases. Which statement is correct?","opts":["This needs no chemotherapy","This is benign","This is poor-prognosis disease, treated with four cycles of BEP in a high-volume center","This is treated with radiotherapy alone","This is good prognosis"],"a":2,"e":"Primary mediastinal nonseminoma is classified as poor prognosis, and nonpulmonary visceral metastases also define it. Treatment is BEP for four cycles with referral to experienced centers.","k":"Mediastinal primary nonseminoma is poor prognosis.","t":"Poor-prognosis"},{"n":9,"stem":"After chemotherapy for metastatic nonseminoma, markers have normalized and a 4 cm retroperitoneal mass remains. What is recommended?","opts":["Further BEP","Surgical resection of the residual mass","Radiotherapy","Observation only","Biopsy only"],"a":1,"e":"Residual masses over 1 cm after chemotherapy for nonseminoma can contain teratoma or viable cancer, so resection is advised. In seminoma, PET is used for masses over 3 cm.","k":"Resect residual masses after chemotherapy for nonseminoma.","t":"Residual mass"},{"n":10,"stem":"After chemotherapy for metastatic seminoma, a 5 cm residual mass persists with normal markers. What guides management?","opts":["Immediate surgery","Orchiectomy","Repeat chemotherapy","PET after at least 6 weeks, since fibrosis is common","Radiotherapy to the whole abdomen immediately"],"a":3,"e":"Residual seminoma masses are usually fibrosis, and surgery is difficult. PET can identify viable tumor, and a negative PET allows observation.","k":"Use PET to evaluate residual seminoma masses after chemotherapy.","t":"Seminoma residual mass"},{"n":11,"stem":"A man with nonseminoma has normal markers and enlarging masses during chemotherapy. What diagnosis fits?","opts":["Metastatic seminoma","Progression requiring salvage chemotherapy","Lymphoma","Pseudoprogression","Growing teratoma syndrome, treated by surgery"],"a":4,"e":"Growing teratoma syndrome occurs when chemosensitive elements are eliminated and benign teratoma enlarges. It is resistant to chemotherapy, and complete resection is the treatment.","k":"Growing teratoma syndrome requires surgical resection, not more chemotherapy.","t":"Growing teratoma"},{"n":12,"stem":"A man relapses 8 months after first-line BEP for nonseminoma. Which approach offers curative potential?","opts":["Salvage chemotherapy with TIP, or high-dose chemotherapy with stem cell rescue","Radiotherapy alone","Hormone therapy","Mitotane","Observation"],"a":0,"e":"A substantial fraction of relapsed patients are cured with salvage regimens such as paclitaxel, ifosfamide and cisplatin, or with high-dose carboplatin and etoposide with autologous stem cell support.","k":"Relapsed germ cell tumors remain curable with salvage chemotherapy.","t":"Relapsed germ cell"},{"n":13,"stem":"Which measure lowers cisplatin nephrotoxicity?","opts":["Vigorous hydration and magnesium repletion","Vancomycin","Contrast agents","NSAIDs","Fluid restriction"],"a":0,"e":"Hydration with saline and magnesium supplementation prevents renal injury. Nephrotoxic drugs are avoided.","k":"Hydrate vigorously and replace magnesium with cisplatin.","t":"Cisplatin nephrotoxicity"},{"n":14,"stem":"Which is a recognized long-term effect after cisplatin-based chemotherapy for testicular cancer?","opts":["Hypoparathyroidism","Cataracts only","Hypogonadism, cardiovascular disease, and second malignancies","Pulmonary alveolar proteinosis","Clotting factor deficiency"],"a":2,"e":"Survivors face increased cardiovascular risk, hypogonadism, neuropathy, ototoxicity, and a higher risk of second cancers, so long-term surveillance is needed.","k":"Testicular cancer survivors have long-term cardiovascular, endocrine, and second cancer risks.","t":"Late effects"},{"n":15,"stem":"Which condition raises the risk of testicular germ cell tumor?","opts":["Vasectomy","Hydrocele","Mumps in adulthood","Epididymitis","Cryptorchidism"],"a":4,"e":"Cryptorchidism increases the risk of testicular cancer, and orchiopexy before puberty lowers it but does not remove it. A prior germ cell tumor also raises contralateral risk.","k":"Cryptorchidism increases the risk of testicular cancer.","t":"Risk factors"},{"n":16,"stem":"A 55-year-old woman has a 3 cm adrenal mass found incidentally with an unenhanced attenuation of 6 Hounsfield units. How should it be classified?","opts":["Pheochromocytoma","Adrenocortical carcinoma","Lymphoma","Likely a benign lipid-rich adenoma, with hormonal evaluation","Metastasis"],"a":3,"e":"An unenhanced attenuation under 10 Hounsfield units indicates a lipid-rich adenoma. All incidentalomas need evaluation for cortisol excess and, if unenhanced density is high or hypertension is present, pheochromocytoma.","k":"Unenhanced attenuation under 10 Hounsfield units suggests a benign adrenal adenoma.","t":"Adrenal incidentaloma"},{"n":17,"stem":"A man taking mitotane for adrenocortical carcinoma develops fatigue and hypotension. What should be started?","opts":["Calcium","Glucocorticoid replacement, since mitotane causes adrenal insufficiency","Insulin","Fludrocortisone alone","Levothyroxine"],"a":1,"e":"Mitotane is adrenolytic. Hydrocortisone replacement is started with it, usually at higher doses because mitotane increases cortisol metabolism, and mitotane levels are monitored.","k":"Mitotane requires glucocorticoid replacement.","t":"Mitotane replacement"},{"n":18,"stem":"A man has metastatic adrenocortical carcinoma. Which regimen has randomized evidence?","opts":["Osimertinib","Etoposide, doxorubicin, cisplatin with mitotane","Paclitaxel","Rituximab","Imatinib"],"a":1,"e":"The FIRM-ACT trial showed greater response and progression-free survival with etoposide, doxorubicin, cisplatin and mitotane versus streptozocin and mitotane.","k":"EDP plus mitotane is a regimen for advanced adrenocortical carcinoma.","t":"Metastatic adrenocortical carcinoma"},{"n":19,"stem":"A woman has episodic headaches, sweating, palpitations and hypertension. Which test is the most sensitive for diagnosis?","opts":["Plasma free or 24-hour urinary fractionated metanephrines","Serum calcium","Serum cortisol","Renin","Thyroid-stimulating hormone"],"a":0,"e":"Metanephrines have the highest sensitivity for catecholamine-secreting tumors. Imaging follows biochemical confirmation.","k":"Plasma or urinary metanephrines diagnose pheochromocytoma.","t":"Pheochromocytoma diagnosis"},{"n":20,"stem":"A patient with pheochromocytoma is prepared for surgery. Why is a beta blocker never started first?","opts":["It lowers blood sugar","It causes hypokalemia","Unopposed alpha stimulation can precipitate a hypertensive crisis","It is not effective in any patient","It causes bradycardia only"],"a":2,"e":"Alpha blockade with phenoxybenzamine or doxazosin comes first. Beta blockade is added later for tachycardia, since beta blockade alone leaves vasoconstriction unopposed.","k":"Start alpha blockade before beta blockade in pheochromocytoma.","t":"Alpha blockade"},{"n":21,"stem":"A 25-year-old with pheochromocytoma and a family history of medullary thyroid cancer is most likely to carry which variant?","opts":["APC","TP53","BRCA1","RET","MLH1"],"a":3,"e":"Pheochromocytoma may be part of MEN2, caused by RET variants, or VHL, NF1 or SDHx syndromes. Genetic testing is recommended in all patients.","k":"MEN2 results from RET variants and includes pheochromocytoma and medullary thyroid cancer.","t":"Pheochromocytoma genetics"}]},{"ch":17,"title":"Renal and Urothelial Cancers","qs":[{"n":1,"stem":"A 72-year-old man with severe heart failure has an incidental 2.5 cm enhancing renal mass. What are reasonable management options?","opts":["Immediate radical nephrectomy for all","Palliative care only","Cytoreductive chemotherapy","Adjuvant pembrolizumab","Active surveillance, ablation, or partial nephrectomy, chosen by comorbidity and preference"],"a":4,"e":"Small renal masses grow slowly, and metastasis is uncommon. Partial nephrectomy is preferred when surgery is chosen, and surveillance or thermal ablation suits patients with limited life expectancy or comorbidity.","k":"Small renal masses in frail patients can be managed by surveillance or ablation.","t":"Small renal mass"},{"n":2,"stem":"A 55-year-old man has a 4 cm cT1a renal tumor in a solitary kidney. Which surgical approach preserves renal function?","opts":["Radical nephrectomy","Bilateral nephrectomy","Palliative radiotherapy","Partial nephrectomy","Chemotherapy"],"a":3,"e":"Partial nephrectomy is the standard for T1 renal tumors when feasible, with oncologic outcomes similar to radical nephrectomy and better preservation of renal function.","k":"Partial nephrectomy is preferred for T1 renal tumors.","t":"Partial nephrectomy"},{"n":3,"stem":"A man has metastatic clear cell renal cell carcinoma with intermediate IMDC risk and a large symptomatic primary. What is the role of cytoreductive nephrectomy?","opts":["It is contraindicated in all patients","It is done only after death","It is considered selectively in patients with good performance status and limited metastatic burden","It replaces systemic therapy","It is mandatory for all patients"],"a":2,"e":"The CARMENA trial showed no benefit of upfront nephrectomy before sunitinib in intermediate and poor-risk patients, so surgery is reserved for selected patients, often after systemic response.","k":"Cytoreductive nephrectomy is selective in the immunotherapy era.","t":"Cytoreductive nephrectomy"},{"n":4,"stem":"Which feature counts as an adverse risk factor in the IMDC model?","opts":["Time from diagnosis to systemic therapy under one year","Male sex","Right-sided tumor","Age over 60 years","Smoking history"],"a":0,"e":"IMDC factors include anemia, hypercalcemia, neutrophilia, thrombocytosis, Karnofsky score under 80, and less than one year from diagnosis to therapy.","k":"A short time from diagnosis to systemic therapy is an IMDC adverse factor.","t":"IMDC adverse factors"},{"n":5,"stem":"A man has metastatic clear cell renal cell carcinoma with poor IMDC risk. Which regimen improved overall survival over sunitinib?","opts":["Everolimus alone","Nivolumab with ipilimumab","Observation","Sorafenib","Interferon alfa"],"a":1,"e":"CheckMate 214 showed that nivolumab with ipilimumab improved survival over sunitinib in intermediate and poor risk disease, with higher rates of immune-related adverse events.","k":"Nivolumab with ipilimumab is a first-line option for intermediate and poor-risk renal cell carcinoma.","t":"Nivolumab plus ipilimumab"},{"n":6,"stem":"Which combination is established for first-line advanced clear cell renal cell carcinoma in patients of all risk groups?","opts":["Sunitinib with gefitinib","Imatinib with nivolumab","Bevacizumab alone","Temsirolimus alone","Axitinib with pembrolizumab"],"a":4,"e":"Immunotherapy combined with a VEGF inhibitor, such as axitinib with pembrolizumab, lenvatinib with pembrolizumab, or cabozantinib with nivolumab, improves survival over sunitinib.","k":"Pembrolizumab with axitinib is a first-line combination for advanced clear cell renal carcinoma.","t":"Axitinib combination"},{"n":7,"stem":"A woman on cabozantinib has blood pressure of 170/105 mmHg and proteinuria. What is the recommended action?","opts":["Stop all therapy permanently","Start or adjust antihypertensive therapy and monitor proteinuria, holding the drug if severe","Add NSAIDs","Ignore hypertension","Increase the dose"],"a":1,"e":"VEGF pathway inhibitors cause hypertension and proteinuria. Blood pressure is controlled with antihypertensives, and dose interruption or reduction is used for severe or persistent toxicity.","k":"VEGF inhibitors require blood pressure control and monitoring of proteinuria.","t":"VEGF inhibitor toxicity"},{"n":8,"stem":"A patient with advanced clear cell renal cell carcinoma has progressed after anti-PD-1 therapy and a VEGF inhibitor. Which agent inhibits the transcription factor HIF-2 alpha?","opts":["Temsirolimus","Everolimus","Axitinib","Belzutifan","Sunitinib"],"a":3,"e":"Belzutifan inhibits HIF-2 alpha and improved progression-free survival over everolimus after prior therapy. Anemia is a key toxicity, and it is teratogenic.","k":"Belzutifan inhibits HIF-2 alpha, and anemia is a main toxicity.","t":"Belzutifan"},{"n":9,"stem":"A woman has metastatic papillary renal cell carcinoma. How does management differ from clear cell disease?","opts":["No systemic therapy exists","Immunotherapy never works","Trial participation is encouraged, and cabozantinib or combinations may be used","Interferon is first-line","Treatment is identical in all respects"],"a":2,"e":"Non-clear cell histologies were excluded from most pivotal trials. Cabozantinib showed benefit in a randomized phase 2 trial, and immunotherapy combinations are used.","k":"Non-clear cell renal cancers have a weaker evidence base, and trials are encouraged.","t":"Non-clear cell"},{"n":10,"stem":"After nephrectomy, which patient with clear cell renal cell carcinoma is a candidate for adjuvant pembrolizumab?","opts":["A patient with pT3 tumor or node-positive disease with high recurrence risk","A patient with benign oncocytoma","A patient with metastases at diagnosis who is rendered disease-free","A patient with papillary histology only","A patient with pT1a tumor"],"a":0,"e":"KEYNOTE-564 enrolled patients at intermediate-high or high risk after nephrectomy. Low-risk patients are observed.","k":"Adjuvant pembrolizumab is for high-risk clear cell renal cell carcinoma after nephrectomy.","t":"Adjuvant selection"},{"n":11,"stem":"Which patient with muscle-invasive bladder cancer is typically considered cisplatin-ineligible?","opts":["A patient with no neuropathy","A patient with creatinine clearance of 90 mL/min","A patient with normal hearing","A patient with ECOG 0","A patient with creatinine clearance of 45 mL/min"],"a":4,"e":"Cisplatin ineligibility criteria include creatinine clearance below 60 mL/min, ECOG performance status of 2 or more, grade 2 or higher hearing loss or neuropathy, and NYHA class III heart failure.","k":"A creatinine clearance below 60 mL/min makes a patient cisplatin-ineligible.","t":"Cisplatin eligibility"},{"n":12,"stem":"A 62-year-old fit man has cT3N0 muscle-invasive bladder cancer. Which approach improves survival?","opts":["Radiotherapy alone","TURBT alone","Cystectomy alone","Observation","Neoadjuvant cisplatin-based chemotherapy before radical cystectomy"],"a":4,"e":"Neoadjuvant cisplatin-based chemotherapy provides an absolute survival benefit of about 5 to 8 percent over cystectomy alone. Dose-dense MVAC or gemcitabine with cisplatin are options.","k":"Neoadjuvant cisplatin-based chemotherapy improves survival in muscle-invasive bladder cancer.","t":"Neoadjuvant chemotherapy"},{"n":13,"stem":"A patient with a solitary T2 bladder tumor without hydronephrosis and no carcinoma in situ declines cystectomy. Which approach offers bladder preservation?","opts":["Radical prostatectomy","TURBT alone","Chemotherapy alone","Maximal TURBT followed by chemoradiotherapy","Intravesical BCG"],"a":3,"e":"Trimodality therapy, with maximal transurethral resection and concurrent chemoradiation, yields bladder preservation with outcomes comparable to cystectomy in selected patients.","k":"Trimodality therapy offers bladder preservation in selected patients with muscle-invasive disease.","t":"Bladder-sparing"},{"n":14,"stem":"A man has high-grade T1 non-muscle-invasive bladder cancer after complete resection. Which intravesical therapy reduces recurrence and progression?","opts":["Intravesical saline","BCG induction followed by maintenance","Systemic cisplatin","Observation","Oral antibiotics"],"a":1,"e":"BCG immunotherapy is standard for high-risk non-muscle-invasive disease. Cystoscopy and cytology are used for surveillance.","k":"BCG is standard for high-risk non-muscle-invasive bladder cancer.","t":"BCG"},{"n":15,"stem":"A patient with BCG-unresponsive carcinoma in situ declines cystectomy. Which systemic agent is approved?","opts":["Pembrolizumab","Sunitinib","Sorafenib","Bevacizumab","Imatinib"],"a":0,"e":"Pembrolizumab is approved for BCG-unresponsive carcinoma in situ in patients who are ineligible for or decline cystectomy. Other options include intravesical agents.","k":"Pembrolizumab is an option for BCG-unresponsive carcinoma in situ.","t":"BCG-unresponsive"},{"n":16,"stem":"A man on enfortumab vedotin develops a painful blistering rash with mucosal involvement. What is the appropriate action?","opts":["Add pembrolizumab","Increase the dose","Stop the drug and treat as a severe cutaneous reaction","Continue and apply moisturizer","Ignore"],"a":2,"e":"Enfortumab vedotin can cause Stevens-Johnson syndrome and toxic epidermal necrolysis, including fatal cases. Severe skin reactions require permanent discontinuation.","k":"Enfortumab vedotin can cause severe cutaneous reactions that require discontinuation.","t":"Enfortumab vedotin toxicity"},{"n":17,"stem":"A man with advanced urothelial carcinoma progressed on chemotherapy and immunotherapy, and his tumor harbors an FGFR3 alteration. Which drug is approved?","opts":["Olaparib","Erdafitinib","Capivasertib","Osimertinib","Alpelisib"],"a":1,"e":"Erdafitinib inhibits FGFR and is approved after platinum-containing chemotherapy in FGFR2 or FGFR3-altered urothelial carcinoma. Hyperphosphatemia and ocular toxicity are notable.","k":"Erdafitinib is used for FGFR-altered urothelial carcinoma.","t":"FGFR3"},{"n":18,"stem":"A patient has high-grade upper tract urothelial carcinoma and undergoes nephroureterectomy with pT3 disease. Which adjuvant strategy improved disease-free survival?","opts":["Platinum-based chemotherapy","Radiotherapy alone","Observation only","Hormone therapy","Mitotane"],"a":0,"e":"The POUT trial showed that adjuvant gemcitabine with platinum improved disease-free survival after nephroureterectomy for pT2 to T4 or node-positive disease.","k":"Adjuvant platinum chemotherapy improves disease-free survival after nephroureterectomy.","t":"Upper tract urothelial"},{"n":19,"stem":"A woman with upper tract urothelial carcinoma has a family history of colorectal and endometrial cancers. Which syndrome should be suspected?","opts":["Birt-Hogg-Dube syndrome","Von Hippel-Lindau disease","Lynch syndrome","Li-Fraumeni syndrome","Cowden syndrome"],"a":2,"e":"Lynch syndrome predisposes to upper tract urothelial carcinoma, particularly with MSH2 variants. Tumor mismatch repair testing and germline evaluation are appropriate.","k":"Upper tract urothelial carcinoma can signal Lynch syndrome.","t":"Lynch and urothelial"},{"n":20,"stem":"A 58-year-old smoker has painless gross hematuria. Which evaluation is required?","opts":["Urine culture only","Reassurance","Repeat urinalysis in 1 year","Cystoscopy and imaging of the upper tract","Antibiotics only"],"a":3,"e":"Gross hematuria needs evaluation for urothelial carcinoma and renal tumors, with cystoscopy and CT urography or equivalent, regardless of urinary infection.","k":"Painless gross hematuria needs cystoscopy and upper tract imaging.","t":"Hematuria"},{"n":21,"stem":"A man with metastatic urothelial carcinoma has stable disease after 4 to 6 cycles of platinum-based chemotherapy. What improves survival?","opts"
