:["Maintenance cisplatin","Observation","Maintenance carboplatin","Radiotherapy","Maintenance avelumab"],"a":4,"e":"JAVELIN Bladder 100 showed that maintenance avelumab improved overall survival in patients without progression after first-line platinum chemotherapy.","k":"Maintenance avelumab improves survival after first-line platinum chemotherapy.","t":"Avelumab maintenance"}]},{"ch":18,"title":"Genitourinary Genetics and Treatment Complications","qs":[{"n":1,"stem":"A 30-year-old man has a retinal hemangioblastoma, a cerebellar hemangioblastoma, and bilateral renal cell carcinomas. Which syndrome is likely?","opts":["Tuberous sclerosis","Lynch syndrome","Von Hippel-Lindau disease","Cowden syndrome","Birt-Hogg-Dube syndrome"],"a":2,"e":"VHL disease causes hemangioblastomas of the retina and central nervous system, clear cell renal carcinomas, pheochromocytomas and pancreatic neuroendocrine tumors, due to VHL inactivation and HIF activation.","k":"Retinal and cerebellar hemangioblastomas with renal cell carcinoma indicate von Hippel-Lindau disease.","t":"VHL syndrome"},{"n":2,"stem":"A patient with von Hippel-Lindau disease has a 2.2 cm renal tumor. What is the usual surgical threshold for intervention?","opts":["Remove at 0.5 cm","Perform radical nephrectomy at diagnosis","Treat with interferon","Observe until the largest tumor reaches about 3 cm, then use nephron-sparing surgery","Never operate"],"a":3,"e":"In von Hippel-Lindau disease, observation until 3 cm limits repeated surgeries and preserves kidney function, since metastatic risk is low below that size.","k":"Intervene in von Hippel-Lindau renal tumors at about 3 cm with nephron-sparing surgery.","t":"VHL renal surgery"},{"n":3,"stem":"A patient with von Hippel-Lindau disease on belzutifan has fatigue and a hemoglobin of 8 g/dL. What is the likely cause?","opts":["Belzutifan-related anemia, from reduced erythropoietin","Hemolysis from rituximab","Bleeding from the tumor","Iron overload","Vitamin K deficiency"],"a":0,"e":"HIF-2 alpha drives erythropoietin production, so belzutifan commonly causes anemia, which can need erythropoiesis-stimulating agents or transfusion. It is teratogenic, and contraception is needed.","k":"Belzutifan causes anemia by lowering erythropoietin.","t":"Belzutifan adverse effects"},{"n":4,"stem":"A man with recurrent spontaneous pneumothorax, facial fibrofolliculomas, and multiple chromophobe renal tumors most likely has a pathogenic variant in which gene?","opts":["FH","VHL","TSC2","TP53","FLCN"],"a":4,"e":"Birt-Hogg-Dube syndrome is caused by variants in FLCN and presents with lung cysts, skin lesions and renal tumors of mixed chromophobe and oncocytic types.","k":"FLCN variants cause Birt-Hogg-Dube syndrome.","t":"Birt-Hogg-Dube"},{"n":5,"stem":"A young woman has multiple cutaneous leiomyomas, severe uterine fibroids, and an aggressive papillary renal carcinoma. Which gene is involved?","opts":["FLCN","Fumarate hydratase","TP53","VHL","BRCA1"],"a":1,"e":"Hereditary leiomyomatosis and renal cell carcinoma is caused by fumarate hydratase variants and carries a high risk of aggressive renal cancer, so early surgery is advised.","k":"Fumarate hydratase variants cause hereditary leiomyomatosis and renal cell carcinoma.","t":"HLRCC"},{"n":6,"stem":"A woman with seizures, facial angiofibromas, and bilateral renal angiomyolipomas is considered for medical therapy. Which agent is used for growing angiomyolipomas?","opts":["Everolimus","Imatinib","Sorafenib","Belzutifan","Sunitinib"],"a":0,"e":"Tuberous sclerosis results from TSC1 or TSC2 variants that activate mTOR. Everolimus shrinks angiomyolipomas and subependymal giant cell astrocytomas.","k":"Everolimus treats angiomyolipomas in tuberous sclerosis.","t":"Tuberous sclerosis"},{"n":7,"stem":"For which man with prostate cancer is germline testing most clearly recommended?","opts":["A man with low-risk disease and no family history","A man with benign prostatic hyperplasia","A man with metastatic disease","A man with prostatitis","A man with an elevated PSA only"],"a":2,"e":"Guidelines recommend germline testing for men with metastatic, high-risk or regional prostate cancer, or with suggestive family history or histology, as results affect treatment and relatives.","k":"Offer germline testing to men with metastatic prostate cancer.","t":"Germline testing in prostate cancer"},{"n":8,"stem":"A man with prostate cancer has a tumor with mismatch repair deficiency. What is the implication?","opts":["No further evaluation is needed","He has no relatives at risk","He has Li-Fraumeni syndrome","Check for Lynch syndrome and consider immunotherapy","He needs a PARP inhibitor only"],"a":3,"e":"Mismatch repair deficiency may arise from a germline Lynch syndrome variant, so genetic counseling is advised, and it predicts response to immune checkpoint inhibitors.","k":"Mismatch repair deficiency prompts evaluation for Lynch syndrome.","t":"Lynch in prostate"},{"n":9,"stem":"A man's germline test shows a BRCA2 pathogenic variant. What should be advised about his daughters?","opts":["They need no counseling","They need prostate screening","They are not at risk","Only sons are at risk","They may carry it, and cascade testing should be offered"],"a":4,"e":"Autosomal dominant inheritance means each child has a 50 percent chance of carrying the variant. Female carriers have increased risk of breast and ovarian cancer and need risk management.","k":"A BRCA2 variant in a man puts his children at 50 percent risk and warrants cascade testing.","t":"Cascade counseling"},{"n":10,"stem":"A 72-year-old man starts androgen deprivation therapy. Which baseline test is recommended?","opts":["Skin biopsy","Bone mineral density by DXA","Colonoscopy","Echocardiogram","Pulmonary function"],"a":1,"e":"Androgen deprivation therapy lowers bone density and increases fracture risk. Baseline DXA, calcium and vitamin D, and consideration of denosumab or bisphosphonates reduce risk.","k":"Obtain a baseline bone density scan before long-term androgen deprivation.","t":"ADT and bone"},{"n":11,"stem":"Which intervention improves fatigue, muscle mass and quality of life in men on androgen deprivation therapy?","opts":["Dietary supplements alone","Bed rest","High-dose steroids","Testosterone injections","Supervised resistance and aerobic exercise"],"a":4,"e":"Exercise counteracts sarcopenia, fatigue and metabolic effects of androgen deprivation. Guidelines advise regular aerobic and resistance training.","k":"Exercise improves fatigue and body composition during androgen deprivation therapy.","t":"Exercise during ADT"},{"n":12,"stem":"What did the PRONOUNCE trial show about degarelix and leuprolide in men with cardiovascular disease?","opts":["Degarelix doubled events","Leuprolide halved cardiovascular events","Degarelix halved cardiovascular events","No significant difference in major cardiovascular events","Both drugs eliminated events"],"a":3,"e":"PRONOUNCE ended early and found similar rates of major adverse cardiovascular events, and earlier signals favoring antagonists were not confirmed.","k":"PRONOUNCE found no difference in major cardiovascular events between degarelix and leuprolide.","t":"Degarelix cardiovascular"},{"n":13,"stem":"A patient on pembrolizumab has creatinine rising from 1.0 to 2.2 mg/dL with sterile pyuria and no proteinuria. What is suspected?","opts":["Polycystic kidney disease","Immune-related acute interstitial nephritis, treated with holding the drug and corticosteroids","Prerenal azotemia only","Cisplatin toxicity","Nephrotic syndrome"],"a":1,"e":"Checkpoint inhibitors can cause acute interstitial nephritis, and proton pump inhibitors increase risk. Other causes are excluded, and steroids are started with holding of therapy.","k":"A rising creatinine on immunotherapy suggests immune-related nephritis.","t":"Immune nephritis"},{"n":14,"stem":"A man receiving nivolumab and ipilimumab for renal cell carcinoma develops fatigue, TSH 45, and low free T4. What is the management?","opts":["Stop all therapy","Thyroidectomy","Levothyroxine, with continuation of immunotherapy","Steroids at high dose","Radioactive iodine"],"a":2,"e":"Thyroid dysfunction is common with checkpoint inhibitors. Hormone replacement allows continued therapy, and adrenal insufficiency should be excluded before treating.","k":"Treat immune hypothyroidism with levothyroxine and continue therapy.","t":"Immune hypothyroidism in RCC"},{"n":15,"stem":"A man on ipilimumab has 5 stools a day above baseline with no blood and no fever. How is this graded?","opts":["Grade 2 diarrhea, requiring holding therapy and starting steroids if persistent","Grade 3","Grade 0","Grade 1","Grade 4"],"a":0,"e":"Four to six stools above baseline is grade 2, and seven or more is grade 3. Persistent grade 2 events prompt holding and steroids, with stool testing to exclude infection.","k":"Four to six stools above baseline is grade 2 diarrhea.","t":"Colitis grading"},{"n":16,"stem":"Which is the standard option to preserve fertility before chemotherapy in a 28-year-old man?","opts":["Testicular shielding alone","Hormone suppression with GnRH","Testosterone therapy","Delaying all treatment","Sperm cryopreservation"],"a":4,"e":"Sperm banking before therapy is the established method. Hormonal suppression does not protect spermatogenesis.","k":"Sperm banking is the standard fertility preservation for men.","t":"Fertility male"},{"n":17,"stem":"A man has erectile dysfunction after radical prostatectomy. Which drug class is a first-line treatment?","opts":["Nitrate","Phosphodiesterase type 5 inhibitor","Statin","Spironolactone","Alpha blocker alone"],"a":1,"e":"Phosphodiesterase inhibitors can restore erections after nerve-sparing surgery. Nitrates are contraindicated with them.","k":"A phosphodiesterase type 5 inhibitor is first-line for erectile dysfunction after prostatectomy.","t":"Erectile dysfunction"},{"n":18,"stem":"A man treated with pelvic radiotherapy years earlier has painless gross hematuria. What is the key step?","opts":["Perform nephrectomy","Start antibiotics","Assume radiation cystitis without evaluation","Evaluate for recurrent or second cancer, even if radiation cystitis is likely","Do nothing"],"a":3,"e":"Radiation cystitis causes late hematuria, but cancer must be excluded by cystoscopy and imaging, because radiation also raises bladder cancer risk.","k":"Late hematuria after pelvic radiotherapy still requires evaluation for cancer.","t":"Radiation cystitis"},{"n":19,"stem":"A man on sunitinib has fatigue, cold intolerance, and rising TSH. What is the cause?","opts":["Thyroid dysfunction from the tyrosine kinase inhibitor","Hemochromatosis","Iodine deficiency","Adrenal insufficiency","Pituitary tumor"],"a":0,"e":"Sunitinib commonly causes hypothyroidism. Thyroid function is monitored every few cycles, and levothyroxine is given.","k":"Sunitinib commonly causes hypothyroidism.","t":"TKI hypothyroidism"}]},{"ch":19,"title":"Gynecologic Cancers","qs":[{"n":1,"stem":"A 35-year-old woman asks about cervical cancer screening. Which options are recommended by US guidelines?","opts":["Screening only after age 65","Annual cytology for life","Primary HPV testing every 5 years, or cytology with HPV cotesting every 5 years, or cytology every 3 years","No screening before age 40","Pelvic ultrasound every year"],"a":2,"e":"For ages 30 to 65, guidelines allow primary HPV testing every 5 years, cotesting every 5 years or cytology every 3 years. Women aged 21 to 29 are screened with cytology every 3 years.","k":"Primary HPV testing every 5 years is recommended for women aged 30 to 65.","t":"Cervical screening"},{"n":2,"stem":"For early-stage cervical cancer treated with radical hysterectomy, which surgical route was associated with worse disease-free survival in the LACC trial?","opts":["Open abdominal surgery","Observation","Radiotherapy alone","Minimally invasive surgery","Vaginal route only"],"a":3,"e":"The LACC trial showed higher recurrence and death with minimally invasive radical hysterectomy compared with open surgery, so open surgery is recommended for most patients.","k":"Open radical hysterectomy is preferred over minimally invasive surgery for early-stage cervical cancer.","t":"Radical hysterectomy approach"},{"n":3,"stem":"A 28-year-old woman has a 1.5 cm stage IB1 cervical squamous cancer with negative nodes and wishes to retain fertility. Which procedure may be offered?","opts":["Radical trachelectomy","Simple hysterectomy","Chemotherapy alone","Whole-pelvis radiotherapy","Oophorectomy"],"a":0,"e":"Radical trachelectomy preserves the uterine body in selected patients with tumors under 2 cm and negative nodes. Pregnancy outcomes are possible, with some risk of preterm birth.","k":"Radical trachelectomy is a fertility-sparing option for tumors under 2 cm.","t":"Fertility-sparing"},{"n":4,"stem":"After radical hysterectomy for stage IB cervical cancer, pathology shows positive pelvic lymph nodes and positive parametrial involvement. What is recommended?","opts":["Observation","Hormonal therapy","Repeat surgery","Chemotherapy alone","Pelvic radiotherapy with concurrent cisplatin"],"a":4,"e":"Positive nodes, parametrial invasion or positive margins are high-risk features, and adjuvant chemoradiation improves survival.","k":"Positive nodes, margins or parametria after radical hysterectomy call for adjuvant chemoradiation.","t":"Adjuvant after hysterectomy"},{"n":5,"stem":"A woman has stage IIIB cervical squamous cancer with parametrial extension to the pelvic sidewall. What is the standard treatment?","opts":["Chemotherapy alone","Palliative care","Concurrent cisplatin-based chemoradiation with brachytherapy","Observation","Radical hysterectomy"],"a":2,"e":"Locally advanced cervical cancer is treated with chemoradiation, and brachytherapy is an essential component of the radiation. Surgery is not the primary treatment.","k":"Locally advanced cervical cancer is treated with chemoradiation and brachytherapy.","t":"Locally advanced cervical"},{"n":6,"stem":"A woman with stage III cervical cancer receives chemoradiation. Which addition improved progression-free survival in the KEYNOTE-A18 trial?","opts":["Bevacizumab","Pembrolizumab with chemoradiation, followed by maintenance","Imatinib","Trastuzumab","Olaparib"],"a":1,"e":"KEYNOTE-A18 showed that adding pembrolizumab to chemoradiation in locally advanced disease improved progression-free survival and overall survival.","k":"Pembrolizumab added to chemoradiation improves outcomes in locally advanced cervical cancer.","t":"Cervical immunotherapy"},{"n":7,"stem":"A woman with recurrent cervical cancer previously treated with chemotherapy is offered an antibody-drug conjugate targeting tissue factor. Which toxicity requires eye care?","opts":["Ocular toxicity, including conjunctivitis and keratitis","Ototoxicity","Pulmonary fibrosis","Cardiomyopathy","Hemorrhagic cystitis"],"a":0,"e":"Tisotumab vedotin causes ocular adverse events, so patients use prophylactic eye drops and have eye examinations.","k":"Tisotumab vedotin requires ocular monitoring and preventive eye care.","t":"Tisotumab vedotin"},{"n":8,"stem":"A woman is newly diagnosed with high-grade serous ovarian cancer. What testing is recommended?","opts":["HER2 testing alone","Testing only for relatives","Germline BRCA testing, with tumor homologous recombination testing","No testing","Testing only after recurrence"],"a":2,"e":"Germline and tumor testing for BRCA and homologous recombination deficiency guides maintenance therapy and identifies hereditary risk for relatives.","k":"All patients with high-grade serous ovarian cancer should have germline BRCA testing.","t":"Ovarian BRCA testing"},{"n":9,"stem":"A woman has stage IV ovarian cancer with a poor performance status and extensive disease, and primary cytoreduction is unlikely to achieve no residual disease. What is an appropriate approach?","opts":["Hormonal therapy","Neoadjuvant chemotherapy followed by interval cytoreduction","Primary radical surgery regardless","Radiotherapy to the abdomen","Observation"],"a":1,"e":"Neoadjuvant chemotherapy with interval debulking is noninferior to primary surgery in survival with lower surgical morbidity in patients unlikely to be optimally debulked.","k":"Neoadjuvant chemotherapy and interval surgery suit patients unlikely to be optimally debulked.","t":"Interval debulking"},{"n":10,"stem":"Which toxicity warrants caution when bevacizumab is used in ovarian cancer?","opts":["Hypothyroidism","Ototoxicity","Hemorrhagic cystitis","Cardiomyopathy only","Gastrointestinal perforation and impaired wound healing"],"a":4,"e":"Bevacizumab carries risks of bowel perforation, hypertension, proteinuria, and delayed wound healing, so it is held before and after surgery.","k":"Bevacizumab can cause bowel perforation and impair wound healing.","t":"Bevacizumab in ovarian"},{"n":11,"stem":"A woman without a BRCA mutation but with a homologous recombination-deficient tumor responds to first-line platinum. Which maintenance has evidence?","opts":["Observation is superior","Imatinib","Tamoxifen","A PARP inhibitor such as niraparib","Anastrozole"],"a":3,"e":"The PRIMA trial showed that niraparib improved progression-free survival in patients after first-line platinum, with the greatest effect in homologous recombination-deficient tumors. Thrombocytopenia is common.","k":"PARP inhibitor maintenance benefits homologous recombination-deficient ovarian cancer.","t":"Niraparib maintenance"},{"n":12,"stem":"A woman on olaparib for 18 months develops progressive macrocytic anemia and thrombocytopenia. Which long-term complication is suspected?","opts":["Hemolytic anemia","Pernicious anemia","Myelodysplastic syndrome or acute myeloid leukemia","Iron deficiency","Folate deficiency alone"],"a":2,"e":"PARP inhibitors are associated with myelodysplastic syndrome and acute myeloid leukemia, so persistent cytopenias need marrow evaluation.","k":"Persistent cytopenias on a PARP inhibitor require evaluation for myeloid neoplasms.","t":"PARP inhibitor toxicity"},{"n":13,"stem":"A woman with ovarian cancer relapses 14 months after her last platinum dose. How is she classified, and what is the usual treatment?","opts":["Platinum-sensitive, treated with platinum-based chemotherapy","Hormone-sensitive, treated with tamoxifen","Platinum-resistant, treated with single-agent weekly paclitaxel","Platinum-refractory, treated with observation","Immune-sensitive, treated with pembrolizumab"],"a":0,"e":"Relapse more than 6 months after platinum is platinum-sensitive, and retreatment with platinum-based chemotherapy has high response rates.","k":"Relapse more than 6 months after platinum is platinum-sensitive.","t":"Platinum-sensitive relapse"},{"n":14,"stem":"A woman has platinum-resistant ovarian cancer and no targetable marker. Which regimen is standard?","opts":["Radiotherapy alone","Single-agent chemotherapy such as weekly paclitaxel, liposomal doxorubicin, or topotecan, with or without bevacizumab","Olaparib in all patients","Repeat carboplatin and paclitaxel","Tamoxifen alone"],"a":1,"e":"Platinum-resistant disease is treated with non-platinum single agents, and adding bevacizumab improved progression-free survival in the AURELIA trial.","k":"Platinum-resistant ovarian cancer is treated with single-agent non-platinum chemotherapy.","t":"Platinum-resistant treatment"},{"n":15,"stem":"A 40-year-old woman has recurrent low-grade serous ovarian carcinoma with indolent behavior. Which agent class is used?","opts":["High-dose cisplatin","Anthracycline-based chemotherapy","CAR T-cell therapy","Endocrine therapy or a MEK inhibitor","Radioactive iodine"],"a":3,"e":"Low-grade serous carcinomas are relatively chemoresistant. Endocrine therapy and MEK inhibitors such as trametinib or avutometinib have shown activity.","k":"Low-grade serous ovarian carcinoma responds to endocrine therapy and MEK inhibition.","t":"Low-grade serous"},{"n":16,"stem":"Which molecular subgroup of endometrial cancer has an excellent prognosis even with high-grade histology?","opts":["Mismatch repair-deficient","No specific molecular profile","Microsatellite stable only","p53-abnormal","POLE-ultramutated"],"a":4,"e":"POLE-mutated endometrial cancers have excellent outcomes and may avoid adjuvant therapy. p53-abnormal tumors have the worst prognosis.","k":"POLE-ultramutated endometrial cancer has an excellent prognosis.","t":"Endometrial molecular class"},{"n":17,"stem":"A woman has stage I grade 1 endometrioid endometrial cancer. What is the standard treatment?","opts":["Radiotherapy alone","Observation","Hysterectomy with bilateral salpingo-oophorectomy","Chemotherapy alone","Hormone therapy alone in all cases"],"a":2,"e":"Surgical staging with total hysterectomy and bilateral salpingo-oophorectomy is standard, and sentinel lymph node mapping can assess nodes. Fertility-sparing progestin therapy is reserved for selected patients.","k":"Hysterectomy with bilateral salpingo-oophorectomy is standard for early endometrial cancer.","t":"Endometrial surgery"},{"n":18,"stem":"A woman with advanced endometrial cancer has progressed after platinum chemotherapy and has microsatellite stable disease. Which regimen improved survival?","opts":["Imatinib","Pembrolizumab alone","Tamoxifen","Pembrolizumab with lenvatinib","Bevacizumab alone"],"a":3,"e":"The KEYNOTE-775 trial showed improved progression-free survival and overall survival with pembrolizumab and lenvatinib over chemotherapy in previously treated endometrial cancer.","k":"Pembrolizumab with lenvatinib is used for previously treated endometrial cancer.","t":"Pembrolizumab plus lenvatinib"},{"n":19,"stem":"A woman undergoes laparoscopic morcellation of a presumed fibroid, and pathology shows leiomyosarcoma. What was the concern with morcellation?","opts":["No clinical effect","Increased bleeding only","Improved survival","Decreased risk of recurrence","Spread of tumor within the peritoneal cavity, with worse outcomes"],"a":4,"e":"Morcellation of an unsuspected uterine sarcoma disseminates tumor and worsens prognosis, so power morcellation is avoided when malignancy is possible.","k":"Morcellation of unsuspected uterine sarcoma worsens prognosis.","t":"Leiomyosarcoma morcellation"},{"n":20,"stem":"A woman undergoes open surgery for ovarian cancer. Which prophylaxis lowers venous thromboembolism after discharge?","opts":["Prophylaxis only in hospital","Extended low-molecular-weight heparin for up to 4 weeks","No prophylaxis","Warfarin for 1 year","Aspirin only"],"a":1,"e":"Extended thromboprophylaxis with low-molecular-weight heparin for about 28 days after abdominal or pelvic cancer surgery reduces venous thromboembolism.","k":"Extended low-molecular-weight heparin lowers thromboembolism after major cancer surgery.","t":"Venous thromboembolism"},{"n":21,"stem":"A 48-year-old woman with endometrial cancer has loss of MSH2 and MSH6 on immunohistochemistry. What is the next step?","opts":["Germline testing for Lynch syndrome","BRCA testing only","Testing only her children","No further testing","HER2 testing"],"a":0,"e":"Loss of MSH2 and MSH6 is not explained by MLH1 methylation, so germline testing is advised. Risk-reducing surgery and colonoscopy surveillance follow if confirmed.","k":"MSH2 and MSH6 loss in endometrial cancer calls for germline Lynch testing.","t":"Lynch endometrial"},{"n":22,"stem":"A woman has stage III ovarian cancer and a partial response to 3 cycles of neoadjuvant chemotherapy. Which addition at interval surgery improved survival in one randomized trial?","opts":["Whole-abdominal radiotherapy","Hyperthermic intraperitoneal chemotherapy with cisplatin","Tamoxifen","Intraperitoneal radiotherapy","Hormone therapy"],"a":1,"e":"The OVHIPEC-1 trial showed improved recurrence-free and overall survival with heated cisplatin at interval cytoreduction, though practice varies across centers.","k":"Heated intraperitoneal cisplatin at interval surgery improved survival in OVHIPEC-1.","t":"HIPEC ovarian"},{"n":23,"stem":"A 70-year-old woman has a 3 cm vulvar squamous carcinoma without nodal disease. What is standard?","opts":["Hormone therapy","Hysterectomy","Observation","Wide local excision with sentinel node biopsy or groin evaluation","Chemotherapy alone"],"a":3,"e":"Vulvar cancer is treated surgically with inguinal node assessment, and nodal status drives adjuvant radiotherapy.","k":"Vulvar cancer is treated with wide excision and groin node evaluation.","t":"Vulvar cancer"},{"n":24,"stem":"A woman carries a BRCA1 pathogenic variant and has finished childbearing at age 40. What is recommended for ovarian cancer risk?","opts":["Tamoxifen","Hysterectomy only","No action","Annual CA-125 and ultrasound as sole prevention","Risk-reducing salpingo-oophorectomy"],"a":4,"e":"Screening does not reliably detect ovarian cancer early, so salpingo-oophorectomy between ages 35 and 40 is advised for BRCA1 carriers after childbearing.","k":"BRCA1 carriers are advised risk-reducing salpingo-oophorectomy by age 35 to 40.","t":"Hereditary ovarian"}]},{"ch":20,"title":"Esophageal, Gastric, Small Bowel, and Appendiceal Cancers","qs":[{"n":1,"stem":"A 60-year-old man with long-standing reflux has Barrett esophagus with low-grade dysplasia confirmed by an expert pathologist. What is appropriate?","opts":["Endoscopic eradication therapy or close endoscopic surveillance","Chemotherapy","Esophagectomy","Radiotherapy","No follow-up"],"a":0,"e":"Dysplasia in Barrett esophagus raises cancer risk. Radiofrequency ablation reduces progression, and surveillance is intensified.","k":"Dysplastic Barrett esophagus is treated by endoscopic eradication or close surveillance.","t":"Barrett surveillance"},{"n":2,"stem":"A man has a 1 cm, well-differentiated adenocarcinoma limited to the mucosa (T1a) in Barrett esophagus. Which treatment is preferred?","opts":["Palliative chemotherapy","Esophagectomy","Endoscopic mucosal resection with ablation of residual Barrett","Chemoradiation","Observation"],"a":2,"e":"Mucosal tumors have a very low risk of nodal spread, and endoscopic resection is curative in selected cases. Deeper invasion carries higher nodal risk and needs surgery.","k":"T1a esophageal adenocarcinoma can be cured by endoscopic resection.","t":"Early esophageal cancer"},{"n":3,"stem":"A patient has resectable stage III esophageal adenocarcinoma. Which preoperative regimen improved survival in the CROSS trial?","opts":["Surgery alone","Carboplatin and paclitaxel with concurrent radiotherapy","Radiotherapy alone","Cisplatin and fluorouracil alone","Trastuzumab"],"a":1,"e":"The CROSS trial showed improved overall survival with weekly carboplatin and paclitaxel and 41.4 Gy radiotherapy before esophagectomy, in both squamous and adenocarcinoma histologies.","k":"CROSS uses carboplatin, paclitaxel and 41.4 Gy before esophagectomy.","t":"CROSS regimen"},{"n":4,"stem":"A fit man has locally advanced cervical esophageal squamous cell carcinoma, close to the upper esophageal sphincter. What is the preferred approach?","opts":["Definitive chemoradiation","Palliative stent","Chemotherapy alone","Esophagectomy with pharyngolaryngectomy first","Observation"],"a":0,"e":"Cervical esophageal tumors require extensive surgery, so definitive chemoradiation is preferred to preserve function, with similar survival.","k":"Cervical esophageal squamous cancer is treated with definitive chemoradiation.","t":"Definitive chemoradiation"},{"n":5,"stem":"Which exposure is the leading risk factor for esophageal squamous cell carcinoma worldwide?","opts":["Asbestos","Helicobacter pylori","Obesity and reflux","Tobacco and alcohol","Hepatitis B"],"a":3,"e":"Squamous cell carcinoma is linked to tobacco, alcohol, hot beverages and nutritional factors, whereas adenocarcinoma is linked to reflux, Barrett esophagus and obesity.","k":"Tobacco and alcohol are the main risk factors for esophageal squamous cell carcinoma.","t":"Squamous risk factors"},{"n":6,"stem":"A man with advanced gastric adenocarcinoma has HER2 immunohistochemistry 3 plus. Which addition to chemotherapy improved survival?","opts":["Cetuximab","Everolimus","Trastuzumab","Imatinib","Bevacizumab"],"a":2,"e":"The ToGA trial showed that trastuzumab added to fluoropyrimidine and cisplatin improved overall survival in HER2-positive gastric and gastroesophageal junction cancers.","k":"Trastuzumab improves survival in HER2-positive advanced gastric cancer.","t":"HER2 gastric"},{"n":7,"stem":"A man with metastatic gastric cancer progresses on first-line fluoropyrimidine and platinum. Which combination improved survival in the RAINBOW trial?","opts":["Cetuximab with paclitaxel","Ramucirumab alone","Sunitinib","Imatinib","Ramucirumab with paclitaxel"],"a":4,"e":"Ramucirumab, a VEGFR2 antibody, combined with paclitaxel improved overall survival over paclitaxel alone in the second line.","k":"Ramucirumab with paclitaxel is a standard second-line regimen for gastric cancer.","t":"Second-line gastric"},{"n":8,"stem":"Which first-line therapy was added to chemotherapy for gastric cancers expressing claudin 18.2 and negative for HER2?","opts":["Pembrolizumab","Cetuximab","Zolbetuximab","Ramucirumab","Trastuzumab"],"a":2,"e":"Zolbetuximab, a claudin 18.2 antibody, improved progression-free survival with mFOLFOX6 in SPOTLIGHT. Nausea and vomiting were common.","k":"Zolbetuximab targets claudin 18.2 and causes nausea and vomiting.","t":"Claudin 18.2"},{"n":9,"stem":"A woman with advanced gastric cancer has a tumor with microsatellite instability. What does it predict?","opts":["A strong benefit from immune checkpoint inhibitors","No benefit from immunotherapy","Resistance to chemotherapy only","Benefit from trastuzumab","Hereditary diffuse type"],"a":0,"e":"Mismatch repair deficiency predicts a high response to immunotherapy in gastrointestinal cancers, with durable benefit in some patients.","k":"Mismatch repair deficiency predicts benefit from checkpoint inhibitors.","t":"MSI-high gastric"},{"n":10,"stem":"A man has gastric adenocarcinoma with no distant metastases on CT and is considered for resection. Which step reveals occult peritoneal disease?","opts":["Liver ultrasound","Staging laparoscopy with peritoneal washings","Repeat CT","Bone scan","Tumor markers"],"a":1,"e":"Peritoneal metastases are often missed by CT. Staging laparoscopy changes management in a substantial proportion of patients with locally advanced gastric cancer.","k":"Staging laparoscopy finds peritoneal disease that CT misses.","t":"Staging laparoscopy"},{"n":11,"stem":"What is the standard extent of lymph node dissection for curative gastrectomy in many centers?","opts":["D0 lymphadenectomy","Mediastinal dissection only","No lymph node dissection","D2 lymphadenectomy","Sampling of one node"],"a":3,"e":"D2 lymphadenectomy removes perigastric and regional nodes and is standard in experienced centers, with lower recurrence than limited dissection.","k":"D2 lymphadenectomy is the standard in curative gastric surgery.","t":"D2 lymphadenectomy"},{"n":12,"stem":"A patient receiving perioperative FLOT has grade 3 neutropenia and diarrhea. Which drug component accounts for neuropathy and neutropenia risk?","opts":["Leucovorin","Fluorouracil only","Bevacizumab","Radiotherapy","Docetaxel"],"a":4,"e":"FLOT combines fluorouracil, leucovorin, oxaliplatin and docetaxel. Docetaxel is mainly responsible for neutropenia, and oxaliplatin for neuropathy.","k":"Docetaxel contributes neutropenia, and oxaliplatin contributes neuropathy in FLOT.","t":"FLOT toxicity"},{"n":13,"stem":"A man develops severe mucositis, diarrhea, and pancytopenia a week after his first cycle of fluorouracil. Which enzyme deficiency is suspected?","opts":["UGT1A1","Dihydropyrimidine dehydrogenase","Glucose-6-phosphate dehydrogenase","Thiopurine methyltransferase","Cytochrome CYP2D6"],"a":1,"e":"Dihydropyrimidine dehydrogenase metabolizes fluoropyrimidines, and deficiency causes severe, sometimes fatal, toxicity. Uridine triacetate is an antidote, and pretreatment testing is increasingly recommended.","k":"DPD deficiency causes severe fluoropyrimidine toxicity.","t":"DPD deficiency"},{"n":14,"stem":"A woman after total gastrectomy has early postprandial palpitations, sweating, and diarrhea. What is the likely cause?","opts":["Adrenal insufficiency","Pulmonary embolism","Early dumping syndrome, managed with small frequent low-carbohydrate meals","Pancreatitis","Hypothyroidism"],"a":2,"e":"Rapid emptying of hyperosmolar contents into the small bowel causes vasomotor and gastrointestinal symptoms. Dietary changes help, and octreotide is used for refractory cases.","k":"Early dumping is managed with small, frequent, low-carbohydrate meals.","t":"Dumping syndrome"},{"n":15,"stem":"A man 2 years after total gastrectomy has macrocytic anemia and paresthesias. Which deficiency is expected?","opts":["Vitamin K deficiency","Vitamin A deficiency","Zinc deficiency only","Vitamin C deficiency","Vitamin B12 deficiency, requiring lifelong parenteral supplementation"],"a":4,"e":"Loss of intrinsic factor after total gastrectomy leads to B12 deficiency. Iron and calcium malabsorption also occur, and supplementation is lifelong.","k":"Total gastrectomy requires lifelong vitamin B12 replacement.","t":"B12 after gastrectomy"},{"n":16,"stem":"Which condition predisposes to small bowel adenocarcinoma?","opts":["Crohn disease, celiac disease, and Lynch syndrome","Cholelithiasis","Irritable bowel syndrome","Diverticulosis","Gastroesophageal reflux"],"a":0,"e":"Chronic small bowel inflammation and hereditary syndromes raise risk. Treatment of advanced disease generally follows colorectal regimens.","k":"Crohn disease, celiac disease and Lynch syndrome predispose to small bowel adenocarcinoma.","t":"Small bowel adenocarcinoma risk"},{"n":17,"stem":"A woman has a low-grade mucinous appendiceal neoplasm with diffuse mucinous peritoneal deposits. What is the preferred treatment?","opts":["Systemic chemotherapy alone","Hemicolectomy alone","Observation only","Cytoreductive surgery with hyperthermic intraperitoneal chemotherapy at a specialized center","Radiotherapy"],"a":3,"e":"Pseudomyxoma peritonei has a slow behavior and responds poorly to systemic therapy. Complete cytoreduction with intraperitoneal chemotherapy offers long-term survival in selected patients.","k":"Pseudomyxoma peritonei is treated by cytoreduction with heated intraperitoneal chemotherapy.","t":"Pseudomyxoma"},{"n":18,"stem":"A 1.2 cm well-differentiated neuroendocrine tumor is found at the tip of the appendix after appendectomy, with clear margins. What is next?","opts":["Right hemicolectomy","No further surgery, since tumors under 2 cm are cured by appendectomy","Liver transplantation","Chemotherapy","Octreotide infusion"],"a":1,"e":"Appendiceal neuroendocrine tumors under 1 cm are cured by appendectomy, and tumors of 1 to 2 cm usually are, unless high-risk features such as base location, positive margins or lymphovascular invasion are present.","k":"Small appendiceal neuroendocrine tumors are cured by appendectomy.","t":"Appendiceal carcinoid size"},{"n":19,"stem":"A man with metastatic esophageal cancer has progressive dysphagia and cannot swallow saliva. What gives rapid relief?","opts":["A self-expanding esophageal stent","Repeat dilation every day","Gastric bypass","Observation","Chemotherapy only"],"a":0,"e":"Self-expanding metal stents give quick palliation of dysphagia in malignant obstruction. Radiotherapy or brachytherapy provide more durable relief but act more slowly.","k":"A self-expanding stent rapidly relieves malignant dysphagia.","t":"Esophageal stent"},{"n":20,"stem":"A patient with esophageal cancer has cough with swallowing and aspiration pneumonia. Imaging shows a tracheoesophageal fistula. What is the main palliative measure?","opts":["Antibiotics alone","Tube feeding without stent","Covered esophageal or airway stent","Observation","Higher-dose chemotherapy"],"a":2,"e":"A fistula between the esophagus and airway causes recurrent aspiration. Covered stents seal the fistula, and radiotherapy or chemotherapy can worsen it.","k":"A covered stent seals a malignant tracheoesophageal fistula.","t":"Tracheoesophageal fistula"},{"n":21,"stem":"A woman with HER2-negative advanced gastric cancer has PD-L1 combined positive score of 8. What does CheckMate 649 support?","opts":["Bevacizumab","Nivolumab alone only","No role for immunotherapy","Nivolumab with chemotherapy as first-line therapy, with greater benefit at higher scores","Cetuximab"],"a":3,"e":"CheckMate 649 showed improved overall survival with nivolumab plus chemotherapy, most at a combined positive score of 5 or more. Regulators vary on the score threshold for use.","k":"Nivolumab with chemotherapy improves survival in HER2-negative advanced gastric cancer.","t":"Immunotherapy in gastric"},{"n":22,"stem":"A woman with a CDH1 pathogenic variant asks about gastric cancer risk. What is advised?","opts":["Prophylactic colectomy","No action","Annual CT","Hormone therapy","Consider prophylactic total gastrectomy"],"a":4,"e":"CDH1 carriers have a high lifetime risk of diffuse gastric cancer, and endoscopic surveillance misses signet ring foci. Prophylactic gastrectomy is advised in early adulthood.","k":"CDH1 carriers are offered prophylactic total gastrectomy.","t":"Hereditary diffuse gastric"},{"n":23,"stem":"Which esophageal condition raises the risk of squamous cell carcinoma?","opts":["Diverticulum","Eosinophilic esophagitis alone","Long-standing achalasia","Hiatal hernia","Mild reflux"],"a":2,"e":"Chronic stasis and mucosal irritation from untreated achalasia raise squamous cancer risk, as do lye strictures and tylosis.","k":"Achalasia, lye strictures and tylosis predispose to esophageal squamous carcinoma.","t":"Achalasia risk"},{"n":24,"stem":"Which infection is the major risk factor for distal gastric adenocarcinoma?","opts":["Clostridioides difficile","Hepatitis C","Epstein-Barr virus only","Cytomegalovirus","Helicobacter pylori"],"a":4,"e":"Helicobacter pylori causes chronic gastritis, atrophy and intestinal metaplasia. Eradication lowers gastric cancer risk.","k":"Helicobacter pylori infection is the major risk factor for distal gastric cancer.","t":"H. pylori"},{"n":25,"stem":"What defines a Siewert type II gastroesophageal junction adenocarcinoma?","opts":["Tumor 5 cm below the junction","Tumor center within 1 cm above to 2 cm below the junction","Tumor limited to the antrum","Tumor in the duodenum","Tumor 5 to 10 cm above the junction"],"a":1,"e":"Siewert classification locates the tumor center relative to the anatomic cardia and guides the surgical approach.","k":"Siewert type II tumors are centered at the gastroesophageal junction.","t":"Siewert"},{"n":26,"stem":"A man with unresectable gastric antral cancer has persistent vomiting from outlet obstruction. Which palliative option offers quick relief of oral intake?","opts":["Radiotherapy only","No intervention","Antiemetics alone for months","Endoscopic duodenal stent or surgical gastrojejunostomy","Total parenteral nutrition as the only plan"],"a":3,"e":"Stenting gives faster oral intake and shorter stay, while gastrojejunostomy gives more durable relief in patients with longer expected survival.","k":"Gastric outlet obstruction is palliated by a duodenal stent or gastrojejunostomy.","t":"Gastric outlet"}]},{"ch":21,"title":"Colorectal and Anal Cancers","qs":[{"n":1,"stem":"A 46-year-old man with average risk and no symptoms asks when to begin colorectal cancer screening. What is the recommendation?","opts":["Begin at age 45, with colonoscopy every 10 years or an alternative stool or imaging test","Annual CT scans","Begin at age 30","Begin at age 60","No screening if asymptomatic"],"a":0,"e":"Guidelines lowered the screening start age to 45 for average-risk adults because of rising early-onset incidence. Options include colonoscopy, fecal immunochemical test, stool DNA and CT colonography.","k":"Average-risk colorectal screening begins at age 45.","t":"Colorectal screening"},{"n":2,"stem":"Which finding in resected stage II colon cancer is a high-risk feature favoring adjuvant chemotherapy discussion?","opts":["Right-sided location","Female sex","Tumor size of 2 cm","Age under 40","T4 tumor or fewer than 12 nodes examined"],"a":4,"e":"High-risk features include T4 disease, perforation or obstruction, lymphovascular or perineural invasion, poorly differentiated histology (except mismatch repair-deficient tumors), and inadequate nodal sampling.","k":"T4 disease or inadequate nodal sampling defines high-risk stage II colon cancer.","t":"High-risk stage II"},{"n":3,"stem":"A woman has stage II colon cancer with deficient mismatch repair and no high-risk features. What is the usual management?","opts":["Observation, because fluoropyrimidine monotherapy offers no benefit","Adjuvant bevacizumab","Adjuvant oxaliplatin","Pelvic radiotherapy","Adjuvant fluorouracil alone"],"a":0,"e":"Stage II tumors with deficient mismatch repair have a good prognosis and do not benefit from fluoropyrimidine alone, so observation is recommended.","k":"Stage II dMMR colon cancer is observed rather than treated with fluorouracil alone.","t":"dMMR stage II"},{"n":4,"stem":"A man on adjuvant FOLFOX has persistent grade 2 sensory neuropathy after 8 cycles. What is appropriate?","opts":["Give calcium and magnesium infusions as standard proof","Increase oxaliplatin","Add paclitaxel","Consider dose reduction or stopping oxaliplatin","Continue unchanged"],"a":3,"e":"Oxaliplatin neuropathy is cumulative and may persist. Dose reduction or discontinuation is advised for persistent grade 2 or higher toxicity, and no agent prevents it.","k":"Persistent grade 2 oxaliplatin neuropathy warrants dose reduction or stopping.","t":"Oxaliplatin neuropathy"},{"n":5,"stem":"What is a characteristic early symptom of oxaliplatin toxicity?","opts":["Pulmonary fibrosis","Hemorrhagic cystitis","Acute cold-induced paresthesias of the hands, feet, and throat","Cardiomyopathy","Hearing loss"],"a":2,"e":"Acute neurotoxicity from oxaliplatin is triggered by cold and resolves within days. Patients are advised to avoid cold drinks and exposure during infusion periods.","k":"Oxaliplatin causes cold-induced paresthesias.","t":"Cold sensitivity"},{"n":6,"stem":"Before considering cetuximab for metastatic colorectal cancer, which testing is required?","opts":["HER2 only","RAS mutation testing, with a wild-type result needed","BRCA testing","ALK testing","No testing is needed"],"a":1,"e":"Mutations in KRAS or NRAS predict lack of benefit from anti-EGFR antibodies. Patients with RAS wild-type, left-sided tumors benefit most.","k":"Anti-EGFR therapy requires RAS wild-type tumors.","t":"RAS testing"},{"n":7,"stem":"A man has RAS wild-type, BRAF wild-type metastatic colorectal cancer in the right colon. How does sidedness affect first-line therapy?","opts":["Sidedness has no effect","Right-sided tumors derive less benefit from anti-EGFR antibodies, so bevacizumab-based therapy is often preferred","Right-sided tumors always have MSI-high status","Right-sided tumors need radiotherapy","Anti-EGFR antibodies work better on the right"],"a":1,"e":"Primary tumor sidedness is prognostic and predictive. Left-sided RAS wild-type tumors benefit from anti-EGFR antibodies in the first line.","k":"Right-sided RAS wild-type tumors benefit less from anti-EGFR therapy.","t":"Sidedness"},{"n":8,"stem":"A patient on cetuximab develops an acneiform rash. What does the rash correlate with?","opts":["Cardiac failure","Treatment failure","Renal failure","Hepatic failure","Treatment benefit, and it is managed with topical and oral antibiotics"],"a":4,"e":"Acneiform rash from EGFR inhibition correlates with response and is managed with moisturizers, sunscreen, topical steroids and doxycycline.","k":"The rash from anti-EGFR antibodies correlates with benefit and is managed supportively.","t":"Cetuximab toxicity"},{"n":9,"stem":"Which laboratory abnormality is expected with panitumumab and cetuximab?","opts":["Hypomagnesemia","Hypercalcemia","Hyperkalemia","Hypernatremia","Hyperphosphatemia"],"a":0,"e":"EGFR inhibitors cause renal magnesium wasting. Monitoring and replacement are required, since severe deficiency can cause arrhythmia.","k":"Anti-EGFR antibodies cause hypomagnesemia.","t":"Panitumumab electrolytes"},{"n":10,"stem":"A man homozygous for UGT1A1*28 is to receive irinotecan. What is the concern?","opts":["Cardiac toxicity","Neuropathy","Reduced efficacy only","Increased risk of severe neutropenia and diarrhea","Ocular toxicity"],"a":3,"e":"UGT1A1 glucuronidates the active irinotecan metabolite SN-38. Reduced activity raises toxicity, and a lower starting dose is considered.","k":"UGT1A1*28 homozygosity increases irinotecan toxicity.","t":"Irinotecan genetics"},{"n":11,"stem":"A man with chemorefractory KRAS G12C-mutated metastatic colorectal cancer is offered targeted therapy. Which approach has shown benefit?","opts":["Osimertinib","Sotorasib alone","Sotorasib or adagrasib combined with an anti-EGFR antibody","Olaparib","Imatinib"],"a":2,"e":"In colorectal cancer, KRAS G12C inhibitors alone are limited by feedback EGFR signaling, so combination with cetuximab or panitumumab is used.","k":"KRAS G12C inhibitors in colorectal cancer are combined with anti-EGFR antibodies.","t":"KRAS G12C"},{"n":12,"stem":"A patient with RAS wild-type, HER2-amplified metastatic colorectal cancer has progressed on standard therapy. Which regimen is active?","opts":["Tucatinib with trastuzumab","Osimertinib","Sorafenib","Imatinib","Everolimus"],"a":0,"e":"HER2-amplified colorectal cancer, in about 3 percent of patients, responds to HER2-directed combinations such as tucatinib with trastuzumab.","k":"Tucatinib with trastuzumab is active in HER2-positive colorectal cancer.","t":"HER2 colorectal"},{"n":13,"stem":"A man with metastatic colorectal cancer progressed through fluoropyrimidine, oxaliplatin, irinotecan and targeted agents. Which oral agents have survival benefit?","opts":["Sunitinib","Abiraterone","Olaparib","Trifluridine-tipiracil, regorafenib, or fruquintinib","Imatinib"],"a":3,"e":"Trifluridine-tipiracil with bevacizumab, regorafenib and fruquintinib each extended survival in refractory disease.","k":"Trifluridine-tipiracil, regorafenib and fruquintinib are options for refractory colorectal cancer.","t":"Refractory colorectal"},{"n":14,"stem":"A fit man has 3 resectable liver metastases from colon cancer and no other disease. What is the preferred strategy?","opts":["Palliative chemotherapy only","Observation","Multidisciplinary evaluation for curative resection with systemic chemotherapy","Radiotherapy to the liver","Transplant for all"],"a":2,"e":"Resection of limited liver metastases can cure a proportion of patients, with 5-year survival around 40 percent. Perioperative chemotherapy is commonly given.","k":"Resectable colorectal liver metastases should be evaluated for curative resection.","t":"Liver metastases resection"},{"n":15,"stem":"What surveillance is recommended for a carrier of a Lynch syndrome mismatch repair variant?","opts":["Barium enema yearly","Annual CT colonography only","Colonoscopy every 10 years from age 50","No surveillance","Colonoscopy every 1 to 2 years starting at age 20 to 25"],"a":4,"e":"Lynch syndrome carries a high lifetime risk of colorectal and endometrial cancer. Frequent colonoscopy is advised, and aspirin may reduce risk.","k":"Lynch syndrome carriers need colonoscopy every 1 to 2 years from the early 20s.","t":"Lynch screening"},{"n":16,"stem":"A tumor shows loss of MLH1 and PMS2 on immunohistochemistry in a 72-year-old woman. Which test helps decide whether Lynch syndrome is likely?","opts":["FLT3 testing","BRAF V600E mutation or MLH1 promoter methylation testing","KRAS testing","HER2 testing","PD-L1 testing"],"a":1,"e":"Sporadic MLH1 loss is usually caused by promoter methylation, often with BRAF V600E. Absence of these findings raises concern for Lynch syndrome and germline testing.","k":"BRAF V600E or MLH1 methylation suggests sporadic loss rather than Lynch syndrome.","t":"MLH1 methylation"},{"n":17,"stem":"What is the main purpose of pelvic MRI in newly diagnosed rectal cancer?","opts":["To replace colonoscopy","To measure serum CEA","To detect lung metastases","To assess the tumor relation to the mesorectal fascia and nodal status","To assess liver function"],"a":3,"e":"High-resolution MRI predicts circumferential margin involvement and extramural invasion, guiding the choice of neoadjuvant therapy.","k":"Pelvic MRI defines the mesorectal fascia relation and guides neoadjuvant treatment of rectal cancer.","t":"Rectal MRI"},{"n":18,"stem":"A patient has locally advanced rectal cancer at high risk of recurrence, with enlarged nodes and a threatened margin. What approach lowers distant relapse?","opts":["Surgery alone","Hormonal therapy","Total neoadjuvant therapy with chemoradiation or short-course radiotherapy plus full-dose chemotherapy before surgery","No treatment","Adjuvant therapy only"],"a":2,"e":"Total neoadjuvant therapy improves compliance with systemic therapy and complete response rates, and is an established strategy for high-risk rectal cancer.","k":"Total neoadjuvant therapy is used for high-risk locally advanced rectal cancer.","t":"Total neoadjuvant therapy"},{"n":19,"stem":"A man achieves a clinical complete response after neoadjuvant therapy for low rectal cancer and wishes to avoid a permanent stoma. What is the strategy?","opts":["Watch and wait with intensive surveillance, accepting a risk of regrowth","Observation without endoscopy","No follow-up","Adjuvant radiotherapy","Immediate abdominoperineal resection"],"a":0,"e":"Selected patients with clinical complete response can be observed with endoscopy, MRI and digital examination. Local regrowth occurs in about a quarter and is usually salvageable.","k":"Watch and wait is an option after clinical complete response in rectal cancer.","t":"Watch and wait"},{"n":20,"stem":"A man has stage II anal squamous cell carcinoma. What is the standard treatment?","opts":["Chemotherapy alone","Chemoradiation with mitomycin and fluorouracil or capecitabine","Local excision","Radiotherapy alone","Abdominoperineal resection"],"a":1,"e":"The Nigro regimen of radiation with fluorouracil and mitomycin cures most patients and preserves the sphincter. Surgery is reserved for persistent or recurrent disease.","k":"Anal squamous cell carcinoma is treated with chemoradiation, not primary surgery.","t":"Anal cancer treatment"},{"n":21,"stem":"Which group has a high risk of anal cancer and may benefit from screening with anal cytology or high-resolution anoscopy?","opts":["Children","Adults over 80 only","Men with prostate cancer","Women with breast cancer","Men who have sex with men and people living with HIV"],"a":4,"e":"HPV-associated anal intraepithelial neoplasia is more frequent in people with HIV and men who have sex with men. Treatment of high-grade lesions lowers progression to cancer.","k":"People living with HIV are at high risk for anal cancer.","t":"Anal cancer screening"},{"n":22,"stem":"A woman has biopsy-proven persistent anal carcinoma 26 weeks after completing chemoradiation. What is the standard salvage treatment?","opts":["Abdominoperineal resection","Immunotherapy alone","Observation","Repeat chemoradiation","Hormone therapy"],"a":0,"e":"Regression can continue for several months after chemoradiation. Persistence at 26 weeks or recurrence is managed by salvage abdominoperineal resection.","k":"Persistent or recurrent anal cancer after chemoradiation is treated with salvage surgery.","t":"Persistent anal disease"},{"n":23,"stem":"After curative resection of stage III colon cancer, which surveillance schedule is recommended?","opts":["PET every month","Daily CEA","CEA and clinical review every 3 to 6 months, CT periodically, and colonoscopy at 1 year","No surveillance","Annual chest radiograph only"],"a":2,"e":"Surveillance for the first 3 to 5 years detects resectable recurrence. Colonoscopy is repeated at 1 year and then at intervals.","k":"Stage III colon cancer surveillance combines CEA, CT and colonoscopy.","t":"CEA surveillance"},{"n":24,"stem":"Which finding is associated with benefit from adjuvant aspirin in colon cancer?","opts":["BRAF wild-type","PIK3CA mutation in the tumor","MSI-high","KRAS mutation","HER2 amplification"],"a":1,"e":"Observational and trial data suggest aspirin lowers recurrence in PIK3CA-mutated colorectal cancer, though adoption varies.","k":"PIK3CA-mutated colorectal cancer may benefit from adjuvant aspirin.","t":"Aspirin PIK3CA"},{"n":25,"stem":"A woman with obstructing sigmoid cancer and a distended abdomen is in the emergency department. What is the first priority?","opts":["Chemotherapy first","Oral laxatives","Radiotherapy","Decompression and stabilization with a stent or diversion, before definitive treatment","Colonoscopy with a large biopsy only"],"a":3,"e":"Obstruction is an emergency. Options include stent as a bridge to surgery or resection with stoma, and the choice depends on the disease and the patient.","k":"Obstructing colon cancer needs decompression, by stent or surgery.","t":"Bowel obstruction"},{"n":26,"stem":"A man on capecitabine and oxaliplatin develops grade 3 diarrhea and mucositis. What is appropriate?","opts":["Double the oxaliplatin","Continue at full dose","Stop all therapy forever","Add irinotecan","Hold capecitabine, give supportive care, and resume at a reduced dose after recovery"],"a":4,"e":"Grade 3 toxicity from fluoropyrimidines needs interruption and dose reduction, and DPYD deficiency is considered if it is severe and early.","k":"Grade 3 fluoropyrimidine toxicity needs interruption and dose reduction.","t":"CAPOX toxicity"}]},{"ch":22,"title":"Hepatobiliary, Pancreatic, and Neuroendocrine Tumors","qs":[{"n":1,"stem":"A 58-year-old man with hepatitis B cirrhosis wants to know about surveillance for hepatocellular carcinoma. What is recommended?","opts":["Colonoscopy","No surveillance","Ultrasound with or without alpha-fetoprotein every 6 months","MRI of the brain","Annual chest radiograph"],"a":2,"e":"Patients with cirrhosis, and some with chronic hepatitis B without cirrhosis, undergo biannual ultrasound with or without AFP to detect small tumors.","k":"Patients with cirrhosis need ultrasound surveillance every 6 months.","t":"HCC surveillance"},{"n":2,"stem":"A man with cirrhosis has a 3 cm liver nodule with arterial enhancement and washout on multiphase CT. What is the diagnosis?","opts":["Hemangioma","Metastasis","Focal nodular hyperplasia","Biopsy is always required","Hepatocellular carcinoma, which can be diagnosed without biopsy in cirrhosis"],"a":4,"e":"In cirrhosis, characteristic arterial hyperenhancement with washout on multiphase imaging is diagnostic of hepatocellular carcinoma by LI-RADS criteria.","k":"Arterial enhancement with washout in a cirrhotic liver nodule is diagnostic of hepatocellular carcinoma.","t":"Noninvasive HCC diagnosis"},{"n":3,"stem":"Which patient with cirrhosis and hepatocellular carcinoma meets the Milan criteria for liver transplantation?","opts":["Four tumors of 4 cm each","One tumor of 4 cm with no vascular invasion","Tumor with extrahepatic metastasis","One tumor of 8 cm","Tumor with portal vein invasion"],"a":1,"e":"The Milan criteria are one tumor up to 5 cm or up to three tumors each up to 3 cm, with no vascular invasion or extrahepatic spread.","k":"Milan criteria allow one tumor to 5 cm or up to three tumors to 3 cm.","t":"Milan criteria"},{"n":4,"stem":"A patient with Child-Pugh A cirrhosis has a single 2 cm hepatocellular carcinoma and is not a surgical candidate. What is an effective curative-intent option?","opts":["Radiotherapy to the whole liver","Sorafenib","Observation","Radiofrequency or microwave ablation","Systemic chemotherapy"],"a":3,"e":"Thermal ablation gives high complete response rates for tumors under 3 cm, with outcomes comparable to resection in some series.","k":"Ablation is curative-intent for small hepatocellular carcinomas.","t":"Ablation"},{"n":5,"stem":"A patient has intermediate-stage multifocal hepatocellular carcinoma confined to the liver with preserved liver function. Which locoregional treatment is standard?","opts":["Transarterial chemoembolization","Intrathecal chemotherapy","Whole-liver radiotherapy","Cryotherapy only","Brachytherapy"],"a":0,"e":"Transarterial chemoembolization is the standard for BCLC stage B disease and can improve survival. It is contraindicated with portal vein thrombosis or decompensated cirrhosis.","k":"Transarterial chemoembolization is the standard for intermediate-stage hepatocellular carcinoma.","t":"TACE"},{"n":6,"stem":"Before starting atezolizumab and bevacizumab for hepatocellular carcinoma, which evaluation is recommended?","opts":["Thyroid ultrasound","Coronary angiography","Bone scan","Pulmonary function tests","Upper endoscopy to assess and treat varices"],"a":4,"e":"Bevacizumab increases bleeding risk, including from esophageal varices. Endoscopic assessment and treatment of high-risk varices are advised before starting.","k":"Screen for varices before bevacizumab in hepatocellular carcinoma.","t":"Varices before bevacizumab"},{"n":7,"stem":"Which tyrosine kinase inhibitor was noninferior to sorafenib in first-line advanced hepatocellular carcinoma?","opts":["Erlotinib","Osimertinib","Lenvatinib","Gefitinib","Imatinib"],"a":2,"e":"The REFLECT trial showed lenvatinib was noninferior to sorafenib for overall survival, with higher response rates. Hypertension and proteinuria are common.","k":"Lenvatinib is an alternative first-line agent for advanced hepatocellular carcinoma.","t":"Lenvatinib"},{"n":8,"stem":"A man with hepatocellular carcinoma previously treated with sorafenib has an alpha-fetoprotein of 1,200 ng/mL. Which second-line agent improved survival in this group?","opts":["Bevacizumab","Ramucirumab","Trastuzumab","Imatinib","Cetuximab"],"a":1,"e":"The REACH-2 trial showed a survival benefit of ramucirumab in patients with AFP of 400 ng/mL or higher after sorafenib.","k":"Ramucirumab improves survival when AFP is 400 ng/mL or higher after sorafenib.","t":"Ramucirumab AFP"},{"n":9,"stem":"A man with chronic hepatitis B and hepatocellular carcinoma has detectable HBV DNA. Which treatment is indicated alongside cancer therapy?","opts":["Ribavirin","No treatment","Rituximab","Nucleos(t)ide analogue such as entecavir or tenofovir","Interferon at high dose in all patients"],"a":3,"e":"Antiviral therapy lowers HBV DNA, reduces recurrence after resection, and prevents reactivation during systemic therapy.","k":"Patients with hepatitis B and hepatocellular carcinoma need antiviral therapy.","t":"Hepatitis B antivirals"},{"n":10,"stem":"A man with intrahepatic cholangiocarcinoma has a FGFR2 fusion and progressed on gemcitabine and cisplatin. Which drug is approved?","opts":["Pemigatinib","Trastuzumab","Osimertinib","Imatinib","Sorafenib"],"a":0,"e":"FGFR2 fusions occur in about 10 to 15 percent of intrahepatic cholangiocarcinomas. Pemigatinib and futibatinib have response rates around 35 to 40 percent, and hyperphosphatemia is a class effect.","k":"FGFR2 fusions in cholangiocarcinoma are treated with FGFR inhibitors such as pemigatinib.","t":"Biliary targets"},{"n":11,"stem":"A patient with previously treated cholangiocarcinoma has an IDH1 mutation. Which drug improved progression-free survival?","opts":["Olaparib","Alpelisib","Ivosidenib","Everolimus","Enasidenib"],"a":2,"e":"The ClarIDHy trial showed that ivosidenib improved progression-free survival over placebo in IDH1-mutant cholangiocarcinoma.","k":"Ivosidenib is used for IDH1-mutant cholangiocarcinoma.","t":"IDH1 cholangiocarcinoma"},{"n":12,"stem":"After resection of cholangiocarcinoma, which adjuvant therapy improved overall survival in the BILCAP trial?","opts":["Capecitabine for 6 months","Observation","Imatinib","Sorafenib","Radiotherapy alone"],"a":0,"e":"BILCAP showed a survival benefit for adjuvant capecitabine in resected biliary tract cancer, particularly in the per-protocol analysis.","k":"Adjuvant capecitabine is standard after resection of biliary tract cancer.","t":"Adjuvant biliary"},{"n":13,"stem":"Pathology after cholecystectomy for stones shows a T1b gallbladder carcinoma. What is the next step?","opts":["No further treatment","Chemotherapy alone","Radiotherapy alone","Observation","Re-resection with liver wedge and lymphadenectomy after staging"],"a":4,"e":"Incidental T1b or higher gallbladder cancer is treated with radical re-resection if disease is localized, which improves survival.","k":"Incidental gallbladder cancer of T1b or higher stage warrants re-resection.","t":"Incidental gallbladder cancer"},{"n":14,"stem":"A patient with obstructive jaundice has a CA 19-9 of 3,000 U/mL. What limits the interpretation of CA 19-9?","opts":["It is elevated only in colon cancer","It is never elevated","It is always diagnostic","It can be elevated in biliary obstruction and absent in Lewis-negative individuals","It is specific for liver disease"],"a":3,"e":"CA 19-9 lacks sensitivity and specificity and is a monitoring tool and not a screening test. Biliary obstruction raises levels, and Lewis antigen-negative patients cannot make it.","k":"CA 19-9 is raised by biliary obstruction and absent in Lewis-negative patients.","t":"Pancreatic CA 19-9"},{"n":15,"stem":"A woman has pancreatic adenocarcinoma abutting the superior mesenteric vein for 180 degrees. How is this classified, and what is the usual approach?","opts":["Resectable, with upfront surgery only","Borderline resectable, with neoadjuvant therapy before surgery","Benign, with observation","Locally advanced, with radiotherapy only","Metastatic, with palliative care"],"a":1,"e":"Venous abutment or limited involvement defines borderline resectable disease. Neoadjuvant therapy improves the chance of an R0 resection and treats micrometastases.","k":"Borderline resectable pancreatic cancer is treated with neoadjuvant therapy.","t":"Borderline resectable"},{"n":16,"stem":"A 58-year-old woman with excellent performance status recovers from resection of pancreatic adenocarcinoma. Which adjuvant regimen gave the longest survival in PRODIGE 24?","opts":["Radiotherapy alone","Gemcitabine alone","Observation","Modified FOLFIRINOX","Capecitabine alone"],"a":3,"e":"Modified FOLFIRINOX gave a median survival of over 4 years in PRODIGE 24 but also more toxicity, so it is for fit patients.","k":"Modified FOLFIRINOX is the preferred adjuvant regimen for fit patients after pancreatic resection.","t":"Adjuvant pancreatic"},{"n":17,"stem":"A man has metastatic pancreatic adenocarcinoma. What testing is recommended?","opts":["HER2 testing only","Germline testing for all patients, and tumor profiling","No genetic testing","Testing only if under age 40","Testing only for relatives"],"a":1,"e":"About 5 to 10 percent carry germline variants in BRCA1, BRCA2, PALB2 and others, which guides platinum and PARP inhibitor therapy and relatives' risk.","k":"All patients with pancreatic adenocarcinoma should have germline testing.","t":"Pancreatic germline testing"},{"n":18,"stem":"A man with unresectable pancreatic head cancer has steatorrhea and weight loss. What improves symptoms?","opts":["Pancreatic enzyme replacement therapy","Loperamide only","Antibiotics","High-dose steroids","Octreotide alone"],"a":0,"e":"Pancreatic exocrine insufficiency causes malabsorption and responds to enzyme replacement taken with meals, which also improves nutrition.","k":"Pancreatic enzyme replacement treats malabsorption from pancreatic cancer.","t":"Pancreatic enzyme replacement"},{"n":19,"stem":"A man with a midgut neuroendocrine tumor and liver metastases has flushing and diarrhea. Which drug controls these symptoms?","opts":["Propranolol alone","Imatinib","Metformin","Aspirin","Octreotide or lanreotide"],"a":4,"e":"Somatostatin analogues control hormonal symptoms and slow tumor growth in well-differentiated neuroendocrine tumors, as shown in PROMID and CLARINET.","k":"Somatostatin analogues control carcinoid syndrome and slow tumor growth.","t":"Carcinoid syndrome"},{"n":20,"stem":"A man with carcinoid syndrome has a new tricuspid murmur and right heart failure. What is the likely cause?","opts":["Pulmonary fibrosis","Left ventricular hypertrophy","Carcinoid heart disease with fibrous plaques on right-sided valves","Rheumatic fever","Infective endocarditis"],"a":2,"e":"Serotonin-related fibrosis affects right-sided valves, and echocardiography is advised in carcinoid syndrome with elevated urinary 5-HIAA.","k":"Carcinoid syndrome can cause right-sided valve fibrosis.","t":"Carcinoid heart disease"},{"n":21,"stem":"A patient with progressive well-differentiated pancreatic neuroendocrine tumor needs systemic therapy and has low somatostatin receptor expression. Which drugs have randomized evidence?","opts":["Gefitinib","Rituximab","Tamoxifen","Imatinib","Everolimus or sunitinib"],"a":4,"e":"Everolimus and sunitinib improved progression-free survival in pancreatic neuroendocrine tumors in randomized trials. Hyperglycemia and stomatitis are everolimus toxicities.","k":"Everolimus and sunitinib are options for progressive pancreatic neuroendocrine tumors.","t":"pNET targeted"},{"n":22,"stem":"A woman has episodic confusion relieved by sugar, fasting glucose of 38 mg/dL, and inappropriately high insulin. What is the diagnosis?","opts":["Gastrinoma","VIPoma","Insulinoma","Glucagonoma","Carcinoid"],"a":2,"e":"Whipple triad of symptomatic hypoglycemia, low glucose and relief with glucose, with high insulin and C-peptide, indicates insulinoma. Most are benign and resectable.","k":"Hypoglycemia with high insulin and C-peptide indicates insulinoma.","t":"Insulinoma"},{"n":23,"stem":"Why is liver function assessed before systemic therapy for hepatocellular carcinoma?","opts":["Most trials enrolled only Child-Pugh A patients, and decompensation limits options","It is irrelevant","It predicts HER2 status","It determines the tumor grade","It replaces imaging"],"a":0,"e":"Underlying cirrhosis determines tolerability and survival, so Child-Pugh class and performance status guide treatment.","k":"Child-Pugh class guides therapy choice in hepatocellular carcinoma.","t":"Child-Pugh"},{"n":24,"stem":"A woman has resectable pancreatic head cancer with jaundice. Which operation is standard?","opts":["Esophagectomy","Pancreaticoduodenectomy","Total gastrectomy","Liver transplant","Distal pancreatectomy"],"a":1,"e":"Tumors of the pancreatic head are removed by pancreaticoduodenectomy (Whipple), and complications include fistula and delayed gastric emptying.","k":"Pancreaticoduodenectomy is the operation for pancreatic head cancer.","t":"Whipple"},{"n":25,"stem":"A man with pancreatic cancer and jaundice is to receive neoadjuvant chemotherapy. What is placed to relieve obstruction?","opts":["Nothing","A bladder catheter","A gastrostomy","A metal biliary stent, by endoscopic retrograde cholangiopancreatography","A chest tube"],"a":3,"e":"Biliary drainage relieves jaundice and cholangitis risk and allows chemotherapy. Self-expanding metal stents last longer than plastic ones.","k":"Metal biliary stents relieve obstruction before chemotherapy.","t":"Biliary stent"},{"n":26,"stem":"A patient with a somatostatin receptor-positive midgut neuroendocrine tumor progresses on octreotide. Which therapy improved progression-free survival?","opts":["Sorafenib","Lutetium dotatate","Cisplatin","Imatinib","Gefitinib"],"a":1,"e":"Peptide receptor radionuclide therapy needs uptake on somatostatin receptor imaging, and bone marrow and kidney function are monitored.","k":"Lutetium dotatate treats progressive somatostatin receptor-positive neuroendocrine tumors.","t":"Peptide receptor"}]},{"ch":23,"title":"Gastrointestinal Genetics and Treatment Complications","qs":[{"n":1,"stem":"A 16-year-old has hundreds of colonic adenomas and an APC pathogenic variant. What is the expected management?","opts":["No surveillance of the stomach and duodenum","Colonoscopy every 10 years from age 50","Observation until cancer develops","Chemotherapy to prevent polyps","Prophylactic colectomy, timed by polyp burden, with upper GI surveillance"],"a":4,"e":"Untreated classic familial adenomatous polyposis leads to colorectal cancer almost universally, so colectomy is performed in the teens or twenties. Duodenal adenomas need lifelong endoscopic surveillance.","k":"Classic FAP requires prophylactic colectomy and duodenal surveillance.","t":"FAP"},{"n":2,"stem":"A man has 30 colorectal adenomas, and his parents are unaffected. Which inheritance pattern suggests MUTYH-associated polyposis?","opts":["X-linked","Chromosomal translocation","Mitochondrial","Autosomal recessive, with biallelic MUTYH variants","Autosomal dominant APC"],"a":3,"e":"MUTYH-associated polyposis causes an attenuated polyposis phenotype and requires two pathogenic variants, so parents are usually unaffected carriers.","k":"MUTYH-associated polyposis is autosomal recessive.","t":"MUTYH"},{"n":3,"stem":"A young woman has mucocutaneous pigmentation of the lips and hamartomatous small bowel polyps with intussusception. Which gene is affected?","opts":["STK11","SMAD4","MLH1","PTEN","APC"],"a":0,"e":"Peutz-Jeghers syndrome from STK11 variants raises the risk of gastrointestinal, breast, pancreatic and gynecologic cancers and calls for lifelong surveillance.","k":"STK11 variants cause Peutz-Jeghers syndrome.","t":"Peutz-Jeghers"},{"n":4,"stem":"A patient with juvenile polyposis and epistaxis with arteriovenous malformations has which gene variant?","opts":["STK11","MUTYH","SMAD4","TP53","APC"],"a":2,"e":"SMAD4 variants cause juvenile polyposis with hereditary hemorrhagic telangiectasia in some patients, and carry a high risk of gastric and colorectal cancer.","k":"SMAD4 variants cause juvenile polyposis and may coexist with hereditary hemorrhagic telangiectasia.","t":"Juvenile polyposis"},{"n":5,"stem":"A hospital wants a screening strategy to find Lynch syndrome among all new colorectal cancers. What is recommended?","opts":["No tumor testing","Testing only patients over 80","Testing only those with family history","Immunohistochemistry for mismatch repair proteins or microsatellite testing on every tumor","Germline panel for all patients without tumor testing"],"a":3,"e":"Universal tumor screening identifies many cases missed by family-history criteria, and abnormal results prompt germline testing.","k":"Universal tumor testing for mismatch repair finds many Lynch syndrome cases.","t":"Universal testing"},{"n":6,"stem":"A woman on ipilimumab and nivolumab develops 8 loose stools daily above baseline, with abdominal pain. What grade is this and what is the first step?","opts":["Grade 4, cease permanently with no steroids","Not immune-related","Grade 3 colitis, so hold immunotherapy and start high-dose corticosteroids","Grade 1, continue and observe","Grade 2, give loperamide alone"],"a":2,"e":"Seven or more stools a day above baseline indicates grade 3 diarrhea. Infection is excluded, and steroids are started, with infliximab or vedolizumab if no response.","k":"Grade 3 immune colitis needs held therapy and high-dose corticosteroids.","t":"Immune colitis"},{"n":7,"stem":"A man with immune-related colitis has no improvement after 3 days of intravenous methylprednisolone. What is next?","opts":["Add oral vancomycin only","Restart immunotherapy","Add loperamide only","Stop steroids","Add infliximab or vedolizumab"],"a":4,"e":"Steroid-refractory immune colitis responds to tumor necrosis factor inhibition or integrin blockade. Infliximab is avoided in hepatitis.","k":"Infliximab or vedolizumab treats steroid-refractory immune colitis.","t":"Steroid-refractory colitis"},{"n":8,"stem":"A patient on pembrolizumab has an alanine aminotransferase of 12 times the upper limit with normal bilirubin. What is the management?","opts":["Hold immunotherapy and begin corticosteroids after excluding other causes","Start infliximab first","Give acetaminophen","Continue treatment unchanged","Give vitamin K"],"a":0,"e":"Grade 3 hepatitis from immunotherapy is treated with steroids. Mycophenolate is added for refractory cases, and infliximab is avoided because of hepatotoxicity.","k":"Grade 3 immune hepatitis is treated with held therapy and corticosteroids.","t":"Immune hepatitis"},{"n":9,"stem":"Which immune-related adverse event can be managed without permanent discontinuation of checkpoint inhibitors, even at high grade?","opts":["Myocarditis","Endocrinopathies controlled with hormone replacement","Colitis","Neurologic toxicity","Pneumonitis"],"a":1,"e":"Hypothyroidism, adrenal insufficiency and diabetes controlled with hormone replacement allow continued immunotherapy. Other life-threatening events generally lead to permanent discontinuation.","k":"Endocrinopathies on replacement can continue immunotherapy.","t":"Grade 4 events"},{"n":10,"stem":"Which chemotherapy agent has high emetic risk requiring a four-drug antiemetic regimen?","opts":["Cisplatin","Bevacizumab","Capecitabine","Vincristine","Methotrexate low dose"],"a":0,"e":"Cisplatin is highly emetogenic. Prophylaxis uses an NK1 antagonist, a 5-HT3 antagonist, dexamethasone and olanzapine.","k":"Cisplatin needs four-drug antiemetic prophylaxis.","t":"Antiemetic risk"},{"n":11,"stem":"A woman has breakthrough nausea on cisplatin despite ondansetron and dexamethasone. Which agent has strong evidence in this setting?","opts":["Lorazepam alone","Metoclopramide alone","Olanzapine","Prochlorperazine alone","Haloperidol"],"a":2,"e":"Olanzapine improves control of nausea and vomiting, both as part of prophylaxis and for breakthrough symptoms. Sedation is the main adverse effect.","k":"Olanzapine controls chemotherapy-induced nausea and is part of high-risk regimens.","t":"Olanzapine"},{"n":12,"stem":"When does delayed chemotherapy-induced nausea and vomiting occur?","opts":["Before chemotherapy","Only after 2 weeks","Only during infusion","Within 5 minutes","More than 24 hours after chemotherapy, usually peaking at 2 to 3 days"],"a":4,"e":"Acute emesis occurs within 24 hours, mediated by serotonin, whereas delayed emesis is mediated by substance P and responds to NK1 antagonists and dexamethasone.","k":"Delayed emesis occurs beyond 24 hours and responds to NK1 antagonists.","t":"Delayed emesis"},{"n":13,"stem":"A woman feels nauseated on arriving at the infusion center before treatment. Which approach is most effective?","opts":["Ondansetron alone","Dexamethasone","Higher chemotherapy doses","Behavioral therapy and benzodiazepines, plus optimal prevention in early cycles","Ignoring symptoms"],"a":3,"e":"Anticipatory nausea is a conditioned response and is best prevented by good control in earlier cycles. Relaxation techniques and lorazepam help.","k":"Anticipatory nausea is best prevented with good control in early cycles.","t":"Anticipatory nausea"},{"n":14,"stem":"A man has painful chemotherapy-induced peripheral neuropathy 2 months after oxaliplatin. Which agent has supporting trial evidence?","opts":["Amitriptyline as proven","Duloxetine","Gabapentin","Vitamin E","Acetyl-L-carnitine"],"a":1,"e":"A randomized trial showed duloxetine reduced neuropathic pain. Acetyl-L-carnitine may worsen neuropathy, and no agent has been proven to prevent it.","k":"Duloxetine is the only agent with adequate evidence for painful neuropathy.","t":"Duloxetine"},{"n":15,"stem":"A woman on capecitabine has painful redness and peeling of her palms and soles. What is the management?","opts":["Hold or reduce the dose, with emollients and urea cream","Ignore","Give antibiotics routinely","Increase capecitabine","Add radiotherapy"],"a":0,"e":"Hand-foot syndrome is dose-related and improves with interruption and dose reduction. Skin care and avoiding friction help.","k":"Hand-foot syndrome is managed by dose reduction and skin care.","t":"Hand-foot syndrome"},{"n":16,"stem":"A man is heterozygous for a decreased-function DPYD variant and needs fluorouracil. What is recommended?","opts":["Standard full dose","Give uridine triacetate prophylactically","Start at a reduced dose and titrate to tolerance","Avoid all chemotherapy","Double the dose"],"a":2,"e":"Heterozygous carriers have partial deficiency, so a 50 percent starting dose with escalation is recommended. Complete deficiency calls for avoiding fluoropyrimidines.","k":"Partial DPYD deficiency calls for a reduced fluoropyrimidine starting dose.","t":"DPYD heterozygous"},{"n":17,"stem":"A woman receiving irinotecan has cholinergic diarrhea with sweating and cramping during infusion. What treats it?","opts":["Infliximab","Vancomycin","Loperamide","Octreotide","Atropine"],"a":4,"e":"Early diarrhea from irinotecan is cholinergic and responds to atropine, whereas late diarrhea is treated with high-dose loperamide.","k":"Early irinotecan diarrhea is treated with atropine.","t":"Diarrhea from irinotecan"},{"n":18,"stem":"A woman at day 8 after chemotherapy has fever, right lower quadrant pain, and neutropenia. Imaging shows cecal wall thickening. What is the diagnosis?","opts":["Appendicitis requiring immediate surgery in all cases","Neutropenic enterocolitis, treated with broad-spectrum antibiotics covering anaerobes","Diverticulosis","Gastroenteritis only","Crohn disease"],"a":1,"e":"Neutropenic enterocolitis occurs after cytotoxic therapy and is managed with bowel rest, antibiotics and supportive care, with surgery for perforation or ischemia.","k":"Neutropenic enterocolitis is treated with broad-spectrum antibiotics including anaerobic cover.","t":"Neutropenic enterocolitis"},{"n":19,"stem":"A woman on ipilimumab has headache, fatigue and hypotension, with low cortisol and low ACTH. What is the diagnosis and key treatment?","opts":["Pituitary adenoma needing surgery","Hyperthyroidism","Primary adrenal failure only","Hypophysitis, with physiologic hydrocortisone replacement before thyroid hormone","Pheochromocytoma"],"a":3,"e":"Checkpoint inhibitor hypophysitis causes secondary adrenal insufficiency. Steroids are started before thyroid hormone to avoid adrenal crisis.","k":"Immune hypophysitis needs hydrocortisone before levothyroxine.","t":"Immune hypophysitis"},{"n":20,"stem":"A man on nivolumab has cough, dyspnea and ground-glass opacities. Infection is excluded. What is the treatment for grade 3 disease?","opts":["Continue and observe","Antibiotics alone","Hold immunotherapy and give high-dose corticosteroids","Diuretics","Bronchodilators alone"],"a":2,"e":"Pneumonitis is treated by grade, with steroids for grade 2 and higher, and additional immunosuppression for refractory cases.","k":"Grade 3 immune pneumonitis is treated with held therapy and high-dose corticosteroids.","t":"Immune pneumonitis"}]},{"ch":24,"title":"Skin Cancers","qs":[{"n":1,"stem":"A man has a 1.5 mm thick melanoma on his back. What surgical margin is recommended for wide local excision?","opts":["No excision needed","2 cm","5 cm","0.5 cm","5 mm only"],"a":1,"e":"Margins are 1 cm for tumors up to 1 mm and 1 to 2 cm for tumors 1 to 2 mm. Thicker than 2 mm calls for 2 cm margins.","k":"Melanoma margins are tied to Breslow thickness, with 2 cm for thick tumors.","t":"Melanoma margins"},{"n":2,"stem":"A woman has a 1.8 mm thick melanoma without clinical nodal disease. What is offered for staging?","opts":["Sentinel lymph node biopsy","Completion lymph node dissection in all","Bone scan","Brain MRI","Observation without staging"],"a":0,"e":"Sentinel node biopsy is recommended for tumors thicker than 1 mm and informs prognosis and adjuvant therapy. Completion dissection no longer improves survival for node-positive patients.","k":"Sentinel node
