<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medical Oncology Clinical Casebook: Online Companion</title>
<style>
:root{--g:#6E1E3A;--gd:#4a1226;--ink:#2B3440;--mut:#6B7280;--bg:#F6F4F2;--card:#fff;--line:#E3DED9;--ok:#1F7A4D;--bad:#B42318;--gold:#E8B04A}
*{box-sizing:border-box}body{margin:0;font-family:Calibri,Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:980px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{border-left:4px solid var(--g);padding-left:10px;font-weight:700;line-height:1.15}.brand small{display:block;font-size:11px;letter-spacing:.08em;color:var(--g);font-weight:700}
nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:0;padding:8px 11px;border-radius:8px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}nav button.on{background:#f3e6ea;color:var(--g)}
main{max-width:980px;margin:auto;padding:18px 16px 60px}
.hero{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-radius:16px;padding:30px 26px}
.hero h1{margin:4px 0 8px;font-size:34px;line-height:1.1}.hero .eb{letter-spacing:.12em;font-size:12px;font-weight:700;color:var(--gold)}.hero p{max-width:560px;margin:0 0 16px;opacity:.95}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}.btn.alt{background:#fff;color:var(--g);border:1px solid var(--g)}.btn.gold{background:var(--gold);color:#2b1a05}.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:16px 0}
.stat{background:#fff;padding:12px 14px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.ch{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit}.ch:hover{border-color:var(--g)}.ch b{color:var(--g)}.ch small{display:block;color:var(--mut)}
h2{color:var(--g);margin:20px 0 8px}.q{font-size:17px}.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font:inherit;cursor:pointer}
.opt.sel{border-color:var(--g);background:#f8eef1}.opt.ok{border-color:var(--ok);background:#e8f5ee}.opt.bad{border-color:var(--bad);background:#fdecea}
.kp{background:#f4f5f7;border-left:4px solid var(--g);padding:10px 12px;border-radius:6px;margin-top:10px}
.bar2{height:8px;background:#ece7e3;border-radius:6px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--g)}
.fc{min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px;padding:24px;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:14px}
.fc.back{background:#f8eef1}.tag{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
table{border-collapse:collapse;width:100%}th{background:var(--g);color:#fff;text-align:left}th,td{padding:7px 9px;border:1px solid var(--line);vertical-align:top}
.gate{max-width:440px;margin:12vh auto;padding:0 16px;text-align:center}.gate input{width:100%;font:inherit;font-size:20px;text-align:center;letter-spacing:.12em;padding:12px;border:2px solid var(--line);border-radius:10px;margin:14px 0 10px;text-transform:uppercase}
.err{color:var(--bad);min-height:22px;font-weight:600}.foot{color:var(--mut);font-size:12px;margin-top:30px}
@media(max-width:600px){.hero h1{font-size:27px}nav{margin-left:0}}
</style></head><body>
<div id="app"></div>
<script>
const DATA={"D": [{"ch": 1, "title": "Clinical Research Methodology and Ethics", "qs": [{"n": 1, "stem": "A 63-year-old man with metastatic colon cancer has three target lesions with a baseline sum of longest diameters of 100 mm. After four cycles the sum is 68 mm. No new lesions appear, and nontarget lesions are stable on the same scan. His oncologist records the response according to RECIST 1.1. What is the correct category?", "opts": ["Partial response", "Complete response because no lesions are new", "Stable disease because the fall is under half", "Progressive disease because the sum is not zero", "Not evaluable until a pathology review is done"], "a": 0, "e": "RECIST 1.1 follows the sum of the longest diameters of up to five target lesions. A fall of 30 percent in the sum is a partial response, and a rise of 20 percent with an absolute increase of at least 5 mm is progressive disease. His sum has fallen by 32 percent, and there are no new lesions and the nontarget lesions are stable, so the response is partial. Complete response needs disappearance of all target lesions.", "k": "RECIST 1.1 partial response: 30 percent fall in the sum of target diameters.", "t": "RECIST partial response"}, {"n": 2, "stem": "A 57-year-old woman with melanoma has enlarging lung nodules on her first scan after starting immunotherapy. She feels well, her blood counts and organ function are stable, and her performance status is unchanged. Her oncologist applies iRECIST to the scan. What is the best next step?", "opts": ["Declare treatment failure and stop immediately", "Switch to cytotoxic chemotherapy at once", "Order a new biopsy before any further scan", "Continue treatment and repeat imaging", "Record a complete response because she feels well"], "a": 3, "e": "Immunotherapy can cause a transient increase in tumor size before shrinkage. iRECIST records the finding as unconfirmed progression, and progression is confirmed only if repeat imaging shows further growth. A clinically stable patient may continue treatment while confirmation is awaited, and the team documents the date of the first suspicion. A declining patient would not wait, because the decision rests on the clinical picture as well as the scan.", "k": "Growth on immunotherapy in a stable patient: unconfirmed progression, continue and repeat imaging.", "t": "iRECIST unconfirmed progression"}, {"n": 3, "stem": "A 70-year-old man with advanced cancer is offered a new drug that improved progression-free survival in a randomized trial, with no overall survival data yet and a modest effect on quality of life. His oncologist wants a structured way to describe how large the benefit is. Which tool is designed for this purpose?", "opts": ["The Deauville five-point scale for PET", "The revised Cochrane risk-of-bias tool", "ESMO-MCBS grading", "RECIST 1.1 response categories", "The CONSORT participant flow diagram"], "a": 2, "e": "The ESMO Magnitude of Clinical Benefit Scale grades the size of benefit seen in a trial. A high grade signals a meaningful gain in survival or quality of life, and a low grade signals a modest one. RECIST measures tumor response on imaging, CONSORT guides reporting, and the Cochrane tool judges bias. His oncologist can use the scale to explain that a gain in progression-free survival alone, with a modest effect on quality of life, may rate low.", "k": "ESMO-MCBS grades the size of clinical benefit seen in a trial.", "t": "ESMO magnitude of clinical benefit"}, {"n": 4, "stem": "A reviewer assesses a randomized oncology trial. Allocation was by a sequence generated in advance, but envelopes were not sealed and site staff could view the next assignment before enrolling each patient. Outcome assessors were unblinded. Which bias domain does the first problem concern, using the revised Cochrane tool for randomized trials?", "opts": ["Deviations that arise from the funding source", "The randomization process", "Missing outcome data across arms", "Measurement of the outcome in subgroups only", "Selection of the reported result among analyses"], "a": 1, "e": "The revised Cochrane tool for randomized trials examines bias in five domains, beginning with the randomization process. Concealed allocation protects against selection of patients by staff who can predict the assignment. Here the open sequence breaks concealment and so raises risk of bias in that first domain. Unblinded outcome assessment raises a separate concern about measurement of the outcome, and both would lower confidence in the result.", "k": "Broken allocation concealment is a randomization-process bias.", "t": "Risk of bias in randomized trials"}, {"n": 5, "stem": "A journal editor receives a randomized oncology trial and wants authors to follow the current reporting guideline. The manuscript omits the participant flow diagram and does not describe where the protocol and data can be found. The editor asks the authors to cite the guideline that includes an open science section. Which guideline applies?", "opts": ["RECIST 1.1", "The Declaration of Helsinki 2024", "The ESMO Magnitude of Clinical Benefit Scale", "iRECIST", "CONSORT 2025"], "a": 4, "e": "CONSORT 2025 updates the reporting guideline for randomized trials, and it is a 30-item checklist with 7 new items, 3 revised items and 1 deleted item. It adds an open science section, and a participant flow diagram remains part of the statement. Its development used a three-round Delphi survey with 317 participants and a consensus meeting of 30 experts. The other tools measure response, set ethical principles or grade benefit, so none fits.", "k": "CONSORT 2025: 30-item checklist, participant flow diagram and an open science section.", "t": "CONSORT 2025"}, {"n": 6, "stem": "An investigator plans a phase 2 trial in a rare cancer. The protocol is complete, but she has not yet submitted it for independent review, and the consent form is being drafted. Her trial coordinator asks which ethical principles should be settled before any patient is enrolled. What is the best answer?", "opts": ["Registration of the drug with an insurer", "Choice of the response criteria only", "Statistical analysis plan approval alone", "Publication in a journal after enrollment ends", "Ethics review and informed consent"], "a": 4, "e": "The Declaration of Helsinki sets the ethical principles for research on people, and the 2024 revision is the current version. Participation is voluntary, consent is informed, and an independent ethics committee reviews the protocol before enrollment begins. Statistical plans, response criteria and publication are important to a trial, but none replaces independent ethical review or valid consent. Enrolling patients before both are in place would breach the central principles of the declaration.", "k": "Before enrollment: independent ethics review and informed voluntary consent.", "t": "Declaration of Helsinki"}, {"n": 7, "stem": "A 66-year-old man is offered a phase 2 trial that requires a fresh tumor biopsy before treatment and another on progression. The second biopsy would not change his care and is not needed to answer the primary question. He worries about bleeding risk. According to the ASCO framework, how should the second biopsy be handled?", "opts": ["As an optional biopsy", "As a procedure with no consent needed", "As a condition for receiving the study drug", "As mandatory for every participant", "As a reason to exclude him from the trial"], "a": 0, "e": "Research biopsies serve scientific goals and may offer participants no direct benefit while carrying known risks. The ASCO framework addresses participant protections, informed consent and understanding of risks and benefits, and it guides when biopsies should be optional or mandatory. Mandatory biopsies are reserved for those essential to the aims of the trial. His second biopsy is not essential, so it should be optional, and refusal never affects his access to treatment.", "k": "A research biopsy that is not essential to trial aims should be optional.", "t": "Research biopsy as optional or mandatory"}, {"n": 8, "stem": "A 60-year-old woman reads that a new drug improved progression-free survival with no gain in overall survival in a randomized trial. She asks her oncologist whether the drug really works and whether she should take it. The oncologist reviews what progression-free survival means as an endpoint. What is the best explanation?", "opts": ["It proves that the drug prolongs life", "It measures only quality of life", "It is useless because it ignores progression", "It is a surrogate that needs to predict benefit", "It is identical to overall survival in all diseases"], "a": 3, "e": "Overall survival is the most reliable endpoint, but it needs long follow-up and is affected by later therapy. Progression-free survival is a common surrogate, and it is accepted when it predicts survival or patient benefit in that disease. A gain in progression-free survival without a survival gain is promising but leaves the survival question open. The oncologist explains the trade-offs, including toxicity, so she can decide with realistic expectations.", "k": "Progression-free survival is a surrogate and counts only if it predicts patient benefit.", "t": "Surrogate endpoints"}, {"n": 9, "stem": "In a randomized trial of two regimens, 15 patients assigned to the experimental arm never received the drug because of early deterioration. The investigator proposes dropping them from the analysis to show the true effect of the drug. A reviewer must decide which analysis best preserves the validity of the randomized comparison. What should the reviewer recommend?", "opts": ["Analysis restricted to the final cohort", "Exclusion of every patient who died early", "Intention-to-treat analysis", "Analysis of responders in each arm", "Per-protocol analysis of treated patients only"], "a": 2, "e": "Intention-to-treat analysis keeps patients in the arm to which they were randomized, whatever treatment they received. It protects the comparison from selection effects that arise when patients drop out or switch. Dropping the early deteriorations would remove patients who did poorly from one arm only, and it would bias the result in favor of the drug. A per-protocol analysis can be reported as supportive, but it is not the primary analysis.", "k": "Intention-to-treat analysis preserves the randomized comparison.", "t": "Intention-to-treat analysis"}, {"n": 10, "stem": "An investigator reviews a trial in which 70 percent of control patients crossed over to the experimental drug after progression. The experimental drug doubled progression-free survival, but overall survival shows no difference between arms. She wonders how to interpret the survival result. What is the best interpretation?", "opts": ["Overall survival can never be analyzed", "Crossover may dilute a true survival difference", "Randomization failed in the control arm", "The progression-free survival result is invalid", "The drug has proven to be ineffective"], "a": 1, "e": "Crossover after progression can dilute a survival difference even when the experimental drug works, because control patients receive the drug later. Statisticians adjust for it, but the adjustments rest on assumptions, and the reader weighs them carefully. The doubling of progression-free survival remains a valid finding. She asks the statistician for an adjusted analysis and reads its assumptions before drawing conclusions about the drug.", "k": "High crossover can dilute an overall survival difference.", "t": "Crossover and survival"}, {"n": 11, "stem": "A trial of a new regimen reports a hazard ratio for progression or death of 0.70, with a 95 percent confidence interval from 0.55 to 0.89. A resident asks what the result means for the comparison between the new regimen and the control. Which statement is the most accurate reading?", "opts": ["The interval proves that the effect is exactly 30 percent", "The control arm has the lower hazard", "The new regimen lowers the hazard of progression or death", "The result cannot be interpreted without survival curves", "The new regimen raises the hazard of progression or death"], "a": 2, "e": "A hazard ratio under 1 favors the experimental arm, and its confidence interval shows the precision of the estimate. Here the whole interval lies under 1, so the lower hazard is unlikely to be due to chance. The point estimate suggests about a 30 percent lower hazard at any time, but the interval shows that the true effect could be smaller or larger. The reader also weighs the endpoint, the follow-up and the toxicity.", "k": "Hazard ratio under 1 with an interval that excludes 1 favors the experimental arm.", "t": "Hazard ratio"}, {"n": 12, "stem": "A trial compares a new oral drug with standard intravenous therapy and aims to show non-inferiority. The reported hazard ratio is 1.05, and the upper bound of its confidence interval is 1.20. The prespecified margin was 1.25. A fellow asks whether the trial supports a claim of non-inferiority. What is the correct reading?", "opts": ["Yes, the upper bound is within the margin", "No, because the hazard ratio exceeds 1", "No, because the trial did not show superiority", "It cannot be judged without overall survival", "Yes, because the margin was set after the results"], "a": 0, "e": "Non-inferiority trials set a margin in advance, and the claim of equivalence holds only within that margin. A claim is supported when the upper bound of the confidence interval for the hazard ratio stays under the margin. Here the bound of 1.20 is under the margin of 1.25, so non-inferiority is shown even though the point estimate is over 1. A margin set after the results would invalidate the test.", "k": "Non-inferiority holds when the interval bound stays within the prespecified margin.", "t": "Non-inferiority margin"}, {"n": 13, "stem": "A reviewer assesses a randomized trial submitted to a journal. The report gives no participant flow diagram and does not state how allocation was concealed, and the primary endpoint changed during the study without explanation. The reviewer must decide what to ask of the authors. What is the best request?", "opts": ["Ask for a larger sample size only", "Accept the report because the result is positive", "Reject it because every trial has gaps", "Remove the primary endpoint from the report", "Add the flow diagram and explain the change"], "a": 4, "e": "These gaps raise concern for bias and breach the reporting checklist. CONSORT 2025 is a 30-item checklist, and a participant flow diagram is part of the statement. The reviewer asks the authors to supply the flow diagram, describe allocation concealment and explain the endpoint change. An unexplained change in the primary endpoint is a particular worry, because it can reflect selection of a favorable result.", "k": "A trial report with missing flow, concealment and endpoint information needs correction before it can be trusted.", "t": "Reading a randomized trial report"}]}, {"ch": 2, "title": "Advanced Cancer and Cancer Pain", "qs": [{"n": 1, "stem": "A 59-year-old man has newly diagnosed metastatic pancreatic cancer with uncontrolled pain, weight loss and distress about the future of his young family. He is due to start chemotherapy next week, and his oncologist wonders whether to wait until chemotherapy fails before involving palliative care. What is the best recommendation?", "opts": ["Refer only in the last weeks of his life", "Treat pain alone and avoid any referral", "Refer now, alongside chemotherapy", "Wait until chemotherapy has failed before referring", "Refer his family but not the patient"], "a": 2, "e": "The ASCO guideline update advises early referral of patients with advanced solid tumors and hematologic malignancies to specialized interdisciplinary palliative care teams. Referral is made early in the disease course and alongside active cancer treatment. Uncontrolled symptoms and quality-of-life concerns are a clear reason to ask for help sooner. Caregivers may also be referred for support, and he and his family benefit from care that starts now.", "k": "Advanced cancer with unaddressed distress: involve specialist palliative care early, alongside active treatment.", "t": "Early palliative care referral"}, {"n": 2, "stem": "A 64-year-old man with lung cancer has severe chest pain that he rates 8 out of 10 on most days. He takes only a nonopioid analgesic and swallows pills without difficulty. His renal function is normal. His oncologist must choose the initial approach to pain control. What is the best plan?", "opts": ["A sedative with no analgesic included", "An intravenous infusion with no breakthrough doses", "A single fixed dose with no reassessment planned", "Oral opioid, breakthrough dose, bowel regimen", "A higher dose of the nonopioid analgesic alone"], "a": 3, "e": "Moderate or severe cancer pain calls for an opioid, and oral dosing is preferred when the patient can swallow. The dose is titrated to effect with an immediate-release preparation, and a long-acting opioid then covers baseline pain, with an immediate-release dose kept for breakthrough episodes. A bowel regimen starts with the first dose, because tolerance to constipation does not develop. Pain is reassessed after every change, and undertreatment is sought as well as sedation.", "k": "Severe cancer pain: oral opioid titrated to effect, a breakthrough dose and a bowel regimen from the start.", "t": "Opioid titration for severe pain"}, {"n": 3, "stem": "A 72-year-old man with kidney disease takes escalating doses of morphine for cancer pain. He now has myoclonic jerks and episodes of confusion, although his pain remains controlled. His creatinine has risen over two weeks. His team recognizes a toxicity of the drug. What is the best management?", "opts": ["Continue unchanged and observe at home", "Add a benzodiazepine to the same morphine dose", "Increase the morphine dose to control the jerks", "Stop all opioids and use a nonopioid only", "Hydrate and rotate to hydromorphone"], "a": 4, "e": "Opioid neurotoxicity presents with myoclonus, hallucinations or delirium, especially in renal failure and at high doses. The active metabolites of morphine accumulate when kidney function falls, and hydromorphone or fentanyl is safer. Treatment includes hydration, a lower dose or rotation to a different opioid, and review of other drugs that cause confusion. Raising the dose would worsen toxicity, and stopping all opioids would leave his pain untreated.", "k": "Opioid neurotoxicity in renal failure: hydrate and rotate to a different opioid.", "t": "Opioid choice in renal failure"}, {"n": 4, "stem": "A 67-year-old woman has breast cancer with a single painful metastasis in the femur. Imaging shows no impending fracture, and she has no neurologic deficit. Her pain is controlled poorly on analgesics alone. Her team seeks an effective treatment with a short course for her convenience. What is the best choice?", "opts": ["Single-fraction palliative radiotherapy", "Systemic chemotherapy alone with no local treatment", "Long-course radiotherapy for five weeks", "Surgical fixation without imaging review", "Observation with increased analgesics only"], "a": 0, "e": "Painful bone metastases respond to palliative radiotherapy, and a single fraction gives relief comparable to longer schedules in most patients. Analgesics continue while the radiotherapy takes effect, and bone-modifying agents are considered. A longer course adds visits and burden without better pain relief for most patients. Surgery is reserved for fracture or impending fracture, and systemic therapy alone is slower to relieve a localized painful site.", "k": "Painful bone metastasis: single-fraction radiotherapy relieves pain as well as longer schedules.", "t": "Painful bone metastasis"}, {"n": 5, "stem": "A 70-year-old woman has advanced lung cancer and worsening breathlessness. Her oxygen saturation is normal, imaging shows no reversible cause, and she is anxious about each episode. Her oncologist reviews the ASCO approach to dyspnea in advanced cancer. What is the best first measure after treating reversible causes?", "opts": ["Observation without any intervention", "Directed airflow from a fan", "High-dose benzodiazepines as first-line therapy", "Home oxygen for every patient regardless of saturation", "Immediate intubation for comfort"], "a": 1, "e": "The ASCO dyspnea guideline is hierarchical. Clinicians assess dyspnea, treat reversible causes and refer patients to an interdisciplinary palliative care team. Nonpharmacologic measures follow, including directed airflow from a fan, standard supplemental oxygen for patients with hypoxemia, and psychoeducational or self-management approaches. Systemic opioids are offered when relief is inadequate, and her normal saturation means oxygen is not indicated, so a fan and self-management skills are the sensible start.", "k": "Dyspnea without hypoxemia: a fan and self-management first, then systemic opioids if relief is inadequate.", "t": "Dyspnea in advanced cancer"}, {"n": 6, "stem": "A 61-year-old woman starts a long-acting opioid for pain from colon cancer. Two weeks later she has hard stools and abdominal discomfort, and no bowel regimen was prescribed. She has no vomiting and passes some flatus. Her team wants to treat her symptoms and prevent recurrence. What is the best management?", "opts": ["Wait for tolerance to constipation to develop", "Daily enemas with no oral laxative", "Stimulant laxative with a stool softener", "Bulk fiber only with restricted fluids", "Stop the opioid immediately"], "a": 2, "e": "A bowel regimen starts with the first opioid dose, because tolerance to constipation does not develop. She did not receive one, so a stimulant laxative with a stool softener is started now. The team excludes obstruction before escalating therapy, since she has colon cancer, though flatus and the absence of vomiting are reassuring. Stopping the opioid would leave her pain untreated, and bulk fiber without fluid can worsen the problem.", "k": "Every opioid prescription is paired with a bowel regimen, and tolerance to constipation does not develop.", "t": "Opioid-induced constipation"}, {"n": 7, "stem": "A 55-year-old man has pelvic cancer with burning, shooting pain in the leg after tumor invasion of the sacral plexus. High doses of an opioid give only partial relief and cause sedation. His team seeks an addition that targets the nerve pain. What is the best step?", "opts": ["Stop the opioid and give only paracetamol", "Add a gabapentinoid and raise slowly", "Double the opioid dose again", "Refer for observation with no change", "Add a second opioid of the same class"], "a": 1, "e": "Neuropathic pain has a burning or shooting quality and responds poorly to opioids alone. A gabapentinoid or a serotonin-norepinephrine reuptake inhibitor is added, and the dose is raised slowly to limit sedation and dizziness. Because he is already sedated, a slow titration matters. Doubling the opioid would add sedation without addressing the neuropathic mechanism, and a second opioid of the same class would add toxicity.", "k": "Neuropathic cancer pain: add a gabapentinoid or an SNRI to the opioid and titrate slowly.", "t": "Neuropathic cancer pain"}, {"n": 8, "stem": "A 63-year-old man with metastatic prostate cancer has severe back pain, new leg weakness and urinary hesitancy over two days. Examination shows reduced sensation from the umbilicus down. His oncologist suspects a complication that threatens his ability to walk. What is the most appropriate immediate step?", "opts": ["Corticosteroids and urgent spinal imaging", "Oral analgesics and review next month", "Physical therapy referral for the leg", "Routine bone scan at the next visit", "Observation until weakness progresses further"], "a": 0, "e": "Spinal cord compression presents with back pain, weakness and sensory loss, and it is an emergency. High-dose corticosteroids and urgent imaging come first, and radiotherapy or surgery follows according to the findings. Delay risks permanent paralysis, because function at treatment predicts function afterward. Analgesics and physical therapy do not address the compression, and waiting for progression removes the chance to preserve walking.", "k": "Suspected spinal cord compression: corticosteroids and urgent imaging, then radiotherapy or surgery.", "t": "Spinal cord compression"}]}, {"ch": 3, "title": "Survivorship and End of Life", "qs": [{"n": 1, "stem": "A 52-year-old woman finished treatment for breast cancer a year ago. She now has persistent low mood and loss of interest, and her symptoms are of moderate severity. She has no thoughts of self-harm, and she prefers not to take medication. Her oncologist reviews the ASCO guideline on anxiety and depression in survivors. What is the best first-line approach?", "opts": ["An antidepressant as the only treatment", "A benzodiazepine taken every night", "Reassurance only with no follow-up planned", "Admission to hospital for observation", "Cognitive behavioral therapy"], "a": 4, "e": "The ASCO guideline update advises a stepped-care approach that matches the most effective, least resource-intensive intervention to symptom severity. For moderate depression, options include cognitive behavioral therapy, behavioral activation, mindfulness-based stress reduction and structured physical activity. Evidence for medications was inconsistent, and medication may be offered when the patient lacks access to first-line treatment, prefers it, has responded to it before, or has not improved.", "k": "Moderate depression in a survivor: psychological therapy, behavioral activation or structured activity first.", "t": "Moderate depression in a survivor"}, {"n": 2, "stem": "A cancer center is building a program for survivors with anxiety and depression. Resources are limited, and the team wants to match each survivor to an intervention that works without using more resources than needed. A committee member asks which organizing principle the ASCO guideline recommends. What is the best answer?", "opts": ["Stepped care matched to symptom severity", "Medication for every survivor with symptoms", "Specialist therapy for every survivor regardless of severity", "Screening at diagnosis only, with no repeat", "Treatment only if a survivor requests it"], "a": 0, "e": "The ASCO guideline advises a stepped-care approach that matches the most effective, least resource-intensive intervention to symptom severity. All oncology patients are offered education about depression and anxiety, and more intensive care is reserved for those with moderate or severe symptoms. Psychological, educational and psychosocial interventions improved depression and anxiety, whereas evidence for medications was inconsistent. Screening is repeated across the course of survivorship.", "k": "Survivors with anxiety or depression: stepped care matched to severity.", "t": "Principle of stepped care"}, {"n": 3, "stem": "A 49-year-old survivor of colon cancer has moderate depression and has completed eight weeks of cognitive behavioral therapy without improvement. She has no history of antidepressant use and no thoughts of self-harm. Her oncologist considers whether medication is appropriate. Which statement best reflects the ASCO guideline?", "opts": ["Medication is never appropriate in survivors", "Medication if first-line care has failed", "Medication should be given without discussion", "Medication is appropriate only for severe symptoms", "Medication must always precede psychological therapy"], "a": 1, "e": "Evidence for medications in survivors was inconsistent, so psychological and psychosocial interventions come first. The guideline states that medication may be offered if the patient lacks access to first-line treatment, prefers it, has responded to it before, or has not improved with psychological or behavioral care. She has not improved after therapy, so medication is reasonable to discuss. The decision is shared and reviewed regularly.", "k": "Medication for depression in survivors is an option when first-line psychological care has not helped.", "t": "When to offer medication"}, {"n": 4, "stem": "A 39-year-old man finishes treatment for Hodgkin lymphoma that included chest radiotherapy and doxorubicin. He is returning to work and asks what follow-up he needs. His primary care clinician has not received any information from the cancer center. What is the most useful step for his oncology team?", "opts": ["Leave the plan to the patient alone", "Tell him that follow-up is not needed", "Defer the plan until symptoms develop", "Give a summary and surveillance plan", "Order every available test every month"], "a": 3, "e": "A survivorship care plan summarizes the treatment received, the expected late effects and a schedule of surveillance. The plan names who is responsible for each test, and it is shared with the primary care clinician. He received chest radiotherapy and doxorubicin, so he needs attention to heart function, and his risk of second cancers is raised. Ordering every test would add cost and anxiety without a clear plan.", "k": "After treatment: give a care plan with a treatment summary, late-effect risks and a surveillance schedule.", "t": "Survivorship care plan"}, {"n": 5, "stem": "A 61-year-old man has burning pain in both feet eight months after oxaliplatin. Blood tests exclude diabetes and vitamin deficiency, simple analgesics give little relief, and the pain disturbs his sleep. His oncologist wants a drug with supportive evidence for his condition. What is the best choice?", "opts": ["Vitamin supplements for prevention", "Corticosteroids for a long course", "Duloxetine", "No treatment because it cannot improve", "Opioids as the only treatment"], "a": 2, "e": "Chemotherapy-induced peripheral neuropathy causes numbness, tingling and pain that can persist for years. No drug reliably prevents it, but painful neuropathy that persists is treated with duloxetine, which has supportive evidence. Clinicians exclude other causes such as diabetes or vitamin deficiency, and here both are excluded. Benefit is reviewed regularly, and exercise and counseling add to drug therapy, so he is not left on analgesics alone.", "k": "Persistent painful chemotherapy-induced neuropathy: duloxetine.", "t": "Painful chemotherapy-induced neuropathy"}, {"n": 6, "stem": "A 57-year-old woman has persistent fatigue after treatment for colon cancer. Her blood counts and thyroid tests are normal, and she spends most of the day sitting. She asks whether rest or activity is better for recovery. Her oncologist advises a plan. What is the best recommendation?", "opts": ["Bed rest until the fatigue resolves", "Avoid exercise to protect the heart", "High-intensity training from the first day", "Stimulant medication as first-line therapy", "A graded activity program"], "a": 4, "e": "Regular physical activity is advised for survivors because it improves fitness and quality of life. Rest alone tends to worsen deconditioning, so inactivity does not relieve fatigue. A graded program starts at a comfortable level and builds over weeks, and a dietitian helps with intake. Her normal blood counts and thyroid tests make a reversible medical cause less likely, so activity is the first step.", "k": "Survivors with fatigue: advise graded regular physical activity.", "t": "Exercise after treatment"}, {"n": 7, "stem": "A 68-year-old woman with metastatic ovarian cancer is bedbound and eats little. She is declining further chemotherapy, her family is exhausted, and she tells her team that she wants to die at home. Her prognosis is estimated at weeks, and her oncologist has discussed these goals with her at length. Which step is most appropriate?", "opts": ["Admission to intensive care for support", "Hospice enrollment with a written symptom plan", "Discharge home without any plan", "Daily testing to monitor her disease", "Another line of chemotherapy despite her wishes"], "a": 1, "e": "Hospice enrollment is offered when prognosis is limited and the goals of care center on comfort. Symptom control covers pain, dyspnea, delirium and secretions, and the plan is written so that family and nurses can act at any hour. Her wish to die at home fits hospice care. The family is prepared for what to expect, and bereavement support continues after the death.", "k": "Limited prognosis with comfort goals: hospice enrollment, a written symptom plan and family support.", "t": "Hospice referral"}]}, {"ch": 4, "title": "Communication, Prognosis, and Goals of Care", "qs": [{"n": 1, "stem": "A 54-year-old man has a scan showing progression of his lung cancer. His oncologist prepares to tell him in clinic. His wife is in the waiting room, the room is noisy, and the oncologist does not yet know what he understands about his illness. Using the SPIKES protocol, what should the oncologist do first?", "opts": ["Describe the next regimen in detail first", "Quote a survival statistic at the outset", "Avoid mentioning the scan until a later visit", "Arrange privacy and ask his perception", "State the scan result in the first sentence"], "a": 3, "e": "The SPIKES protocol structures a serious conversation in six steps: setting, perception, invitation, knowledge, emotions and strategy. The clinician arranges privacy, finds out what the patient already understands, and asks how much information the patient wants. Only then is the news delivered in plain words, in short pieces and with pauses. Starting with the result or a statistic would skip the steps that prepare the patient to hear it.", "k": "SPIKES begins with the setting and the patient's perception.", "t": "SPIKES protocol"}, {"n": 2, "stem": "A 63-year-old woman with stage IV colorectal cancer tells her oncologist that she expects chemotherapy to cure her. She finds the visits supportive and rates her oncologist's communication very highly. She has not heard the word incurable. The oncologist reviews research on what patients understand. What is the best interpretation?", "opts": ["Her belief will correct itself without discussion", "Her belief is rare among patients with her cancer", "Her education level fully explains the belief", "Her belief proves that her oncologist communicates poorly", "Warm communication does not ensure accurate understanding"], "a": 4, "e": "In a cohort of 1,193 patients with stage IV lung or colorectal cancer, 69% of those with lung cancer and 81% of those with colorectal cancer did not report understanding that chemotherapy was not at all likely to cure. Patients who rated physician communication in the highest third had higher odds of inaccurate beliefs, with an odds ratio of 1.90. Educational level, functional status and role in decision-making were not associated. The oncologist asks her to explain her expectations in her own words and clarifies the aim.", "k": "Patients often misunderstand the aim of palliative chemotherapy, even when they rate communication highly.", "t": "Misunderstanding of chemotherapy intent"}, {"n": 3, "stem": "A 60-year-old woman with advanced lung cancer fears that talking about dying will upset her. Her daughter wants to delay the discussion, and her oncologist knows she is likely to be admitted again soon. The oncologist recalls a cohort of patients with advanced cancer. Which finding most directly addresses the concern that such a discussion will cause harm?", "opts": ["Worse caregiver bereavement for all families", "No higher rate of major depressive disorder", "Lower hospice enrollment in the discussion group", "Higher ventilation rates near death", "More ICU admission in the discussion group"], "a": 1, "e": "In a prospective cohort of 332 patients with advanced cancer, end-of-life discussions were not associated with more major depressive disorder, at 8.3% against 5.8%. After propensity weighting, discussions were associated with less ventilation, resuscitation and ICU admission, and with earlier hospice enrollment, at 65.6% against 44.5%. These are associations and do not prove cause. They do argue against the fear that talking about death harms patients.", "k": "End-of-life discussions were not associated with more depression and were associated with less aggressive care near death.", "t": "End-of-life discussions and care near death"}, {"n": 4, "stem": "A cancer center wants to improve how often and how early oncology clinicians hold serious illness conversations. The leadership reviews a cluster randomized trial of a communication program for clinicians and their patients with life-limiting cancer. Which outcome did the program improve compared with usual care?", "opts": ["Documented goals conversations", "The rate of cancer remission", "The number of chemotherapy lines received", "The rate of hospital admission overall", "Median survival of all patients"], "a": 0, "e": "The Serious Illness Care Program was tested in a cluster randomized trial with 91 clinicians and 278 patients. Conversations about values or goals were documented for 89% against 44%, and prognosis or illness understanding for 91% against 48%. Conversations occurred a median of 143 days before death in the intervention arm against 71 days in the control arm. The outcomes concerned the occurrence, timing and quality of conversations, and not survival.", "k": "A structured conversation program increased and advanced documented goals-of-care conversations.", "t": "Structured conversation program"}, {"n": 5, "stem": "A 58-year-old woman learns that her cancer has progressed after second-line therapy. She begins to cry and says that she is frightened and cannot think. Her oncologist has prepared a detailed explanation of the next regimen and expected side effects, and the visit is nearly over. What is the best response at this moment?", "opts": ["Change the subject to lighten the mood", "Continue explaining the next regimen quickly", "Acknowledge her fear first", "End the visit and leave the room", "Reassure her that everything will be fine"], "a": 2, "e": "Empathic statements name or acknowledge the emotion, express respect and offer support. They are used before facts, because patients absorb little information while they are overwhelmed. The clinician responds to emotion before moving on, and the conversation ends with a plan and a time to meet again. Continuing with the regimen would not be heard, and false reassurance would erode trust. A pause with a short statement of support is usually enough to restore attention.", "k": "Respond to emotion with an empathic statement before giving more information.", "t": "Empathic response"}, {"n": 6, "stem": "A 72-year-old man with heart failure and metastatic prostate cancer asks his oncologist how long he has. He wants honesty. His wife asks that no numbers be given. His oncologist wants to respect both the patient's request and the uncertainty of prognosis. What is the best approach?", "opts": ["Give a single exact number of months", "Tell his wife only and not him", "Promise that he will live for years", "Share a range with scenarios", "Refuse to discuss prognosis at all"], "a": 3, "e": "Prognosis is shared as a range, such as weeks to months or months to years, because single numbers imply false precision. Clinicians offer best-case, worst-case and most likely scenarios and name the uncertainty. The patient is the person who asked, so the conversation is with him, with attention to his wife's concerns and a promise to revisit as things change. Refusing to answer would leave him unprepared, and false promises would damage trust.", "k": "Share prognosis as a range with scenarios, and revisit it as the illness changes.", "t": "Sharing prognosis"}, {"n": 7, "stem": "A 69-year-old woman with metastatic gastric cancer is admitted with sepsis. Her performance status is poor, her family is anxious, and she has not discussed code status with any clinician. The team prepares to meet her and her family. What is the best way to approach the discussion?", "opts": ["Discuss goals and recommend based on her values", "Assume full resuscitation without discussion", "Leave the decision entirely to the youngest relative", "Ask a single yes or no question about resuscitation", "Postpone the discussion until cardiac arrest occurs"], "a": 0, "e": "Code status is discussed as part of goals of care and not as a stand-alone question. The clinician makes a recommendation based on the patient's values and the likely benefit of resuscitation. Here the benefit is limited by her advanced cancer, sepsis and poor function, and the team explains that openly. Asking a bare yes or no question places the burden on the family, and waiting for an arrest removes any chance of a considered decision.", "k": "Discuss code status within goals of care, with a recommendation grounded in the patient's values.", "t": "Code status discussion"}]}, {"ch": 5, "title": "Acute Leukemia and Myelodysplasia", "qs": [{"n": 1, "stem": "A 77-year-old man has newly diagnosed acute myeloid leukemia with an NPM1 mutation and no FLT3 mutation. He has heart failure and a performance status of 2, and he declines intensive chemotherapy after discussion with his family. His oncologist reviews randomized evidence for patients who are ineligible for standard induction. What is the best recommendation?", "opts": ["Blinatumomab with consolidation chemotherapy", "Standard seven plus three induction", "Azacitidine with venetoclax", "Midostaurin with intensive chemotherapy", "Azacitidine with placebo only"], "a": 2, "e": "VIALE-A enrolled 431 treatment-naive adults who were ineligible for standard induction and randomized them to azacitidine with venetoclax or placebo. Median overall survival was 14.7 months against 9.6 months, a hazard ratio of 0.66, and composite complete remission was 66.4% against 28.3%. Febrile neutropenia was 42% against 19%, so counts and infection signs are checked closely in the early cycles.", "k": "Older or unfit adults with untreated AML: azacitidine with venetoclax.", "t": "Unfit older adult with AML"}, {"n": 2, "stem": "A 45-year-old woman has newly diagnosed acute myeloid leukemia, and rapid testing shows a FLT3 internal tandem duplication. She is fit and has no significant comorbidity, and she is about to start standard induction. Her oncologist reviews the randomized trial of a kinase inhibitor added to chemotherapy in younger adults. What is the best addition?", "opts": ["Observation until relapse is seen", "Venetoclax without chemotherapy", "Blinatumomab with consolidation", "Arsenic trioxide with retinoic acid", "Midostaurin with chemotherapy"], "a": 4, "e": "RATIFY screened 3,277 younger adults for FLT3 mutations and randomized 717 aged 18 to 59 years to standard chemotherapy with midostaurin or placebo. Overall survival was longer with midostaurin, with a hazard ratio for death of 0.78, and event-free survival also favored midostaurin. The benefit was consistent across FLT3 subtypes, and severe adverse events were similar. A donor search begins early.", "k": "FLT3-mutated AML in fit adults aged 18 to 59: add midostaurin to chemotherapy.", "t": "FLT3-mutated AML"}, {"n": 3, "stem": "A 52-year-old man has BCR::ABL1-negative B-cell acute lymphoblastic leukemia. After induction and intensification he is in complete remission, with measurable residual disease under 0.01 percent by flow cytometry. His oncologist reviews a randomized trial that tested adding a bispecific antibody to consolidation. What is the best recommendation?", "opts": ["Add blinatumomab to consolidation", "Stop treatment and observe", "Consolidation chemotherapy with no addition", "Switch to a hypomethylating agent alone", "Add midostaurin to consolidation"], "a": 0, "e": "E1910 enrolled patients aged 30 to 70 years in MRD-negative remission and randomized them to four cycles of blinatumomab plus consolidation chemotherapy or consolidation alone. Three-year overall survival was 85% against 68%, a hazard ratio for death of 0.41. Relapse-free survival was 80% against 64%. Neuropsychiatric events were more frequent, so mood and cognition are reviewed at every visit, and families learn the early warning signs.", "k": "MRD-negative BCR::ABL1-negative B-ALL: adding blinatumomab to consolidation improved survival.", "t": "Blinatumomab in MRD-negative ALL"}, {"n": 4, "stem": "A 33-year-old woman has gum bleeding, bruising and fever. Her white count is low, her fibrinogen is very low, and the smear shows abnormal promyelocytes with Auer rods. Bone marrow and PML::RARA results will take several days to return. Her team asks what should be given now, before confirmation. What is the best management?", "opts": ["Azacitidine alone as a first step", "Standard induction without retinoic acid", "Wait for genetic confirmation before any treatment", "Start retinoic acid now, with blood support", "Observation with repeat counts tomorrow"], "a": 3, "e": "Acute promyelocytic leukemia presents with severe coagulopathy and a high risk of early death from bleeding. When the smear or clinical picture suggests it, all-trans retinoic acid starts at once, without waiting for confirmation by PML::RARA testing. Platelets and fibrinogen are replaced to protect against hemorrhage, and arsenic trioxide is added once the diagnosis is confirmed. Waiting for genetics exposes her to the highest risk of fatal hemorrhage.", "k": "Suspected APL: start all-trans retinoic acid before genetic confirmation.", "t": "Suspected acute promyelocytic leukemia"}, {"n": 5, "stem": "A 40-year-old man is on day 8 of induction for acute promyelocytic leukemia. He develops fever, dyspnea and weight gain, and imaging shows bilateral pleural effusions. His white count has risen from the start of treatment. Cultures are pending, and he is hemodynamically stable on supplemental oxygen. What is the most appropriate immediate step?", "opts": ["Stop all treatment and wait for cultures", "Start dexamethasone, continue supportive care", "Add midostaurin to the regimen", "Observe for another week before acting", "Begin standard intensive induction chemotherapy"], "a": 1, "e": "Differentiation syndrome presents with fever, dyspnea, edema and effusions during induction, and it is treated promptly with dexamethasone. His timing and findings fit, and delay raises the risk of respiratory failure. Infection is evaluated at the same time, since cultures are pending, but treatment does not wait for the results. Supportive care continues, and the differentiating agent is adjusted by the team according to severity.", "k": "Differentiation syndrome in APL induction: start dexamethasone promptly.", "t": "Differentiation syndrome"}, {"n": 6, "stem": "A 61-year-old woman has myelodysplastic syndrome with excess blasts, adverse cytogenetics and a TP53 mutation. She has transfusion-dependent anemia and thrombocytopenia, and she is otherwise fit with a good performance status. Her molecular risk score places her in a higher-risk category. Which step should her oncologist take early?", "opts": ["Use growth factors only for anemia", "Observe until blasts rise further", "Treat with midostaurin and chemotherapy", "Manage with transfusions alone", "Early allogeneic transplant referral"], "a": 4, "e": "Myelodysplastic syndromes carry a risk of progression to acute myeloid leukemia, and molecular scoring refines risk with gene mutations. Higher-risk disease needs disease-modifying therapy, and fit patients are referred early for allogeneic transplantation, the only curative option. A donor search starts while she receives therapy. Transfusions and growth factors manage symptoms of lower-risk disease and do not change the course of higher-risk disease.", "k": "Higher-risk MDS in a fit patient: early referral for allogeneic transplantation.", "t": "Higher-risk myelodysplastic syndrome"}]}, {"ch": 6, "title": "Chronic Myeloid and Lymphoproliferative Leukemias", "qs": [{"n": 1, "stem": "A 48-year-old man is found to have a white count of 120,000 and splenomegaly, and marrow and PCR confirm chronic-phase CML with the BCR::ABL1 fusion. He has no significant comorbidities, and he asks which first-line option gave the highest rate of major molecular response at week 48 in a randomized comparison. What is the best answer?", "opts": ["Asciminib", "Venetoclax with obinutuzumab", "Allogeneic transplantation first", "Chemotherapy with cytarabine", "Imatinib alone in every patient"], "a": 0, "e": "ASC4FIRST randomized 201 patients with newly diagnosed chronic-phase disease to asciminib and 204 to investigator-selected tyrosine kinase inhibitors. Major molecular response at week 48 was 67.7% against 49.0%, a difference of 18.9 percentage points. Discontinuation due to adverse events was 4.5% with asciminib against 11.1% with imatinib. Direct comparison with second-generation inhibitors was not a primary objective, and follow-up is still short.", "k": "Newly diagnosed chronic-phase CML: first-line asciminib improved major molecular response at week 48.", "t": "First-line CML"}, {"n": 2, "stem": "A 64-year-old woman has a hematocrit of 56 percent, a JAK2 mutation, itching after bathing and a prior deep vein thrombosis. Her spleen is mildly enlarged, and she takes no medication. Her hematologist plans treatment for polycythemia vera in the high-risk group. What is the most appropriate management?", "opts": ["Allogeneic transplantation as first-line therapy", "Phlebotomy alone with no aspirin", "Venetoclax with obinutuzumab", "Observation until the hematocrit rises further", "Phlebotomy, aspirin and cytoreduction"], "a": 4, "e": "Polycythemia vera is driven by JAK2 mutations and causes erythrocytosis, thrombosis and pruritus. Treatment aims to keep the hematocrit under 45 percent with phlebotomy, and low-dose aspirin lowers thrombotic risk. High-risk patients, defined by age or prior thrombosis, receive cytoreduction with hydroxyurea or interferon. Her prior thrombosis places her in that group, and ruxolitinib is reserved for those who cannot tolerate first-line cytoreduction.", "k": "High-risk polycythemia vera: phlebotomy to hematocrit under 45 percent, aspirin and cytoreduction.", "t": "High-risk polycythemia vera"}, {"n": 3, "stem": "A 58-year-old man has symptomatic chronic lymphocytic leukemia with progressive anemia and massive lymphadenopathy. TP53 testing shows no aberration, IGHV is unmutated, and he is fit. He asks for a fixed-duration first-line option that has randomized support over chemoimmunotherapy, and he wants to avoid indefinite daily therapy if possible. What is the best recommendation?", "opts": ["Venetoclax with rituximab alone", "Fludarabine, cyclophosphamide and rituximab", "Venetoclax with obinutuzumab", "Observation until symptoms become severe", "Indefinite zanubrutinib without any plan to stop"], "a": 2, "e": "CLL13 randomized 926 fit patients without TP53 aberrations to chemoimmunotherapy or venetoclax-based regimens. Undetectable MRD at month 15 was 86.5% with venetoclax and obinutuzumab against 52.0% with chemoimmunotherapy, and 3-year progression-free survival was 87.7% against 75.5%. Venetoclax with rituximab did not improve progression-free survival, at 80.8%. Tumor lysis risk is assessed before he starts, and the dose is raised stepwise over several weeks.", "k": "Fit CLL without TP53 aberration: venetoclax with obinutuzumab for a fixed duration.", "t": "Fixed-duration first-line CLL"}, {"n": 4, "stem": "A 66-year-old woman has symptomatic CLL with a 17p deletion and a TP53 mutation, and she has had no treatment. She has hypertension controlled on one drug. Her oncologist reviews the first-line options, noting that the trial of venetoclax combinations excluded patients like her. What is the best treatment?", "opts": ["Bendamustine with rituximab", "A BTK inhibitor", "Imatinib for BCR::ABL1", "Observation until progression", "Fludarabine, cyclophosphamide and rituximab"], "a": 1, "e": "CLL13 excluded patients with TP53 aberrations, so its fixed-duration regimens do not apply to her directly. Patients with TP53 aberrations do poorly with chemoimmunotherapy, and a BTK inhibitor is used. Atrial fibrillation, bleeding and hypertension are monitored, and heart rhythm and blood pressure are checked at each visit. Her controlled hypertension is a risk factor to be watched, not a contraindication, and her team treats it alongside the leukemia.", "k": "CLL with TP53 aberration: BTK inhibitor, not chemoimmunotherapy.", "t": "CLL with TP53 aberration"}, {"n": 5, "stem": "A 70-year-old man has relapsed CLL after chemoimmunotherapy, with a TP53 mutation and a history of atrial fibrillation. His oncologist is choosing a BTK inhibitor and reviews the randomized head-to-head trial of two agents in relapsed or refractory disease. Which statement from that trial best supports the choice?", "opts": ["The trial enrolled only patients who had never been treated", "Both agents were identical in every outcome that was measured", "Neither agent worked in patients with TP53-mutated disease", "Zanubrutinib: longer progression-free survival, fewer cardiac events", "Ibrutinib gave longer progression-free survival than zanubrutinib did"], "a": 3, "e": "ALPINE randomized 652 patients with relapsed or refractory CLL or SLL to zanubrutinib or ibrutinib. The hazard ratio for progression or death was 0.65, and 24-month progression-free survival was 78.4% against 65.9%. In patients with a 17p deletion, a TP53 mutation or both, the hazard ratio was 0.53, and zanubrutinib caused fewer cardiac events. His rhythm is followed at each visit.", "k": "Relapsed CLL with cardiac risk: zanubrutinib improved progression-free survival with fewer cardiac events.", "t": "BTK inhibitor choice in relapse"}, {"n": 6, "stem": "A 62-year-old woman with relapsed CLL has a lymph node measuring 8 cm and a white count of 90,000. She is about to start venetoclax, and her creatinine is slightly raised. Her oncologist plans the safest approach to starting treatment. Which plan is most appropriate?", "opts": ["Check electrolytes only at the end of the month", "Avoid hydration in order to protect the kidneys", "Start the full dose on the very first day", "Stepwise ramp-up with hydration", "Delay venetoclax indefinitely without any plan"], "a": 3, "e": "Venetoclax causes rapid tumor lysis in patients with a high burden of disease. Risk is assessed by lymph node size and white count, and her large node and raised white count place her at higher risk. The dose is raised stepwise over weeks, with hydration, uric acid control and frequent electrolyte checks, and admission for the first doses is reasonable. Starting the full dose would risk tumor lysis and kidney injury.", "k": "High tumor burden: start venetoclax with a stepwise ramp-up and tumor lysis precautions.", "t": "Venetoclax tumor lysis"}]}, {"ch": 7, "title": "Hodgkin and Non-Hodgkin Lymphoma", "qs": [{"n": 1, "stem": "A 62-year-old man has stage III diffuse large B-cell lymphoma with an intermediate-risk index. He is fit and has no cardiac disease, and he asks which first-line regimen showed the better progression-free survival in a randomized comparison with R-CHOP. His oncologist reviews the data. What is the best answer?", "opts": ["Observation until symptoms develop further", "R-CHOP with no change in any component", "Pola-R-CHP", "Nivolumab with AVD chemotherapy", "Axicabtagene ciloleucel as first-line therapy"], "a": 2, "e": "POLARIX randomized 879 patients aged 18 to 80 years with untreated intermediate- or high-risk disease to pola-R-CHP or R-CHOP. Two-year progression-free survival was 76.7% against 70.2%, a hazard ratio of 0.73. Overall survival did not differ, at 88.7% against 88.6%, and the safety profile was comparable. He is told that the progression-free survival gain has not yet translated into a survival difference.", "k": "Untreated intermediate- or high-risk DLBCL: pola-R-CHP improved progression-free survival, not yet overall survival.", "t": "First-line DLBCL"}, {"n": 2, "stem": "A 58-year-old woman has large B-cell lymphoma that relapsed 8 months after R-CHOP. She is fit, her disease is in a single nodal region, and she asks about options other than salvage chemotherapy followed by autologous transplant. Her oncologist reviews the randomized trial of CAR T-cell therapy in this setting. What is the best recommendation?", "opts": ["Axicabtagene ciloleucel", "Salvage chemotherapy with autologous transplant", "Brentuximab vedotin with AVD chemotherapy", "Observation until the next relapse", "Repeat R-CHOP for six more cycles"], "a": 0, "e": "ZUMA-7 enrolled 180 patients to axicabtagene ciloleucel and 179 to standard care, all with disease refractory or relapsing within 12 months of first-line therapy. Event-free survival at 24 months was 41% against 16%, a hazard ratio of 0.40, and complete response was 65% against 32%. Grade 3 or higher neurologic events occurred in 21%, so a monitoring plan is needed.", "k": "Large B-cell lymphoma refractory or relapsing within 12 months: axicabtagene ciloleucel improved event-free survival.", "t": "Early relapsed LBCL"}, {"n": 3, "stem": "A 29-year-old woman has stage IV classic Hodgkin lymphoma. She has no lung disease and wants to limit long-term toxicity from treatment. Her oncologist reviews the recent randomized comparison of two AVD-based regimens in stage III or IV disease. Which regimen showed the longer progression-free survival?", "opts": ["ABVD with bleomycin in all patients", "Nivolumab-AVD", "Rituximab with cyclophosphamide and vincristine", "Brentuximab-AVD", "Radiotherapy alone to all involved sites"], "a": 1, "e": "SWOG S1826 enrolled 994 patients aged 12 years or older with stage III or IV classic Hodgkin lymphoma. With a median follow-up of 2.1 years, 2-year progression-free survival was 92% with nivolumab-AVD and 83% with brentuximab-AVD, a hazard ratio of 0.45. Immune-related events were infrequent, and discontinuation was more frequent with brentuximab. Follow-up is still short for late effects, so the choice also weighs neuropathy risk.", "k": "Advanced classic Hodgkin lymphoma: nivolumab-AVD improved progression-free survival over brentuximab-AVD.", "t": "Advanced Hodgkin lymphoma"}, {"n": 4, "stem": "A 54-year-old man is about to start rituximab-based therapy for follicular lymphoma with symptomatic bulky disease. He is from a region where hepatitis B is common and has never been tested for it. His liver enzymes are normal, and he feels well. What should his team do before the first dose?", "opts": ["Give a live vaccine before the first rituximab dose", "Start rituximab now and test only if enzymes rise", "Avoid all tests because his enzymes are normal", "Check hepatitis B surface antigen and core antibody", "Test for hepatitis C only because it is more common"], "a": 3, "e": "Every patient who starts an anti-CD20 antibody has hepatitis B surface antigen and core antibody checked first. Normal liver enzymes do not exclude chronic or occult infection. Carriers receive antiviral prophylaxis, because reactivation after rituximab can be fatal. Waiting for enzymes to rise would expose him to the risk of fulminant hepatitis, which is avoidable with a simple test and a short course of prophylaxis.", "k": "Before any anti-CD20 antibody: screen for hepatitis B and give prophylaxis to carriers.", "t": "Hepatitis B before anti-CD20"}, {"n": 5, "stem": "A 47-year-old man finishes six cycles of treatment for diffuse large B-cell lymphoma. His end-of-treatment PET shows a residual mass with a Deauville score of 4, and he feels well. The team debates whether to change therapy at once. What is the best next step?", "opts": ["Start salvage chemotherapy immediately", "Declare a complete metabolic response", "Repeat the same six cycles of therapy", "Stop all follow-up and discharge him", "Biopsy the residual mass first"], "a": 4, "e": "PET results are scored on the five-point Deauville scale. A score of 1 to 3 is read as a complete metabolic response, while a score of 4 or 5 raises concern for residual disease. Imaging alone can mislead after therapy because inflammation can mimic tumor. A biopsy of the residual mass confirms whether lymphoma remains, and the result guides the next step before any change in treatment.", "k": "Deauville 4 or 5 at the end of treatment: biopsy before changing therapy.", "t": "Residual PET mass"}, {"n": 6, "stem": "A 66-year-old woman has newly diagnosed follicular lymphoma with several small nodes, normal blood counts and no symptoms. Her tumor burden is low by the usual criteria, and she asks whether she should start treatment now. Her oncologist outlines the standard approach for patients with her presentation. What is the best recommendation?", "opts": ["Observation with regular follow-up", "Allogeneic transplantation in first remission", "Brentuximab vedotin with AVD chemotherapy", "Immediate chemotherapy with an anti-CD20 antibody", "Axicabtagene ciloleucel as first-line therapy"], "a": 0, "e": "Follicular lymphoma is often indolent, and observation is appropriate for patients without symptoms or a high tumor burden. When treatment is needed, an anti-CD20 antibody is combined with chemotherapy. Starting treatment early adds toxicity without a clear benefit for a patient with her presentation. She is seen regularly, and treatment starts if symptoms, cytopenias or bulky disease develop, with a repeat biopsy if a node grows quickly.", "k": "Low-burden asymptomatic follicular lymphoma: observation with regular follow-up.", "t": "Follicular lymphoma observation"}, {"n": 7, "stem": "A 60-year-old woman receives axicabtagene ciloleucel for relapsed large B-cell lymphoma. On day 3 she develops fever and hypotension, and on day 5 she becomes confused. Cultures are negative, and she has no focal signs of infection. Her team recognizes a known toxicity of the therapy. What is the best management?", "opts": ["Discharge her home with oral antibiotics", "Stop all care and withhold monitoring", "Give a second CAR T-cell infusion at once", "Start high-dose chemotherapy to control the lymphoma", "Tocilizumab and corticosteroids with supportive care"], "a": 4, "e": "In ZUMA-7, grade 3 or higher cytokine release syndrome occurred in 6% and grade 3 or higher neurologic events in 21%. Tocilizumab and corticosteroids treat these toxicities, and care is given in a monitored setting by a center with CAR T-cell experience. Her fever with hypotension fits cytokine release syndrome, and the confusion suggests neurologic involvement. Antibiotics alone do not treat either problem.", "k": "CAR T-cell cytokine release and neurologic toxicity: tocilizumab and corticosteroids with monitored supportive care.", "t": "CAR T-cell toxicity"}, {"n": 8, "stem": "A 41-year-old man with stage III classic Hodgkin lymphoma has severe emphysema and a low diffusing capacity. His oncologist plans an AVD-based regimen and wants to avoid a drug with a known risk of pulmonary toxicity. He has no baseline neuropathy. Which regimen is the best fit for him?", "opts": ["Observation until symptoms worsen", "Whole-lung radiotherapy", "Brentuximab vedotin with AVD", "ABVD with standard bleomycin", "R-CHOP for six cycles"], "a": 2, "e": "Brentuximab vedotin with doxorubicin, vinblastine and dacarbazine replaces bleomycin and avoids its pulmonary toxicity, at the price of peripheral neuropathy. In ECHELON-1, grade 3 or higher pulmonary toxicity was under 1% against 3% with ABVD, and neuropathy was 67% against 43%. His severe emphysema and low diffusing capacity make bleomycin a poor choice. He is counseled to report numbness or tingling early, because dose reduction limits lasting nerve injury. R-CHOP treats B-cell lymphomas and does not apply to classic Hodgkin lymphoma.", "k": "Hodgkin lymphoma with lung disease: avoid bleomycin and use brentuximab vedotin with AVD.", "t": "Bleomycin and brentuximab in Hodgkin lymphoma"}]}, {"ch": 8, "title": "Myeloma, Genomics, and Treatment Complications", "qs": [{"n": 1, "stem": "A 58-year-old man has newly diagnosed multiple myeloma with bone lesions and anemia. He is fit and plans to undergo autologous transplantation after induction. He asks which induction regimen produced the best progression-free survival in a randomized comparison of transplant-eligible patients. His oncologist reviews the data. What is the best answer?", "opts": ["Bortezomib, lenalidomide and dexamethasone alone", "Ciltacabtagene autoleucel as first-line therapy", "Observation until bone disease progresses", "Melphalan with prednisone only", "Four-drug regimen with daratumumab"], "a": 4, "e": "PERSEUS enrolled 709 transplant-eligible patients with newly diagnosed myeloma and compared a four-drug regimen with and without daratumumab. At 48 months, progression-free survival was 84.3% against 67.7%, a hazard ratio of 0.42, and MRD negativity was 75.2% against 47.5%. Neutropenia and thrombocytopenia were more frequent with daratumumab, so blood counts and infection prevention are part of the plan, and he is told about both before starting.", "k": "Transplant-eligible newly diagnosed myeloma: adding daratumumab improved 48-month progression-free survival.", "t": "Transplant-eligible induction"}, {"n": 2, "stem": "A 63-year-old woman has myeloma that progressed on lenalidomide maintenance after two prior lines of therapy. She is fit, and her organ function is good. She asks about CAR T-cell therapy and what the randomized evidence shows in her situation. Which statement best supports a recommendation?", "opts": ["The trial excluded every patient with prior lenalidomide", "Standard care gave longer progression-free survival than CAR T-cell therapy", "Randomized evidence is not available for this setting", "Cilta-cel improved progression-free survival over standard care", "CAR T-cell therapy has no important side effects at all"], "a": 3, "e": "CARTITUDE-4 randomized 419 lenalidomide-refractory patients with one to three prior lines to ciltacabtagene autoleucel or standard care. Twelve-month progression-free survival was 75.9% against 48.6%, a hazard ratio of 0.26. Cytokine release syndrome occurred in 76.1% of treated patients, with grade 3 or 4 events in 1.1%, and cranial nerve palsy occurred in 9.1%. She is told about the delay before infusion.", "k": "Lenalidomide-refractory myeloma after 1 to 3 prior lines: ciltacabtagene autoleucel improved progression-free survival.", "t": "Lenalidomide-refractory relapse"}, {"n": 3, "stem": "A 67-year-old woman has 20 percent clonal plasma cells in the marrow and a modest monoclonal protein. She has no anemia, hypercalcemia, renal injury or bone lesions on whole-body imaging, and she feels well. Her risk markers are not high. Her oncologist classifies her disease and plans the next step. What is the best management?", "opts": ["Autologous transplantation within the month", "Observation with regular follow-up", "Refer for CAR T-cell therapy", "Discharge her with no follow-up planned", "Start four-drug induction therapy at once"], "a": 1, "e": "Smoldering myeloma has clonal plasma cells without end-organ damage or a biomarker of malignancy, and it is observed unless risk is high. Her labs and imaging show no anemia, hypercalcemia, renal injury or bone lesions, and her risk markers are not high. Treatment now would add toxicity without a clear benefit. She is followed at regular intervals, and therapy starts if end-organ damage or a biomarker of malignancy appears.", "k": "Smoldering myeloma at standard risk: observation with regular follow-up.", "t": "Smoldering myeloma"}, {"n": 4, "stem": "A 61-year-old man is on day 6 after ciltacabtagene autoleucel for myeloma. He has word-finding difficulty and tremor and cannot write his name. His fever has settled, cultures are negative, and he is hemodynamically stable. His team recognizes a known toxicity of the therapy. What is the best management?", "opts": ["Tocilizumab alone with no corticosteroids", "Broad antibiotics as the only treatment", "Corticosteroids and monitoring", "A second CAR T-cell infusion", "Discharge home with outpatient review"], "a": 2, "e": "ICANS presents with confusion, aphasia, tremor or seizures. In CARTITUDE-4, ICANS occurred in 4.5% of treated patients, all of it grade 1 or 2. Corticosteroids are added for ICANS, and tocilizumab treats cytokine release syndrome but is not enough for neurologic toxicity alone. Infection is ruled out at the same time, and he is monitored in a unit with experience in cellular therapy, with the neurologic score repeated each shift.", "k": "ICANS after CAR T-cell therapy: corticosteroids and monitored neurologic care.", "t": "ICANS"}, {"n": 5, "stem": "A 55-year-old woman on myeloma therapy develops a temperature of 38.6 degrees and an absolute neutrophil count of 300. She is hypotensive and tachycardic, and cultures have been drawn. Her team is waiting for culture results before deciding on treatment, and the ward is busy. Which action is most appropriate now?", "opts": ["Empiric intravenous antibiotics within the hour", "Stop all anticancer therapy permanently with no antibiotics", "Oral antibiotics at home with a call tomorrow", "Wait for culture results before treatment", "Give growth factor only and observe"], "a": 0, "e": "Fever during neutropenia is an emergency. Cultures are taken, and empiric intravenous antipseudomonal therapy starts within the hour, without waiting for results. Her hypotension and tachycardia place her in the high-risk group, so she is admitted for monitoring and reassessed at 48 hours. Oral therapy at home is reserved for carefully selected low-risk patients. Waiting a day for cultures would risk rapid progression to septic shock.", "k": "Neutropenic fever with instability: empiric intravenous antibiotics within the hour and admission.", "t": "Neutropenic fever"}, {"n": 6, "stem": "A 60-year-old man with newly diagnosed myeloma has a 17p deletion and t(4;14) on FISH. He is fit with good organ function, and he asks whether his genetics mean that treatment is not worthwhile. His oncologist explains how genomic risk is used in practice. What is the best response?", "opts": ["Wait until his bone disease becomes severe", "Offer comfort care alone from the start", "Treat with a standard regimen", "Withhold all treatment because his risk is high", "Choose treatment by chromosome findings only"], "a": 2, "e": "Risk is scored with serum markers and cytogenetics, and the second revision of the international staging system adds chromosome 1q gain and other abnormalities. High-risk findings such as 17p deletion and t(4;14) refine prognosis and do not by themselves withhold effective therapy. He starts a standard modern regimen with close monitoring of response, and measurable residual disease testing may help assess the depth of response during follow-up.", "k": "High-risk cytogenetics refine prognosis and do not withhold effective therapy.", "t": "High-risk cytogenetics"}]}, {"ch": 9, "title": "Non-Small Cell Lung Cancer and Thoracic Genomics", "qs": [{"n": 1, "stem": "A 58-year-old woman who has never smoked has newly diagnosed metastatic lung adenocarcinoma with bone and adrenal metastases. Tissue next-generation sequencing shows an EGFR exon 19 deletion and no other actionable alteration. PD-L1 expression is 1%. She has mild cough, an ECOG performance status of 1, and no brain metastases on MRI. Which first-line treatment is best supported by randomized evidence?", "opts": ["Lorlatinib as first-line therapy", "Platinum doublet chemotherapy alone", "Osimertinib as first-line therapy", "Durvalumab after chemoradiotherapy", "Pembrolizumab with first-line chemotherapy"], "a": 2, "e": "The osimertinib trial randomized 556 patients with an exon 19 deletion or L858R to osimertinib or a first-generation inhibitor, and progression-free survival was 18.9 against 10.2 months, with longer overall survival at the final analysis., Osimertinib is therefore correct for this genotype. Pembrolizumab with chemotherapy is the trap, because its trial enrolled patients without EGFR or ALK alterations and so does not describe her. Lorlatinib targets ALK, and durvalumab consolidation applies only after chemoradiotherapy for stage III disease. In practice, the genotype closes the immunotherapy route before the PD-L1 value is even considered.", "k": "In EGFR-mutated advanced disease, the targeted inhibitor comes first and immunotherapy regimens do not apply.", "t": "EGFR first line"}, {"n": 2, "stem": "A 66-year-old woman who has never smoked undergoes lobectomy with mediastinal node dissection for lung adenocarcinoma, pathologic stage IIIA with N2 disease and negative margins. Molecular testing on the resected tumor shows an EGFR L858R substitution. Postoperative imaging shows no residual disease, and her performance status is excellent. Which additional treatment has randomized evidence of improved disease-free survival?", "opts": ["Durvalumab for up to 12 months", "Osimertinib for three years", "Observation with surveillance imaging", "Pembrolizumab with chemotherapy", "Lorlatinib for three years"], "a": 1, "e": "ADAURA randomized 682 patients after complete resection of EGFR-mutated disease to osimertinib or placebo for three years. In stage II to IIIA disease, 24-month disease-free survival was 90% against 44%, a hazard ratio of 0.17. That is the evidence for adjuvant osimertinib. Durvalumab is the trap for stage III thinking, because its benefit was shown after chemoradiotherapy in unresected disease and not after surgery. Observation ignores a very large disease-free survival gap, and pembrolizumab with chemotherapy was studied in patients without EGFR alterations. Overall survival was immature, so counsel her that the proven gain is fewer relapses.", "k": "Adjuvant osimertinib is the EGFR-specific option after complete resection of s
