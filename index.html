cle-invasive bladder cancer: perioperative durvalumab with chemotherapy improves survival.", "t": "Perioperative therapy in bladder cancer"}, {"n": 5, "stem": "A 71-year-old woman has metastatic urothelial carcinoma to the lungs and nodes, with no prior systemic therapy. She is active and has normal liver function and adequate kidney function. She asks which first-line regimen has been shown to improve overall survival compared with platinum chemotherapy. What is the best answer?", "opts": ["Pembrolizumab alone in all patients", "Gemcitabine plus cisplatin alone", "Best supportive care without any anticancer therapy", "Enfortumab vedotin plus pembrolizumab", "Maintenance avelumab given as the first treatment"], "a": 3, "e": "EV-302 randomized 886 patients to enfortumab vedotin plus pembrolizumab or gemcitabine with cisplatin or carboplatin. Median overall survival was 31.5 months against 16.1 months, a hazard ratio of 0.47, and progression-free survival was 12.5 months against 6.3 months. Grade 3 or higher treatment-related events were fewer, at 55.9% against 69.5%. Skin reactions and neuropathy need early recognition, so she should be told to report rash and numbness promptly, and doses are adjusted when they occur.", "k": "Untreated advanced urothelial cancer: enfortumab vedotin with pembrolizumab beats platinum chemotherapy.", "t": "First-line advanced urothelial carcinoma"}, {"n": 6, "stem": "A 69-year-old man completed six cycles of gemcitabine and cisplatin for metastatic urothelial carcinoma, and imaging shows stable disease without progression. He asks whether to stop all treatment or continue with something to keep the cancer controlled. His oncologist reviews the evidence for maintenance. Which statement is correct?", "opts": ["Maintenance avelumab had no effect on survival", "Maintenance was tested only after progression on chemotherapy", "Maintenance avelumab lowered the rate of adverse events", "Maintenance avelumab improved overall survival", "Only patients with PD-L1-negative disease benefited"], "a": 3, "e": "JAVELIN Bladder 100 randomized 700 patients without progression after first-line platinum chemotherapy to best supportive care with or without avelumab. Median overall survival was 21.4 months against 14.3 months, a hazard ratio of 0.69. Grade 3 or higher events were more frequent, at 47.4% against 25.2%. The benefit was also seen in the PD-L1-positive population. Treatment is started after platinum chemotherapy ends, so the timing matters, and reviews should include symptoms and laboratory results.", "k": "No progression after platinum chemotherapy: maintenance avelumab improves overall survival.", "t": "Maintenance therapy"}, {"n": 7, "stem": "A 55-year-old woman had a nephrectomy for a 3 cm clear-cell renal carcinoma confined to the kidney with low-grade features and negative margins. Her oncologist is asked whether she should receive adjuvant pembrolizumab. He reviews the population enrolled in the randomized trial and her risk. What is the best statement?", "opts": ["The trial enrolled all patients after any nephrectomy", "Her low-grade tumor makes her the ideal candidate", "Adjuvant pembrolizumab is required for every stage", "The trial excluded clear-cell histology entirely", "The trial enrolled high-risk patients; she is not"], "a": 4, "e": "KEYNOTE-564 enrolled patients with clear-cell carcinoma at high risk of recurrence after nephrectomy, with or without metastasectomy. Grade 3 or higher events were more common with pembrolizumab, at 32.4% against 17.7%, so exposure is justified by risk. A small, low-grade, organ-confined tumor falls outside that population, and surveillance imaging scheduled by risk is the appropriate plan for her. Exposing a low-risk patient to immune-related toxicity would add harm without a shown benefit.", "k": "Adjuvant pembrolizumab applies to high-risk clear-cell carcinoma, not to low-risk disease.", "t": "Clear-cell adjuvant trial population"}]}, {"ch": 18, "title": "Genitourinary Genetics and Treatment Complications", "qs": [{"n": 1, "stem": "A 28-year-old man has two small clear-cell renal tumors and a cerebellar hemangioblastoma on MRI. His mother had kidney cancer at 41, and he has had retinal changes noted on an eye examination. He asks whether his findings suggest a hereditary syndrome and which gene is likely to be involved. What is the best answer?", "opts": ["Li-Fraumeni syndrome, from TP53 loss", "No hereditary syndrome, since the tumors are small", "Von Hippel-Lindau disease, from VHL inactivation", "Lynch syndrome, from mismatch repair loss", "BRCA2 syndrome, from DNA repair loss"], "a": 2, "e": "Von Hippel-Lindau disease arises from inactivation of the VHL gene, which leads to constitutive activation of HIF-2 alpha. Patients develop clear-cell renal carcinoma, pancreatic lesions, central nervous system hemangioblastomas and retinal hemangioblastomas. The combination of kidney tumors, a cerebellar lesion, retinal findings and an affected relative points to the syndrome. Germline testing confirms it and guides surveillance of relatives, who each have a chance of carrying the same variant and deserve counseling and testing.", "k": "Kidney tumors, hemangioblastomas and retinal lesions: think von Hippel-Lindau disease and test VHL.", "t": "Hereditary renal cancer recognition"}, {"n": 2, "stem": "A 35-year-old woman with von Hippel-Lindau disease has multiple renal tumors, pancreatic lesions and a hemangioblastoma. She wishes to avoid repeated surgery and asks about drug therapy, including what response to expect, how long the benefit might last, and which side effect to monitor. Which statement about belzutifan is correct?", "opts": ["It was tested only in sporadic clear-cell carcinoma", "It produced no responses in renal cell carcinoma", "It is given as a single dose before surgery", "It caused no anemia in any treated patient", "It produced renal responses; anemia was common"], "a": 4, "e": "In a phase 2 single-group trial, 49% of patients with renal cell carcinoma in von Hippel-Lindau disease had an objective response to belzutifan, and 77% of patients with pancreatic lesions responded. Most adverse events were grade 1 or 2, and anemia occurred in 90% of patients. Hemoglobin therefore needs monitoring. The trial had no comparison group, and pregnancy precautions need to be discussed.", "k": "Belzutifan in von Hippel-Lindau disease: responses in renal and pancreatic tumors; monitor anemia.", "t": "Belzutifan"}, {"n": 3, "stem": "A 62-year-old man with metastatic prostate cancer has sequencing that shows a germline BRCA2 pathogenic variant. He has two daughters and a sister who have never been tested, and he asks what the result means for them. His oncologist reviews the next steps for him and for his family. What is most appropriate?", "opts": ["Testing of male relatives only, to avoid worry", "Treat the result as a variant of uncertain significance", "No action, because prostate cancer affects only men", "Genetic counseling and cascade testing of relatives", "Repeat the test yearly to confirm the variant"], "a": 3, "e": "A germline BRCA2 variant affects drug selection, such as PARP inhibitors, and informs risk to relatives. BRCA2 carriers face higher risks of aggressive prostate cancer, and female relatives face higher breast and ovarian cancer risk. Cascade testing of relatives is therefore offered after counseling. The variant is pathogenic, not uncertain, and repeating the test adds nothing. His daughters and sister should be told about the result.", "k": "Germline BRCA2 in prostate cancer: counseling and cascade testing, including female relatives.", "t": "Germline testing in prostate cancer"}, {"n": 4, "stem": "A 72-year-old man with a prior myocardial infarction needs androgen-deprivation therapy for high-risk prostate cancer. He asks whether choosing a GnRH antagonist instead of an agonist would reduce his risk of another cardiovascular event. His oncologist reviews the only randomized comparison in men with cardiovascular disease. What does it show?", "opts": ["No cardiovascular events occurred in either group", "No significant difference in major events", "A large reduction in events with the antagonist", "A large increase in events with the agonist", "The trial enrolled only men without heart disease"], "a": 1, "e": "PRONOUNCE randomized men with prostate cancer and atherosclerotic cardiovascular disease to degarelix or leuprolide for 12 months. Major cardiovascular events occurred in 5.5% and 4.1%, a hazard ratio of 1.28 with a wide interval. The trial ended early with fewer participants and events than planned, so the relative safety of the two classes remains unresolved. Practical care rests on blood pressure, lipids and glucose.", "k": "PRONOUNCE: no significant difference in major cardiovascular events between degarelix and leuprolide.", "t": "Cardiovascular safety of androgen deprivation"}, {"n": 5, "stem": "A 66-year-old man receiving pembrolizumab for urothelial carcinoma has a creatinine that has risen from 1.1 to 2.4 mg/dL over 3 weeks, with no urinary symptoms. He takes no nonsteroidal drugs, and obstruction and dehydration have been excluded. His oncologist grades the event as grade 3 immune-related nephritis. What is the best management?", "opts": ["Suspend the drug and start high-dose corticosteroids", "Continue pembrolizumab with oral fluids only", "Continue pembrolizumab and recheck the creatinine later", "Stop all treatment and give no corticosteroids", "Give a second checkpoint inhibitor to the regimen"], "a": 0, "e": "The ASCO guideline update advises that grade 3 events generally lead to suspension of the checkpoint inhibitor and high-dose corticosteroids, tapered over at least 4 to 6 weeks. Refractory cases may need other immunosuppressive agents. Continuing the drug risks permanent kidney injury. Nephrology is involved, and the decision about resuming immunotherapy comes later, once the cause is clear and the grade has fallen.", "k": "Grade 3 immune-related nephritis: suspend immunotherapy and give high-dose corticosteroids.", "t": "Immune-related nephritis"}]}, {"ch": 19, "title": "Gynecologic Cancers", "qs": [{"n": 1, "stem": "A 46-year-old woman has recurrent cervical cancer with lung metastases 14 months after chemoradiation. Biopsy shows squamous carcinoma with a PD-L1 combined positive score of 20. She has not had systemic therapy for recurrence, and she asks which first-line regimen has randomized evidence for survival benefit. What is the best answer?", "opts": ["Maintenance olaparib after any response to therapy", "Chemotherapy alone, because PD-L1 is irrelevant here", "Pembrolizumab alone, replacing all chemotherapy drugs", "Chemotherapy with pembrolizumab and optional bevacizumab", "Repeat chemoradiation to the pelvis as the only treatment"], "a": 3, "e": "KEYNOTE-826 randomized patients to pembrolizumab or placebo with platinum-based chemotherapy and optional bevacizumab. In patients with a score of 1 or more, 24-month overall survival was 53.0% against 41.7%, a hazard ratio for death of 0.64. In patients with a score of 10 or more, the hazard ratio was 0.61. Immune-related events need monitoring, and olaparib belongs to BRCA-mutated ovarian cancer.", "k": "Recurrent cervical cancer with PD-L1 positivity: add pembrolizumab to chemotherapy.", "t": "Pembrolizumab in cervical cancer"}, {"n": 2, "stem": "A 50-year-old woman with metastatic cervical cancer is starting pembrolizumab with carboplatin, paclitaxel and bevacizumab. She asks which side effects were most common at severe grades in the randomized trial, so she knows what her team will be watching for during treatment. Which pair is correct?", "opts": ["Anemia and neutropenia", "Pulmonary fibrosis and alopecia", "Peripheral edema and hair color change", "Cerebellar ataxia and optic neuritis", "Hearing loss and cataracts"], "a": 0, "e": "In KEYNOTE-826, the most common grade 3 to 5 events were anemia, at 30.3% with pembrolizumab against 26.9% with placebo, and neutropenia, at 12.4% against 9.7%. These reflect the chemotherapy backbone and are managed with counts and supportive care. Immune-related events also need attention, and she should know to report new cough, diarrhea or rash promptly, because early treatment of these events limits harm and keeps her on therapy.", "k": "Expect anemia and neutropenia on pembrolizumab with chemotherapy for cervical cancer.", "t": "Toxicity in KEYNOTE-826"}, {"n": 3, "stem": "A 54-year-old woman completed surgery and six cycles of carboplatin and paclitaxel for stage III high-grade serous ovarian cancer, with a complete clinical response. Germline testing shows a BRCA1 pathogenic variant. She asks what she can do to lower her chance of relapse now. Which approach has randomized support?", "opts": ["Observation with no further therapy given", "Maintenance olaparib", "Radiation to the abdomen and pelvis", "Six more cycles of the same chemotherapy", "Pembrolizumab alone as maintenance for a year"], "a": 1, "e": "SOLO-1 enrolled women with newly diagnosed stage III or IV disease and a BRCA mutation who responded to platinum, and randomized them 2:1 to olaparib or placebo. Olaparib lowered the risk of progression or death by 70%, a hazard ratio of 0.30, and 3-year freedom from progression was 60% against 27%. Blood counts are monitored, and relatives are offered counseling. Further chemotherapy adds toxicity without a shown benefit.", "k": "BRCA-mutated advanced ovarian cancer responding to platinum: maintenance olaparib.", "t": "Maintenance olaparib"}, {"n": 4, "stem": "A 54-year-old woman asks her oncologist to explain what SOLO-1 showed about maintenance olaparib, because she wants to understand how much it might help. She has stage III high-grade serous ovarian cancer, a BRCA1 variant and a complete response to platinum. Which description of the trial result is accurate?", "opts": ["The trial randomized patients before platinum chemotherapy", "The trial enrolled only patients without a BRCA mutation", "Freedom from progression at 3 years was 27% against 60%", "The hazard ratio for progression was 1.30 with olaparib", "Freedom from progression at 3 years was 60% against 27%"], "a": 4, "e": "SOLO-1 randomized 391 patients, 260 to olaparib and 131 to placebo, and all had responded to platinum-based chemotherapy. At a median follow-up of 41 months, the hazard ratio for progression or death was 0.30. Freedom from progression at 3 years was 60% with olaparib against 27% with placebo. A hazard ratio under 1 favors the drug, and enrollment followed the platinum response, not preceded it.", "k": "SOLO-1: olaparib maintenance, hazard ratio 0.30, 3-year freedom from progression 60% against 27%.", "t": "Interpreting SOLO-1"}, {"n": 5, "stem": "A 62-year-old woman has high-grade serous ovarian cancer that progressed 4 months after her last platinum dose, after two prior lines. Tumor testing shows high folate receptor alpha expression. She asks whether anything beats single-agent chemotherapy in her situation and what the risks are. Which approach is supported by a randomized trial?", "opts": ["Maintenance olaparib regardless of BRCA status", "Observation with symptom control only", "Mirvetuximab soravtansine, with eye monitoring", "Pembrolizumab alone without any chemotherapy", "Repeat the same platinum regimen for six cycles"], "a": 2, "e": "MIRASOL enrolled patients with platinum-resistant high-grade serous disease and high folate receptor alpha expression. Median overall survival was 16.46 months against 12.75 months, a hazard ratio of 0.67, and objective response was 42.3% against 15.9%. Grade 3 or higher events were fewer, at 41.7% against 54.1%. Eye toxicity is a known effect of the class, so examinations and drops are arranged.", "k": "Platinum-resistant ovarian cancer with high receptor expression: mirvetuximab soravtansine.", "t": "Targeted therapy in platinum-resistant disease"}, {"n": 6, "stem": "A 52-year-old woman has stage IV endometrial cancer with peritoneal disease. Immunohistochemistry shows loss of MLH1 and PMS2, and MLH1 promoter methylation is present. She asks which first-line approach has the strongest evidence for a tumor with this molecular profile, and whether the result suggests an inherited syndrome. What is the best answer?", "opts": ["Endocrine therapy alone; the tumor is hormone driven", "Dostarlimab alone; methylation excludes any further testing", "Carboplatin, paclitaxel and dostarlimab; likely sporadic", "Chemotherapy alone; methylation proves Lynch syndrome", "Radiation alone; the immunohistochemistry result is irrelevant"], "a": 2, "e": "RUBY randomized patients with advanced or recurrent disease to dostarlimab or placebo with carboplatin and paclitaxel, and in the mismatch repair-deficient group, 24-month progression-free survival was 61.4% against 15.7%, a hazard ratio of 0.28. MLH1 promoter methylation points to a sporadic cause, so Lynch syndrome is less likely, whereas loss of MSH2 and MSH6 without methylation would raise concern. Severe events were more frequent with dostarlimab.", "k": "Mismatch repair-deficient endometrial cancer: add dostarlimab; MLH1 methylation suggests sporadic disease.", "t": "Mismatch repair deficiency in endometrial cancer"}, {"n": 7, "stem": "A 60-year-old woman has stage III endometrial cancer and a mismatch repair-proficient tumor. Her oncologist is considering adding dostarlimab to carboplatin and paclitaxel and wants to describe the trial result for proficient tumors honestly. She asks whether she should expect the same benefit as in deficient tumors. What is most accurate?", "opts": ["Dostarlimab lowered survival in the overall population", "The trial enrolled no patients with proficient tumors", "Benefit existed only in deficient tumors and nowhere else", "Benefit was identical in deficient and proficient tumors", "Benefit overall, but smaller than in deficient tumors"], "a": 4, "e": "In RUBY, the hazard ratio for progression was 0.28 in the mismatch repair-deficient group and 0.64 in the overall population. Twenty-four-month progression-free survival was 36.1% against 18.1% overall, and 24-month overall survival was 71.3% against 56.0%. The overall result includes proficient tumors, so some benefit exists, but it is smaller than in the deficient group. She should hear that severe events were more frequent.", "k": "Dostarlimab helps overall, with the largest effect in mismatch repair-deficient tumors.", "t": "Overall population results in RUBY"}, {"n": 8, "stem": "A 41-year-old woman has stage I endometrial cancer, and immunohistochemistry shows loss of MSH2 and MSH6 without MLH1 loss. Her father had colon cancer at 48. She asks whether her tumor result could mean she carries an inherited cancer syndrome, and what should happen next. What is the most appropriate step?", "opts": ["Repeat immunohistochemistry on the same sample", "Testing of her father's tumor slides alone", "Prophylactic colectomy before any testing is done", "Germline testing for Lynch syndrome", "No further testing, since the tumor is early stage"], "a": 3, "e": "Loss of MSH2 and MSH6 without promoter methylation raises concern for Lynch syndrome, and mismatch repair testing in every endometrial cancer serves to guide immunotherapy and to screen for the syndrome. A deficient result in a young patient with a family history prompts germline testing. A confirmed variant would change surveillance for her and her relatives, including colonoscopy at regular intervals. Surgery is not decided before the result.", "k": "Mismatch repair loss in a young patient: send germline testing for Lynch syndrome.", "t": "Lynch syndrome screening"}, {"n": 9, "stem": "A 39-year-old woman has a 6 cm cervical tumor with pelvic node involvement and no distant disease on imaging. She is healthy and asks whether surgery should be her first treatment. Her gynecologic oncologist reviews standard management for this stage with her and discusses fertility and side effects. What is the best recommendation?", "opts": ["Chemoradiation after a fertility discussion", "Pembrolizumab alone without any radiation", "Observation until symptoms develop", "Maintenance olaparib after a clinical response", "Radical hysterectomy as the first treatment"], "a": 0, "e": "Locally advanced cervical cancer is treated with chemoradiation rather than primary surgery, and nodal involvement changes both the stage and the plan. Radiation affects ovarian function and the pelvis, so fertility options are discussed before treatment starts. Bowel and bladder toxicity are monitored. Pembrolizumab belongs to persistent, recurrent or metastatic disease, and olaparib belongs to BRCA-mutated ovarian cancer, so neither applies to her.", "k": "Locally advanced cervical cancer: chemoradiation, not primary surgery.", "t": "Locally advanced cervical cancer"}, {"n": 10, "stem": "A 58-year-old woman recovering from debulking surgery for ovarian cancer develops left leg swelling and mild dyspnea on day 8. She is about to start chemotherapy, and her blood pressure and oxygen saturation are stable. Imaging confirms deep vein thrombosis. Her oncologist asks about management and whether chemotherapy should wait. What is appropriate?", "opts": ["Withhold anticoagulation because she just had surgery", "Start anticoagulation and proceed with chemotherapy", "Place a filter and give no anticoagulant at all", "Delay all treatment for six months without therapy", "Give aspirin alone for the confirmed thrombosis"], "a": 1, "e": "Venous thromboembolism is common in gynecologic cancer, especially after pelvic surgery and during chemotherapy, and anticoagulation is the treatment for confirmed thrombosis. Chemotherapy can proceed with anticoagulation, and the team monitors bleeding risk and platelet counts. Withholding anticoagulation risks pulmonary embolism, and aspirin alone does not treat an established clot. Risk-based prophylaxis after future surgery is also planned, and she should be told to report new swelling, chest pain or breathlessness at once, since a clot can recur during chemotherapy.", "k": "Confirmed thrombosis in gynecologic cancer: anticoagulate and continue chemotherapy with monitoring.", "t": "Thrombosis after pelvic surgery"}, {"n": 11, "stem": "A 49-year-old woman has uterine leiomyosarcoma found after hysterectomy for presumed fibroids. Imaging shows no residual disease, and she is otherwise well. She asks whether chemotherapy is needed to prevent recurrence and how she will be followed. Her oncologist explains the uncertainty in the evidence. Which statement is accurate?", "opts": ["Radiation to the pelvis is required for every patient", "Surveillance is unnecessary after complete resection", "Adjuvant benefit is uncertain; surveillance is used", "Adjuvant chemotherapy is proven to cure all patients", "Hormone therapy is the standard adjuvant treatment"], "a": 2, "e": "Uterine leiomyosarcoma is aggressive and is treated with surgery. The role of adjuvant chemotherapy is uncertain, so the decision is shared and individualized. Surveillance imaging is used for early detection of relapse. The tumor was found unexpectedly, so pathology review by an expert is useful. Hormone therapy and routine pelvic radiation are not standard for every patient, and she should know that recurrence can occur even after complete resection.", "k": "Uterine leiomyosarcoma: surgery, uncertain adjuvant chemotherapy, and surveillance imaging.", "t": "Uterine leiomyosarcoma follow-up"}]}, {"ch": 20, "title": "Esophageal, Gastric, Small Bowel, and Appendiceal Cancers", "qs": [{"n": 1, "stem": "A 62-year-old man completed chemoradiation and esophagectomy for a distal adenocarcinoma. Pathology shows an R0 resection with a 1.5 cm focus of viable residual tumor in the specimen. He recovered well from surgery and asks whether any further treatment would lower his risk of recurrence. His oncologist reviews the randomized evidence. What is the best recommendation?", "opts": ["Adjuvant FLOT for four postoperative cycles", "Repeat chemoradiation to the surgical bed", "Observation because no adjuvant treatment is proven", "Adjuvant pembrolizumab given with fluorouracil", "Adjuvant nivolumab for up to one year"], "a": 4, "e": "CheckMate 577 enrolled adults with R0-resected stage II or III disease and residual pathological disease after neoadjuvant chemoradiotherapy, and randomized them 2:1 to nivolumab or placebo for up to 1 year. Median disease-free survival was 22.4 months against 11.0 months, a hazard ratio of 0.69. Grade 3 or 4 treatment-related events were more frequent, at 13% against 6%. Counseling covers immune-related events.", "k": "Residual disease after chemoradiation and esophagectomy: adjuvant nivolumab for up to a year.", "t": "Adjuvant nivolumab"}, {"n": 2, "stem": "A 58-year-old woman had chemoradiation and esophagectomy for adenocarcinoma. Surgical pathology shows an R0 resection and no residual viable tumor, a pathological complete response. Her oncologist is asked whether she should receive the same adjuvant nivolumab given to patients with residual disease, and reviews the population enrolled in CheckMate 577. What is the best answer?", "opts": ["The trial enrolled only patients with a complete response", "Nivolumab replaces surveillance imaging in all patients", "The trial enrolled patients with residual disease only", "The trial excluded patients after chemoradiation entirely", "Nivolumab is required for every resected esophageal cancer"], "a": 2, "e": "CheckMate 577 enrolled patients with residual pathological disease after neoadjuvant chemoradiotherapy and surgery. The benefit, with median disease-free survival of 22.4 months against 11.0 months, was shown in that group. A pathological complete response falls outside the enrolled population, so the trial does not support extending treatment to her. Surveillance is the plan, and she should understand the reasoning behind it.", "k": "Adjuvant nivolumab applies to residual disease, not to a pathological complete response.", "t": "Who benefits from adjuvant nivolumab"}, {"n": 3, "stem": "A 66-year-old woman has metastatic esophageal squamous cell carcinoma with liver metastases and a PD-L1 combined positive score of 15. She has had no prior systemic therapy and has good performance status. She asks which first-line regimen was shown to improve survival over chemotherapy in a randomized trial. What is the best answer?", "opts": ["Pembrolizumab with fluorouracil and cisplatin", "Fluorouracil and cisplatin alone", "Perioperative FLOT given for eight cycles", "Endocrine therapy with a cell-cycle inhibitor", "Adjuvant nivolumab for one year"], "a": 0, "e": "KEYNOTE-590 randomized 749 patients with untreated advanced esophageal cancer to pembrolizumab or placebo with fluorouracil and cisplatin. In squamous disease with a score of 10 or more, median overall survival was 13.9 months against 8.8 months, a hazard ratio of 0.57. Grade 3 or higher events were 72% against 68%. FLOT belongs to resectable gastric cancer, and adjuvant nivolumab belongs to residual disease after surgery.", "k": "Advanced esophageal squamous cancer with a score of 10 or more: add pembrolizumab to chemotherapy.", "t": "Immunotherapy in esophageal squamous cancer"}, {"n": 4, "stem": "A 58-year-old man has metastatic HER2-negative gastric adenocarcinoma with a PD-L1 combined positive score of 7, and he has had no treatment. He is active and asks whether adding immunotherapy to chemotherapy has randomized support and what the cost in toxicity might be. His oncologist reviews the trial. Which statement is correct?", "opts": ["Nivolumab was inferior to chemotherapy in every subgroup studied", "Nivolumab was tested only in tumors with a score of zero", "Nivolumab had fewer severe events than chemotherapy alone", "Survival improved at a score of 5 or more, with more toxicity", "The trial enrolled only patients with HER2-positive disease"], "a": 3, "e": "CheckMate 649 randomized patients with untreated non-HER2-positive disease to nivolumab with chemotherapy or chemotherapy alone, and in those with a score of 5 or more, the hazard ratio for death was 0.71. Grade 3 to 4 treatment-related events occurred in 59% against 44%, so benefit comes with more toxicity. His score of 7 falls within the primary population. HER2-positive disease follows a different pathway.", "k": "HER2-negative gastric cancer with a score of 5 or more: nivolumab with chemotherapy improves survival with more toxicity.", "t": "First-line gastric cancer immunotherapy"}, {"n": 5, "stem": "A 54-year-old woman has a cT3N1 gastric adenocarcinoma with no distant metastases on CT, and staging laparoscopy is negative for peritoneal disease. She is active with normal kidney and liver function. Her tumor board asks which perioperative regimen has randomized evidence of better survival than ECF or ECX for fit patients. What is the best answer?", "opts": ["Surgery alone without any chemotherapy", "FLOT before and after surgery", "Nivolumab alone before surgery", "Radiation alone followed by observation", "ECF given for six cycles after surgery only"], "a": 1, "e": "FLOT4 randomized 716 patients with resectable disease to perioperative FLOT or ECF or ECX. Median overall survival was 50 months against 35 months, a hazard ratio of 0.77. Related serious adverse events were similar, at 27% in each group. Staging laparoscopy excludes occult peritoneal disease, and counts and neuropathy are checked before each cycle because docetaxel and oxaliplatin cause both.", "k": "Resectable gastric cancer in a fit patient: perioperative FLOT.", "t": "Perioperative chemotherapy for gastric cancer"}, {"n": 6, "stem": "A 52-year-old woman has abdominal distension, and CT shows mucinous ascites with peritoneal implants from a ruptured appendiceal mucinous tumor. Biopsy shows a low-grade mucinous neoplasm. She is otherwise well and asks what the diagnosis means and where she should be treated. Which plan is most appropriate?", "opts": ["Observation with repeat imaging every five years", "Endocrine therapy with an aromatase inhibitor", "Cytoreductive surgery at a specialized center", "Radiation to the abdomen as primary treatment", "Systemic chemotherapy at the nearest community clinic"], "a": 2, "e": "Mucinous appendiceal tumors with peritoneal spread produce pseudomyxoma peritonei. Selected patients are treated at specialized centers with cytoreductive surgery and heated intraperitoneal chemotherapy. Because these tumors are uncommon, care at a high-volume center and review by a multidisciplinary team are expected. Systemic chemotherapy alone has limited benefit in low-grade disease, and radiation and endocrine therapy have no role as primary treatment.", "k": "Pseudomyxoma peritonei: cytoreductive surgery at a specialized center.", "t": "Appendiceal tumor with peritoneal spread"}]}, {"ch": 21, "title": "Colorectal and Anal Cancers", "qs": [{"n": 1, "stem": "A 63-year-old man had a sigmoid colon cancer resected with clear margins. Pathology shows pT3N1 disease, with 2 of 12 nodes positive. He is active and worried about numbness in his hands after chemotherapy. His oncologist reviews the pooled duration trials with him before choosing a plan. What is the best recommendation?", "opts": ["Three months of CAPOX", "Adjuvant radiotherapy to the colon bed", "Pembrolizumab for two years after resection", "Observation without adjuvant treatment", "Six months of FOLFOX, no shorter course"], "a": 0, "e": "The IDEA pooled analysis compared 3 and 6 months of FOLFOX or CAPOX in 12,834 patients. CAPOX met noninferiority with a hazard ratio of 0.95, whereas FOLFOX did not. In patients with T1 to T3 and N1 disease, 3-year disease-free survival was 83.1% with 3 months and 83.3% with 6 months. His lower-risk stage fits a shorter CAPOX course, and neuropathy is reviewed at each visit.", "k": "Lower-risk stage III colon cancer: 3 months of CAPOX is noninferior.", "t": "Duration of adjuvant CAPOX"}, {"n": 2, "stem": "A 59-year-old woman had a right colon cancer resected with clear margins. Pathology shows pT4N2 disease with 6 positive nodes. She is fit and asks whether a shorter course of adjuvant chemotherapy would be enough. Her oncologist reviews how risk group affected the duration results in the pooled trials. What is the best answer?", "opts": ["Three months was superior for T4 or N2 disease", "Three months and six months were identical in every group", "Six months of therapy was superior for T4 or N2 disease", "Duration made no difference for any regimen", "Adjuvant therapy is optional for stage III disease"], "a": 2, "e": "In an exploratory analysis of the IDEA trials, patients with T4 or N2 disease did better with 6 months than with 3 months. In T1 to T3 and N1 disease, 3-year disease-free survival was the same for both durations. Her higher-risk stage therefore favors the longer course, and the regimen choice and neuropathy risk are discussed together before the first cycle begins. A shorter course would give up benefit in this group.", "k": "T4 or N2 stage III colon cancer favors 6 months of adjuvant therapy.", "t": "Higher-risk stage III colon cancer"}, {"n": 3, "stem": "A 58-year-old woman has newly found liver metastases from a right-sided colon cancer. Tumor testing shows loss of MLH1 and PMS2 with MSI-high status, and she has had no systemic treatment. She has good performance status and asks which first-line approach has the best randomized evidence. What is the best choice?", "opts": ["FOLFOX with bevacizumab", "Encorafenib with cetuximab alone", "Surgery of the primary only, then observation", "Pembrolizumab alone", "Adjuvant capecitabine for six months"], "a": 3, "e": "KEYNOTE-177 enrolled 307 untreated patients with MSI-H or dMMR metastatic disease and randomized them to pembrolizumab or chemotherapy. Median progression-free survival was 16.5 months against 8.2 months, a hazard ratio of 0.60. Grade 3 or higher treatment-related events were 22% against 66%. Loss of MLH1 and PMS2 also prompts germline testing for Lynch syndrome. Chemotherapy with bevacizumab or cetuximab remains the comparator, not the preferred first-line choice here.", "k": "MSI-H or dMMR metastatic colorectal cancer: first-line pembrolizumab.", "t": "MSI-high first-line therapy"}, {"n": 4, "stem": "A 66-year-old man has metastatic right-sided colon cancer with peritoneal and liver disease. Testing shows a BRAF V600E mutation and proficient mismatch repair. He has had no treatment, and his performance status is good. His oncologist reviews recent first-line trial data in this poor-prognosis subtype. Which regimen has randomized support for improved survival?", "opts": ["Pembrolizumab alone as first-line treatment", "Dostarlimab for six months before surgery", "Retifanlimab with carboplatin and paclitaxel", "Observation after resection of the primary", "Encorafenib, cetuximab and mFOLFOX6"], "a": 4, "e": "BREAKWATER randomized patients with untreated BRAF V600E metastatic disease to encorafenib and cetuximab, with or without mFOLFOX6, or standard care. Encorafenib, cetuximab and mFOLFOX6 improved median progression-free survival to 12.8 months from 7.1 months, and median overall survival was 30.3 months against 15.1 months. Pembrolizumab fits MSI-H disease, but his tumor is proficient for mismatch repair, so immunotherapy alone is not the best choice for him.", "k": "BRAF V600E metastatic colorectal cancer: encorafenib, cetuximab and mFOLFOX6.", "t": "BRAF V600E first-line therapy"}, {"n": 5, "stem": "A 55-year-old woman has a cT3N1 mid-rectal cancer. MRI shows a clear mesorectal fascia and a tumor well away from the sphincter. She would like to avoid pelvic radiation if outcomes are equivalent. Her team reviews the randomized trial that tested a selective approach to chemoradiotherapy. What is the best recommendation?", "opts": ["Dostarlimab for six months in every patient", "Preoperative FOLFOX with restaging", "Radiation alone with no systemic therapy", "Upfront surgery with no preoperative treatment", "Adjuvant FOLFOX only after surgery"], "a": 1, "e": "PROSPECT randomized 1,194 patients to preoperative FOLFOX or chemoradiotherapy, with chemoradiotherapy given in the FOLFOX group only if the tumor shrank by under 20% or FOLFOX was stopped. The hazard ratio for disease-free survival was 0.92, which met noninferiority. Her MRI features fit the selected population. Dostarlimab applies only to mismatch repair-deficient tumors, and her tumor was not reported as deficient. Upfront surgery and radiation alone lack this randomized support.", "k": "Selected rectal cancers: preoperative FOLFOX is noninferior to chemoradiotherapy.", "t": "Preoperative therapy for rectal cancer"}, {"n": 6, "stem": "A 60-year-old woman has liver and lung metastases from anal squamous cell carcinoma that recurred after chemoradiotherapy. Her HIV infection is well controlled on treatment with an undetectable viral load. She has good performance status and no prior systemic therapy for metastatic disease. Which first-line regimen improved progression-free survival in a randomized trial?", "opts": ["Carboplatin and paclitaxel with retifanlimab", "Carboplatin and paclitaxel with placebo alone", "Pembrolizumab for MSI-H colorectal cancer", "Radiation alone because of her HIV status", "Encorafenib with cetuximab and mFOLFOX6"], "a": 0, "e": "POD1UM-303 randomized 308 patients with inoperable locally recurrent or metastatic anal squamous cell carcinoma to retifanlimab or placebo with carboplatin and paclitaxel. Median progression-free survival was 9.3 months against 7.4 months, a hazard ratio of 0.63. Grade 3 or worse events were 83.1% against 75.0%. Patients with well-controlled HIV were eligible, so HIV status alone does not exclude treatment. Single-agent radiation and an MSI-H regimen do not apply to her situation.", "k": "Metastatic anal squamous cancer: add retifanlimab to carboplatin and paclitaxel.", "t": "Metastatic anal squamous cancer"}]}, {"ch": 22, "title": "Hepatobiliary, Pancreatic, and Neuroendocrine Tumors", "qs": [{"n": 1, "stem": "A 64-year-old man with hepatitis C cirrhosis has multifocal hepatocellular carcinoma beyond transplant and liver-directed options. His liver function is Child-Pugh class A, and he has had no systemic therapy. Endoscopy shows small varices with no recent bleeding. Which first-line regimen improved overall survival over sorafenib in a randomized trial?", "opts": ["Sorafenib alone as first-line therapy", "Atezolizumab with bevacizumab", "Lutetium dotatate with octreotide", "Adjuvant capecitabine for six months", "Gemcitabine with cisplatin"], "a": 1, "e": "IMbrave150 randomized patients with unresectable disease 2:1 to atezolizumab with bevacizumab or sorafenib. The hazard ratio for death was 0.58, and overall survival at 12 months was 67.2% against 54.6%. Severe adverse events were similar, at 56.5% against 55.1%. Bevacizumab raises bleeding risk, so varices are assessed by endoscopy and treated before it begins, which his team has done before the first treatment visit.", "k": "Unresectable hepatocellular carcinoma: atezolizumab with bevacizumab after variceal assessment.", "t": "First-line hepatocellular carcinoma"}, {"n": 2, "stem": "A 69-year-old woman has unresectable hepatocellular carcinoma with cirrhosis and Child-Pugh class A function. Endoscopy shows large esophageal varices that were banded last month, and her hepatologist is concerned about rebleeding with a vascular endothelial growth factor inhibitor. She has had no systemic therapy. Which first-line regimen has randomized survival evidence without bevacizumab?", "opts": ["Modified FOLFIRINOX for 24 weeks", "Bevacizumab with chemotherapy", "Atezolizumab with bevacizumab", "Tremelimumab with durvalumab", "Radioligand therapy with lutetium dotatate"], "a": 3, "e": "HIMALAYA randomized treatment-naive patients who were not candidates for locoregional therapy to tremelimumab with durvalumab, durvalumab alone, or sorafenib. Median overall survival rose from 13.8 months to 16.4 months with the dual immunotherapy against sorafenib. The regimen contains no bevacizumab, so it avoids the added bleeding risk. Liver tests and immune-related events are followed during treatment, and her endoscopy results are reviewed regularly.", "k": "High variceal bleeding risk: tremelimumab with durvalumab avoids bevacizumab.", "t": "High bleeding risk in hepatocellular carcinoma"}, {"n": 3, "stem": "A 60-year-old man with unresectable hepatocellular carcinoma and well-compensated cirrhosis asks his oncologist how dual immunotherapy compared with sorafenib in the HIMALAYA trial. He had no prior systemic treatment and is not a candidate for liver-directed therapy. Which statement about the survival result is correct?", "opts": ["Survival was reported only for durvalumab alone", "Median survival was equal to sorafenib at 13.8 months", "Median survival was 16.4 months against 13.8 months", "The trial enrolled only previously treated patients", "Median survival fell from 16.4 months to 13.8 months"], "a": 2, "e": "HIMALAYA assessed overall survival in treatment-naive patients who were not candidates for locoregional therapy and randomized them to tremelimumab with durvalumab, durvalumab alone, or sorafenib. Median overall survival increased significantly by 2.5 months, from 13.8 months to 16.4 months, with single-dose tremelimumab plus durvalumab against sorafenib. The trial enrolled untreated patients, so it applies to his first-line decision, and his team reviews immune-related risks with him.", "k": "HIMALAYA: tremelimumab with durvalumab, median overall survival 16.4 months against 13.8 months.", "t": "Interpreting HIMALAYA"}, {"n": 4, "stem": "A 61-year-old man has intrahepatic cholangiocarcinoma with liver and nodal metastases, a normal bilirubin, and good performance status. He has had no systemic therapy, and tumor sequencing has been sent. His oncologist reviews randomized first-line options for advanced biliary tract cancer. Which regimen was tested against placebo with chemotherapy and reported similar severe event rates?", "opts": ["Durvalumab with gemcitabine and cisplatin", "Single-agent capecitabine for six months", "Modified FOLFIRINOX for 24 weeks", "Gemcitabine and cisplatin without any addition", "Lutetium dotatate with octreotide"], "a": 0, "e": "TOPAZ-1 enrolled previously untreated patients with locally advanced or metastatic biliary tract cancer and randomized them to durvalumab or placebo with gemcitabine and cisplatin. Median overall survival in the durvalumab group was 12.8 months, and severe event rates were similar between the groups. Sequencing for FGFR2 fusions, IDH1 variants and HER2 alterations guides later therapy after first-line treatment, so results are reviewed at each visit.", "k": "Advanced biliary tract cancer: add durvalumab to gemcitabine and cisplatin.", "t": "Advanced biliary tract cancer"}, {"n": 5, "stem": "A 58-year-old woman underwent pancreatoduodenectomy for a 3 cm pancreatic adenocarcinoma with 2 positive nodes. She has recovered well, walks daily, and has normal bilirubin and blood counts. Her oncologist reviews the randomized adjuvant trial that compared a combination regimen with gemcitabine. What is the best recommendation?", "opts": ["Lutetium dotatate after resection", "Adjuvant radiation alone to the bed", "Adjuvant sorafenib for twelve months", "Observation without adjuvant treatment", "Modified FOLFIRINOX"], "a": 4, "e": "PRODIGE 24 randomized 493 patients with resected disease to modified FOLFIRINOX or gemcitabine for 24 weeks. Median overall survival was 54.4 months against 35.0 months, a hazard ratio of 0.64. Grade 3 or 4 adverse events occurred in 75.9% against 52.9%, so only patients who are fit receive the combination. She meets that standard, and neutropenia and diarrhea are monitored.", "k": "Resected pancreatic cancer in a fit patient: modified FOLFIRINOX.", "t": "Adjuvant therapy for pancreatic cancer"}, {"n": 6, "stem": "A 63-year-old man has metastatic pancreatic adenocarcinoma with liver metastases and no prior treatment. He has an ECOG performance status of 1 and a normal bilirubin, and germline testing is negative. His oncologist reviews a randomized trial that tested a liposomal irinotecan regimen against nab-paclitaxel with gemcitabine. What is the best summary of the result?", "opts": ["Both arms had identical median survival of 9.2 months", "NALIRIFOX was inferior with a hazard ratio over one", "The trial enrolled only resected patients", "NALIRIFOX improved median survival to 11.1 months", "NALIRIFOX caused no severe adverse events"], "a": 3, "e": "NAPOLI 3 randomized 770 untreated metastatic patients to NALIRIFOX or nab-paclitaxel with gemcitabine. Median overall survival was 11.1 months against 9.2 months, a hazard ratio of 0.83. Severe treatment-emergent events were common in both groups, at 87% and 86%. NALIRIFOX is therefore an option, and toxicity such as diarrhea and neutropenia is reviewed before each cycle, with dose changes made for severe events.", "k": "Metastatic pancreatic cancer: NALIRIFOX improved overall survival over nab-paclitaxel with gemcitabine.", "t": "Metastatic pancreatic first line"}, {"n": 7, "stem": "A 66-year-old woman has a well-differentiated midgut neuroendocrine tumor with liver metastases. Imaging shows progression on octreotide, and somatostatin receptor imaging shows strong uptake in all lesions. Her counts and kidney function are normal. Her oncologist reviews the randomized trial of radioligand therapy against high-dose octreotide. What is the best next treatment?", "opts": ["Gemcitabine with cisplatin alone", "Modified FOLFIRINOX for 24 weeks", "Cisplatin with etoposide for small cell disease", "Observation until symptoms worsen", "Lutetium dotatate with octreotide"], "a": 4, "e": "NETTER-1 compared lutetium dotatate with high-dose octreotide in 229 patients with progressive, receptor-positive midgut tumors. The estimated progression-free survival rate at month 20 was 65.2% against 10.8%, and the response rate was 18% against 3%. Clinically significant myelosuppression occurred in fewer than 10% of treated patients. Counts and kidney function are monitored during treatment, and hormone symptoms are managed with somatostatin analogs.", "k": "Progressive receptor-positive midgut neuroendocrine tumor: lutetium dotatate.", "t": "Radioligand therapy"}, {"n": 8, "stem": "A 57-year-old man has a pancreatic neuroendocrine neoplasm with liver metastases. Biopsy shows well-differentiated morphology with a Ki-67 index of 40 percent, and imaging shows strong somatostatin receptor uptake. The pathologist is asked to classify the tumor, because poorly differentiated carcinoma would be treated with platinum chemotherapy. Which classification is correct?", "opts": ["Well-differentiated neuroendocrine tumor, grade 3", "Poorly differentiated neuroendocrine carcinoma", "Mixed adenocarcinoma with neuroendocrine features", "Small cell carcinoma of pancreatic origin", "Grade 1 neuroendocrine tumor"], "a": 0, "e": "Neuroendocrine neoplasms are classified by differentiation and proliferation. Well-differentiated tumors are graded by the Ki-67 index, and a high index in a well-differentiated tumor gives a grade 3 neuroendocrine tumor rather than a carcinoma. Poorly differentiated carcinomas have distinct morphology and are treated differently, with platinum chemotherapy. Pathology review therefore decides the pathway, and his uptake on receptor imaging supports consideration of radioligand options later in his course.", "k": "Well-differentiated morphology with a high Ki-67 index is a grade 3 neuroendocrine tumor, not a carcinoma.", "t": "Grading of neuroendocrine neoplasms"}, {"n": 9, "stem": "A 55-year-old woman has unresectable intrahepatic cholangiocarcinoma and starts first-line durvalumab with gemcitabine and cisplatin. Her oncologist asks whether any molecular testing should be sent now, because the result could open targeted options after the first-line regimen. She has good performance status and a normal bilirubin. Which testing plan is most appropriate?", "opts": ["No testing because targeted therapy is never used", "Tumor sequencing for FGFR2, IDH1 and HER2", "Repeat imaging in place of any molecular testing", "Germline testing only for BRCA in every patient", "Testing for BRAF V600E in colorectal cancer only"], "a": 1, "e": "Tumor sequencing is sent at diagnosis of advanced biliary tract cancer, because FGFR2 fusions, IDH1 variants and HER2 alterations open targeted options after first-line therapy. Results are best available before progression, so the next line can be started without delay. TOPAZ-1 tested first-line durvalumab with gemcitabine and cisplatin. Germline testing may also be offered where family history suggests an inherited syndrome.", "k": "Advanced biliary tract cancer: send tumor sequencing at diagnosis for FGFR2, IDH1 and HER2.", "t": "Molecular testing in biliary cancer"}]}, {"ch": 23, "title": "Gastrointestinal Genetics and Treatment Complications", "qs": [{"n": 1, "stem": "A 29-year-old woman is found to carry a pathogenic CDH1 variant after her mother died of diffuse gastric cancer at a young age. Upper endoscopy with random biopsies is normal, and she has no symptoms. She asks how her risk should be managed over the long term. What is the best recommendation?", "opts": ["Chemotherapy to prevent gastric cancer", "Partial gastrectomy for the antrum only", "Discharge from care after the normal biopsies", "Annual endoscopy alone with no surgical discussion", "Counseling about prophylactic total gastrectomy"], "a": 4, "e": "Hereditary diffuse gastric cancer arises from CDH1 variants and carries a high lifetime risk of diffuse gastric cancer and lobular breast cancer. Endoscopy can miss small foci of signet-ring cells, so normal biopsies do not remove the risk. Carriers are counseled about prophylactic total gastrectomy at an experienced center, and breast surveillance continues. Relatives are offered cascade testing, and nutrition support follows surgery.", "k": "CDH1 variant carriers: counsel about prophylactic total gastrectomy and continue breast surveillance.", "t": "CDH1 carrier counseling"}, {"n": 2, "stem": "A 22-year-old man has hundreds of colonic polyps at his first colonoscopy and a pathogenic APC variant on testing. His father was treated for colorectal cancer at 40. He is well and has normal hemoglobin. His gastroenterologist discusses long-term management with him and his family. What is the best plan?", "opts": ["Timed colectomy with duodenal surveillance", "Treatment only if symptoms or anemia develop", "Genetic testing of his siblings only after cancer", "Annual colonoscopy for life without surgery", "Aspirin alone as definitive prevention"], "a": 0, "e": "Familial adenomatous polyposis arises from APC variants and causes hundreds of colorectal adenomas that progress to cancer without surgery. Colectomy is timed by polyp burden and age, so he needs surgical planning rather than surveillance alone. Endoscopic surveillance continues for duodenal disease after colectomy. Cascade testing of relatives is offered at once, because those who carry the variant need the same care.", "k": "Familial adenomatous polyposis: colectomy timed by polyp burden, with duodenal surveillance.", "t": "Familial adenomatous polyposis"}, {"n": 3, "stem": "A 67-year-old man with melanoma receives combination checkpoint inhibitor therapy. After the third cycle he develops 8 watery stools a day, severe abdominal cramping and fever, and he is dehydrated. Stool studies are negative for infection. His oncologist grades the event as grade 3 colitis. What is the best initial management?", "opts": ["Permanently discontinue and observe without steroids", "Continue immunotherapy with loperamide alone", "Give a double dose of immunotherapy", "Suspend therapy and start high-dose corticosteroids", "Wait two weeks and recheck stool studies"], "a": 3, "e": "Management in the ASCO guideline update follows grade. Grade 3 events generally lead to suspension of immunotherapy and high-dose corticosteroids, tapered over at least 4 to 6 weeks. Refractory events call for other immunosuppressive agents. Grade 1 events are monitored closely, and grade 4 events generally lead to permanent discontinuation. He needs admission for fluids and monitoring, and infection and other causes of diarrhea are excluded first.", "k": "Grade 3 immune-related events: suspend therapy and start high-dose corticosteroids.", "t": "Grade 3 immune-related colitis"}, {"n": 4, "stem": "A 61-year-old woman starts pembrolizumab with cisplatin-based chemotherapy for non-small-cell lung cancer. She is worried about corticosteroids and asks whether dexamethasone can be skipped from her antiemetic plan to protect the immunotherapy effect. Her oncologist reviews the current guideline recommendation. What is the best answer?", "opts": ["Stop chemotherapy to avoid any corticosteroid", "Use dexamethasone only after vomiting begins", "Dexamethasone stays in guideline-compliant prophylaxis", "Omit all antiemetics because she receives immunotherapy", "Replace every antiemetic with olanzapine alone"], "a": 2, "e": "The ASCO antiemetic guideline update examined randomized trials that added a checkpoint inhibitor to chemotherapy. Two phase III trials in non-small-cell lung cancer compared platinum-based doublets with or without pembrolizumab, and both supported dexamethasone as part of prophylaxis for all patients. There is no clinical evidence to justify omitting it from guideline-compliant prophylaxis. Checkpoint inhibitors given alone are different, because they do not routinely require prophylaxis.", "k": "Checkpoint inhibitors with chemotherapy: keep dexamethasone in antiemetic prophylaxis.", "t": "Dexamethasone with immunotherapy"}, {"n": 5, "stem": "A 63-year-old man receives adjuvant FOLFOX for stage III colon cancer. After several cycles he has numbness in the fingers that makes buttoning shirts difficult, and burning pain at night. He asks whether a supplement could prevent worsening. His oncologist reviews the guideline for prevention and management. What is the best recommendation?", "opts": ["Acetyl-L-carnitine to prevent worsening", "Duloxetine for pain and discussion of oxaliplatin changes", "Stop all follow-up until symptoms resolve", "Add a second neurotoxic agent", "Continue full-intensity treatment and ignore the symptoms"], "a": 1, "e": "Per the ASCO guideline, no agent can be recommended for preventing chemotherapy-induced neuropathy, and acetyl-L-carnitine was discouraged. For painful established neuropathy, duloxetine was the only agent with adequate evidence, with limited benefit. When neuropathy is intolerable or causes functional impairment, clinicians may delay, reduce or stop chemotherapy, or substitute another agent. His functional loss calls for that discussion, and his symptoms are reviewed at every visit.", "k": "Oxaliplatin neuropathy: duloxetine for pain, no preventive agent, and adjust therapy for functional impairment.", "t": "Oxaliplatin neuropathy"}, {"n": 6, "stem": "A 58-year-old woman is about to start adjuvant capecitabine after resection of a stage III colon cancer. Her sister developed severe mucositis and neutropenia during fluorouracil treatment years earlier. Her baseline counts and liver tests are normal, and she has no other medical problems. What is the most appropriate step before treatment?", "opts": ["Start full-intensity capecitabine without testing", "Order a tumor mismatch repair stain only", "Add prophylactic duloxetine from the first cycle", "Test for DPYD variants before starting", "Test for CDH1 variants as the next step"], "a": 3, "e": "Deficiency of the DPYD enzyme can cause severe or fatal fluoropyrimidine toxicity, such as mucositis, neutropenia and diarrhea. Many centers test for DPYD variants before treatment starts, and her sister's history raises concern. The result guides the dose or the choice of drug. Normal counts and liver tests do not exclude enzyme deficiency, because the problem appears only after exposure to the drug.", "k": "Test for DPYD variants before fluoropyrimidine therapy.", "t": "DPYD testing"}]}, {"ch": 24, "title": "Skin Cancers", "qs": [{"n": 1, "stem": "A 52-year-old woman had a 3.8 mm ulcerated melanoma of the back excised. Sentinel node biopsy was negative, and the pathologic stage is IIB. Staging imaging shows no metastases, and she is otherwise healthy. Her oncologist reviews the randomized evidence for systemic therapy after complete resection. What is the best recommendation?", "opts": ["Adjuvant pembrolizumab after complete resection", "Neoadjuvant ipilimumab with nivolumab", "Adjuvant cemiplimab for up to 48 weeks", "Radiotherapy to the scar and sentinel nodal basin", "Observation because no adjuvant therapy is proven"], "a": 0, "e": "KEYNOTE-716 randomized 976 patients with completely resected stage IIB or IIC melanoma 1:1 to pembrolizumab or placebo for 17 cycles. At the second interim analysis, recurrence or death occurred in 15% with pembrolizumab and 24% with placebo, a hazard ratio of 0.61. Severe treatment-related events were more frequent, at 16% against 4% at the first analysis. She is counseled about delayed immune-related events.", "k": "Resected stage IIB or IIC melanoma: adjuvant pembrolizumab reduces recurrence.", "t": "Adjuvant therapy for stage IIB melanoma"}, {"n": 2, "stem": "A 48-year-old man has a palpable axillary node mass from a melanoma of the arm. Biopsy confirms melanoma, and imaging shows no distant disease. Surgery is feasible, and he is fit. His team reviews a randomized trial that compared neoadjuvant treatment with the usual sequence of surgery first. Which plan has the best randomized support?", "opts": ["Surgery first, then observation without systemic therapy", "Adjuvant radiotherapy to the axilla with no drug therapy", "Neoadjuvant ipilimumab with nivolumab, then surgery", "Hedgehog pathway inhibitor before surgery", "Neoadjuvant chemotherapy before surgery"], "a": 2, "e": "NADINA randomized 423 patients with resectable macroscopic stage III melanoma 1:1 to two neoadjuvant cycles of ipilimumab with nivolumab, then surgery, or to surgery followed by adjuvant nivolumab. Estimated 12-month event-free survival was 83.7% against 57.2%, a hazard ratio of 0.32. Severe treatment-related events were 29.7% against 14.7%. The trade-off in toxicity is discussed with him, along with the plan for surgery after the second cycle and the chance that adjuvant therapy is still needed.", "k": "Resectable macroscopic stage III melanoma: neoadjuvant ipilimumab with nivolumab improved event-free survival.", "t": "Neoadjuvant therapy in stage III melanoma"}, {"n": 3, "stem": "A 55-year-old woman completed two neoadjuvant cycles of ipilimumab with nivolumab for resectable stage III melanoma and then had surgery. Pathology shows a major pathological response with under 10 percent viable tumor. She asks whether she needs further adjuvant systemic treatment. Her oncologist reviews how the trial handled adjuvant therapy after neoadjuvant treatment. What is the best answer?", "opts": ["Adjuvant therapy is contraindicated after surgery", "Adjuvant therapy is reserved for partial or no response", "Repeat the neoadjuvant cycles before surveillance", "Only patients with a major response need adjuvant therapy", "Adjuvant therapy is required for every patient"], "a": 1, "e": "In NADINA, patients in the neoadjuvant group received adjuvant therapy only if they had a partial response or no response. Twelve-month recurrence-free survival was 95.1% with a major pathological response, 76.1% with a partial response and 57.0% with no response. Her major response therefore supports surveillance without further systemic therapy. Imaging and clinic visits continue at intervals set by the team.", "k": "After neoadjuvant therapy, a major pathological response supports surveillance, and partial or no response calls for adjuvant therapy.", "t": "Response-driven adjuvant therapy"}, {"n": 4, "stem": "A 71-year-old man had a squamous cell carcinoma of the scalp with a parotid node containing extracapsular extension. He completed surgery and postoperative radiotherapy, and imaging shows no residual disease. He has no history of organ transplantation or autoimmune disease. His oncologist reviews a randomized trial in this high-risk setting. What is the best recommendation?", "opts": ["Hedgehog pathway inhibitor for a year", "Neoadjuvant ipilimumab with nivolumab", "Observation because adjuvant therapy lacks evidence", "Adjuvant pembrolizumab for stage IIB melanoma", "Adjuvant cemiplimab"], "a": 4, "e": "C-POST randomized 415 patients with local or regional disease, after surgery and postoperative radiotherapy, to adjuvant cemiplimab or placebo for up to 48 weeks. Disease-free survival was superior, with a hazard ratio of 0.32, and 24-month disease-free survival was 87.1% against 64.1%. Severe events occurred in 23.9% against 14.2%. His team monitors for immune-related events, and the possibility of graft problems is excluded because he has had no transplant.", "k": "High-risk cutaneous squamous cell carcinoma after surgery and radiotherapy: adjuvant cemiplimab.", "t": "Adjuvant therapy for cutaneous squamous cell carcinoma"}, {"n": 5, "stem": "A 76-year-old woman has Merkel cell carcinoma of the cheek with new liver and nodal metastases after wide excision and radiotherapy last year. She has good performance status and no autoimmune disease or organ transplant. Her oncologist discusses first-line options for advanced disease. Which treatment is the most appropriate first-line choice?", "opts": ["Observation until symptoms develop", "Hedgehog pathway inhibitor", "BRAF and MEK inhibitors", "Anti-PD-1 or anti-PD-L1 immunotherapy", "Adjuvant radiotherapy to the liver only"], "a": 3, "e": "Advanced Merkel cell carcinoma responds to anti-PD-1 and anti-PD-L1 immunotherapy, which is the first-line choice for most patients. She has no transplant or autoimmune disease, which would change the risk of immune-related events. Hedgehog inhibitors belong to basal cell carcinoma, and BRAF and MEK inhibitors belong to BRAF-mutant melanoma. Her team monitors thyroid function and liver tests during treatment, and early symptoms are reported at once.", "k": "Advanced Merkel cell carcinoma: first-line anti-PD-1 or anti-PD-L1 immunotherapy.", "t": "Metastatic Merkel cell carcinoma"}, {"n": 6, "stem": "A 79-year-old man has a large basal cell carcinoma of the temple that invades the orbit. Surgery would require removal of the eye, which he declines, and prior radiotherapy to the area limits further treatment. Imaging shows no distant metastases. His oncologist discusses systemic options. Which agent class is most appropriate for locally advanced disease?", "opts": ["Anti-PD-L1 immunotherapy for Merkel cell carcinoma", "Adjuvant cemiplimab for one year", "Neoadjuvant ipilimumab with nivolumab", "Platinum chemotherapy with cetuximab", "Hedgehog pathway inhibitor"], "a": 4, "e": "Basal cell carcinoma rarely spreads, but locally advanced disease can threaten vital structures when surgery and radiotherapy are not options. Hedgehog pathway inhibitors are used in that situation. Counseling covers muscle cramps, taste change and hair loss, which are the common effects. Immunotherapy has a role in selected patients after hedgehog treatment, and a multidisciplinary team reviews options, including a limited surgical approach if he later changes his view.", "k": "Locally advanced basal cell carcinoma not suited to surgery or radiotherapy: hedgehog pathway inhibitor.", "t": "Locally advanced basal cell carcinoma"}]}, {"ch": 25, "title": "Sarcomas, Unknown Primary, Genetics, and Complications", "qs": [{"n": 1, "stem": "A 52-year-old woman has uterine leiomyosarcoma with lung metastases after hysterectomy. She has had no chemotherapy and has good performance status, and her echocardiogram shows normal cardiac function. Her oncologist reviews randomized evidence for first-line treatment of metastatic leiomyosarcoma, including the trade-off between benefit and toxicity. What is the best recommendation?", "opts": ["Observation until symptoms develop", "Doxorubicin plus trabectedin, then maintenance", "Molecularly guided therapy without chemotherapy", "Platinum chemotherapy with etoposide", "Nirogacestat for progressing disease"], "a": 1, "e": "LMS-04 compared first-line doxorubicin alone with doxorubicin plus trabectedin, followed by trabectedin maintenance, in 150 patients with metastatic or unresectable leiomyosarcoma. Median progression-free survival was 12.2 months against 6.2 months, a hazard ratio of 0.41. Grade 3 or 4 neutropenia was 80% against 13%, so counts are monitored closely and growth factor support is planned. Doxorubicin also carries cardiac risk, which is why her normal echocardiogram matters.", "k": "First-line metastatic leiomyosarcoma: doxorubicin plus trabectedin improves progression-free survival with more toxicity.", "t": "First-line leiomyosarcoma"}, {"n": 2, "stem": "A 34-year-old woman has an abdominal wall desmoid tumor that grew over 6 months of active surveillance and now causes pain with activity. She hopes to have children in the future. Her oncologist reviews the randomized trial of a gamma-secretase inhibitor, including adverse events relevant to her plans. What is the most important counseling point before starting?", "opts": ["Counsel about ovarian dysfunction before starting", "The tumor will metastasize without any treatment", "The drug causes no adverse events in young women at all", "The drug has no effect on tumor progression at all", "Surveillance must continue for another full year"], "a": 0, "e": "In DeFi, 70 patients received nirogacestat and 72 received placebo, and the hazard ratio for progression or death was 0.29. Among 36 women of childbearing potential receiving nirogacestat, 27 had events consistent with ovarian dysfunction, which resolved in 20. Diarrhea occurred in 84%. Fertility counseling is therefore part of the plan, with monitoring of diarrhea and electrolytes, and options for preserving fertility are reviewed.", "k": "Nirogacestat for desmoid tumors: counsel about ovarian dysfunction before starting.", "t": "Progressing desmoid tumor"}, {"n": 3, "stem": "A 19-year-old man has a pelvic Ewing sarcoma, and biopsy shows an EWSR1 fusion. Staging shows no metastases, and he wishes to preserve fertility. His team reviews the randomized trial that compared the two standard chemotherapy regimens used in Europe and in the United States. Which conclusion did the authors reach?", "opts": ["Only radiotherapy is needed for pelvic tumors", "Chemotherapy had no role in localized disease", "The US regimen was more effective and shorter", "The regimens were not compared in a randomized trial", "The European regimen was shorter and less toxic"], "a": 2, "e": "EURO EWING 2012 was an open-label randomized phase 3 trial that compared the European and US regimens, both standard, in 640 patients with newly diagnosed Ewing sarcoma. The authors concluded that the US regimen was more effective, less toxic and shorter in duration across all stages, and should become the standard of care. Fertility preservation is arranged before chemotherapy starts, and he is treated at a specialist center.", "k": "Ewing sarcoma: the US regimen was favored in EURO EWING 2012.", "t": "Ewing sarcoma chemotherapy"}, {"n": 4, "stem": "A 58-year-old man has a 9 cm deep thigh mass that has grown over 3 months. A general surgeon offers to remove it next week. MRI shows a heterogeneous mass abutting the femoral vessels, and no biopsy has been done. His primary physician asks for the best next step. What should be recommended?", "opts": ["Observation with repeat MRI in a year", "Radiotherapy alone without biopsy", "Immediate marginal excision as planned", "Sarcoma center referral for biopsy first", "Empiric chemotherapy without tissue diagnosis"], "a": 3, "e": "A deep, large or growing mass is imaged and biopsied before any excision. Unplanned excision of a possible sarcoma can compromise later surgery, because margins and tissue planes are disturbed. Care begins at an expert center, where a core needle biopsy and multidisciplinary planning precede resection. Soft tissue sarcomas include dozens of histologic types, and radiotherapy and chemotherapy depend on histology, grade and site.", "k": "A deep or large mass needs imaging and biopsy at a sarcoma center before excision.", "t": "Approach to a possible soft tissue sarcoma"}, {"n": 5, "stem": "A 64-year-old man has liver and nodal metastases from an adenocarcinoma, and a full workup finds no primary site. He has good performance status, and pathology review excludes favorable subsets. His oncologist discusses sequencing and treatment. Which statement best reflects the evidence from the randomized phase 2 trial in unfavourable disease?", "opts": ["Guided therapy was worse than chemotherapy", "Genomic profiling is not recommended at diagnosis", "The trial enrolled only squamous histology", "All patients were treated without any chemotherapy", "Guided therapy improved progression-free survival"], "a": 4, "e": "CUPISCO randomized 436 patients with disease control after three cycles of platinum chemotherapy 3:1 to molecularly guided therapy or continued chemotherapy. Median progression-free survival was 6.1 months against 4.4 months, a hazard ratio of 0.72. The authors concluded that comprehensive genomic profiling should be performed at initial diagnosis. Tissue is preserved and sequencing is sent early, so that an actionable alteration is not missed while platinum chemotherapy begins.", "k": "Unfavourable cancer of unknown primary: send genomic profiling at diagnosis.", "t": "Genomic profiling in unknown primary"}, {"n": 6, "stem": "A 49-year-old woman has a single enlarged right axillary node that biopsy shows to be metastatic adenocarcinoma, estrogen receptor positive and GATA3 positive. Examination and CT of the chest, abdomen and pelvis show no other disease. Breast MRI shows a small enhancing focus. Her tumor board asks how to classify and treat the cancer. What is the best approach?", "opts": ["Observe the axillary node without therapy", "Start nirogacestat for a desmoid tumor", "Treat as unfavourable cancer of unknown primary", "Treat as node-positive breast cancer", "Treat as metastatic leiomyosarcoma"], "a": 3, "e": "Pathology review, immunohistochemistry and imaging look first for favorable subsets that have specific treatment. Isolated axillary adenocarcinoma with hormone receptor and GATA3 positivity and a suspicious breast focus fits breast cancer, so she is treated on that pathway rather than as an unfavourable unknown primary. Genomic profiling matters for unfavourable disease, where no subset applies, and it is not the first step for her.", "k": "Axillary adenocarcinoma with breast markers: treat as node-positive breast cancer.", "t": "Favorable subset of unknown primary"}, {"n": 7, "stem": "A 31-year-old woman has a pathogenic germline TP53 variant after her sister developed an adrenocortical carcinoma at a young age. She has no symptoms, and her screening mammogram is normal. She asks how her cancer risk should be managed and whether imaging choices matter. What is the best plan?", "opts": ["No surveillance until symptoms develop", "Prophylactic chemotherapy each year", "Surveillance for breast cancer only", "Annual CT of the chest, abdomen and pelvis", "Annual whole-body MRI and breast MRI"], "a": 4, "e": "Li-Fraumeni syndrome arises from germline TP53 variants and predisposes to sarcoma, breast cancer, brain tumors, adrenocortical carcinoma and leukemia. Carriers are offered surveillance that includes whole-body MRI, and ionizing radiation is avoided when other options exist. Repeated CT would add radiation exposure. Relatives are offered cascade testing, and any cancer is treated with radiation only when no alternative gives the same control.", "k": "Li-Fraumeni syndrome: MRI-based surveillance and avoidance of radiation when possible.", "t": "Li-Fraumeni syndrome"}, {"n": 8, "stem": "A 60-year-old man with a soft tissue sarcoma is about to start doxorubicin. He has hypertension controlled on one medication and no history of heart disease, and his echocardiogram has never been done. His oncologist asks what should be done before treatment to reduce cardiac risk. Which plan is most appropriate?", "opts": ["Start a trabectedin-only regimen", "Baseline cardiac assessment and a monitoring plan", "Defer chemotherapy until blood pressure is normal", "Obtain a bone scan before treatment", "No cardiac assessment because he has no symptoms"], "a": 1, "e": "Anthracyclines and some targeted agents cause cardiomyopathy. Baseline cardiac assessment, risk factor control and a plan for monitoring are set before treatment starts, and cardiology is involved early when function falls. His hypertension is a risk factor to treat, not a reason to withhold needed chemotherapy. A bone scan has no role in assessing cardiac risk, and a trabectedin-only regimen is not standard first-line therapy.", "k": "Before anthracyclines, assess baseline cardiac function and set a monitoring plan.", "t": "Cardiac monitoring before anthracyclines"}]}, {"ch": 26, "title": "Head and Neck, Salivary, and Nasopharyngeal Cancers", "qs": [{"n": 1, "stem": "A 61-year-old man has a T4a squamous cell carcinoma of the oral cavity with nodal disease. The tumor is resectable, his PD-L1 combined positive score is 15, and he is fit with no autoimmune disease. He asks whether immunotherapy given around surgery has randomized support. What is the best recommendation?", "opts": ["Surgery alone with no radiotherapy", "Cisplatin alone without surgery or radiation", "Perioperative pembrolizumab with standard care", "Cetuximab replacing radiotherapy after surgery", "Observation until recurrence is seen"], "a": 2, "e": "KEYNOTE-689 randomized 714 patients with locally advanced resectable disease 1:1 to standard care or standard care with two neoadjuvant and 15 adjuvant cycles of pembrolizumab. Event-free survival at 36 months was 59.8% against 45.9% in patients with a score of 10 or more, a hazard ratio of 0.66. Surgery was completed in about 88% of patients, and thyroid function is followed during treatment.", "k": "Resectable locally advanced head and neck cancer: perioperative pembrolizumab improved event-free survival.", "t": "Perioperative pembrolizumab"}, {"n": 2, "stem": "A 57-year-old woman has a resectable laryngeal squamous cell carcinoma and a PD-L1 combined positive score of 0 on testing. Her surgeon asks whether the perioperative pembrolizumab trial included patients across score groups and whether benefit was limited to high scores. Which statement about the results is correct?", "opts": ["The trial enrolled only metastatic disease", "Only patients with a score over 10 were analyzed", "Pembrolizumab prevented completion of surgery", "Event-free survival improved in all three groups", "Pembrolizumab had no effect on event-free survival"], "a": 3, "e": "The primary endpoint in KEYNOTE-689 was event-free survival, assessed in three sequential populations defined by score: 10 or more, 1 or more, and all patients. Event-free survival at 36 months favored pembrolizumab in all three, with hazard ratios of 0.66, 0.70 and 0.73. Surgery was completed in about 88% of patients in each group. Her score of 0 places her in the all-patients population.", "k": "KEYNOTE-689 showed benefit in the score 10 or more, score 1 or more and all-patient populations.", "t": "Interpreting KEYNOTE-689"}, {"n": 3, "stem": "A 54-year-old man has a p16-positive tonsil cancer with a 3 cm primary and two ipsilateral nodes. He is a never-smoker with normal kidney function and good hearing. He asks whether cetuximab could replace cisplatin with radiotherapy to avoid cisplatin toxicity. What is the best answer?", "opts": ["Cetuximab caused far less toxicity than cisplatin", "Cisplatin stays standard, as cetuximab was inferior", "Cetuximab was non-inferior to cisplatin in the trial", "Radiotherapy alone is superior to either drug", "Pembrolizumab replaces radiotherapy in this setting"], "a": 1, "e": "NRG Oncology RTOG 1016 randomized 849 patients with locoregionally advanced p16-positive disease to radiotherapy with cetuximab or cisplatin. Estimated 5-year overall survival was 77.9% with cetuximab and 84.6% with cisplatin, and cetuximab did not meet the non-inferiority criterion. Toxicity was similar. Cisplatin with radiotherapy therefore remains standard, and kidney function, hearing and nutrition are monitored throughout, with dose adjustments for toxicity.", "k": "HPV-positive oropharyngeal cancer: radiotherapy with cisplatin, not cetuximab.", "t": "HPV-positive oropharyngeal cancer"}, {"n": 4, "stem": "A 67-year-old woman has recurrent squamous cell carcinoma of the larynx with lung metastases and a PD-L1 combined positive score of 25. She has mild cough only, good performance status and no autoimmune disease. Her oncologist reviews the first-line trial that compared immunotherapy regimens with a cetuximab-based regimen. What is the best option?", "opts": ["Neoadjuvant pembrolizumab before surgery", "Observation with no systemic therapy", "Radiotherapy with cisplatin for cure", "Cetuximab with platinum and fluorouracil only", "Pembrolizumab alone"], "a": 4, "e": "KEYNOTE-048 randomized 882 untreated patients 1:1:1 to pembrolizumab alone, pembrolizumab with platinum and fluorouracil, or cetuximab with platinum and fluorouracil. At a score of 20 or more, pembrolizumab alone improved median overall survival to 14.9 months from 10.7 months, a hazard ratio of 0.61. Severe adverse events were 55% with pembrolizumab alone against 83% with the cetuximab regimen.", "k": "Recurrent or metastatic disease with a score of 20 or more: pembrolizumab alone is an option.", "t": "First-line pembrolizumab alone"}, {"n": 5, "stem": "A 58-year-old man has recurrent oropharyngeal squamous cell carcinoma with rapidly growing neck disease that causes pain and difficulty swallowing. His PD-L1 combined positive score is 5, and he needs a quick response. His oncologist reviews the first-line trial for patients whose disease is symptomatic. Which regimen is the best choice?", "opts": ["Pembrolizumab with platinum and fluorouracil", "Radiotherapy alone without systemic therapy", "Pembrolizumab alone and reassess in three months", "Observation until the disease worsens further", "Neoadjuvant therapy before surgery"], "a": 0, "e": "In KEYNOTE-048, pembrolizumab with platinum and fluorouracil improved overall survival in the total population, with a median of 13.0 months against 10.7 months, a hazard ratio of 0.77. At final analysis, it also improved survival at a score of 1 or more. Severe adverse events were 85%, so nutrition and counts are supported closely. Pembrolizumab alone suits patients who are not in urgent need of a response.", "k": "Symptomatic recurrent disease: pembrolizumab with chemotherapy for a quick response.", "t": "Pembrolizumab with chemotherapy"}, {"n": 6, "stem": "A 38-year-old man has painless neck nodes and nasal obstruction. Biopsy shows nasopharyngeal carcinoma, and plasma EBV DNA is high. Staging shows locoregionally advanced disease with no distant metastases. He asks how he will be treated and how his response will be followed. What is the best plan?", "opts": ["Hedgehog pathway inhibitor", "Surgery of the nasopharynx alone", "Pembrolizumab alone in the curative setting", "Chemoradiotherapy with EBV DNA monitoring", "Observation with repeat biopsy in a year"], "a": 3, "e"
