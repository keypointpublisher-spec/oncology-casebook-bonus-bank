lasdegib"],"a":2,"e":"Enasidenib inhibits mutant IDH2 and induces differentiation, with a risk of differentiation syndrome. Ivosidenib is the IDH1 inhibitor.","k":"Enasidenib targets mutant IDH2, and ivosidenib targets mutant IDH1.","t":"IDH2 mutation"},{"n":7,"stem":"A man on azacitidine and venetoclax is started on posaconazole for prophylaxis. What adjustment is needed?","opts":["Reduce the venetoclax dose, because posaconazole is a strong CYP3A inhibitor","No change is needed","Switch to rifampin","Stop azacitidine","Increase the venetoclax dose"],"a":0,"e":"Venetoclax is metabolized by CYP3A, and strong inhibitors such as azoles raise exposure. The dose is reduced, for example by about three-quarters with posaconazole.","k":"Reduce the venetoclax dose with strong CYP3A inhibitors such as posaconazole.","t":"Venetoclax interaction"},{"n":8,"stem":"A man with newly diagnosed AML has a white cell count of 220,000 per microliter, confusion, and hypoxemia. What is the most appropriate immediate step?","opts":["Start tyrosine kinase inhibitor","Delay treatment until a bone marrow report returns","Transfuse red cells to a hemoglobin of 12 g/dL","Start cytoreduction with hydroxyurea and consider leukapheresis, with prompt induction","Give high-dose steroids alone"],"a":3,"e":"Hyperleukocytosis with symptoms is leukostasis, an emergency. Red cell transfusion raises viscosity and is avoided unless needed. Cytoreduction and definitive chemotherapy follow quickly.","k":"Leukostasis is treated with prompt cytoreduction, and red cell transfusion is avoided.","t":"Leukostasis"},{"n":9,"stem":"A 32-year-old woman has low-risk acute promyelocytic leukemia with a white cell count of 4,000 per microliter. Which regimen is preferred?","opts":["Allogeneic transplant","7+3 chemotherapy","All-trans retinoic acid with arsenic trioxide","High-dose cytarabine","Azacitidine and venetoclax"],"a":2,"e":"In low- and intermediate-risk APL, chemotherapy-free all-trans retinoic acid plus arsenic trioxide is at least as effective as ATRA with chemotherapy and has lower hematologic toxicity.","k":"Low-risk APL is treated with ATRA and arsenic trioxide.","t":"APL treatment"},{"n":10,"stem":"A woman with suspected APL has bruising, a fibrinogen of 90 mg/dL, and a platelet count of 18,000 per microliter. What is appropriate?","opts":["Start ATRA and give platelets and fibrinogen replacement to keep fibrinogen above 150 mg/dL","Give heparin","Wait for the cytogenetic confirmation","Give tranexamic acid alone","Give only red cells"],"a":0,"e":"APL is associated with a high early death rate from hemorrhage. ATRA is started when it is suspected, and platelets and fibrinogen are maintained at protective levels.","k":"In suspected APL, start ATRA and correct coagulopathy at once.","t":"APL coagulopathy"},{"n":11,"stem":"A patient receiving arsenic trioxide for APL has a QTc of 520 ms. What is the next step?","opts":["Add a fluoroquinolone","Continue and recheck in a month","Increase the dose","Switch to ondansetron for nausea","Hold arsenic and correct potassium and magnesium"],"a":4,"e":"Arsenic prolongs the QT interval. Electrolytes are corrected and interacting drugs removed, and the drug is held when the QTc is above 500 ms.","k":"Arsenic trioxide prolongs the QTc, and electrolytes must be kept replete.","t":"Arsenic toxicity"},{"n":12,"stem":"A 48-year-old man has BCR::ABL1-positive acute lymphoblastic leukemia. Which approach is standard?","opts":["Hydroxyurea","A tyrosine kinase inhibitor with chemotherapy or blinatumomab","Venetoclax alone","Rituximab alone","Chemotherapy without a tyrosine kinase inhibitor"],"a":1,"e":"Adding a BCR::ABL1 inhibitor to therapy transformed outcomes in Philadelphia-positive ALL. Regimens combine ponatinib or dasatinib with chemotherapy or blinatumomab.","k":"Philadelphia-positive ALL requires a BCR::ABL1 tyrosine kinase inhibitor.","t":"Ph-positive ALL"},{"n":13,"stem":"A 25-year-old woman receiving a pediatric-inspired ALL regimen develops epigastric pain, nausea, and a lipase of 1,200 U/L. Which agent is the most likely cause?","opts":["Cytarabine","Vincristine","Dexamethasone","Asparaginase","Methotrexate"],"a":3,"e":"Asparaginase causes pancreatitis, thrombosis, hepatotoxicity, hypertriglyceridemia and hypersensitivity. Pancreatitis is a reason to stop the drug.","k":"Asparaginase causes pancreatitis, thrombosis, and hepatotoxicity.","t":"Asparaginase toxicity"},{"n":14,"stem":"Why is intrathecal therapy given routinely during ALL treatment?","opts":["To prevent tumor lysis","To reduce the risk of neutropenia","To prevent central nervous system relapse, which is a sanctuary site","To treat all patients who have meningitis","To replace systemic chemotherapy"],"a":2,"e":"Lymphoblasts reach the central nervous system, which systemic drugs penetrate poorly. Intrathecal chemotherapy, with or without high-dose systemic drugs, lowers relapse.","k":"Central nervous system prophylaxis is a standard part of ALL therapy.","t":"CNS prophylaxis"},{"n":15,"stem":"A patient receiving blinatumomab develops aphasia and tremor on day 5. What is the appropriate management?","opts":["Hold the infusion and give dexamethasone","Give tocilizumab only","Give no treatment and observe","Increase the infusion rate","Start high-dose methotrexate"],"a":0,"e":"Blinatumomab can cause cytokine release and neurotoxicity. Dexamethasone is given for neurologic events and the drug is interrupted, with permanent discontinuation for severe events.","k":"Blinatumomab neurotoxicity is treated by holding the drug and giving dexamethasone.","t":"Blinatumomab neurotoxicity"},{"n":16,"stem":"A patient with relapsed B-cell ALL treated with inotuzumab ozogamicin is planned for allogeneic transplant. Which complication is a particular concern?","opts":["Hypothyroidism","Hepatic veno-occlusive disease","Pulmonary fibrosis","Hemorrhagic cystitis","Nephrogenic diabetes insipidus"],"a":1,"e":"Inotuzumab, a CD22 antibody-drug conjugate, carries a risk of sinusoidal obstruction syndrome, especially when followed by transplant with certain conditioning.","k":"Inotuzumab ozogamicin raises the risk of hepatic veno-occlusive disease.","t":"Inotuzumab risk"},{"n":17,"stem":"What does persistent measurable residual disease after ALL induction predict?","opts":["Resistance to blinatumomab only","A low risk of relapse","No relevance","The need for CNS radiation","A higher risk of relapse, and it prompts treatment intensification"],"a":4,"e":"Measurable residual disease is the strongest prognostic factor in ALL. Persistent disease prompts blinatumomab or transplant.","k":"Persistent measurable residual disease predicts relapse in ALL.","t":"MRD in ALL"},{"n":18,"stem":"A 70-year-old woman has lower-risk MDS with isolated del(5q), transfusion-dependent anemia, and a normal platelet count. Which drug is appropriate?","opts":["Allogeneic transplant now","Lenalidomide","Hydroxyurea","Luspatercept","Azacitidine alone"],"a":1,"e":"Lenalidomide produces transfusion independence in most patients with del(5q) lower-risk MDS. Cytopenias are common, so counts are watched closely.","k":"Lenalidomide is used for lower-risk MDS with isolated del(5q).","t":"Del(5q) MDS"},{"n":19,"stem":"A man with lower-risk MDS with ring sideroblasts and an SF3B1 mutation is transfusion-dependent and has failed erythropoietin. Which agent is approved?","opts":["Cytarabine","Lenalidomide","Luspatercept","Decitabine","Imatinib"],"a":2,"e":"Luspatercept reduces transfusion need in MDS with ring sideroblasts. It is given after erythropoiesis-stimulating agents have failed or are unlikely to work.","k":"Luspatercept reduces transfusions in MDS with ring sideroblasts.","t":"Ring sideroblasts"},{"n":20,"stem":"A patient with lower-risk MDS and symptomatic anemia has a serum erythropoietin level of 80 U/L and few transfusions. What is the best first drug?","opts":["Antithymocyte globulin","Azacitidine","Allogeneic transplant","An erythropoiesis-stimulating agent","Iron chelation alone"],"a":3,"e":"A low erythropoietin level and low transfusion burden predict response to erythropoiesis-stimulating agents, which are first-line for symptomatic anemia in lower-risk MDS without del(5q).","k":"Low erythropoietin and low transfusion need predict response to ESA in lower-risk MDS.","t":"ESA in MDS"},{"n":21,"stem":"A 62-year-old man with higher-risk MDS and a matched sibling donor is fit for transplant. Which approach gives the only potentially curative treatment?","opts":["Azacitidine indefinitely","Erythropoietin","Lenalidomide","Observation","Allogeneic stem cell transplant, with azacitidine as bridge if needed"],"a":4,"e":"Allogeneic transplant is the only curative option in MDS. Hypomethylating agents prolong survival but are not curative.","k":"Allogeneic transplant is the only curative treatment for higher-risk MDS.","t":"Higher-risk MDS"},{"n":22,"stem":"What is the main reason hypomethylating therapy such as azacitidine needs several cycles before response is judged?","opts":["Responses often take four to six cycles to appear","Cycles are limited to two","Marrow response is always immediate","Responses occur only after one cycle","The drug works only after transplant"],"a":0,"e":"Hematologic response to azacitidine commonly appears after four to six cycles, so therapy is not stopped early for lack of response if the patient is tolerating it.","k":"Azacitidine usually needs four to six cycles before response is judged.","t":"Hypomethylating agent"}]},{"ch":6,"title":"Chronic Myeloid and Lymphoproliferative Leukemias","qs":[{"n":1,"stem":"A 45-year-old man with chronic-phase CML started imatinib 3 months ago. His BCR::ABL1 transcript level on the international scale is 18 percent. How is this response best interpreted?","opts":["A reason to stop all therapy","Above the 10 percent early molecular response milestone, so adherence and mutations should be assessed","Blast crisis","Optimal response with no action needed","Complete molecular response"],"a":1,"e":"An international scale value above 10 percent at 3 months is a warning sign. Adherence, drug interactions and kinase domain mutations are reviewed and a change of inhibitor is considered.","k":"A BCR::ABL1 level above 10 percent at 3 months is a warning that prompts evaluation.","t":"CML monitoring milestone"},{"n":2,"stem":"Which patient with chronic-phase CML is most suitable to attempt treatment-free remission?","opts":["A patient in accelerated phase","A patient who has been taking drug for 3 months","A patient with a T315I mutation","A patient with a stable deep molecular response of at least MR4 for two years","A patient with partial cytogenetic response"],"a":3,"e":"Stopping an inhibitor is considered after at least 3 years of therapy and 2 years of sustained deep molecular response, with frequent monitoring and prompt restart on loss of major response.","k":"Treatment-free remission requires a sustained deep molecular response and close monitoring.","t":"Treatment-free remission"},{"n":3,"stem":"A patient with CML progressing on dasatinib is found to have a T315I kinase domain mutation. Which drug is active against this mutation?","opts":["Ponatinib or asciminib","Nilotinib","Imatinib at higher dose","Dasatinib at higher dose","Bosutinib"],"a":0,"e":"The T315I gatekeeper mutation confers resistance to imatinib, nilotinib, dasatinib and bosutinib. Ponatinib and asciminib are active, and ponatinib carries a risk of arterial occlusive events.","k":"T315I resistance is overcome by ponatinib or asciminib.","t":"T315I mutation"},{"n":4,"stem":"A patient with CML on dasatinib develops dyspnea and a pleural effusion. Which drug property explains this?","opts":["Imatinib is the cause","The effusion is unrelated to the drug","Nilotinib is the cause","The patient has blast crisis in every case","Dasatinib causes pleural effusion, and the drug is held or the dose reduced"],"a":4,"e":"Pleural effusion is a characteristic adverse effect of dasatinib. Management includes drug interruption, diuretics or corticosteroids and a dose reduction or a change of inhibitor.","k":"Dasatinib is associated with pleural effusion.","t":"Dasatinib effusion"},{"n":5,"stem":"Which risk is particularly associated with nilotinib?","opts":["Hemorrhagic cystitis","Pleural effusion","QT prolongation and vascular events","Severe diarrhea","Pulmonary fibrosis"],"a":2,"e":"Nilotinib prolongs the QT interval, raises glucose and lipids and increases arterial vascular events. It must be taken fasting, and it is avoided in patients with cardiovascular disease.","k":"Nilotinib carries QT and vascular risk and is taken fasting.","t":"Nilotinib toxicity"},{"n":6,"stem":"A woman taking imatinib has periorbital edema, nausea, and muscle cramps. Which measure is correct?","opts":["Stop all therapy permanently","Start high-dose steroids","Perform an urgent echocardiogram in every case","Supportive care is usually sufficient, and the drug is taken with food","Switch to chemotherapy"],"a":3,"e":"Fluid retention, nausea, cramps and rash are common with imatinib and are managed supportively. Persistent or severe symptoms may prompt a switch.","k":"Imatinib causes fluid retention and cramps, usually managed supportively.","t":"Imatinib adverse effects"},{"n":7,"stem":"A 55-year-old man has polycythemia vera with a hematocrit of 52 percent and JAK2 V617F. He is low risk, with no prior thrombosis. What is the initial treatment?","opts":["Hydroxyurea alone","Ruxolitinib","Phlebotomy to hematocrit below 45 percent and low-dose aspirin","Anagrelide","Observation only"],"a":2,"e":"Low-risk polycythemia vera is managed with phlebotomy targeting a hematocrit under 45 percent and low-dose aspirin. Cytoreduction is added for high-risk disease, intolerance to phlebotomy or progression.","k":"Low-risk polycythemia vera is treated with phlebotomy and aspirin.","t":"Polycythemia vera therapy"},{"n":8,"stem":"Which patient with polycythemia vera is high risk and needs cytoreductive therapy?","opts":["A 50-year-old with pruritus only","A 40-year-old with no complications","A 35-year-old with mild splenomegaly","A 45-year-old with a hematocrit of 44 percent","A 66-year-old with prior venous thrombosis"],"a":4,"e":"Age over 60 and prior thrombosis define high risk. Hydroxyurea or ropeginterferon alfa-2b are options for cytoreduction, and ruxolitinib is used after inadequate response.","k":"Age over 60 or prior thrombosis makes polycythemia vera high risk.","t":"High-risk polycythemia vera"},{"n":9,"stem":"A 28-year-old woman has essential thrombocythemia with a CALR mutation, a platelet count of 800,000 per microliter, and no thrombosis. Which approach is appropriate?","opts":["Low-dose aspirin, with cytoreduction reserved for higher-risk features","Anticoagulation for life","Splenectomy","Allogeneic transplant","Immediate hydroxyurea in every pregnancy"],"a":0,"e":"Low-risk essential thrombocythemia is managed with aspirin, with cytoreduction for age over 60, prior thrombosis or high-risk JAK2 status. Platelet counts alone do not set risk.","k":"Platelet count alone does not define thrombotic risk in essential thrombocythemia.","t":"Essential thrombocythemia"},{"n":10,"stem":"A patient with essential thrombocythemia and a platelet count of 1.6 million per microliter has mucosal bleeding. What condition may explain this?","opts":["Immune thrombocytopenia","Acquired von Willebrand syndrome","Hemophilia A","Vitamin K deficiency","Heparin-induced thrombocytopenia"],"a":1,"e":"Very high platelet counts can cause loss of large von Willebrand multimers. Aspirin can worsen bleeding, and cytoreduction corrects the problem.","k":"Extreme thrombocytosis can cause acquired von Willebrand syndrome.","t":"Acquired von Willebrand"},{"n":11,"stem":"A 63-year-old man with intermediate-risk myelofibrosis has a spleen 10 cm below the costal margin, night sweats, and early satiety. Which drug is first-line?","opts":["Hydroxyurea alone","Azacitidine","Ruxolitinib","Rituximab","Imatinib"],"a":2,"e":"JAK inhibitors such as ruxolitinib reduce splenomegaly and symptoms and improve survival in myelofibrosis. Anemia and thrombocytopenia are common adverse effects.","k":"Ruxolitinib reduces splenomegaly and symptoms in myelofibrosis.","t":"Myelofibrosis symptoms"},{"n":12,"stem":"A fit 55-year-old with high-risk myelofibrosis wants a chance of cure. What is the only potentially curative option?","opts":["Allogeneic stem cell transplant","Splenectomy","Ruxolitinib","Erythropoietin","Hydroxyurea"],"a":0,"e":"Transplant is the only treatment that can induce long-term remission, at the cost of significant morbidity. It is considered for intermediate-2 and high-risk disease in suitable patients.","k":"Allogeneic transplant is the only curative option for myelofibrosis.","t":"Myelofibrosis curative therapy"},{"n":13,"stem":"A 68-year-old man has Rai stage 0 CLL with a lymphocyte count of 90,000 per microliter, no symptoms, and normal hemoglobin and platelets. What is the right approach?","opts":["Give venetoclax with obinutuzumab","Observation, since there is no indication for treatment","Start ibrutinib now","Perform splenectomy","Give FCR"],"a":1,"e":"Early-stage asymptomatic CLL is observed, and a high lymphocyte count alone is not a reason to treat. Indications include marrow failure, symptomatic nodes or spleen, constitutional symptoms and rapid doubling.","k":"A high lymphocyte count alone is not an indication to treat CLL.","t":"CLL treatment indication"},{"n":14,"stem":"A 72-year-old man with untreated CLL needing treatment has a 17p deletion. Which regimen is preferred?","opts":["Rituximab alone","Fludarabine, cyclophosphamide, rituximab","Chlorambucil with obinutuzumab","A BTK inhibitor such as acalabrutinib or zanubrutinib","Bendamustine with rituximab"],"a":3,"e":"TP53 aberrations predict poor response to chemoimmunotherapy. Continuous BTK inhibitors or venetoclax-based regimens are used.","k":"TP53 aberration in CLL calls for a BTK inhibitor, not chemoimmunotherapy.","t":"Del(17p) in CLL"},{"n":15,"stem":"A man with CLL on ibrutinib develops palpitations, and an electrocardiogram shows atrial fibrillation. Which statement is correct?","opts":["Anticoagulation is contraindicated forever","Atrial fibrillation does not occur with BTK inhibitors","Venetoclax causes the arrhythmia","The patient has Richter transformation","Atrial fibrillation and bleeding are recognized effects, and a more selective BTK inhibitor may lower the risk"],"a":4,"e":"Ibrutinib raises the risk of atrial fibrillation, hypertension and bleeding. Zanubrutinib had fewer cardiac events in a head-to-head trial, and anticoagulant choice must account for bleeding risk.","k":"Ibrutinib increases atrial fibrillation and bleeding risk.","t":"Ibrutinib adverse effects"},{"n":16,"stem":"A man with long-standing CLL develops rapidly enlarging nodes, fever, elevated lactate dehydrogenase, and a PET-avid node with a very high standardized uptake value. What should be done?","opts":["Order a repeat flow cytometry only","Biopsy the most avid node to look for transformation to large-cell lymphoma","Increase the ibrutinib dose","Give rituximab alone","Observe for three months"],"a":1,"e":"Rapid nodal growth, systemic symptoms and a high uptake on PET suggest Richter transformation. Biopsy of the most avid site confirms it and guides lymphoma-directed therapy.","k":"Suspect Richter transformation when one node grows rapidly with high PET uptake and raised LDH.","t":"Richter transformation"},{"n":17,"stem":"A woman with CLL has fatigue, jaundice, a falling hemoglobin, reticulocytosis, and a positive direct antiglobulin test. What is the first-line treatment?","opts":["Splenic radiation","Fludarabine alone","Corticosteroids","Folate","Plasma exchange"],"a":2,"e":"Autoimmune hemolytic anemia is a complication of CLL, treated first with corticosteroids. Rituximab is added if steroids fail, and purine analogs are avoided because they can precipitate hemolysis.","k":"Autoimmune hemolytic anemia in CLL is treated with corticosteroids.","t":"Autoimmune hemolysis in CLL"},{"n":18,"stem":"Why is venetoclax started at 20 mg and increased weekly over five weeks in CLL?","opts":["To lower the risk of tumor lysis syndrome","To prevent neuropathy","To prevent atrial fibrillation","To avoid anaphylaxis","To lower the cost"],"a":0,"e":"Venetoclax causes rapid tumor lysis in patients with a high tumor burden. A stepwise ramp-up with hydration, allopurinol and monitoring lowers the risk.","k":"Venetoclax is ramped up weekly to prevent tumor lysis syndrome.","t":"Venetoclax ramp-up"},{"n":19,"stem":"A man with CLL and a lymph node of 11 cm and a white cell count of 120,000 per microliter is about to start venetoclax. He has a G6PD deficiency. Which drug is contraindicated if tumor lysis develops?","opts":["Dialysis","Febuxostat","Intravenous fluids","Rasburicase","Allopurinol"],"a":3,"e":"Rasburicase can cause hemolysis and methemoglobinemia in G6PD deficiency. Allopurinol, fluids and monitoring are appropriate.","k":"Rasburicase is contraindicated in G6PD deficiency.","t":"Tumor lysis management"},{"n":20,"stem":"A patient with CLL progresses on a covalent BTK inhibitor and a C481S mutation is found. Which drug acts regardless of this mutation?","opts":["Ibrutinib at higher dose","Acalabrutinib","Zanubrutinib","Chlorambucil","Pirtobrutinib, a noncovalent BTK inhibitor"],"a":4,"e":"The C481S mutation prevents covalent binding. Pirtobrutinib binds reversibly and retains activity, and venetoclax with an anti-CD20 antibody is another option.","k":"Pirtobrutinib retains activity against BTK C481S resistance.","t":"Covalent BTK inhibitor resistance"},{"n":21,"stem":"A man with CLL has recurrent sinopulmonary infections and an IgG level of 300 mg/dL. Which intervention reduces infections?","opts":["Repeat rituximab","Splenectomy","Observation","Immunoglobulin replacement","Long-term steroids"],"a":3,"e":"Patients with CLL and recurrent serious infections with low IgG levels benefit from immunoglobulin replacement. Vaccines with non-live preparations and antimicrobial prophylaxis are also used.","k":"Immunoglobulin replacement reduces infections in CLL with hypogammaglobulinemia.","t":"Hypogammaglobulinemia"}]},{"ch":7,"title":"Hodgkin and Non-Hodgkin Lymphoma","qs":[{"n":1,"stem":"A 58-year-old man has a large B-cell lymphoma with MYC and BCL2 rearrangements on fluorescence in situ hybridization. Which regimen is commonly preferred over R-CHOP for high-grade B-cell lymphoma of this type?","opts":["CHOP without rituximab","DA-EPOCH-R","Chlorambucil","ABVD","Rituximab alone"],"a":1,"e":"High-grade B-cell lymphoma with MYC and BCL2 and/or BCL6 rearrangements has a poor outcome with R-CHOP. Dose-adjusted EPOCH with rituximab is widely used, though randomized proof of superiority is limited.","k":"Double-hit lymphoma is usually treated with an intensive regimen such as DA-EPOCH-R.","t":"Double-hit lymphoma"},{"n":2,"stem":"A woman with DLBCL has kidney involvement, a raised LDH, and a high CNS-IPI. Which strategy is considered?","opts":["Central nervous system prophylaxis with high-dose methotrexate","No prophylaxis ever","Prophylactic ibrutinib","Intrathecal rituximab","Whole-brain radiation for everyone"],"a":0,"e":"Patients with high CNS-IPI scores or involvement of the kidneys, adrenals or testes are at higher risk of central nervous system relapse. High-dose intravenous methotrexate is commonly used.","k":"High CNS-IPI or kidney, adrenal or testicular involvement prompts CNS prophylaxis.","t":"CNS prophylaxis in DLBCL"},{"n":3,"stem":"Before starting R-CHOP in a 72-year-old man with hypertension, which assessment is most appropriate?","opts":["Bone density scan","Audiometry","Baseline left ventricular ejection fraction","Thyroid ultrasound","Pulmonary function tests"],"a":2,"e":"Doxorubicin is cardiotoxic, so baseline cardiac function is assessed, particularly in older adults and those with cardiac risk factors.","k":"Assess left ventricular function before anthracycline-based therapy.","t":"Doxorubicin before R-CHOP"},{"n":4,"stem":"A 62-year-old woman has a single enhancing periventricular mass, and a stereotactic biopsy shows DLBCL. What is the backbone of induction therapy?","opts":["Whole-brain radiotherapy alone","R-CHOP","ABVD","Resection with observation","High-dose methotrexate-based chemotherapy"],"a":4,"e":"Primary CNS lymphoma is treated with high-dose methotrexate regimens, often with rituximab, followed by consolidation. Steroids are avoided before biopsy because they can obscure the diagnosis.","k":"Primary CNS lymphoma is treated with high-dose methotrexate.","t":"Primary CNS lymphoma"},{"n":5,"stem":"Why should corticosteroids be withheld before the biopsy of a suspected primary CNS lymphoma, when possible?","opts":["They cause stroke","They can cause rapid tumor lysis and make the biopsy nondiagnostic","They increase toxicity of methotrexate","They are contraindicated in every brain tumor","They raise intracranial pressure"],"a":1,"e":"Lymphoma cells are corticosteroid sensitive and may disappear before biopsy, producing a nondiagnostic specimen. Steroids are used only when needed for herniation risk.","k":"Corticosteroids can obscure the diagnosis of CNS lymphoma.","t":"Steroids before biopsy"},{"n":6,"stem":"A patient develops fever to 39 degrees Celsius and hypotension that responds to a fluid bolus, 3 days after CD19 CAR T-cell infusion. How is this graded and treated?","opts":["Grade 1, no treatment","Grade 4, treated with transplant","Grade 2 cytokine release syndrome, treated with tocilizumab","Infection, treated with antifungals alone","Neurotoxicity, treated with tocilizumab alone"],"a":2,"e":"Cytokine release syndrome with fever and hypotension responding to fluids is grade 2. Tocilizumab, an interleukin-6 receptor antibody, is given, with corticosteroids if there is no response.","k":"Cytokine release syndrome after CAR T-cell therapy is treated with tocilizumab.","t":"CAR T grading"},{"n":7,"stem":"On day 6 after CAR T-cell infusion a patient has expressive aphasia and cannot write a sentence. There is no fever. What is the most appropriate treatment?","opts":["Dexamethasone","Antiepileptic alone","Tocilizumab alone","Intrathecal chemotherapy","Observation"],"a":0,"e":"Immune effector cell-associated neurotoxicity syndrome is treated with corticosteroids and supportive care. Tocilizumab does not cross the blood-brain barrier and is used mainly when cytokine release coexists.","k":"ICANS is treated with corticosteroids, and tocilizumab alone does not treat it.","t":"ICANS management"},{"n":8,"stem":"A man with a positive hepatitis B core antibody and negative surface antigen is to begin rituximab. What is recommended?","opts":["Check the antibody after one year","No action","Use lamivudine only if symptoms develop","Antiviral prophylaxis with entecavir or tenofovir, with monitoring","Vaccinate during treatment only"],"a":3,"e":"Anti-CD20 therapy carries a high risk of hepatitis B reactivation even when the surface antigen is negative and the core antibody is positive. Prophylaxis continues for about 12 months or longer after the last dose.","k":"Core antibody positivity before anti-CD20 therapy calls for antiviral prophylaxis.","t":"Hepatitis B reactivation"},{"n":9,"stem":"During the first rituximab infusion a patient develops chills, hypotension and wheeze. What is appropriate?","opts":["Continue unchanged","Increase the rate","Permanently contraindicate rituximab","Give only a steroid after the infusion","Stop the infusion, give supportive treatment, and restart at a slower rate after symptoms resolve"],"a":4,"e":"Infusion reactions are common with the first dose, especially at high tumor burden. Stopping, treating, and restarting at half the rate once symptoms resolve is standard.","k":"Interrupt, treat, and restart at a slower rate after a rituximab infusion reaction.","t":"Rituximab infusion reaction"},{"n":10,"stem":"At end of treatment, PET in a patient with DLBCL shows residual uptake in a node that is greater than liver. How is this scored?","opts":["Deauville 2","Deauville 1, a complete response","Deauville 3, which is negative","Deauville 4 or 5, which is a positive result and prompts biopsy before changing therapy","Not scorable"],"a":3,"e":"A Deauville score of 4 or 5 is positive under the Lugano criteria. False positives occur, so biopsy is advised before changing treatment.","k":"Deauville 4 or 5 is a positive PET and should be biopsied before change of therapy.","t":"Deauville score"},{"n":11,"stem":"A 66-year-old woman has DLBCL relapsing 14 months after R-CHOP and two further lines of therapy. She is a candidate for cellular therapy. Which type is it?","opts":["CD20 antibody alone","CD19-directed CAR T-cell therapy","BCMA-directed CAR T-cell therapy","Autologous transplant with no further evaluation","CD30-directed therapy"],"a":1,"e":"CD19-directed CAR T-cell therapies are approved for large B-cell lymphoma after two or more lines of therapy. BCMA is the target in myeloma.","k":"CD19 CAR T-cell therapy is used in relapsed large B-cell lymphoma.","t":"Third-line CAR T"},{"n":12,"stem":"A 74-year-old man has mantle cell lymphoma with a t(11;14) translocation that has relapsed after first-line chemoimmunotherapy. Which drug class is approved?","opts":["A BRAF inhibitor","A PARP inhibitor","A CDK4/6 inhibitor","An aromatase inhibitor","A BTK inhibitor"],"a":4,"e":"BTK inhibitors have high response rates in relapsed mantle cell lymphoma. Zanubrutinib, acalabrutinib and pirtobrutinib are examples.","k":"BTK inhibitors are used for relapsed mantle cell lymphoma.","t":"Mantle cell lymphoma"},{"n":13,"stem":"A 22-year-old man has a rapidly enlarging abdominal mass, and biopsy shows Burkitt lymphoma. He has a high uric acid and creatinine rising. What is the highest immediate concern?","opts":["Tumor lysis syndrome during the first treatment","Hypothyroidism","Hyperglycemia","Heart failure","Anaphylaxis to rituximab"],"a":0,"e":"Burkitt lymphoma has a very high proliferation rate. Tumor lysis risk is high, so hydration, rasburicase and close monitoring are started before chemotherapy.","k":"Burkitt lymphoma carries a very high risk of tumor lysis syndrome.","t":"Burkitt lymphoma"},{"n":14,"stem":"A 50-year-old woman has a localized gastric marginal zone lymphoma and Helicobacter pylori infection. What is first-line treatment?","opts":["Rituximab alone","Gastrectomy","Eradication of Helicobacter pylori","R-CHOP","Whole-abdominal radiotherapy"],"a":2,"e":"Gastric MALT lymphoma associated with H pylori often regresses after eradication therapy. Radiotherapy or rituximab is used if there is no response or the disease is H pylori negative.","k":"Gastric MALT lymphoma is treated first with Helicobacter pylori eradication.","t":"Gastric MALT lymphoma"},{"n":15,"stem":"A 62-year-old man has stage III grade 1 to 2 follicular lymphoma with low tumor burden by GELF criteria and no symptoms. What is the best approach?","opts":["Immediate R-CHOP","Watchful waiting","Allogeneic transplant","Autologous transplant","Radioimmunotherapy"],"a":1,"e":"Asymptomatic, low-burden follicular lymphoma can be observed without loss of survival. Treatment starts for symptoms, organ compromise or high tumor burden.","k":"Low-burden asymptomatic follicular lymphoma is observed.","t":"Follicular lymphoma observation"},{"n":16,"stem":"A 55-year-old woman has stage I follicular lymphoma confined to a single inguinal node group. What is the preferred treatment?","opts":["Rituximab maintenance for two years","Autologous transplant","Bendamustine with rituximab","CAR T-cell therapy","Involved-site radiotherapy"],"a":4,"e":"Stage I follicular lymphoma can be cured in many patients with involved-site radiotherapy, often 24 Gy. Observation is an alternative in selected cases.","k":"Stage I follicular lymphoma is treated with involved-site radiotherapy.","t":"Localized follicular lymphoma"},{"n":17,"stem":"A patient with Hodgkin lymphoma on ABVD develops dry cough and reduced diffusing capacity after 4 cycles. What is appropriate?","opts":["Give a growth factor only","Add rituximab","Stop bleomycin and consider corticosteroids","Stop all therapy and reassess in 1 year","Continue and increase the dose"],"a":2,"e":"Bleomycin can cause pulmonary fibrosis, and risk rises with cumulative dose, age, renal impairment and granulocyte colony-stimulating factor use. The drug is stopped if toxicity appears.","k":"Stop bleomycin when pulmonary toxicity appears.","t":"Bleomycin pulmonary toxicity"},{"n":18,"stem":"A 26-year-old woman has stage IIA nonbulky Hodgkin lymphoma with a negative interim PET after two cycles of ABVD. What is a reasonable approach?","opts":["Complete a short course of chemotherapy with or without limited radiotherapy","Allogeneic transplant","Autologous transplant","Single-agent rituximab","No treatment"],"a":0,"e":"Response-adapted strategies reduce treatment for early favorable disease. Negative interim PET permits fewer cycles or omission of radiotherapy, balancing cure and late effects.","k":"Early-stage Hodgkin lymphoma is treated with a short course of chemotherapy, adapted to interim PET.","t":"Early-stage Hodgkin"},{"n":19,"stem":"A 30-year-old man has Hodgkin lymphoma relapsing 3 months after ABVD, and chemosensitive on salvage chemotherapy. What is the standard next step?","opts":["Observation","Repeat ABVD","Single-agent steroids","High-dose chemotherapy with autologous stem cell transplant","Allogeneic transplant as first choice"],"a":3,"e":"Salvage chemotherapy followed by autologous transplant cures many patients with chemosensitive relapse. Brentuximab maintenance is considered after transplant in high-risk patients.","k":"Chemosensitive relapsed Hodgkin lymphoma is treated with autologous transplant.","t":"Relapsed Hodgkin"},{"n":20,"stem":"A man receiving brentuximab vedotin has numbness and tingling in the fingers. What is the appropriate management?","opts":["Add bleomycin","Add vincristine","Increase the dose","Ignore","Dose reduction or holding, since peripheral neuropathy is dose-related"],"a":4,"e":"Brentuximab commonly causes sensory neuropathy that is cumulative. Doses are held or reduced, and the drug is stopped for severe events.","k":"Brentuximab vedotin causes dose-related peripheral neuropathy.","t":"Brentuximab adverse effect"},{"n":21,"stem":"A 60-year-old man has peripheral T-cell lymphoma, not otherwise specified, with CD30 expression in most tumor cells. Which regimen adds a targeted agent to chemotherapy?","opts":["Brentuximab vedotin with cyclophosphamide, doxorubicin, and prednisone","R-CHOP","Rituximab alone","ABVD","Imatinib"],"a":0,"e":"In CD30-positive peripheral T-cell lymphoma, adding brentuximab to cyclophosphamide, doxorubicin and prednisone improved outcomes in the ECHELON-2 trial. Rituximab does not apply because T cells lack CD20.","k":"CD30-positive T-cell lymphoma is treated with brentuximab plus chemotherapy.","t":"PTCL treatment"}]},{"ch":8,"title":"Myeloma, Genomics, and Treatment Complications","qs":[{"n":1,"stem":"A 64-year-old man has 14 percent clonal plasma cells in the marrow, an M protein of 2.8 g/dL, normal calcium, creatinine, hemoglobin, and no bone lesions on whole-body imaging. What is the diagnosis?","opts":["Active multiple myeloma","Plasma cell leukemia","Waldenstrom macroglobulinemia","Smoldering multiple myeloma","Monoclonal gammopathy of undetermined significance"],"a":3,"e":"Smoldering myeloma has 10 to 60 percent marrow plasma cells or an M protein of at least 3 g/dL, without myeloma-defining events. Active myeloma requires end-organ damage or a biomarker such as 60 percent or more marrow plasma cells.","k":"Smoldering myeloma has clonal plasma cells without myeloma-defining events.","t":"Myeloma diagnostic criteria"},{"n":2,"stem":"Which finding in a patient with clonal marrow plasma cells meets criteria for treatment of active myeloma?","opts":["Marrow plasma cells of 8 percent","A normal free light chain ratio","Marrow plasma cells of 60 percent or more","An M protein of 1 g/dL","Mild fatigue"],"a":2,"e":"The biomarkers that define active myeloma are 60 percent or more clonal marrow plasma cells, a serum free light chain ratio of 100 or more, and more than one focal lesion on MRI. Calcium, renal, anemia and bone findings are the CRAB features.","k":"Sixty percent or more clonal marrow plasma cells defines active myeloma.","t":"Myeloma-defining event"},{"n":3,"stem":"A woman with newly diagnosed myeloma has acute kidney injury with a creatinine of 4.2 mg/dL and a very high serum free kappa light chain level. Which approach is appropriate?","opts":["Use intravenous contrast for staging","Start bortezomib-based therapy promptly, with hydration","Wait for the kidney to recover","Give NSAIDs for bone pain","Start lenalidomide at full dose"],"a":1,"e":"Cast nephropathy is reversible if the light chain burden falls quickly. Bortezomib-based regimens act fast and need no renal dose adjustment, and nephrotoxins such as NSAIDs and contrast are avoided.","k":"Cast nephropathy needs rapid reduction of light chains with a bortezomib-based regimen.","t":"Renal failure in myeloma"},{"n":4,"stem":"Which cytogenetic abnormality in myeloma is associated with high risk?","opts":["Normal karyotype","Trisomy 9 alone","t(11;14)","Hyperdiploidy","del(17p) or t(4;14)"],"a":4,"e":"Deletion 17p, t(4;14), t(14;16) and gain 1q are high-risk features. Hyperdiploidy and t(11;14) are standard risk, and t(11;14) predicts sensitivity to venetoclax.","k":"Del(17p), t(4;14) and t(14;16) are high-risk myeloma cytogenetics.","t":"High-risk cytogenetics"},{"n":5,"stem":"A 58-year-old man with newly diagnosed myeloma and good performance status completes induction with a very good partial response. What should be offered?","opts":["Autologous stem cell transplant, followed by lenalidomide maintenance","Single-agent melphalan","Allogeneic transplant routinely","No further therapy","Radiotherapy to all bones"],"a":0,"e":"For transplant-eligible patients, high-dose melphalan with autologous transplant improves progression-free survival, and lenalidomide maintenance prolongs remission.","k":"Fit patients receive autologous transplant and lenalidomide maintenance.","t":"Transplant eligibility"},{"n":6,"stem":"A myeloma patient on daratumumab needs blood transfusion. What laboratory issue arises?","opts":["It prevents all transfusion","It makes the direct antiglobulin test negative","It causes hemolysis in every patient","Daratumumab binds CD38 on red cells and interferes with cross-matching","It alters ABO type"],"a":3,"e":"Anti-CD38 antibodies cause panreactivity in the indirect antiglobulin test. Blood banks should be told, and a phenotype is determined before treatment.","k":"Anti-CD38 antibodies interfere with blood bank cross-matching.","t":"Daratumumab interference"},{"n":7,"stem":"A man starts bortezomib for myeloma. Which prophylaxis is recommended?","opts":["Isoniazid","Acyclovir or valacyclovir to prevent herpes zoster","No prophylaxis","Voriconazole","Ciprofloxacin only"],"a":1,"e":"Proteasome inhibitors and anti-CD38 antibodies increase the risk of herpes zoster reactivation. Antiviral prophylaxis is standard.","k":"Give antiviral prophylaxis during proteasome inhibitor treatment.","t":"Zoster prophylaxis"},{"n":8,"stem":"A woman on lenalidomide, dexamethasone and daratumumab has no prior thrombosis. Which prophylaxis is recommended?","opts":["Platelet transfusion","Vitamin K","Aspirin or anticoagulation, chosen by risk","None","Warfarin for everyone"],"a":2,"e":"Immunomodulatory drugs increase venous thromboembolism risk. Low-dose aspirin is used in lower-risk patients, and low-molecular-weight heparin or a direct oral anticoagulant in higher-risk patients.","k":"Immunomodulatory drugs require thromboprophylaxis chosen by risk.","t":"Lenalidomide thrombosis"},{"n":9,"stem":"A man on bortezomib has grade 2 painful neuropathy. Which adjustment is best?","opts":["Dose reduction and weekly subcutaneous schedule","Switch to vincristine","Stop all therapy permanently","Continue the same dose","Add thalidomide"],"a":0,"e":"Subcutaneous administration and weekly dosing reduce neuropathy compared with intravenous twice-weekly dosing. The dose is reduced or held for grade 2 pain.","k":"Weekly subcutaneous bortezomib lowers neuropathy.","t":"Bortezomib neuropathy"},{"n":10,"stem":"A patient with myeloma has relapsed after four lines of therapy. Which cell surface antigen do idecabtagene and ciltacabtagene CAR T cells target?","opts":["CD19","CD22","B-cell maturation antigen","CD30","CD20"],"a":2,"e":"Both products target BCMA, expressed on plasma cells. Bispecific antibodies such as teclistamab also target BCMA.","k":"Myeloma CAR T cells target B-cell maturation antigen.","t":"BCMA targeting"},{"n":11,"stem":"A man with relapsed myeloma starts teclistamab. What is the usual schedule feature during the first dose?","opts":["A single full dose at home","Step-up dosing with monitoring for cytokine release syndrome","No monitoring is needed","Daily intrathecal dosing","Oral administration"],"a":1,"e":"BCMA bispecific antibodies cause cytokine release and neurotoxicity. Step-up dosing, inpatient monitoring for the first doses, and infection prophylaxis are standard.","k":"Bispecific antibodies use step-up dosing to reduce cytokine release syndrome.","t":"Bispecific antibody"},{"n":12,"stem":"A patient on a BCMA bispecific antibody has hypogammaglobulinemia and recurrent infections. What reduces infections?","opts":["Splenectomy","Interferon","Rituximab","More dexamethasone","Immunoglobulin replacement"],"a":4,"e":"BCMA-directed therapy causes B-cell and plasma cell depletion and hypogammaglobulinemia. Immunoglobulin replacement, antimicrobial prophylaxis and vaccination reduce infections.","k":"Immunoglobulin replacement lowers infections after BCMA-directed therapy.","t":"Infection after bispecifics"},{"n":13,"stem":"Weeks after ciltacabtagene, a patient develops slowed movement, tremor and personality change. What is described?","opts":["Cytokine release syndrome","Hypoglycemia","Hypocalcemia","Parkinsonism, a delayed neurotoxicity of BCMA CAR T therapy","Tumor lysis syndrome"],"a":3,"e":"A distinct delayed neurotoxicity with parkinsonian features and cranial nerve palsies has been reported with BCMA CAR T therapy. Early recognition and specialist care are needed.","k":"BCMA CAR T therapy can cause delayed parkinsonism and cranial nerve palsy.","t":"CAR T delayed neurotoxicity"},{"n":14,"stem":"A patient receiving chemotherapy has a temperature of 38.6 degrees Celsius and an absolute neutrophil count of 200 per microliter. What is the target time to first antibiotic dose?","opts":["After imaging","After blood culture results","Within 24 hours","Within 60 minutes of presentation","Within 12 hours"],"a":3,"e":"Febrile neutropenia is an emergency. Empiric broad-spectrum antipseudomonal antibiotics are started within an hour, after cultures are drawn but without waiting for results.","k":"Start empiric antibiotics within 60 minutes of presentation with febrile neutropenia.","t":"Febrile neutropenia risk"},{"n":15,"stem":"A hemodynamically stable patient with febrile neutropenia and no allergy has no localizing source. Which regimen is appropriate?","opts":["Piperacillin-tazobactam, cefepime, or a carbapenem","Oral amoxicillin","Azithromycin","Vancomycin alone","Ceftriaxone alone"],"a":0,"e":"Monotherapy with an antipseudomonal beta-lactam is standard. Vancomycin is added only for specific indications such as hemodynamic instability, line infection, or skin and soft tissue infection.","k":"Empiric therapy in febrile neutropenia is an antipseudomonal beta-lactam.","t":"Choice of empiric antibiotic"},{"n":16,"stem":"A patient remains febrile after 4 days of broad-spectrum antibiotics, with profound neutropenia and negative cultures. Which step is appropriate?","opts":["Wait another two weeks","Stop all antibiotics","Perform CT of the chest and sinuses and consider adding antifungal therapy","Start steroids","Add a second antibacterial of the same class"],"a":2,"e":"Persistent fever beyond 4 to 7 days in high-risk neutropenia raises concern for invasive fungal infection. Imaging, biomarkers such as galactomannan, and empiric or preemptive antifungal therapy are considered.","k":"Persistent neutropenic fever calls for imaging and consideration of antifungal therapy.","t":"Persistent neutropenic fever"},{"n":17,"stem":"Which patient with febrile neutropenia may be considered for outpatient oral therapy?","opts":["A patient with a central line infection","A clinically stable patient with a solid tumor and a MASCC score of 21 or more","A patient with acute leukemia in induction","A patient with hypotension","A patient with pneumonia and hypoxemia"],"a":1,"e":"The MASCC score identifies low-risk patients, who may be treated with oral antibiotics such as ciprofloxacin with amoxicillin-clavulanate after appropriate assessment and close follow-up.","k":"A MASCC score of 21 or more identifies low-risk febrile neutropenia.","t":"Low-risk neutropenic fever"},{"n":18,"stem":"A woman receiving dose-dense chemotherapy for breast cancer has a regimen with a febrile neutropenia risk above 20 percent. What is recommended?","opts":["Antifungal drugs","Steroids","No prophylaxis","Prophylactic antibiotics alone","Primary prophylaxis with a colony-stimulating factor"],"a":4,"e":"Primary prophylaxis with pegfilgrastim is recommended when the risk of febrile neutropenia is above 20 percent. It is considered at 10 to 20 percent with patient risk factors.","k":"Use colony-stimulating factor prophylaxis when febrile neutropenia risk exceeds 20 percent.","t":"Colony-stimulating factor"},{"n":19,"stem":"A 70-year-old man has a lymphoplasmacytic marrow infiltrate, a high IgM paraprotein, MYD88 L265P, and headaches with blurred vision. Which complication is suspected?","opts":["Hyperviscosity syndrome","Cast nephropathy","Amyloid cardiomyopathy only","Tumor lysis","Hypercalcemia"],"a":0,"e":"A very high IgM level can cause hyperviscosity with visual changes, headache and bleeding. Plasmapheresis gives rapid relief while systemic therapy is started.","k":"High IgM in Waldenstrom macroglobulinemia can cause hyperviscosity, treated with plasmapheresis.","t":"Waldenstrom macroglobulinemia"},{"n":20,"stem":"A man has nephrotic-range proteinuria, macroglossia, periorbital purpura, and a lambda light chain excess. A fat pad biopsy shows apple-green birefringence with Congo red. What is the diagnosis?","opts":["Multiple myeloma with cast nephropathy","Wilson disease","Minimal change disease","Light chain deposition disease","AL amyloidosis"],"a":4,"e":"AL amyloidosis is caused by clonal light chains and shows apple-green birefringence on Congo red staining. Cardiac involvement defines prognosis, and daratumumab-based therapy is standard.","k":"AL amyloidosis shows apple-green birefringence with Congo red staining.","t":"AL amyloidosis"},{"n":21,"stem":"A woman with myeloma and lytic lesions is started on zoledronic acid. What precaution is advised before dental extraction?","opts":["No precautions","Give extra calcium by injection","Complete dental procedures before starting, because of osteonecrosis of the jaw","Prophylactic radiation","Avoid all dental care forever"],"a":2,"e":"Osteonecrosis of the jaw is a rare complication of bisphosphonates and denosumab. A dental assessment and completion of invasive work before treatment lowers the risk.","k":"Complete invasive dental work before starting bone-modifying agents.","t":"Bone-modifying agent"}]},{"ch":9,"title":"Non-Small Cell Lung Cancer and Thoracic Genomics","qs":[{"n":1,"stem":"A 62-year-old woman has a 25 pack-year smoking history and quit 8 years ago. What screening is recommended?","opts":["Chest radiograph every year","Annual low-dose CT of the chest","Sputum cytology every year","No screening, since she quit","Tumor markers every 6 months"],"a":1,"e":"Screening with low-dose CT is recommended for adults aged 50 to 80 years with at least 20 pack-years who currently smoke or quit within the past 15 years. Chest radiography does not lower mortality.","k":"Annual low-dose CT screens adults aged 50 to 80 with 20 pack-years who smoke or quit within 15 years.","t":"Lung cancer screening"},{"n":2,"stem":"A patient with a 3 cm adenocarcinoma has PET-avid mediastinal nodes. Which step is required before choosing surgery?","opts":["Treating as stage I","Starting immunotherapy empirically","Repeating PET in a year","Pathologic confirmation of nodal disease by EBUS or mediastinoscopy","Proceeding directly to lobectomy"],"a":3,"e":"PET has false-positive and false-negative nodal results. Tissue sampling of the mediastinum determines stage, and stage N2 changes the treatment approach.","k":"PET-positive mediastinal nodes need tissue confirmation before treatment is chosen.","t":"Mediastinal staging"},{"n":3,"stem":"A frail 80-year-old man has a 2 cm peripheral stage I squamous cancer and severe emphysema. Which treatment is preferred?","opts":["Pneumonectomy","Conventional chemotherapy alone","Observation without treatment","Whole-brain radiotherapy","Stereotactic body radiotherapy"],"a":4,"e":"Stereotactic body radiotherapy gives high local control with low toxicity in medically inoperable early-stage disease.","k":"Stereotactic body radiotherapy is the standard for inoperable stage I lung cancer.","t":"Stage I inoperable"},{"n":4,"stem":"A fit 60-year-old woman has a 1.5 cm peripheral adenocarcinoma with negative nodes. Which surgical approach was noninferior to lobectomy for overall survival in a randomized trial?","opts":["Observation","Wedge resection of any size","Segmentectomy","Radiofrequency ablation","Pneumonectomy"],"a":2,"e":"For peripheral tumors of 2 cm or less, with a high proportion of ground-glass or negative nodes, segmentectomy was noninferior to lobectomy for overall survival in the JCOG0802 trial.","k":"Segmentectomy is noninferior to lobectomy for small peripheral node-negative tumors.","t":"Sublobar resection"},{"n":5,"stem":"A 64-year-old woman has resected stage II adenocarcinoma, no EGFR or ALK alterations, and good recovery. Which adjuvant therapy lowers recurrence?","opts":["Bevacizumab","Radiotherapy to the whole chest","Oral thalidomide","Cisplatin-based chemotherapy","Observation only"],"a":3,"e":"Adjuvant cisplatin-based chemotherapy improves survival in completely resected stage II and IIIA disease. Immunotherapy may follow in selected patients.","k":"Adjuvant cisplatin-based chemotherapy is standard after resection of stage II to IIIA disease.","t":"Adjuvant chemotherapy"},{"n":6,"stem":"After adjuvant chemotherapy for resected stage II adenocarcinoma, a patient has a PD-L1 value of 60 percent and no EGFR or ALK alteration. Which agent may follow?","opts":["Atezolizumab for one year","Durvalumab","Sotorasib","Osimertinib","Lorlatinib"],"a":0,"e":"In the IMpower010 trial, adjuvant atezolizumab improved disease-free survival in patients with stage II to IIIA disease and PD-L1 of at least 1 percent, with the strongest effect in those at 50 percent or higher.","k":"Adjuvant atezolizumab follows chemotherapy in resected PD-L1-positive stage II to IIIA disease.","t":"Adjuvant atezolizumab"},{"n":7,"stem":"A man with metastatic squamous cell lung cancer and hemoptysis is being planned for first-line therapy. Which drug is contraindicated?","opts":["Gemcitabine","Bevacizumab","Pembrolizumab","Paclitaxel","Carboplatin"],"a":1,"e":"Bevacizumab carries a risk of serious pulmonary hemorrhage in squamous histology and in patients with recent hemoptysis. Pemetrexed is also ineffective in squamous cancer.","k":"Bevacizumab is avoided in squamous lung cancer and with hemoptysis.","t":"Squamous histology"},{"n":8,"stem":"Before starting pemetrexed for nonsquamous lung cancer, which supplementation is required?","opts":["Vitamin D alone","Vitamin K","Folic acid and vitamin B12 with dexamethasone","Calcium","Iron"],"a":2,"e":"Folic acid, vitamin B12 and dexamethasone reduce hematologic and cutaneous toxicity of pemetrexed. The drug is not used with severe renal impairment.","k":"Pemetrexed requires folic acid, vitamin B12 and dexamethasone.","t":"Pemetrexed supplementation"},{"n":9,"stem":"A patient with metastatic nonsquamous cancer with no driver mutation is treated with nivolumab, ipilimumab, and two cycles of chemotherapy. Which trial supports this approach?","opts":["ADAURA","CheckMate 9LA","PACIFIC","FLAURA","CROWN"],"a":1,"e":"CheckMate 9LA showed a survival benefit for dual immune checkpoint inhibition with two cycles of platinum-based chemotherapy over chemotherapy alone, as an alternative to chemoimmunotherapy.","k":"CheckMate 9LA supports nivolumab and ipilimumab with two cycles of chemotherapy.","t":"Ipilimumab and nivolumab"},{"n":10,"stem":"A patient is too ill for repeat biopsy and has insufficient tissue for next-generation sequencing. Which test is reasonable?","opts":["Urinary cytology","Skipping testing","Serum CEA","Plasma cell-free DNA genotyping, with tissue testing if negative","Sputum culture"],"a":3,"e":"Plasma genotyping detects driver alterations rapidly when tissue is limited. A negative plasma result does not exclude a driver, so tissue testing is pursued.","k":"A negative plasma genotype does not exclude a driver, and tissue testing should follow.","t":"Plasma genotyping"},{"n":11,"stem":"A woman with an EGFR exon 19 deletion progresses after 20 months of osimertinib. What is the next best step?","opts":["Repeat molecular profiling of tumor or plasma to identify resistance mechanisms","Add durvalumab","Restart osimertinib after a break","Switch to gefitinib","Stop therapy and observe"],"a":0,"e":"Resistance to osimertinib is heterogeneous, with MET amplification, EGFR C797S, and histologic transformation to small cell among the causes. Profiling guides subsequent therapy, and platinum chemotherapy is the default.","k":"Progression on osimertinib needs repeat profiling to find the resistance mechanism.","t":"Osimertinib resistance"},{"n":12,"stem":"A woman on osimertinib develops progressive dry cough and bilateral ground-glass opacities. What is the appropriate management?","opts":["Add pembrolizumab","Continue unchanged","Start a macrolide only","Increase the dose","Withhold osimertinib and evaluate for interstitial lung disease"],"a":4,"e":"Interstitial lung disease or pneumonitis is a serious adverse effect of EGFR inhibitors. The drug is held, infection excluded, and steroids given for confirmed disease, with permanent discontinuation in many cases.","k":"New ground-glass opacities on osimertinib suggest interstitial lung disease.","t":"Osimertinib adverse effects"},{"n":13,"stem":"A patient has an EGFR G719X mutation. Which tyrosine kinase inhibitor has activity against this uncommon mutation?","opts":["Capmatinib","Afatinib","Sotorasib","Dabrafenib","Crizotinib"],"a":1,"e":"Afatinib and osimertinib have activity against several uncommon EGFR mutations. These mutations are not covered by the trials that established first-generation inhibitors.","k":"Afatinib is active against uncommon EGFR mutations such as G719X.","t":"Uncommon EGFR mutation"},{"n":14,"stem":"A 55-year-old never-smoker has a resected stage IB to IIIA ALK-positive adenocarcinoma. Which adjuvant agent improved disease-free survival?","opts":["Pembrolizumab","Sotorasib","Alectinib","Durvalumab","Osimertinib"],"a":2,"e":"The ALINA trial showed that adjuvant alectinib improved disease-free survival over platinum chemotherapy in resected ALK-positive disease.","k":"Adjuvant alectinib improves disease-free survival in resected ALK-positive disease.","t":"ALK adjuvant"},{"n":15,"stem":"A never-smoker has advanced lung adenocarcinoma with a ROS1 fusion. Which therapies are active?","opts":["Entrectinib, crizotinib, or repotrectinib","Selpercatinib","Capmatinib","Osimertinib","Sotorasib"],"a":0,"e":"ROS1 rearrangements respond to ROS1 inhibitors. Entrectinib and repotrectinib also penetrate the brain.","k":"ROS1-positive lung cancer is treated with a ROS1 inhibitor.","t":"ROS1 fusion"},{"n":16,"stem":"A man has advanced lung adenocarcinoma with a BRAF V600E mutation. Which targeted combination is approved?","opts":["Vemurafenib alone","Lorlatinib","Erlotinib","Amivantamab","Dabrafenib with trametinib"],"a":4,"e":"BRAF and MEK inhibition together has high response rates in BRAF V600E-mutated lung cancer. BRAF V600E is rare but actionable.","k":"BRAF V600E lung cancer is treated with dabrafenib and trametinib.","t":"BRAF V600E"},{"n":17,"stem":"A previously treated patient with lung adenocarcinoma has a HER2 exon 20 mutation. Which antibody-drug conjugate has activity?","opts":["Enfortumab vedotin","Brentuximab vedotin","Sacituzumab govitecan","Trastuzumab deruxtecan","Polatuzumab vedotin"],"a":3,"e":"Trastuzumab deruxtecan produced responses in HER2-mutant non-small cell lung cancer and carries a risk of interstitial lung disease that requires monitoring.","k":"Trastuzumab deruxtecan is active in HER2-mutant lung cancer.","t":"HER2 mutation"},{"n":18,"stem":"A patient with unresectable stage III disease finishes concurrent chemoradiotherapy with stable disease and grade 1 pneumonitis. When should durvalumab be started?","opts":["Never in patients with any pneumonitis","Within about 6 weeks of completing radiation, if pneumonitis is not worse than grade 1","During chemoradiotherapy only","After a 1-year interval","Only if disease progressed"],"a":1,"e":"In the PACIFIC trial, durvalumab began within 42 days after chemoradiotherapy. Higher-grade pneumonitis is a reason to withhold it.","k":"Durvalumab after chemoradiotherapy is started within about 6 weeks, without significant pneumonitis.","t":"Durvalumab timing"},{"n":19,"stem":"A man with lung cancer has facial swelling, distended neck veins, and dyspnea. Which is the most appropriate approach?","opts":["Anticoagulation alone","Reassure and observe","Furosemide alone","Confirm with CT, and treat with radiotherapy, stent, or chemotherapy depending on tumor type and severity","Surgery on all patients"],"a":3,"e":"Superior vena cava syndrome is usually managed by treating the malignancy, and stenting gives the fastest relief when severe. A tissue diagnosis guides definitive therapy.","k":"Superior vena cava syndrome is treated by addressing the tumor, with stenting for rapid relief.","t":"Superior vena cava syndrome"},{"n":20,"stem":"A man with squamous cell lung cancer has a calcium of 13.5 mg/dL, a suppressed parathyroid hormone, and no bone metastases. What is the likely mechanism?","opts":["Primary hyperparathyroidism","Lytic bone metastases","Parathyroid hormone-related protein secretion by the tumor","Milk-alkali syndrome","Vitamin D intoxication"],"a":2,"e":"Humoral hypercalcemia of malignancy is caused by parathyroid hormone-related protein, with a suppressed parathyroid hormone and often squamous histology.","k":"Squamous tumors can cause hypercalcemia through parathyroid hormone-related protein.","t":"Hypercalcemia in squamous cancer"},{"n":21,"stem":"A patient has a PD-L1 value of 80 percent. Next-generation sequencing is pending. What is the appropriate first-line plan?","opts":["Start docetaxel","Start osimertinib empirically","Start pembrolizumab alone at once in every case","Observe for months","Wait for the genomic results before starting immunotherapy"],"a":4,"e":"A high PD-L1 value does not apply to tumors with EGFR or ALK alterations, in which immunotherapy has little benefit and toxicity can rise with sequential TKI. Results should be available before first-line therapy unless urgent.","k":"Await driver testing before starting immunotherapy, even with high PD-L1.","t":"PD-L1 high and driver"}]},{"ch":10,"title":"Small Cell Lung Cancer, Mesothelioma, Thymic Cancer, and Complications","qs":[{"n":1,"stem":"A man with small cell lung cancer has a primary tumor in the right lower lobe and a contralateral hilar node, with no distant metastases on PET and brain MRI. How is the disease classified for treatment?","opts":["Extensive stage, because the contralateral node cannot be encompassed in one radiation field","Limited stage","Stage IA","Resectable disease","Smoldering disease"],"a":0,"e":"Limited-stage disease is confined to one hemithorax and can be encompassed within a tolerable radiotherapy field. Contralateral hilar nodes usually exceed this definition, and brain MRI is part of staging.","k":"Limited-stage SCLC fits within one safe radiation field.","t":"SCLC staging"},{"n":2,"stem":"A fit patient has limited-stage small cell lung cancer. What is the standard initial treatment?","opts":["Concurrent platinum-etoposide with thoracic radiotherapy","Surgery alone","Sequential chemotherapy then radiotherapy 6 months later","Whole-brain radiotherapy alone","Immunotherapy alone"],"a":0,"e":"Concurrent chemoradiotherapy with cisplatin and etoposide is standard in limited-stage disease. Early start of thoracic radiation, and twice-daily or high-dose once-daily schedules, are options.","k":"Limited-stage SCLC is treated with concurrent chemoradiotherapy.","t":"Limited-stage chemoradiation"},{"n":3,"stem":"Which statement best describes prophylactic cranial irradiation in SCLC?","opts":["It improves survival in all extensive-stage patients with MRI surveillance","It is mandatory in all patients","It is given only after brain metastases appear","It lowers brain metastases, and surveillance MRI is an alternative when overall benefit is uncertain","It has no effect on brain metastases"],"a":3,"e":"Prophylactic cranial irradiation lowers the risk of brain metastases, but with neurocognitive effects. With routine MRI surveillance, its survival benefit in extensive-stage disease was not confirmed, so decisions are individualized.","k":"Prophylactic cranial irradiation lowers brain metastases but has cognitive risks, and MRI surveillance is an alternative.","t":"Prophylactic cranial irradiation"},{"n":4,"stem":"A man with small cell lung cancer has a sodium of 118 mEq/L, concentrated urine, and euvolemia. What is the most durable treatment?","opts":["Demeclocycline for life","Hypertonic saline for months","Chemotherapy for the underlying tumor","Long-term fluid restriction only","Normal saline infusions"],"a":2,"e":"Small cell lung cancer is a common cause of the syndrome of inappropriate antidiuretic hormone secretion. Treating the tumor corrects it, with fluid restriction and sodium management in the short term.","k":"SIADH from small cell cancer resolves when the tumor is treated.","t":"SIADH"},{"n":5,"stem":"A smoker has proximal leg weakness that improves briefly with exercise, dry mouth, and absent reflexes. What antibody is expected?","opts":["Anti-Hu antibody only","Acetylcholine receptor antibody","Antinuclear antibody","Anti-thyroid antibody","Voltage-gated calcium channel antibody"],"a":4,"e":"Lambert-Eaton myasthenic syndrome is a paraneoplastic disorder associated with small cell lung cancer. Strength increases with repeated effort, in contrast to myasthenia gravis, and treatment includes the tumor and amifampridine.","k":"Lambert-Eaton syndrome is linked to voltage-gated calcium channel antibodies and small cell cancer.","t":"Lambert-Eaton"},{"n":6,"stem":"A man with small cell lung cancer has hypokalemia, hypertension, hyperglycemia, and very high cortisol and ACTH. What is the diagnosis?","opts":["Adrenal adenoma","Ectopic ACTH syndrome","Pituitary adenoma","Primary aldosteronism","Addison disease"],"a":1,"e":"Ectopic ACTH production causes rapid-onset hypercortisolism with severe hypokalemia and metabolic alkalosis, and carries a poor prognosis. Cortisol synthesis inhibitors may be needed while therapy begins.","k":"Ectopic ACTH syndrome gives rapid, severe hypercortisolism with hypokalemia.","t":"Ectopic ACTH"},{"n":7,"stem":"A patient with extensive-stage small cell lung cancer and good performance status needs first-line therapy. Which options improved survival over chemotherapy alone?","opts":["Osimertinib","Radiotherapy alone","Lorlatinib","Pembrolizumab alone","Atezolizumab or durvalumab added to platinum-etoposide"],"a":4,"e":"IMpower133 and CASPIAN showed that adding atezolizumab or durvalumab to platinum and etoposide improved overall survival. Absolute gains are modest.","k":"Atezolizumab or durvalumab with platinum-etoposide is first-line for extensive-stage SCLC.","t":"Extensive-stage first line"},{"n":8,"stem":"A patient with extensive-stage SCLC has a good response to first-line chemoimmunotherapy and few metastatic sites. What additional treatment may be considered?","opts":["Intrathecal therapy","Consolidative thoracic radiotherapy","Pneumonectomy","Lobectomy","Whole-liver radiation"],"a":1,"e":"Consolidative thoracic radiotherapy has shown improved survival in selected patients with extensive-stage disease and low metastatic burden in trials before and alongside immunotherapy.","k":"Consolidative thoracic radiotherapy may help selected extensive-stage patients.","t":"Thoracic radiotherapy in extensive stage"},{"n":9,"stem":"A woman with extensive-stage SCLC relapses 8 months after completing platinum-etoposide. Which agent has randomized evidence of overall survival benefit over chemotherapy?","opts":["Sotorasib","Pembrolizumab","Dabrafenib","Tarlatamab, a DLL3-directed bispecific T-cell engager","Alectinib"],"a":3,"e":"DeLLphi-304 showed improved survival with tarlatamab over standard chemotherapy. Cytokine release syndrome and neurologic events are key toxicities.","k":"Tarlatamab targets DLL3 and improves survival in relapsed small cell lung cancer.","t":"Relapsed SCLC"},{"n":10,"stem":"A patient with relapsed small cell lung cancer is given topotecan. Which toxicity is expected?","opts":["Pulmonary fibrosis","Hemorrhagic cystitis","Myelosuppression","Cardiomyopathy","Ototoxicity"],"a":2,"e":"Topotecan commonly causes neutropenia and thrombocytopenia, which are dose-limiting. Lurbinectedin is another option with its own toxicity profile.","k":"Topotecan is dose-limited by myelosuppression.","t":"Topotecan"},{"n":11,"stem":"A 68-year-old retired shipyard worker has a pleural effusion and diffuse pleural thickening. Which exposure is most strongly linked to the likely diagnosis?","opts":["Asbestos","Silica","Benzene","Arsenic","Radon"],"a":0,"e":"Asbestos is the main cause of malignant pleural mesothelioma, with a latency of decades. Biopsy with immunohistochemistry confirms the diagnosis.","k":"Asbestos exposure causes mesothelioma after a long latency.","t":"Mesothelioma risk"},{"n":12,"stem":"Which histologic subtype of pleural mesothelioma has the poorest prognosis?","opts":["Sarcomatoid","Biphasic with epithelioid predominance","Epithelioid","Cystic","Well-differentiated papillary"],"a":0,"e":"Sarcomatoid mesothelioma has the poorest prognosis, and epithelioid histology has the best. Immunotherapy has shown a particular benefit in nonepithelioid subtypes.","k":"Sarcomatoid histology carries the poorest prognosis in mesothelioma.","t":"Mesothelioma subtype"},{"n":13,"stem":"A man with unresectable epithelioid pleural mesothelioma needs systemic therapy. Which regimens are supported by randomized trials?","opts":["Capecitabine","Imatinib","Radioactive iodine","Nivolumab with ipilimumab, or platinum with pemetrexed","Osimertinib"],"a":3,"e":"Nivolumab and ipilimumab improved survival over platinum with pemetrexed in the CheckMate 743 trial. Platinum with pemetrexed remains an option, sometimes with bevacizumab.","k":"Nivolumab with ipilimumab and platinum with pemetrexed are first-line options in mesothelioma.","t":"Mesothelioma first line"},{"n":14,"stem":"A 45-year-old woman has ptosis, diplopia, and a 5 cm anterior mediastinal mass. Which test is most useful before surgery?","opts":["Thyroglobulin","CA-125","Acetylcholine receptor antibody level","Serum calcium alone","Alpha-fetoprotein"],"a":2,"e":"About one-third of thymomas are associated with myasthenia gravis. Disease control before surgery reduces the risk of postoperative respiratory failure.","k":"Test for myasthenia gravis before thymoma resection.","t":"Thymoma and myasthenia"},{"n":15,"stem":"A mediastinal mass is suspected to be a resectable thymoma on imaging. What is the approach to diagnosis?","opts":["Observation","Radiotherapy first","Repeated needle biopsies through the pleura","Chemotherapy first","Proceed to complete resection without percutaneous biopsy, when imaging is typical"],"a":4,"e":"Biopsy of a resectable thymoma risks pleural seeding. Complete surgical resection is the most important prognostic step, and biopsy is reserved for unresectable or atypical masses.","k":"Avoid transpleural biopsy of a resectable thymoma.","t":"Thymoma biopsy"},{"n":16,"stem":"A man has unresectable thymic carcinoma. Which regimen is commonly used?","opts":["Rituximab","Carboplatin with paclitaxel","Imatinib","Osimertinib","Lenalidomide"],"a":1,"e":"Thymic carcinoma is treated with platinum-based chemotherapy, such as carboplatin with paclitaxel. Immune checkpoint inhibitors carry a high risk of severe immune toxicity in thymoma.","k":"Unresectable thymic carcinoma is treated with carboplatin and paclitaxel.","t":"Thymic carcinoma"},{"n":17,"stem":"A man on ipilimumab and nivolumab develops 7 watery stools above baseline per day with abdominal pain. He is hemodynamically stable. What is the appropriate treatment?","opts":["Start antibiotics only","Hold immunotherapy and give corticosteroids, adding infliximab or vedolizumab if no response","Give oral iron","Start total parenteral nutrition","Continue immunotherapy and give loperamide"],"a":1,"e":"Seven or more stools above baseline is grade 3 colitis. Immunotherapy is held, high-dose steroids are started, and infliximab or vedolizumab is added for steroid-refractory disease.","k":"Grade 3 immune colitis needs steroids, with infliximab or vedolizumab if refractory.","t":"Immune colitis"},{"n":18,"stem":"A patient on pembrolizumab has new cough and dyspnea, and CT shows organizing-pneumonia pattern opacities. Oxygen saturation is 91 percent on room air. What is the plan?","opts":["Hold immunotherapy, exclude infection, and start corticosteroids","Add chemotherapy","Continue and observe","Start radiotherapy","Start inhaled bronchodilator alone"],"a":0,"e":"Immune-related pneumonitis with hypoxemia is grade 3. Infection is excluded, immunotherapy is held, and steroids are started. Infliximab or other agents are added for refractory disease.","k":"Immune pneumonitis needs steroids after infection is excluded.","t":"Immune pneumonitis"},{"n":19,"stem":"A woman on nivolumab has fatigue, cold intolerance, and a TSH of 38 mIU/L with a low free T4. What is the right action?","opts":["Give high-dose steroids","Start methimazole","Start levothyroxine and continue immunotherapy","Stop immunotherapy permanently","Treat with radioactive iodine"],"a":2,"e":"Immune checkpoint inhibitors commonly cause thyroiditis, with a hypothyroid phase that needs hormone replacement. Therapy can usually continue.","k":"Endocrine immune toxicity is treated with hormone replacement while immunotherapy continues.","t":"Immune hypothyroidism"},{"n":20,"stem":"A man on ipilimumab has headache, fatigue, hypotension, low sodium, and a low morning cortisol with a low ACTH. What must be started first?","opts":["Desmopressin only","Levothyroxine alone","Fludrocortisone alone","Hydrocortisone before any thyroid replacement","Insulin"],"a":3,"e":"Hypophysitis causes central adrenal insufficiency. Glucocorticoid replacement is started before thyroid hormone, because thyroid hormone can precipitate adrenal crisis.","k":"Replace cortisol before thyroid hormone in hypophysitis.","t":"Immune hypophysitis"},{"n":21,"stem":"A patient on a checkpoint inhibitor has an ALT of 8 times the upper limit of normal and normal bilirubin. What is the appropriate step?","opts":["Increase the immunotherapy dose","Continue unchanged","Start antifungal therapy","Switch to acetaminophen","Hold immunotherapy, exclude other causes, and give corticosteroids"],"a":4,"e":"Immune-mediated hepatitis is graded by transaminase elevation. Grade 3 events need steroids and holding therapy, with mycophenolate for steroid-refractory disease.","k":"Grade 3 immune hepatitis is treated with steroids.","t":"Immune hepatitis"},{"n":22,"stem":"A patient on combination immunotherapy has chest pain, elevated troponin, and new arrhythmia with a normal coronary angiogram. What is suspected?","opts":["Anaphylaxis","Hypothyroidism","Immune-related myocarditis, requiring high-dose corticosteroids","Pericarditis from radiation","Acute coronary thrombosis"],"a":2,"e":"Immune checkpoint inhibitor myocarditis is rare but has a high mortality. It requires prompt high-dose steroids, and permanent discontinuation of the drug.","k":"Immune-related myocarditis needs urgent high-dose corticosteroids.","t":"Myocarditis"}]},{"ch":11,"title":"Risk, Premalignant Conditions, and Carcinoma in Situ","qs":[{"n":1,"stem":"A 52-year-old postmenopausal woman has a 5-year invasive breast cancer risk of 2.1 percent by the Gail model. Which statement is correct?","opts":["She should have bilateral mastectomy","She needs no counseling","Risk-reducing medication is contraindicated","She meets the usual threshold of 1.67 percent for considering risk-reducing medication","She is below any threshold"],"a":3,"e":"A 5-year risk of 1.67 percent or more is the threshold used in prevention trials, and risk-reducing medication may be offered if adverse-effect risk is low. Tools estimate risk for populations better than for individuals.","k":"A 5-year Gail risk of 1.67 percent or more is the usual threshold for offering risk-reducing medication.","t":"Risk threshold"},{"n":2,"stem":"Which adverse effects of tamoxifen limit its use for breast cancer risk reduction?","opts":["Endometrial cancer, venous thromboembolism, and cataracts","Pulmonary fibrosis","Osteoporosis and fractures","Hearing loss","Cardiomyopathy"],"a":0,"e":"Tamoxifen has estrogen agonist effects on the endometrium and increases thromboembolism. Risk is higher after menopause, and women with an intact uterus need attention to abnormal bleeding.","k":"Tamoxifen raises the risk of endometrial cancer, venous thromboembolism and cataracts.","t":"Tamoxifen adverse effects"},{"n":3,"stem":"A postmenopausal woman at increased risk of breast cancer and with osteoporosis is considering risk-reducing medication. Which drug lowers both breast cancer and vertebral fractures?","opts":["Anastrozole","Exemestane","Letrozole","Medroxyprogesterone","Raloxifene"],"a":4,"e":"Raloxifene reduces invasive breast cancer and vertebral fractures in postmenopausal women and carries a lower endometrial risk than tamoxifen, but it has thromboembolic risk and is not for premenopausal use.","k":"Raloxifene reduces breast cancer and vertebral fractures in postmenopausal women.","t":"Raloxifene"},{"n":4,"stem":"Which statement about aromatase inhibitors for prevention is correct?","opts":["They are approved for average-risk women","They can be used in postmenopausal women at increased risk, and they do not cause endometrial cancer","They have no effect on bone","They are suitable for premenopausal women alone","They raise the risk of endometrial cancer"],"a":1,"e":"Anastrozole and exemestane lower breast cancer risk in postmenopausal women, with musculoskeletal symptoms and bone loss as main adverse effects. They are ineffective without suppression of ovarian estrogen.","k":"Aromatase inhibitors are for postmenopausal women and cause bone loss and arthralgia.","t":"Aromatase inhibitor prevention"},{"n":5,"stem":"A 40-year-old woman has a lifetime breast cancer risk of 25 percent by a model that uses family history. Which screening adds to mammography?","opts":["Thermography","Clinical examination only","Annual breast MRI","Breast ultrasound every 5 years","Tumor markers"],"a":2,"e":"Annual MRI is recommended in addition to mammography when lifetime risk is 20 percent or more, as in BRCA carriers and those with prior chest radiation.","k":"Lifetime risk of 20 percent or more warrants annual breast MRI.","t":"Screening MRI"},{"n":6,"stem":"A core needle biopsy of a calcification shows atypical ductal hyperplasia. What is the standard next step?","opts":["Radiotherapy","Mastectomy","Observation only","Chemotherapy","Surgical excision, because carcinoma is found in a substantial minority"],"a":4,"e":"Core biopsy may underestimate disease, and atypical ductal hyperplasia is upgraded to carcinoma at excision in roughly a fifth of cases. Excision is recommended.","k":"Atypical ductal hyperplasia on core biopsy is excised.","t":"Atypical ductal hyperplasia"},{"n":7,"stem":"A core biopsy for a benign-appearing abnormality finds classic lobular carcinoma in situ, concordant with imaging. What does this indicate?","opts":["A marker of increased risk in both breasts, managed with surveillance and chemoprevention counseling","An invasive cancer requiring mastectomy","An indication for chemotherapy","An indication for axillary dissection","A benign finding with no extra risk"],"a":0,"e":"Classic LCIS is a risk marker for later invasive cancer in either breast. Surgery is not required if concordant, and risk-reducing medication is discussed.","k":"Classic LCIS is a bilateral risk marker, not an indication for mastectomy.","t":"Classic LCIS"},{"n":8,"stem":"A biopsy shows pleomorphic lobular carcinoma in situ with necrosis. How is this approached?","opts":["Mastectomy in every case","Surgical excision, with clear margins considered","Chemotherapy","No follow-up","Observation only"],"a":1,"e":"Pleomorphic LCIS behaves more like DCIS and is often excised. Management is individualized.","k":"Pleomorphic LCIS is usually excised, unlike classic LCIS.","t":"Pleomorphic LCIS"},{"n":9,"stem":"A 55-year-old woman has a 1.5 cm area of grade 2 DCIS. She chooses breast conservation. Which treatment lowers local recurrence after lumpectomy?","opts":["Observation only for all cases","Chemotherapy","Trastuzumab","Whole-breast radiotherapy","Axillary dissection"],"a":3,"e":"Radiotherapy after lumpectomy lowers ipsilateral breast recurrence by about half in DCIS, with no effect on overall survival. Endocrine therapy lowers further events in hormone-positive disease.","k":"Whole-breast radiotherapy lowers local recurrence after lumpectomy for DCIS.","t":"DCIS local treatment"},{"n":10,"stem":"What margin width is generally accepted as adequate after breast-conserving surgery with radiotherapy for DCIS?","opts":["20 mm","10 mm","Tumor touching ink","No consensus exists","2 mm"],"a":4,"e":"A consensus guideline recommends a minimum 2 mm margin for DCIS treated with whole-breast radiotherapy, with wider margins not routinely needed.","k":"A 2 mm margin is the accepted minimum for DCIS with radiotherapy.","t":"DCIS margins"},{"n":11,"stem":"For which patient with a biopsy diagnosis of DCIS is sentinel node biopsy appropriate?","opts":["A patient with LCIS","A patient undergoing mastectomy","Every patient","A patient undergoing lumpectomy","No patient"],"a":1,"e":"Sentinel node biopsy is offered at mastectomy for DCIS, because the node cannot be sampled later, and some have occult invasion. It is not needed with lumpectomy.","k":"Offer sentinel node biopsy for DCIS only when mastectomy is planned.","t":"Sentinel node in DCIS"},{"n":12,"stem":"A 48-year-old premenopausal woman with estrogen receptor-positive DCIS completes lumpectomy and radiotherapy. Which endocrine agent is appropriate?","opts":["Tamoxifen for 5 years","Anast
